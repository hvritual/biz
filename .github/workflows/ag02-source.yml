name: ag02-source
on:
  push:
    branches: [control/ag02-source-20260908]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7d5afbe9cb4b849be462d9a7aed65877ed227700
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 4dd2a264c73a2ce6b85ad7ae6238046762e7e0f7
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable sources without credentials or worktree mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ag02-source"
          test "$(git -C biz rev-parse HEAD)" = 7d5afbe9cb4b849be462d9a7aed65877ed227700
          test "$(git -C yunka.io rev-parse HEAD)" = 4dd2a264c73a2ce6b85ad7ae6238046762e7e0f7
          for repo in biz yunka.io; do
            git -C "$repo" status --short --branch
            test -z "$(git -C "$repo" status --porcelain)"
            git -C "$repo" bundle create "$RUNNER_TEMP/ag02-source/$repo.bundle" HEAD
            git -C "$repo" bundle verify "$RUNNER_TEMP/ag02-source/$repo.bundle"
            git -C "$repo" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ag02-source/$repo.identity"
            git -C "$repo" ls-files '*AGENTS.md' > "$RUNNER_TEMP/ag02-source/$repo.instructions"
          done
          cd "$RUNNER_TEMP/ag02-source"
          sha256sum *.bundle *.identity *.instructions > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag02-source
          path: ${{ runner.temp }}/ag02-source
          if-no-files-found: error
          retention-days: 7
