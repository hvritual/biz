name: b12-3-tenant-member-mysql

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure
    paths:
      - .github/workflows/b12-3-tenant-member-mysql.yml
      - contracts/**
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - integration/b12_member_runtime_mysql_test.go
      - modules/access/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b12-3-tenant-member-mysql.yml
      - contracts/**
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - integration/b12_member_runtime_mysql_test.go
      - modules/access/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b12-3-tenant-member-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_b123?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_b123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Run B12.3 multi-tenant member runtime pressure
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB123'
          test -z "$(git -C biz status --porcelain)"
