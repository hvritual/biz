name: b12-6-concurrency-mysql

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure
    paths:
      - .github/workflows/b12-6-concurrency-mysql.yml
      - contracts/**
      - docs/pressure/B12-framework-pressure.md
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - integration/b12_concurrency_mysql_test.go
      - integration/b12_owner_crosspath_concurrency_mysql_test.go
      - integration/ag02_owner_snapshot_mysql_test.go
      - modules/access/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b12-6-concurrency-mysql.yml
      - contracts/**
      - docs/pressure/B12-framework-pressure.md
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - integration/b12_concurrency_mysql_test.go
      - integration/b12_owner_crosspath_concurrency_mysql_test.go
      - integration/ag02_owner_snapshot_mysql_test.go
      - modules/access/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

env:
  YUNKA_TEST_RESET_FIXTURES: "1"
jobs:
  b12-6-concurrency-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_b126?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_b126
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Load current consumer framework lock
        id: consumer_source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "YUNKA_SHA=$YUNKA_COMMIT" >> "$GITHUB_ENV"
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.consumer_source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Run B12.6 concurrent multi-tenant pressure
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^Test(B126|AG02OwnerInvariantUsesCurrentReadAfterSnapshot)'
          test -z "$(git -C biz status --porcelain)"
