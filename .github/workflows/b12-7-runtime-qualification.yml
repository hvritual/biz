name: b12-7-runtime-qualification

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure
    paths:
      - .github/workflows/b12-7-runtime-qualification.yml
      - .yunka/dev.json
      - cmd/biz/**
      - contracts/**
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - modules/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b12-7-runtime-qualification.yml
      - .yunka/dev.json
      - cmd/biz/**
      - contracts/**
      - internal/access/**
      - internal/assembly/**
      - internal/bizruntime/**
      - modules/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b12-7-runtime-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
      YUNKA_BIZ_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_b127?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      YUNKA_BIZ_AUTO_MIGRATE: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_b127
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Build Biz and exact Yunka CLI
        shell: bash
        run: |
          set -euo pipefail
          go -C biz build ./...
          (cd yunka.io/app && go build -buildvcs=true -o "$RUNNER_TEMP/yunka" ./cmd)
          test -x "$RUNNER_TEMP/yunka"

      - name: Prove zero-argument Access + DeviceOps runtime closure
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          evidence_dir="$RUNNER_TEMP/b12-7-runtime-evidence"
          mkdir -p "$evidence_dir"
          rm -f .yunka/dev-runtime.json .yunka/runtime-graph.json

          dump_evidence() {
            cp -f .yunka/dev-runtime.json "$evidence_dir/dev-runtime.json" 2>/dev/null || true
            cp -f .yunka/runtime-graph.json "$evidence_dir/runtime-graph.json" 2>/dev/null || true
            cp -f "$RUNNER_TEMP/b12-7-dev.stdout" "$evidence_dir/dev.stdout" 2>/dev/null || true
            cp -f "$RUNNER_TEMP/b12-7-dev.stderr" "$evidence_dir/dev.stderr" 2>/dev/null || true
            cp -f "$RUNNER_TEMP/b12-7-diagnostics.json" "$evidence_dir/diagnostics.json" 2>/dev/null || true
            cp -f "$RUNNER_TEMP/b12-7-status.json" "$evidence_dir/status.json" 2>/dev/null || true
          }

          "$RUNNER_TEMP/yunka" dev >"$RUNNER_TEMP/b12-7-dev.stdout" 2>"$RUNNER_TEMP/b12-7-dev.stderr" &
          dev_pid=$!
          cleanup() {
            if kill -0 "$dev_pid" 2>/dev/null; then
              kill -TERM "$dev_pid" 2>/dev/null || true
              wait "$dev_pid" || true
            fi
          }
          on_exit() {
            status=$?
            trap - EXIT
            dump_evidence
            cleanup
            dump_evidence
            exit "$status"
          }
          trap on_exit EXIT

          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              wait "$dev_pid" || true
              cat "$RUNNER_TEMP/b12-7-dev.stdout" || true
              cat "$RUNNER_TEMP/b12-7-dev.stderr" || true
              exit 1
            fi
            if test -f .yunka/dev-runtime.json && jq -e '.state == "running" and (.processes | length) == 1 and .processes[0].state == "ready" and .processes[0].ready == true' .yunka/dev-runtime.json >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" = 1
          grep -Fq 'DEV READY' "$RUNNER_TEMP/b12-7-dev.stderr"

          curl --fail --silent --show-error http://127.0.0.1:8080/__yunka/diagnostics > "$RUNNER_TEMP/b12-7-diagnostics.json"
          jq -e '
            .schemaVersion == 1 and
            .core.schemaVersion == 1 and
            .core.state == "ready" and
            .core.health.ready == true and
            .core.runtime.rpcServerCount == 1 and
            .core.runtime.routeCount >= 20 and
            ((.core.modules | map(.name) | sort) == (["access", "deviceops"] | sort)) and
            ((.core.components | map(.name) | sort) == (["grpc-server", "http-server"] | sort)) and
            (.core.routes | index("/v1/tenants")) != null and
            (.core.routes | index("/v1/tenant/members")) != null and
            (.core.routes | index("/v1/tenant/roles")) != null and
            (.core.routes | index("/v1/devices")) != null
          ' "$RUNNER_TEMP/b12-7-diagnostics.json" >/dev/null

          "$RUNNER_TEMP/yunka" dev status --closure --format json > "$RUNNER_TEMP/b12-7-status.json"
          jq -e '
            .state == "running" and
            (.processes | length) == 1 and
            .processes[0].name == "biz" and
            .processes[0].state == "ready" and
            .processes[0].ready == true and
            .processes[0].diagnostics.ready == true and
            ((.processes[0].graphNodes | sort) == ([
              "application:access/tenant_lifecycle",
              "application:access/tenant_member_lifecycle",
              "application:access/tenant_role_permission",
              "application:deviceops/device_management",
              "application:deviceops/device_transfer",
              "application:deviceops/site_management"
            ] | sort))
          ' "$RUNNER_TEMP/b12-7-status.json" >/dev/null

          jq -e '[.edges[] | select(.kind == "runs" and .from == "process:biz")] | length == 6' .yunka/runtime-graph.json >/dev/null
          jq -e '([.edges[] | select(.kind == "runs" and .from == "process:biz") | .to] | sort) == ([
            "application:access/tenant_lifecycle",
            "application:access/tenant_member_lifecycle",
            "application:access/tenant_role_permission",
            "application:deviceops/device_management",
            "application:deviceops/device_transfer",
            "application:deviceops/site_management"
          ] | sort)' .yunka/runtime-graph.json >/dev/null

          kill -TERM "$dev_pid"
          wait "$dev_pid"
          jq -e '.state == "stopped" and .processes[0].state == "stopped"' .yunka/dev-runtime.json >/dev/null
          dump_evidence
          trap - EXIT

      - name: Export B12.7 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b12-7-runtime-evidence
          path: ${{ runner.temp }}/b12-7-runtime-evidence
          if-no-files-found: warn
          retention-days: 2

      - name: Require clean Biz worktree
        shell: bash
        run: |
          set -euo pipefail
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain)"
