name: b12-canonical-baseline-converge

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Biz head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Converge B12 canonical framework baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "f154c521e5bf6c637022795075c4ebf5d48a00d1"
          new = "6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb"
          workflow_paths = [
              Path('.github/workflows/b12-multitenant-access-pressure.yml'),
              Path('.github/workflows/b12-3-tenant-member-mysql.yml'),
              Path('.github/workflows/b12-4-tenant-role-mysql.yml'),
              Path('.github/workflows/b12-5-tenant-bootstrap-mysql.yml'),
              Path('.github/workflows/b12-6-concurrency-mysql.yml'),
              Path('.github/workflows/b12-7-runtime-qualification.yml'),
              Path('.github/workflows/b12-8-framework-pressure-disposition.yml'),
          ]
          for path in workflow_paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: old Yunka baseline not found')
              path.write_text(text.replace(old, new))

          main = Path('.github/workflows/b12-multitenant-access-pressure.yml')
          text = main.read_text()
          old_inventory = 'tenant.role.bootstrap_owner tenant.role.create tenant.role.get tenant.role.list tenant.role.update tenant.role.disable tenant.role.enable tenant.role.set_permissions tenant.role.assign_member tenant.role.revoke_member; do'
          new_inventory = 'tenant.role.bootstrap_owner tenant.role.create tenant.role.get tenant.role.list tenant.role.update tenant.role.disable tenant.role.enable tenant.role.set_permissions tenant.role.assign_member tenant.role.revoke_member tenant.role.assert_member_deactivation_allowed; do'
          if old_inventory not in text:
              raise SystemExit('B12 operation inventory anchor not found')
          main.write_text(text.replace(old_inventory, new_inventory, 1))

          disposition = Path('.github/workflows/b12-8-framework-pressure-disposition.yml')
          text = disposition.read_text()
          anchor = "          grep -Fq 'CLOSED by Yunka PR #108' \"$ledger\"\n"
          addition = anchor + "          grep -Fq 'B12-FP-006' \"$ledger\"\n          grep -Fq 'YUNKA_COMPILER_GAP' \"$ledger\"\n          grep -Fq 'CLOSED by Yunka PR #112' \"$ledger\"\n"
          if anchor not in text:
              raise SystemExit('B12.8 ledger assertion anchor not found')
          disposition.write_text(text.replace(anchor, addition, 1))

          ledger = Path('docs/pressure/B12-framework-pressure.md')
          text = ledger.read_text()
          old_baseline = '''The final B12.2-B12.8 qualification baseline is:\n\n```text\nhvritual/yunka.io@f154c521e5bf6c637022795075c4ebf5d48a00d1\n```\n\nThis is the merge commit of Yunka PR #108, `B12 authz: principal-aware grant resolution`.'''
          new_baseline = '''The final B12 qualification baseline is:\n\n```text\nhvritual/yunka.io@6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb\n```\n\nThis canonical main merge includes both generic framework fixes discovered by B12: PR #108 (`B12 authz: principal-aware grant resolution`) and PR #112 (`A+: edge-owned child capability codegen`).'''
          if old_baseline not in text:
              raise SystemExit('ledger qualified baseline block not found')
          text = text.replace(old_baseline, new_baseline, 1)
          text = text.replace('The one generic framework defect discovered by B12 was reproduced before any framework change:', 'The first generic framework defect discovered by B12 was reproduced before any framework change:', 1)

          insert_anchor = '\n## Biz-specific discoveries retained in Biz\n'
          fp006 = r'''
### B12-FP-006 — Shared target child capability codegen collided across source Applications

**Classification:** `YUNKA_COMPILER_GAP`

**Observed pressure:** after the Member last-owner rule correctly declared `tenant.member.suspend/remove -> tenant.role.assert_member_deactivation_allowed`, both `access/tenant_lifecycle` and `access/tenant_member_lifecycle` depended on `access/tenant_role_permission`. The old generator emitted the same target-owned child-capability type, implementation and constructor once per source Application, producing duplicate declarations in one Go package. A target-owned deduplication proposal was rejected because unioning required target Operations across sources would widen each source's capability surface.

The executable reproducer is Yunka issue #110. The A+ resolution makes capability identity source-edge owned:

```text
(source Application -> target Application -> required Operations)
```

Each generated edge exposes only target Operations directly named by the source Operations' `requires_operations`. For the real Biz pressure graph this means:

```text
TenantLifecycle -> TenantRolePermission
  exposes BootstrapTenantOwnerRole only

TenantMemberLifecycle -> TenantRolePermission
  exposes AssertTenantMemberDeactivationAllowed only
```

Qualification evidence:

```text
RED fixture commit:          e9477a8848a9be5e458378ada68ae1ed6691e6df
qualified candidate:         044b39b1a893327ef303c5ba5eddcd291bccb3c6
candidate framework CI:      33569648073  SUCCESS
candidate production/MySQL:  33569647996  SUCCESS
Biz reverse qualification:   33571724579  SUCCESS
Biz generated materialize:   33571942057  SUCCESS
canonical integration PR:    #112
canonical main merge:        6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
```

The resolution does not change PB DSL, Application/Operation dependency semantics, OperationPlan, AssemblyPlan, Executor, authorization, or root ExecutionScope/UoW semantics.

**Status:** **CLOSED by Yunka PR #112 / QUALIFIED.**

---
'''
          if insert_anchor not in text:
              raise SystemExit('ledger Biz-specific anchor not found')
          text = text.replace(insert_anchor, '\n' + fp006 + insert_anchor, 1)

          summary_anchor = '| B12-FP-005 | six-Application dev/runtime evidence | DX/runtime assessment | **NO DEFECT; Biz profile drift fixed** |\n'
          summary_row = summary_anchor + '| B12-FP-006 | shared target child capability collision / least-authority surface | `YUNKA_COMPILER_GAP` | **CLOSED by Yunka PR #112** |\n'
          if summary_anchor not in text:
              raise SystemExit('ledger summary table anchor not found')
          text = text.replace(summary_anchor, summary_row, 1)

          old_final = '''B12_FRAMEWORK_PRESSURE_DISPOSITION=PASS\nOPEN_B12_YUNKA_GAPS=0\nQUALIFIED_YUNKA_BASELINE=f154c521e5bf6c637022795075c4ebf5d48a00d1'''
          new_final = '''B12_FRAMEWORK_PRESSURE_DISPOSITION=PASS\nOPEN_B12_YUNKA_GAPS=0\nQUALIFIED_YUNKA_BASELINE=6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb'''
          if old_final not in text:
              raise SystemExit('ledger final disposition baseline not found')
          text = text.replace(old_final, new_final, 1)
          text = text.replace('B12 discovered exactly one generic Yunka defect, reproduced it before framework modification, closed it through a qualified generic framework change, and completed the remaining multi-tenant Access/IAM pressure without additional framework expansion.', 'B12 discovered two generic Yunka defects, reproduced both before framework modification, closed them through qualified generic framework changes, and kept the remaining multi-tenant Access/IAM pressure inside Biz.', 1)
          ledger.write_text(text)
          PY

          git diff --check
          echo '=== B12 canonical baseline diff ==='
          git diff -- .github/workflows/b12-multitenant-access-pressure.yml .github/workflows/b12-3-tenant-member-mysql.yml .github/workflows/b12-4-tenant-role-mysql.yml .github/workflows/b12-5-tenant-bootstrap-mysql.yml .github/workflows/b12-6-concurrency-mysql.yml .github/workflows/b12-7-runtime-qualification.yml .github/workflows/b12-8-framework-pressure-disposition.yml docs/pressure/B12-framework-pressure.md

      - name: Commit convergence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/b12-canonical-baseline-converge.yml
          git add -A .github/workflows/b12-canonical-baseline-converge.yml \
            .github/workflows/b12-multitenant-access-pressure.yml \
            .github/workflows/b12-3-tenant-member-mysql.yml \
            .github/workflows/b12-4-tenant-role-mysql.yml \
            .github/workflows/b12-5-tenant-bootstrap-mysql.yml \
            .github/workflows/b12-6-concurrency-mysql.yml \
            .github/workflows/b12-7-runtime-qualification.yml \
            .github/workflows/b12-8-framework-pressure-disposition.yml \
            docs/pressure/B12-framework-pressure.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(b12): reanchor qualification to canonical A+ main'
          git push origin HEAD:agent/b12-multitenant-access-pressure
