name: b12-multitenant-access-pressure

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure
    paths:
      - .github/workflows/b12-multitenant-access-pressure.yml
      - .yunka/project.json
      - Makefile
      - contracts/**
      - docs/pressure/B12-framework-pressure.md
      - internal/**
      - integration/**
      - modules/**
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/b12-multitenant-access-pressure.yml
      - .yunka/project.json
      - Makefile
      - contracts/**
      - docs/pressure/B12-framework-pressure.md
      - internal/**
      - integration/**
      - modules/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b12-1-contract-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Check committed closure read-only before generation
        shell: bash
        run: |
          set -euo pipefail
          make -C biz check \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          test -z "$(git -C biz status --porcelain)"

      - name: Capture committed generated baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b12"
          (
            cd biz
            find contracts/generated contracts/gen internal -type f \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b12/committed.sha256"

      - name: Generate full multi-PB closure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          test -z "$(git -C biz status --porcelain)"

      - name: Assert B12.1 generated contract inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f biz/contracts/gen/access/v1/tenant.pb.go
          test -f biz/contracts/gen/access/v1/tenant_grpc.pb.go
          test -f biz/contracts/gen/access/v1/tenant_member.pb.go
          test -f biz/contracts/gen/access/v1/tenant_member_grpc.pb.go
          test -f biz/contracts/gen/access/v1/tenant_role.pb.go
          test -f biz/contracts/gen/access/v1/tenant_role_grpc.pb.go
          for operation in \
            tenant.create tenant.get tenant.list tenant.update tenant.activate tenant.suspend tenant.close \
            tenant.member.bootstrap_owner tenant.member.invite tenant.member.get tenant.member.list tenant.member.activate tenant.member.suspend tenant.member.remove \
            tenant.role.bootstrap_owner tenant.role.create tenant.role.get tenant.role.list tenant.role.update tenant.role.disable tenant.role.enable tenant.role.set_permissions tenant.role.assign_member tenant.role.revoke_member tenant.role.assert_member_deactivation_allowed; do
            grep -Fq "\"$operation\"" biz/contracts/generated/operation-plans.json
          done
          grep -Fq 'tenant_lifecycle' biz/contracts/generated/assembly-plan.json
          grep -Fq 'tenant_member_lifecycle' biz/contracts/generated/assembly-plan.json
          grep -Fq 'tenant_role_permission' biz/contracts/generated/assembly-plan.json

      - name: Prove committed equivalence and second generation byte stability
        shell: bash
        run: |
          set -euo pipefail
          (
            cd biz
            find contracts/generated contracts/gen internal -type f \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b12/first.sha256"
          diff -u "$RUNNER_TEMP/b12/committed.sha256" "$RUNNER_TEMP/b12/first.sha256"
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          (
            cd biz
            find contracts/generated contracts/gen internal -type f \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b12/second.sha256"
          diff -u "$RUNNER_TEMP/b12/first.sha256" "$RUNNER_TEMP/b12/second.sha256"
          test -z "$(git -C biz status --porcelain)"

      - name: Check generated closure read-only after generation
        shell: bash
        run: |
          set -euo pipefail
          make -C biz check \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          test -z "$(git -C biz status --porcelain)"

      - name: Compile Biz against generated Access contracts
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test ./...
          go -C biz vet ./...
          go -C biz build ./...
          test -z "$(git -C biz status --porcelain)"

      - name: Capture B12.1 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b12-export"
          cp "$RUNNER_TEMP/b12/"*.sha256 "$RUNNER_TEMP/b12-export/" 2>/dev/null || true
          git -C biz status --porcelain > "$RUNNER_TEMP/b12-export/status.txt"
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/b12-export/generated.diff"

      - name: Upload B12.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b12-1-contract-closure
          path: ${{ runner.temp }}/b12-export
          if-no-files-found: warn
          retention-days: 2

  b12-2-tenant-lifecycle-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_b12?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_b12
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Run B12.2 MySQL lifecycle pressure
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB122'
          test -z "$(git -C biz status --porcelain)"
