name: b12-review-owner-invariant-probe

on:
  push:
    branches:
      - agent/b12-multitenant-access-pressure

permissions:
  contents: read

jobs:
  generate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact qualified Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: f154c521e5bf6c637022795075c4ebf5d48a00d1
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build protobuf plugins
        shell: bash
        run: make -C yunka.io rpc-tools

      - name: Generate owner invariant closure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          grep -R -Fq 'tenant.role.assert_member_deactivation_allowed' biz/contracts/generated/operation-plans.json
          grep -R -Fq 'AssertTenantMemberDeactivationAllowed' biz/internal/access/application
          grep -R -Fq 'AccessTenantRolePermission' biz/internal/assembly/zz_yunka_assembly_gen.go
          test "$(grep -R -l '^type AccessTenantRolePermissionChildCapability interface' biz/internal/access/application | wc -l)" -eq 1
          printf '%s\n' 'B12_REVIEW_OWNER_INVARIANT_GENERATION=PASS'
