name: b13-1-cross-tenant-delegation-contract

on:
  push:
    branches:
      - agent/b13-cross-tenant-delegation-pressure
    paths:
      - .github/workflows/b13-1-cross-tenant-delegation-contract.yml
      - contracts/proto/access/v1/tenant_delegation.proto
      - contracts/proto/deviceops/v1/delegated_device_access.proto
      - contracts/sources.json
      - docs/pressure/B13-framework-pressure.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b13-1-contract-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
    steps:
      - name: Checkout exact Biz pressure candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Generate B13 multi-domain closure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"

      - name: Assert B13.1 compiler inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f biz/contracts/gen/access/v1/tenant_delegation.pb.go
          test -f biz/contracts/gen/access/v1/tenant_delegation_grpc.pb.go
          test -f biz/contracts/gen/deviceops/v1/delegated_device_access.pb.go
          test -f biz/contracts/gen/deviceops/v1/delegated_device_access_grpc.pb.go
          for op in \
            tenant.delegation.grant_device tenant.delegation.get tenant.delegation.list tenant.delegation.revoke \
            device.delegated_get device.delegated_update; do
            grep -Fq "\"$op\"" biz/contracts/generated/operation-plans.json
          done
          grep -Fq 'tenant_delegation_management' biz/contracts/generated/assembly-plan.json
          grep -Fq 'delegated_device_access' biz/contracts/generated/assembly-plan.json
          grep -Fq '/v1/tenant/delegations/devices' biz/contracts/generated/openapi.json
          grep -Fq '/v1/delegated/devices/{id}' biz/contracts/generated/openapi.json
          ! grep -Eq 'owner_tenant_id[[:space:]]*=' biz/contracts/proto/deviceops/v1/delegated_device_access.proto

      - name: Prove second generation byte stability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b13"
          (
            cd biz
            find contracts/generated contracts/gen internal modules -type f \
              \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) \
              -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b13/first.sha256"
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          (
            cd biz
            find contracts/generated contracts/gen internal modules -type f \
              \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) \
              -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b13/second.sha256"
          diff -u "$RUNNER_TEMP/b13/first.sha256" "$RUNNER_TEMP/b13/second.sha256"

      - name: Prove yunka check is read-only on generated closure
        shell: bash
        run: |
          set -euo pipefail
          git -C biz diff --binary > "$RUNNER_TEMP/b13/before-check.diff"
          git -C biz status --porcelain > "$RUNNER_TEMP/b13/before-check.status"
          make -C biz check \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          git -C biz diff --binary > "$RUNNER_TEMP/b13/after-check.diff"
          git -C biz status --porcelain > "$RUNNER_TEMP/b13/after-check.status"
          diff -u "$RUNNER_TEMP/b13/before-check.diff" "$RUNNER_TEMP/b13/after-check.diff"
          diff -u "$RUNNER_TEMP/b13/before-check.status" "$RUNNER_TEMP/b13/after-check.status"

      - name: Compile generated contract and assembly closure
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test ./contracts/gen/...
          go -C biz test ./internal/access/application ./internal/deviceops/application ./internal/assembly

      - name: Reject generator writes outside derived surfaces
        shell: bash
        run: |
          set -euo pipefail
          git -C biz status --porcelain > "$RUNNER_TEMP/b13/status.txt"
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              contracts/gen/*|contracts/generated/*|internal/access/*/zz_yunka*|internal/deviceops/*/zz_yunka*|internal/assembly/*|modules/access/zz_yunka*|modules/deviceops/zz_yunka*) ;;
              *) echo "unexpected generator write: $path" >&2; exit 42 ;;
            esac
          done < "$RUNNER_TEMP/b13/status.txt"

      - name: Capture B13.1 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b13-export"
          cp "$RUNNER_TEMP/b13/"* "$RUNNER_TEMP/b13-export/" 2>/dev/null || true
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/b13-export/generated.diff"
          git -C biz status --porcelain > "$RUNNER_TEMP/b13-export/final-status.txt"

      - name: Upload B13.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b13-1-contract-closure
          path: ${{ runner.temp }}/b13-export
          if-no-files-found: warn
          retention-days: 3
