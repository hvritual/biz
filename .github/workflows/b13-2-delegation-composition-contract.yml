name: b13-2-delegation-composition-contract

on:
  push:
    branches:
      - agent/b13-cross-tenant-delegation-pressure
    paths:
      - .github/workflows/b13-2-delegation-composition-contract.yml
      - contracts/proto/access/v1/tenant.proto
      - contracts/proto/access/v1/tenant_delegation.proto
      - contracts/proto/deviceops/v1/deviceops.proto
      - docs/pressure/B13-framework-pressure.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b13-2-composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
    steps:
      - name: Checkout exact Biz pressure candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Generate cross-domain child capability closure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Assert source-edge capability topology
        shell: bash
        run: |
          set -euo pipefail
          edge=biz/internal/access/application/zz_yunka_tenant_delegation_management_capability_ports_gen.go
          test -f "$edge"
          grep -Fq 'type TenantDelegationManagementToAccessTenantLifecycleChildCapability interface' "$edge"
          grep -Fq 'AssertTenantActive' "$edge"
          grep -Fq 'type TenantDelegationManagementToDeviceopsDeviceManagementChildCapability interface' "$edge"
          grep -Fq 'AssertDeviceOwnedByActorTenant' "$edge"
          ! grep -Fq 'GetTenant(' "$edge"
          ! grep -Fq 'GetDevice(' "$edge"
          ! grep -Fq 'UpdateDevice(' "$edge"

          grep -Fq 'AccessTenantLifecycle accessapplication.TenantDelegationManagementToAccessTenantLifecycleChildCapability' biz/internal/assembly/zz_yunka_assembly_gen.go
          grep -Fq 'DeviceopsDeviceManagement accessapplication.TenantDelegationManagementToDeviceopsDeviceManagementChildCapability' biz/internal/assembly/zz_yunka_assembly_gen.go
          grep -Fq 'tenant.assert_active' biz/contracts/generated/operation-plans.json
          grep -Fq 'device.assert_owned_by_actor_tenant' biz/contracts/generated/operation-plans.json

      - name: Assert internal operations stay transport-hidden
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'tenant.assert_active' biz/contracts/generated/openapi.json
          ! grep -Fq 'device.assert_owned_by_actor_tenant' biz/contracts/generated/openapi.json
          ! grep -Fq 'AssertTenantActive' biz/contracts/generated/client.ts
          ! grep -Fq 'AssertDeviceOwnedByActorTenant' biz/contracts/generated/client.ts

      - name: Prove deterministic checkable closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b13-2"
          (
            cd biz
            find contracts/generated contracts/gen internal modules -type f \
              \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) \
              -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b13-2/first.sha256"
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          (
            cd biz
            find contracts/generated contracts/gen internal modules -type f \
              \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) \
              -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/b13-2/second.sha256"
          diff -u "$RUNNER_TEMP/b13-2/first.sha256" "$RUNNER_TEMP/b13-2/second.sha256"
          make -C biz check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Compile generated cross-domain topology
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test ./contracts/gen/...
          go -C biz test ./internal/access/application ./internal/deviceops/application ./internal/assembly

      - name: Capture B13.2 contract evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b13-2-export"
          cp "$RUNNER_TEMP/b13-2/"* "$RUNNER_TEMP/b13-2-export/" 2>/dev/null || true
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/b13-2-export/generated.diff"
          git -C biz status --porcelain > "$RUNNER_TEMP/b13-2-export/status.txt"

      - name: Upload B13.2 contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b13-2-delegation-composition-contract
          path: ${{ runner.temp }}/b13-2-export
          if-no-files-found: warn
          retention-days: 3
