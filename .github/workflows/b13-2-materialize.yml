name: b13-2-materialize

on:
  push:
    branches:
      - agent/b13-cross-tenant-delegation-pressure
    paths:
      - .github/workflows/b13-2-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
      PRESSURE_BRANCH: agent/b13-cross-tenant-delegation-pressure
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Generate exact B13.2 closure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Verify derived-only write set
        shell: bash
        run: |
          set -euo pipefail
          git -C biz status --porcelain > "$RUNNER_TEMP/status.txt"
          test -s "$RUNNER_TEMP/status.txt"
          while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              contracts/gen/*|contracts/generated/*|internal/access/*/zz_yunka*|internal/deviceops/*/zz_yunka*|internal/assembly/*|modules/access/zz_yunka*|modules/deviceops/zz_yunka*) ;;
              *) echo "unexpected generator write: $path" >&2; exit 42 ;;
            esac
          done < "$RUNNER_TEMP/status.txt"

      - name: Verify generated closure before commit
        shell: bash
        run: |
          set -euo pipefail
          make -C biz check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          go -C biz test ./contracts/gen/...
          go -C biz test ./internal/access/application ./internal/deviceops/application ./internal/assembly

      - name: Commit only derived closure
        shell: bash
        run: |
          set -euo pipefail
          git -C biz config user.name "github-actions[bot]"
          git -C biz config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C biz add -A contracts/gen contracts/generated internal/access internal/deviceops internal/assembly modules/access modules/deviceops
          git -C biz diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          test -s "$RUNNER_TEMP/staged.txt"
          while IFS= read -r path; do
            case "$path" in
              contracts/gen/*|contracts/generated/*|internal/access/*/zz_yunka*|internal/deviceops/*/zz_yunka*|internal/assembly/*|modules/access/zz_yunka*|modules/deviceops/zz_yunka*) ;;
              *) echo "unexpected staged path: $path" >&2; exit 43 ;;
            esac
          done < "$RUNNER_TEMP/staged.txt"
          git -C biz commit -m "chore(b13): materialize delegation composition closure"
          git -C biz push origin "HEAD:${PRESSURE_BRANCH}"
