name: b13-7b-httprule-custom-verb-reverse

on:
  push:
    branches:
      - agent/b13-cross-tenant-delegation-pressure
    paths:
      - .github/workflows/b13-7b-httprule-custom-verb-reverse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b13-7b-httprule-custom-verb-reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_SHA: 7b1fb933fd97d4e4bee052e374045c858631feeb
      YUNKA_BIZ_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_b137b?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      YUNKA_BIZ_AUTO_MIGRATE: "true"
      YUNKA_BIZ_BOOTSTRAP_TOKEN: b13-7b-owner-token
      YUNKA_BIZ_BOOTSTRAP_TENANT_ID: tenant-b13-owner
      YUNKA_BIZ_BOOTSTRAP_TENANT_NAME: B13 Owner
      YUNKA_BIZ_BOOTSTRAP_USER_ID: user-b13-owner
      YUNKA_BIZ_BOOTSTRAP_EMAIL: owner-b13@example.invalid
      YUNKA_BIZ_BOOTSTRAP_SITE_ID: site-b13-owner
      YUNKA_BIZ_BOOTSTRAP_SITE_NAME: B13 Owner Site
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_b137b
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka compatibility fix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Qualify compatibility fix itself
        shell: bash
        run: |
          set -euo pipefail
          go -C yunka.io/gateway test ./httpbinding
          go -C yunka.io/pkg test ./contract -run 'TestRenderC9REST(CustomVerbUsesCanonicalRegistrar|RejectsPartialWildcardTemplate)$'
          (cd yunka.io/app && go build -buildvcs=true -o "$RUNNER_TEMP/yunka" ./cmd)
          test -x "$RUNNER_TEMP/yunka"

      - name: Regenerate Biz with exact fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          "$RUNNER_TEMP/yunka" generate --full
          git diff --name-only > "$RUNNER_TEMP/b13-7b-generated-files.txt"
          test -s "$RUNNER_TEMP/b13-7b-generated-files.txt"
          while IFS= read -r path; do
            case "$path" in
              internal/access/transport/rest/zz_yunka_*_operation_executor_gen.go|internal/deviceops/transport/rest/zz_yunka_*_operation_executor_gen.go)
                ;;
              *)
                echo "unexpected generated delta: $path" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/b13-7b-generated-files.txt"
          grep -Fq 'httpbinding "yunka.io/gateway/httpbinding"' internal/access/transport/rest/zz_yunka_tenant_delegation_management_operation_executor_gen.go
          grep -Fq 'httpbinding.Register(mux, "POST", "/v1/tenant/delegations/{id}:revoke", handler.handleOperationRevokeTenantDelegation)' internal/access/transport/rest/zz_yunka_tenant_delegation_management_operation_executor_gen.go
          if grep -Fq 'mux.HandleFunc("POST /v1/tenant/delegations/{id}:revoke"' internal/access/transport/rest/zz_yunka_tenant_delegation_management_operation_executor_gen.go; then
            echo "raw ServeMux custom-verb registration still present" >&2
            exit 1
          fi
          git diff -- internal/access/transport/rest/zz_yunka_tenant_delegation_management_operation_executor_gen.go > "$RUNNER_TEMP/b13-7b-revoke-generated.patch"

      - name: Build regenerated Biz and canonical graph
        shell: bash
        run: |
          set -euo pipefail
          go -C biz build ./...
          cd biz
          "$RUNNER_TEMP/yunka" graph build --out "$RUNNER_TEMP/b13-7b-application-graph.json"
          "$RUNNER_TEMP/yunka" graph inspect --graph "$RUNNER_TEMP/b13-7b-application-graph.json" --format json > "$RUNNER_TEMP/b13-7b-graph-inspect.json"
          jq -e '
            ([.nodes[] | select(.kind == "application") | .id] | sort) == ([
              "application:access/tenant_delegation_management",
              "application:access/tenant_lifecycle",
              "application:access/tenant_member_lifecycle",
              "application:access/tenant_role_permission",
              "application:deviceops/delegated_device_access",
              "application:deviceops/device_management",
              "application:deviceops/device_transfer",
              "application:deviceops/site_management"
            ] | sort)
          ' "$RUNNER_TEMP/b13-7b-application-graph.json" >/dev/null

      - name: Prove regenerated custom verb runtime closure
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          rm -f .yunka/dev-runtime.json .yunka/runtime-graph.json
          "$RUNNER_TEMP/yunka" dev >"$RUNNER_TEMP/b13-7b-dev.stdout" 2>"$RUNNER_TEMP/b13-7b-dev.stderr" &
          dev_pid=$!
          cleanup() {
            if kill -0 "$dev_pid" 2>/dev/null; then
              kill -TERM "$dev_pid" 2>/dev/null || true
              wait "$dev_pid" || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              wait "$dev_pid" || true
              cat "$RUNNER_TEMP/b13-7b-dev.stdout" || true
              cat "$RUNNER_TEMP/b13-7b-dev.stderr" || true
              exit 1
            fi
            if test -f .yunka/dev-runtime.json && jq -e '.state == "running" and (.processes | length) == 1 and .processes[0].ready == true' .yunka/dev-runtime.json >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" = 1

          curl --fail --silent --show-error http://127.0.0.1:8080/__yunka/diagnostics > "$RUNNER_TEMP/b13-7b-diagnostics.json"
          jq -e '
            .core.state == "ready" and
            .core.health.ready == true and
            ((.core.modules | map(.name) | sort) == (["access", "deviceops"] | sort)) and
            (.core.routes | index("/v1/tenant/delegations/devices")) != null and
            (.core.routes | index("/v1/tenant/delegations/{id}:revoke")) != null and
            (.core.routes | index("/v1/delegated/devices/{id}")) != null
          ' "$RUNNER_TEMP/b13-7b-diagnostics.json" >/dev/null

          known_status=$(curl --silent --show-error --output "$RUNNER_TEMP/b13-7b-known-verb-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${YUNKA_BIZ_BOOTSTRAP_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: b13-7b-revoke' \
            --data '{"version":1}' \
            http://127.0.0.1:8080/v1/tenant/delegations/missing-delegation:revoke)
          test "$known_status" = "403"

          unknown_status=$(curl --silent --show-error --output "$RUNNER_TEMP/b13-7b-unknown-verb-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${YUNKA_BIZ_BOOTSTRAP_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:8080/v1/tenant/delegations/missing-delegation:unknown)
          test "$unknown_status" = "404"

          "$RUNNER_TEMP/yunka" dev status --closure --format json > "$RUNNER_TEMP/b13-7b-status.json"
          jq -e '
            .state == "running" and
            (.processes | length) == 1 and
            .processes[0].name == "biz" and
            .processes[0].ready == true and
            ((.processes[0].graphNodes | sort) == ([
              "application:access/tenant_delegation_management",
              "application:access/tenant_lifecycle",
              "application:access/tenant_member_lifecycle",
              "application:access/tenant_role_permission",
              "application:deviceops/delegated_device_access",
              "application:deviceops/device_management",
              "application:deviceops/device_transfer",
              "application:deviceops/site_management"
            ] | sort))
          ' "$RUNNER_TEMP/b13-7b-status.json" >/dev/null
          jq -e '[.edges[] | select(.kind == "runs" and .from == "process:biz")] | length == 8' .yunka/runtime-graph.json >/dev/null

          kill -TERM "$dev_pid"
          wait "$dev_pid"
          trap - EXIT
          jq -e '.state == "stopped" and .processes[0].state == "stopped"' .yunka/dev-runtime.json >/dev/null

      - name: Export B13.7b reverse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b13-7b-httprule-custom-verb-reverse-evidence
          path: |
            ${{ runner.temp }}/b13-7b-generated-files.txt
            ${{ runner.temp }}/b13-7b-revoke-generated.patch
            ${{ runner.temp }}/b13-7b-application-graph.json
            ${{ runner.temp }}/b13-7b-graph-inspect.json
            ${{ runner.temp }}/b13-7b-diagnostics.json
            ${{ runner.temp }}/b13-7b-status.json
            ${{ runner.temp }}/b13-7b-dev.stdout
            ${{ runner.temp }}/b13-7b-dev.stderr
            ${{ runner.temp }}/b13-7b-known-verb-response.txt
            ${{ runner.temp }}/b13-7b-unknown-verb-response.txt
          if-no-files-found: warn
          retention-days: 2

      - name: Prove handwritten Biz source stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          changed="$RUNNER_TEMP/b13-7b-final-changed-files.txt"
          git diff --name-only > "$changed"
          while IFS= read -r path; do
            case "$path" in
              internal/access/transport/rest/zz_yunka_*_operation_executor_gen.go|internal/deviceops/transport/rest/zz_yunka_*_operation_executor_gen.go)
                ;;
              *)
                echo "non-generated Biz mutation detected: $path" >&2
                exit 1
                ;;
            esac
          done < "$changed"
