name: Tenant branding contract generation
# Task-scoped carrier. It never runs PR code with a privileged pull_request_target token,
# never writes main, and is removed before the final branding PR is merged.
on:
  push:
    branches: [feat/tenant-branding]
    paths:
      - contracts/proto/access/v1/tenant_profile.proto
      - contracts/commercial/operation-capabilities.v1.json
      - .github/workflows/branding-contract-generation.yml
permissions:
  contents: read
concurrency:
  group: branding-contract-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'hvritual/biz' && github.ref == 'refs/heads/feat/tenant-branding'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
      - id: source
        name: Read and verify pinned framework source
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          test "$YUNKA_COMMIT" = '9ee6640f5e19777b4c04d9e4937a93e2035eacda'
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Locked protobuf tools
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o /tmp/protoc.zip
          echo "$PROTOC_LINUX_X86_64_SHA256  /tmp/protoc.zip" | sha256sum -c -
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo /tmp/protoc/bin >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
      - name: Apply the reviewed commercial mapping delta
        working-directory: biz
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          path = pathlib.Path('contracts/commercial/operation-capabilities.v1.json')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '551a274a0d15206bd73e900cccc174a1fd7ab689e45ee7cd0121d6f749221f01', 'Mapping source moved; do not overwrite it'
          data = json.loads(path.read_text())
          assert data['mapping_version'] == '18'
          data['mapping_version'] = '19'
          for operation in ['tenant.branding.get', 'tenant.branding.update']:
              assert not any(item['operation_id'] == operation for item in data['operations'])
              data['operations'].append({'operation_id': operation, 'classification': 'tenant_business', 'module_code': 'access-management', 'capability_codes': ['tenant.lifecycle'], 'children': []})
          data['operations'].sort(key=lambda item: item['operation_id'])
          output = (json.dumps(data, ensure_ascii=False, indent=2) + '\n').encode()
          assert hashlib.sha256(output).hexdigest() == '153c01edb35868c1bacc9115d0215eed1dea7f13a0864654fa870f818d69c82e', 'Reviewed source delta differs'
          path.write_bytes(output)
          PYCODE
      - name: Generate through the existing pinned toolchain
        working-directory: biz
        run: |
          set -euo pipefail
          make yunka-source-check workspace-check
          make generate
          make check
          go test -count=1 ./internal/access/... ./internal/bizruntime/... ./internal/assembly/...
          git diff --check
      - name: Commit only generated output to the same feature branch
        working-directory: biz
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-m', '-o', '--exclude-standard', '-z']).decode().split('\0')
          paths = sorted(set(filter(None, paths)))
          for name in paths:
              allowed = name.startswith(('contracts/gen/', 'contracts/generated/', 'contracts/commercial/generated/')) or name in {'go.mod','go.sum','contracts/commercial/operation-capabilities.v1.json'} or (pathlib.PurePosixPath(name).name.startswith('zz_yunka_') and name.endswith('_gen.go'))
              if not allowed:
                  raise SystemExit('Generation touched non-generated path: ' + name)
          if paths: subprocess.run(['git','add','--',*paths],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin refs/heads/feat/tenant-branding | cut -f1)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(contracts): generate tenant branding contracts from pinned source'
          git push origin HEAD:refs/heads/feat/tenant-branding
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve generated source evidence
        if: always()
        working-directory: biz
        run: |
          set -euo pipefail
          git diff --binary > /tmp/branding-generation.patch
          git archive --format=tar.gz --output=/tmp/branding-generated-source.tar.gz HEAD
          sha256sum /tmp/branding-generation.patch /tmp/branding-generated-source.tar.gz > /tmp/branding-generation-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: branding-contract-generation
          path: |
            /tmp/branding-generation.patch
            /tmp/branding-generated-source.tar.gz
            /tmp/branding-generation-sha256.txt
          if-no-files-found: error
