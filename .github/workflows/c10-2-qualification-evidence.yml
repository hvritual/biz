name: c10-2-qualification-evidence

on:
  push:
    branches:
      - agent/c10-2-qualification-evidence
    paths:
      - .github/workflows/c10-2-qualification-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      C101_SHA: e9c54e9657ffc64d0e56bcd869d9a7bf61e72f7c
      C102_SHA: f03306501ddb4a4f09e3ce0ea6f15eb23c03462e
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Checkout exact C10.1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C101_SHA }}
          path: yunka-c10-1
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact C10.2 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C102_SHA }}
          path: yunka-c10-2
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          actual_c101="$(git -C yunka-c10-1 rev-parse HEAD)"
          actual_c102="$(git -C yunka-c10-2 rev-parse HEAD)"
          test "$actual_c101" = "$C101_SHA"
          test "$actual_c102" = "$C102_SHA"
          printf 'C10.1 exact head: %s\n' "$actual_c101"
          printf 'C10.2 exact head: %s\n' "$actual_c102"
          git -C yunka-c10-1 status --short
          git -C yunka-c10-2 status --short

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka-c10-2/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Qualify exact C10.1 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          cd yunka-c10-1
          test "$(git rev-parse HEAD)" = "$C101_SHA"
          make toolchain-check
          make verify-production
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run C10.2-G generated fixture closure
        shell: bash
        run: |
          set -euo pipefail
          cd yunka-c10-2
          test "$(git rev-parse HEAD)" = "$C102_SHA"
          make toolchain-check
          make c10-2-qualification-check
          git diff --exit-code

      - name: Run exact C10.2 full production verification
        shell: bash
        run: |
          set -euo pipefail
          cd yunka-c10-2
          test "$(git rev-parse HEAD)" = "$C102_SHA"
          make verify-production
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Record qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "C10.1_SHA=$C101_SHA"
            echo "C10.2_SHA=$C102_SHA"
            echo "GO=$(go version)"
            echo "PROTOC=$(protoc --version)"
            echo "C10.1_VERIFY_PRODUCTION=PASS"
            echo "C10.2_QUALIFICATION_CHECK=PASS"
            echo "C10.2_VERIFY_PRODUCTION=PASS"
            echo "C10.2_SECOND_GENERATION_ZERO_DRIFT=PASS"
          } | tee "$RUNNER_TEMP/c10-2-qualification-evidence.txt"
