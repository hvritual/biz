name: c10-3-runtime-closure-evidence

on:
  push:
    branches:
      - agent/c10-3-runtime-closure-evidence
    paths:
      - .github/workflows/c10-3-runtime-closure-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      C103_SHA: 561d9c779334371735acf8d394969cb752e3999d
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C103_SHA }}
          path: yunka-c10-3
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact C10.3 source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka-c10-3 rev-parse HEAD)" = "$C103_SHA"
          git -C yunka-c10-3 status --short

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka-c10-3/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Run exact C10.3 full production verification
        shell: bash
        run: |
          set -euo pipefail
          cd yunka-c10-3
          test "$(git rev-parse HEAD)" = "$C103_SHA"
          make verify-production
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Record C10.3 qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "C10.3_SHA=$C103_SHA"
            echo "GO=$(go version)"
            echo "PROTOC=$(protoc --version)"
            echo "C10.3_G_ASSEMBLED_RUNTIME=PASS"
            echo "C10.3_VERIFY_PRODUCTION=PASS"
            echo "C10.3_TRACKED_WORKTREE=CLEAN"
          } | tee "$RUNNER_TEMP/c10-3-qualification-evidence.txt"
