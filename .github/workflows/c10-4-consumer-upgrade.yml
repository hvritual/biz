name: c10-4-consumer-upgrade

on:
  push:
    branches:
      - agent/c10-4-consumer-upgrade
  pull_request:

permissions:
  contents: read

jobs:
  consumer-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      C104_FRAMEWORK_SHA: 27050aad72133d734cda78a7273513fc58d21981
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Checkout Biz migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka C10.4 framework head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C104_FRAMEWORK_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$C104_FRAMEWORK_SHA"
          printf 'Biz exact head: %s\n' "$(git -C biz rev-parse HEAD)"
          printf 'Yunka C10.4 exact head: %s\n' "$(git -C yunka.io rev-parse HEAD)"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools

      - name: Verify C10.4 framework binding seam
        shell: bash
        run: |
          set -euo pipefail
          (cd yunka.io/pkg && go test -count=1 ./contract ./architecturepolicy)
          (cd yunka.io/pkg && go vet ./contract ./architecturepolicy)
          make -C yunka.io c10-3-runtime-closure-check
          git -C yunka.io diff --exit-code
          test -z "$(git -C yunka.io status --porcelain --untracked-files=no)"

      - name: Prove current C9.9 Biz truth against C10.4
        shell: bash
        run: |
          set -euo pipefail
          make -C biz verify \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          make -C biz pressure \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"

      - name: Compile existing consumer facts through C10 assembly
        shell: bash
        run: |
          set -euo pipefail
          cp -a biz biz-c10
          rm -rf biz-c10/.git
          assembly_args=(
            --proto-dir "$GITHUB_WORKSPACE/biz-c10/contracts/proto"
            --proto-path "$GITHUB_WORKSPACE/biz-c10/contracts/third_party"
            --proto-path "$GITHUB_WORKSPACE/yunka.io/contracts/proto"
            --file deviceops/v1/deviceops.proto
            --module-root "$GITHUB_WORKSPACE/biz-c10/modules"
            --out "$GITHUB_WORKSPACE/biz-c10/contracts/generated"
            --code-out "$GITHUB_WORKSPACE/biz-c10/internal"
            --code-import github.com/hvritual/biz/internal
            --protoc "$(command -v protoc)"
          )
          (
            cd yunka.io/app
            go run ./cmd assembly generate "${assembly_args[@]}"
            go run ./cmd assembly check "${assembly_args[@]}"
          )
          {
            sha256sum biz-c10/contracts/generated/assembly-plan.json
            find biz-c10/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$RUNNER_TEMP/c10-first.sha256"
          (
            cd yunka.io/app
            go run ./cmd assembly generate "${assembly_args[@]}"
            go run ./cmd assembly check "${assembly_args[@]}"
          )
          {
            sha256sum biz-c10/contracts/generated/assembly-plan.json
            find biz-c10/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$RUNNER_TEMP/c10-second.sha256"
          diff -u "$RUNNER_TEMP/c10-first.sha256" "$RUNNER_TEMP/c10-second.sha256"
          (cd biz-c10 && go test ./...)

      - name: Record before plumbing pressure
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kernel.New' biz/cmd/biz/main.go
          grep -q 'modulecatalog.Default' biz/cmd/biz/main.go
          grep -q 'operation.NewExecutorWithOptions' biz/modules/deviceops/module.go
          grep -q 'NewDeviceopsSiteManagementChildCapability' biz/modules/deviceops/module.go
          grep -q 'NewDeviceopsDeviceManagementChildCapability' biz/modules/deviceops/module.go
          grep -q 'RegisterDeviceManagementOperationExecutor' biz/modules/deviceops/module.go
          grep -q 'RegisterDeviceTransferOperationExecutor' biz/modules/deviceops/module.go
          printf '%s\n' \
            'C10.4_FRAMEWORK_BINDING_SEAM=PASS' \
            'C10.4_BASELINE_C9_VERIFY=PASS' \
            'C10.4_BASELINE_MYSQL_PRESSURE=PASS' \
            'C10.4_ASSEMBLY_GENERATE=PASS' \
            'C10.4_ASSEMBLY_CHECK=PASS' \
            'C10.4_SECOND_GENERATION_ZERO_DRIFT=PASS' \
            'C10.4_GENERATED_CONSUMER_COMPILE=PASS'

      - name: Assert Biz source worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain --untracked-files=no)"
