name: c10-4-final-qualification-evidence

on:
  push:
    branches:
      - agent/c10-4-final-qualification-evidence
    paths:
      - .github/workflows/c10-4-final-qualification-evidence.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      YUNKA_SHA: e8fef5f36bf1a704624ea49455894ab9ccbf9f8d
      BIZ_SHA: 1818f1328189fbe6060ecccb8c658f2583b67cb8
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Checkout evidence carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: carrier
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka documented head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Biz documented head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/biz
          ref: ${{ env.BIZ_SHA }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          printf 'YUNKA_EXACT_HEAD=%s\n' "$(git -C yunka.io rev-parse HEAD)"
          printf 'BIZ_EXACT_HEAD=%s\n' "$(git -C biz rev-parse HEAD)"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/protoc" --version

      - name: Yunka final verify-production
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io verify-production PROTOC="$(command -v protoc)"
          git -C yunka.io diff --exit-code
          test -z "$(git -C yunka.io status --porcelain)"
          echo 'C10.4_YUNKA_VERIFY_PRODUCTION=PASS'
          echo 'C10.4_YUNKA_CLEAN_TREE=PASS'

      - name: Biz first regeneration and clean-tree
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain)"
          {
            sha256sum biz/contracts/generated/assembly-plan.json
            find biz/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum biz/contracts/generated/manifest.json biz/contracts/generated/operation-plans.json
          } > "$RUNNER_TEMP/biz-first.sha256"
          echo 'C10.4_BIZ_REGENERATE_1=PASS'

      - name: Biz second regeneration zero drift
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          {
            sha256sum biz/contracts/generated/assembly-plan.json
            find biz/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum biz/contracts/generated/manifest.json biz/contracts/generated/operation-plans.json
          } > "$RUNNER_TEMP/biz-second.sha256"
          diff -u "$RUNNER_TEMP/biz-first.sha256" "$RUNNER_TEMP/biz-second.sha256"
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain)"
          echo 'C10.4_BIZ_REGENERATE_2=PASS'
          echo 'C10.4_BIZ_SECOND_GENERATION_ZERO_DRIFT=PASS'

      - name: Biz final verify
        shell: bash
        run: |
          set -euo pipefail
          make -C biz verify \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          echo 'C10.4_BIZ_VERIFY=PASS'

      - name: Biz final MySQL pressure
        shell: bash
        run: |
          set -euo pipefail
          make -C biz pressure \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          echo 'C10.4_BIZ_MYSQL_PRESSURE=PASS'

      - name: Final clean-tree and qualification record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          git -C yunka.io diff --exit-code
          git -C biz diff --exit-code
          test -z "$(git -C yunka.io status --porcelain)"
          test -z "$(git -C biz status --porcelain)"
          printf '%s\n' \
            "C10.4_YUNKA_HEAD=$YUNKA_SHA" \
            "C10.4_BIZ_HEAD=$BIZ_SHA" \
            'C10.4_YUNKA_VERIFY_PRODUCTION=PASS' \
            'C10.4_BIZ_REGENERATE_TWICE=PASS' \
            'C10.4_BIZ_SECOND_GENERATION_ZERO_DRIFT=PASS' \
            'C10.4_BIZ_VERIFY=PASS' \
            'C10.4_BIZ_MYSQL_PRESSURE=PASS' \
            'C10.4_FINAL_CLEAN_TREE=PASS' \
            'C10.4_FINAL_QUALIFICATION=PASS'
