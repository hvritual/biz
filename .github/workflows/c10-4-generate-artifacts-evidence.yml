name: c10-4-generate-artifacts-evidence

on:
  push:
    branches:
      - agent/c10-4-consumer-upgrade
    paths:
      - .github/workflows/c10-4-generate-artifacts-evidence.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      C104_FRAMEWORK_SHA: ddd2d7a1325b68e2f4abe5b83d7b9bc0af102c96
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c10-4-consumer-upgrade
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact Yunka C10.4 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C104_FRAMEWORK_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Generate canonical Biz assembly
        shell: bash
        run: |
          set -euo pipefail
          cd yunka.io/app
          go run ./cmd assembly generate \
            --proto-dir "$GITHUB_WORKSPACE/biz/contracts/proto" \
            --proto-path "$GITHUB_WORKSPACE/biz/contracts/third_party" \
            --proto-path "$GITHUB_WORKSPACE/yunka.io/contracts/proto" \
            --file deviceops/v1/deviceops.proto \
            --module-root "$GITHUB_WORKSPACE/biz/modules" \
            --out "$GITHUB_WORKSPACE/biz/contracts/generated" \
            --code-out "$GITHUB_WORKSPACE/biz/internal" \
            --code-import github.com/hvritual/biz/internal \
            --protoc "$(command -v protoc)"
          go run ./cmd assembly check \
            --proto-dir "$GITHUB_WORKSPACE/biz/contracts/proto" \
            --proto-path "$GITHUB_WORKSPACE/biz/contracts/third_party" \
            --proto-path "$GITHUB_WORKSPACE/yunka.io/contracts/proto" \
            --file deviceops/v1/deviceops.proto \
            --module-root "$GITHUB_WORKSPACE/biz/modules" \
            --out "$GITHUB_WORKSPACE/biz/contracts/generated" \
            --code-out "$GITHUB_WORKSPACE/biz/internal" \
            --code-import github.com/hvritual/biz/internal \
            --protoc "$(command -v protoc)"
      - name: Print canonical generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            biz/contracts/generated/assembly-plan.json \
            biz/internal/assembly/zz_yunka_assembly_gen.go \
            biz/internal/assembly/zz_yunka_modules_gen.go; do
            echo "===== C10.4_ARTIFACT_BEGIN:$file ====="
            cat "$file"
            echo "===== C10.4_ARTIFACT_END:$file ====="
          done
      - name: Export canonical generated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c10-4-biz-assembly
          path: |
            biz/contracts/generated/assembly-plan.json
            biz/internal/assembly/zz_yunka_assembly_gen.go
            biz/internal/assembly/zz_yunka_modules_gen.go
          if-no-files-found: error
          retention-days: 1
