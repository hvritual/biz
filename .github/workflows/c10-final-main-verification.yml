name: c10-final-main-verification

on:
  push:
    branches:
      - agent/c10-final-main-verification
    paths:
      - .github/workflows/c10-final-main-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FINAL_MAIN_SHA: 257660d5c57ca58647020dc9cf8199f438f5fc96
      PRE_RECORD_MAIN_SHA: d5968c7908b61b68791beb2230f8e0d717849d2e
      QUALIFIED_C105_SHA: 4c4beb72ffde79d97a28cf5c3b083c756b729d27
      BIZ_SHA: 1818f1328189fbe6060ecccb8c658f2583b67cb8
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Checkout evidence carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: carrier
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact final Yunka main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.FINAL_MAIN_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact qualified Biz consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/biz
          ref: ${{ env.BIZ_SHA }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Assert final source and allowed post-merge record delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$FINAL_MAIN_SHA"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          git -C yunka.io merge-base --is-ancestor "$QUALIFIED_C105_SHA" "$FINAL_MAIN_SHA"
          git -C yunka.io merge-base --is-ancestor "$PRE_RECORD_MAIN_SHA" "$FINAL_MAIN_SHA"
          git -C yunka.io diff --name-only "$PRE_RECORD_MAIN_SHA" "$FINAL_MAIN_SHA" | sort > "$RUNNER_TEMP/final-delta.txt"
          printf '%s\n' PROJECT_MEMORY.md docs/waves/C10.5-release-qualification.md | sort > "$RUNNER_TEMP/expected-delta.txt"
          diff -u "$RUNNER_TEMP/expected-delta.txt" "$RUNNER_TEMP/final-delta.txt"
          echo 'C10_FINAL_MAIN_ALLOWED_DELTA=PASS'

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/protoc" --version

      - name: Verify final Yunka main production gate
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io verify-production PROTOC="$(command -v protoc)"
          git -C yunka.io diff --exit-code
          test -z "$(git -C yunka.io status --porcelain)"
          echo 'C10_FINAL_MAIN_VERIFY_PRODUCTION=PASS'

      - name: Regenerate real Biz twice with zero drift
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain)"
          {
            sha256sum biz/contracts/generated/manifest.json
            sha256sum biz/contracts/generated/operation-plans.json
            sha256sum biz/contracts/generated/openapi.json
            sha256sum biz/contracts/generated/client.ts
            sha256sum biz/contracts/generated/assembly-plan.json
            find biz/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$RUNNER_TEMP/biz-first.sha256"
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          {
            sha256sum biz/contracts/generated/manifest.json
            sha256sum biz/contracts/generated/operation-plans.json
            sha256sum biz/contracts/generated/openapi.json
            sha256sum biz/contracts/generated/client.ts
            sha256sum biz/contracts/generated/assembly-plan.json
            find biz/internal/assembly -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$RUNNER_TEMP/biz-second.sha256"
          diff -u "$RUNNER_TEMP/biz-first.sha256" "$RUNNER_TEMP/biz-second.sha256"
          git -C biz diff --exit-code
          test -z "$(git -C biz status --porcelain)"
          echo 'C10_FINAL_BIZ_SECOND_GENERATION_ZERO_DRIFT=PASS'

      - name: Verify and pressure real Biz against final main
        shell: bash
        run: |
          set -euo pipefail
          make -C biz verify \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          make -C biz pressure \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          echo 'C10_FINAL_BIZ_VERIFY=PASS'
          echo 'C10_FINAL_BIZ_MYSQL_PRESSURE=PASS'

      - name: Final sealed release record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$FINAL_MAIN_SHA"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          git -C yunka.io diff --exit-code
          git -C biz diff --exit-code
          test -z "$(git -C yunka.io status --porcelain)"
          test -z "$(git -C biz status --porcelain)"
          echo 'C10_FINAL_MAIN_CLEAN_TREE=PASS'
          echo 'C10_FINAL_RELEASE_SEAL=PASS'
