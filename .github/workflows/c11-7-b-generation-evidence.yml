name: c11-7-b-generation-evidence

on:
  push:
    branches:
      - agent/c11-7-b-dx-adoption
    paths:
      - .github/workflows/c11-7-b-generation-evidence.yml
      - .yunka/project.json
      - Makefile
      - contracts/**
      - internal/**
      - modules/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      C117_FRAMEWORK_SHA: d9bc214a0485a48fefae0826051142d741e54257
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout qualified Yunka C11.7 runtime head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.C117_FRAMEWORK_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$C117_FRAMEWORK_SHA"
          printf 'Biz exact head: %s\n' "$(git -C biz rev-parse HEAD)"
          printf 'Yunka exact head: %s\n' "$(git -C yunka.io rev-parse HEAD)"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools

      - name: Capture committed C10 semantic baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c117-evidence"
          (
            cd biz
            sha256sum contracts/generated/operation-plans.json contracts/generated/assembly-plan.json
            find internal -type f -name 'zz_yunka*.go' -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/c117-evidence/semantic-before.sha256"

      - name: Generate through C11 happy path
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"

      - name: Capture C11 semantic candidate and generated diff
        shell: bash
        run: |
          set -euo pipefail
          (
            cd biz
            sha256sum contracts/generated/operation-plans.json contracts/generated/assembly-plan.json
            find internal -type f -name 'zz_yunka*.go' -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/c117-evidence/semantic-after.sha256"
          git -C biz status --porcelain > "$RUNNER_TEMP/c117-evidence/status-after-first.txt"
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/c117-evidence/generated.diff"
          printf '%s\n' '===== semantic baseline ====='
          cat "$RUNNER_TEMP/c117-evidence/semantic-before.sha256"
          printf '%s\n' '===== semantic candidate ====='
          cat "$RUNNER_TEMP/c117-evidence/semantic-after.sha256"
          printf '%s\n' '===== generated status ====='
          cat "$RUNNER_TEMP/c117-evidence/status-after-first.txt"
          printf '%s\n' '===== generated diff ====='
          cat "$RUNNER_TEMP/c117-evidence/generated.diff"

      - name: Prove second generation byte stability
        shell: bash
        run: |
          set -euo pipefail
          (
            cd biz
            find contracts/generated contracts/gen internal -type f \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/c117-evidence/generated-first.sha256"
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)" \
            PROTOC_GEN_GO="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$GITHUB_WORKSPACE/yunka.io/.yunka/bin/protoc-gen-go-grpc"
          (
            cd biz
            find contracts/generated contracts/gen internal -type f \( -name '*.json' -o -name '*.ts' -o -name '*.pb.go' -o -name 'zz_yunka*.go' \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/c117-evidence/generated-second.sha256"
          diff -u "$RUNNER_TEMP/c117-evidence/generated-first.sha256" "$RUNNER_TEMP/c117-evidence/generated-second.sha256"
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/c117-evidence/generated-final.diff"
          git -C biz status --porcelain > "$RUNNER_TEMP/c117-evidence/status-final.txt"

      - name: Stage generated candidate for artifact export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c117-export"
          cp -a biz/contracts/generated "$RUNNER_TEMP/c117-export/contracts-generated"
          cp -a biz/contracts/gen "$RUNNER_TEMP/c117-export/contracts-gen"
          find biz/internal -type f -name 'zz_yunka*.go' -print0 | while IFS= read -r -d '' file; do
            rel="${file#biz/}"
            mkdir -p "$RUNNER_TEMP/c117-export/$(dirname "$rel")"
            cp "$file" "$RUNNER_TEMP/c117-export/$rel"
          done
          cp "$RUNNER_TEMP/c117-evidence/"* "$RUNNER_TEMP/c117-export/"

      - name: Export C11 generation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c11-7-b-generation-evidence
          path: ${{ runner.temp }}/c117-export
          if-no-files-found: error
          retention-days: 1
