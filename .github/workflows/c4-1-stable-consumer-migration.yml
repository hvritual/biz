name: c4-1-stable-consumer-migration

on:
  push:
    branches: [fix/delivery-release-certification]
    paths:
      - .github/workflows/c4-1-stable-consumer-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/delivery-release-certification
          path: biz
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout canonical Yunka source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 6dab44980dea1090339aea86c47838d6da594646
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false

      - name: Migrate Biz to stable Yunka modules
        shell: bash
        run: |
          set -euo pipefail
          cd biz

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              "yunka.io/framework": "github.com/hvritual/yunka.io/framework",
              "yunka.io/gateway": "github.com/hvritual/yunka.io/gateway",
              "yunka.io/pkg": "github.com/hvritual/yunka.io/pkg",
          }

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.go", "*.proto", "go.mod"], text=True
          ).splitlines()
          for name in tracked:
              path = Path(name)
              text = path.read_text()
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new)

          source = Path(".yunka/source.env")
          source.write_text(
              '# Canonical Yunka source used by Biz consumer certification.\n'
              '# The release contract uses immutable v0.1.0 modules; YUNKA_COMMIT locks the canonical local source checkout.\n'
              'YUNKA_REPOSITORY="https://github.com/hvritual/yunka.io"\n'
              'YUNKA_COMMIT="6dab44980dea1090339aea86c47838d6da594646"\n'
              'YUNKA_VERSION="v0.1.0"\n'
              'YUNKA_MODULES="framework gateway pkg"\n'
          )

          for name in ["scripts/consumer-resolution-check.sh", "scripts/verify-yunka-source.sh"]:
              path = Path(name)
              text = path.read_text()
              for old, replacement in replacements.items():
                  text = text.replace(old, replacement)
              text = text.replace("YUNKA_PSEUDO_VERSION", "YUNKA_VERSION")
              lines = []
              for line in text.splitlines():
                  if "check_version github.com/go-kit/kit v0.10.0" in line:
                      continue
                  if "check_module_path compat/go-kit-kit-log github.com/go-kit/kit" in line:
                      continue
                  if "check_release_contract github.com/go-kit/kit v0.10.0" in line:
                      continue
                  if "check_workspace_replace github.com/go-kit/kit compat/go-kit-kit-log" in line:
                      continue
                  lines.append(line)
              path.write_text("\n".join(lines) + "\n")

          workflow = Path(".github/workflows/delivery-workspace-isolation.yml")
          text = workflow.read_text().replace(
              "6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb",
              "6dab44980dea1090339aea86c47838d6da594646",
          )
          workflow.write_text(text)
          PY

          cat > go.work <<'EOF'
          go 1.25.0

          toolchain go1.25.13

          use .

          replace (
            github.com/hvritual/yunka.io/framework => ../yunka.io/framework
            github.com/hvritual/yunka.io/gateway => ../yunka.io/gateway
            github.com/hvritual/yunka.io/pkg => ../yunka.io/pkg
          )
          EOF

          GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/pkg@v0.1.0
          GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/framework@v0.1.0
          GOWORK=off go mod edit -require=github.com/hvritual/yunka.io/gateway@v0.1.0
          GOWORK=off go mod tidy
          go work sync
          go list -m all >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          legacy = re.compile(r'"yunka\.io/(framework|gateway|pkg)(?:/|"|$)')
          for pattern in ("*.go", "*.proto"):
              names = subprocess.check_output(["git", "ls-files", pattern], text=True).splitlines()
              for name in names:
                  text = Path(name).read_text()
                  if legacy.search(text):
                      raise SystemExit(f"legacy Yunka module import remains: {name}")

          mod = json.loads(subprocess.check_output(
              ["go", "mod", "edit", "-json"],
              text=True,
              env={**__import__('os').environ, "GOWORK": "off"},
          ))
          required = {entry["Path"]: entry["Version"] for entry in mod.get("Require") or []}
          expected = {
              "github.com/hvritual/yunka.io/pkg": "v0.1.0",
              "github.com/hvritual/yunka.io/framework": "v0.1.0",
              "github.com/hvritual/yunka.io/gateway": "v0.1.0",
          }
          for module, version in expected.items():
              if required.get(module) != version:
                  raise SystemExit(f"{module}={required.get(module)!r}, expected {version}")
          for module in ("yunka.io/pkg", "yunka.io/framework", "yunka.io/gateway"):
              if module in required:
                  raise SystemExit(f"legacy go.mod requirement remains: {module}")
          if mod.get("Replace"):
              raise SystemExit("go.mod must remain replacement-free")

          for name in [
              ".yunka/source.env",
              "scripts/consumer-resolution-check.sh",
              "scripts/verify-yunka-source.sh",
              ".github/workflows/delivery-workspace-isolation.yml",
          ]:
              if "YUNKA_PSEUDO_VERSION" in Path(name).read_text():
                  raise SystemExit(f"legacy pseudo-version contract remains: {name}")
          PY

          git diff --check

      - name: Certify development and release graphs
        shell: bash
        run: |
          set -euo pipefail
          make -C biz consumer-certify YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io"
          test -z "$(git -C yunka.io status --porcelain)"
          git -C biz diff --check

      - name: Commit qualified migration and retire executor
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          git rm .github/workflows/c4-1-stable-consumer-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: consume Yunka v0.1.0 stable modules'
          git push origin HEAD:fix/delivery-release-certification
