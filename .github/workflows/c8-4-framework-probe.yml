name: c8-4-framework-probe

on:
  push:
    branches:
      - agent/biz-c8-4-rebuild

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout biz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: workspace/biz
          fetch-depth: 0
      - name: Checkout latest yunka.io
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hvritual/yunka.io
          ref: main
          path: workspace/yunka.io
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Verify framework baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workspace/yunka.io rev-parse HEAD)" = "cdf7d933758d3c94e03a5601801dbf84d8144d00"
          cd workspace/biz
          go test ./...
