name: c8-5-seed-coalesce

on:
  push:
    branches:
      - agent/c8-5-operation-security-boundary
    paths:
      - .github/workflows/c8-5-seed-coalesce.yml

permissions:
  contents: write

jobs:
  coalesce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Coalesce remaining seed chunks
        shell: bash
        run: |
          set -euo pipefail
          cat tools/c8-5-biz-seed.part-001 tools/c8-5-biz-seed.part-002 tools/c8-5-biz-seed.part-003 tools/c8-5-biz-seed.part-004 > tools/c8-5-biz-seed.super-a
          cat tools/c8-5-biz-seed.part-005 tools/c8-5-biz-seed.part-006 tools/c8-5-biz-seed.part-007 tools/c8-5-biz-seed.part-008 > tools/c8-5-biz-seed.super-b
          cat tools/c8-5-biz-seed.part-009 tools/c8-5-biz-seed.part-010 tools/c8-5-biz-seed.part-011 > tools/c8-5-biz-seed.super-c
          git config user.name "biz-c8-5-seed"
          git config user.email "biz-c8-5-seed@users.noreply.github.com"
          git add tools/c8-5-biz-seed.super-*
          git commit -m "ci: coalesce C8.5 biz seed"
          git push origin HEAD:agent/c8-5-operation-security-boundary
