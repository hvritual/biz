name: c8-7-biz-source-export

on:
  push:
    branches:
      - agent/c8-7-real-composition

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Pack exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse b772f8d3081ef47da7aad9334b11206f17eaa742^{tree})" = "204f5ef4115024abe37531de786ea541e59f2a50"
          tar --exclude=.git --exclude=.github/workflows/c8-7-source-export.yml -czf "$RUNNER_TEMP/biz-c8-7-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/biz-c8-7-source.tar.gz" | tee "$RUNNER_TEMP/biz-c8-7-source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: biz-c8-7-source
          path: |
            ${{ runner.temp }}/biz-c8-7-source.tar.gz
            ${{ runner.temp }}/biz-c8-7-source.sha256
          if-no-files-found: error
