name: c9-7-migrate-export

on:
  push:
    branches:
      - agent/c9-7-biz-conformance
    paths:
      - tools/c9_7_biz_migration.py
      - .github/workflows/c9-7-migrate-export.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-7-biz-conformance
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false
      - name: Apply real-biz C9.7 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/c9_7_biz_migration.py
          gofmt -w internal/deviceops/application/*.go internal/deviceops/infrastructure/persistence/scoped.go internal/deviceops/infrastructure/persistence/local_composition.go internal/deviceops/policy/pressure_plans.go modules/deviceops/module.go integration/*.go
          ! grep -R -n 'requestscope.Execute' internal/deviceops/application
          ! grep -R -n 'requestscope.GORMFrom' internal/deviceops/application
          ! grep -R -n 'gorm.io/gorm' internal/deviceops/application
          ! grep -R -n 'TransactionalStore' internal/deviceops/application
          grep -R -q 'requestscope.Join' internal/deviceops/application
          grep -q 'service.stager.Stage' internal/deviceops/application/remote_saga.go
          git diff --check
      - name: Commit migrated non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add contracts/proto docs/pressure integration internal/deviceops modules/deviceops
          git commit -m "feat: migrate real biz to C9.7 execution scope"
          git push origin HEAD:agent/c9-7-biz-conformance
      - name: Export exact migrated source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/biz-c9-7.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/biz-c9-7.tar.gz" > "$RUNNER_TEMP/biz-c9-7.tar.gz.sha256"
      - name: Upload migrated source
        uses: actions/upload-artifact@v4
        with:
          name: biz-c9-7-source
          path: |
            ${{ runner.temp }}/biz-c9-7.tar.gz
            ${{ runner.temp }}/biz-c9-7.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
