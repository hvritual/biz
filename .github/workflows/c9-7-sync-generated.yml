name: c9-7-sync-generated

on:
  push:
    branches:
      - agent/c9-7-biz-conformance
    paths:
      - .github/workflows/c9-7-sync-generated.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/c9-7-biz-conformance
          fetch-depth: 0
      - name: Download verified regenerated artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/generated.zip" 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3e1c-81f4-bbfc-e6890ff15d21/raw?se=2026-08-28T13%3A01%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=eacc9bf0-984a-5410-a051-2d7d536c84a2&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T06%3A43%3A23Z&ske=2026-08-29T06%3A43%3A23Z&sks=b&skv=2026-02-06&sig=zNq4YA/TQGcFxOimrhq2Hd1Px3OAgPuO21Q5NXO4Kis%3D'
          mkdir -p "$RUNNER_TEMP/generated"
          unzip -q "$RUNNER_TEMP/generated.zip" -d "$RUNNER_TEMP/generated"
          tar -xzf "$RUNNER_TEMP/generated/biz-c9-7-regenerated.tar.gz" -C "$RUNNER_TEMP/generated"
      - name: Sync deterministic generated files only
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/generated"
          files=(
            contracts/gen/deviceops/v1/deviceops.pb.go
            contracts/generated/manifest.json
            contracts/generated/operation-plans.json
            internal/deviceops/policy/zz_yunka_device_management_operation_plan_gen.go
            internal/deviceops/transport/rest/zz_yunka_device_management_operation_executor_gen.go
            internal/deviceops/transport/rpc/zz_yunka_device_management_operation_executor_gen.go
          )
          for f in "${files[@]}"; do
            test -f "$src/$f"
            cp "$src/$f" "$f"
          done
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          actual="$(printf '%s\n' "$changed" | sed '/^$/d' | sort)"
          test "$actual" = "$expected"
      - name: Commit regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add contracts/gen/deviceops/v1/deviceops.pb.go contracts/generated/manifest.json contracts/generated/operation-plans.json internal/deviceops/policy/zz_yunka_device_management_operation_plan_gen.go internal/deviceops/transport/rest/zz_yunka_device_management_operation_executor_gen.go internal/deviceops/transport/rpc/zz_yunka_device_management_operation_executor_gen.go
          git commit -m 'build: sync C9.7 generated operation artifacts'
          git push origin HEAD:agent/c9-7-biz-conformance
