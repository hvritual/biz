name: c9-9-exact-closure

on:
  push:
    branches:
      - agent/c9-9-conformance-closure
    paths:
      - .github/workflows/c9-9-exact-closure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-closure:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact Yunka C9.9 closure tree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/c99"
          mkdir -p "$work"
          source_zip="$work/yunka-source.zip"
          source_url='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-fd58-820a-9724-19b2e41a6172/raw?se=2026-08-29T00%3A31%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=7ec966a2-22f2-56a0-b6e8-5953c08876c1&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A49%3A38Z&ske=2026-08-29T20%3A49%3A38Z&sks=b&skv=2026-02-06&sig=JwJDIuEt8FzgU4E63WBgmVCP3ajdd1ArIQWzeoLnzZg%3D'
          curl --fail --silent --show-error --location --retry 3 "$source_url" -o "$source_zip"
          echo '34c61442846d9521215099c187dbfd43b948b644138f3554dd2eb07b475f91b1  '"$source_zip" | sha256sum -c -
          unzip -q "$source_zip" -d "$work/source"
          echo 'b86b15e8690b8162559af7ca3c5e200db402f81636e6ecfd10468b6e15f1d7a1  '"$work/source/yunka-c9-8.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/yunka.io"
          tar -xzf "$work/source/yunka-c9-8.tar.gz" -C "$RUNNER_TEMP/yunka.io"
          cd "$RUNNER_TEMP/yunka.io"
          rm -f .github/workflows/c9-8-framework-export.yml .github/workflows/c9-8-real-biz-control.yml tools/c9-8-biz-source-url.txt .github/workflows/c9-production.yml

          cat > "$work/overlay.tsv" <<'EOF'
          contracts/proto/yunka/dsl/v1/options.proto	fb98c274b6c93b928faadd1e266e3ab1792fa61e	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/contracts/proto/yunka/dsl/v1/options.proto?token=AC2ZLPYFYFOEY372KPSL3WLKSITL7AA
          pkg/applicationgraph/applicationgraph_test.go	2c79aa44749b3d4ad0d6418bf9dcdf5190acc92a	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/applicationgraph/applicationgraph_test.go?token=AC2ZLP33V5WGJYXJXMKUAJDKSITLLAA
          pkg/applicationgraph/contract.go	dbf632ba836a8593b0e039b3e5c188996ce3ff76	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/applicationgraph/contract.go?token=AC2ZLP427UPU6DYUV26XCUDKSITLLAA
          pkg/architecturepolicy/c8_4_test.go	31fd3ef3ebf8349a00cdfae5823e9edc06b1a74c	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/architecturepolicy/c8_4_test.go?token=AC2ZLPZNZ7GYCYS37HVSMEDKSITLVAA
          pkg/contract/application_codegen.go	8c177928a38df134c4623bfe4feb9d817a9ff516	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/application_codegen.go?token=AC2ZLP34URRKTC2IUTJMTP3KSITALAA
          pkg/contract/application_operations.go	2bffc636360b17c6c54934d0d3e254e772c9faad	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/application_operations.go?token=AC2ZLP3JE6TAU2WPQWHS7YTKSITALAA
          pkg/contract/artifact.go	2a42fb7738bd0eaea1e40bbbcf82393c8bf527eb	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/artifact.go?token=AC2ZLP74AKVJ576BBQK2DKDKSITALAA
          pkg/contract/c9_application_codegen.go	33b9205916854240387c4e4faf061495152f9a93	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/c9_application_codegen.go?token=AC2ZLP5DVWERESD72KT7Q63KSITALAA
          pkg/contract/c9_application_codegen_test.go	289163489906a5a7e1390d21ebcf46ceb5ba6304	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/c9_application_codegen_test.go?token=AC2ZLP2AEBM7LYB5SCSK3ELKSITALAA
          pkg/contract/compiler_test.go	b36ab076542a110d165402348789f2d089acfa19	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/compiler_test.go?token=AC2ZLP3XN6LIAMHOKH6PL7TKSITALAA
          pkg/contract/diff.go	d7e69df53672120402852b60cf940b833ef1604f	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/diff.go?token=AC2ZLPZSEQP5244CGZQ73V3KSITALAA
          pkg/contract/dsl_descriptor.go	004e5d65fb88356dc6f706635935a5accff46994	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/dsl_descriptor.go?token=AC2ZLPYZIO3P3RTF66RFXQ3KSITALAA
          pkg/contract/external_contract.go	0c2abc6fc0b53652168f4387b536fdd9f5dd4058	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/external_contract.go?token=AC2ZLPZEHESPJXGEFT3QWYLKSITALAA
          pkg/contract/external_contract_test.go	52fe334b4b472184266f01de42c05c9603ed5059	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/external_contract_test.go?token=AC2ZLP7FDALYGBQ45BEWA4TKSITALAA
          pkg/contract/lint.go	9d88c2ccf08292577bd8848ffa3f0a4ace76a9d9	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/lint.go?token=AC2ZLP77CJNBQIUAVDDZ4BDKSITALAA
          pkg/contract/model.go	e12dc418087a2f586152487931c8fe78fce76b07	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/model.go?token=AC2ZLP337L6DVZAVPSTIS73KSITALAA
          pkg/contract/openapi.go	74b83b9a78e701fe5db55270eb95117b95c6e9ac	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/openapi.go?token=AC2ZLP3ZSX5R2XA4FDELPGDKSITALAA
          pkg/contract/operation_plan.go	785c193eb57241ce3f9f86613422c3e4d5a09a54	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/operation_plan.go?token=AC2ZLP7HHSYDWDT2TWOOEVTKSITALAA
          pkg/contract/operation_plan_test.go	90dacc0903549c9afabcedbe80d813dd084c4d5c	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/operation_plan_test.go?token=AC2ZLP3OODQW5HGVPJI55ELKSITALAA
          pkg/contract/typescript.go	9e94df3e90bccd80128a756d3c186c33c8636b43	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contract/typescript.go?token=AC2ZLP6IK72OWDBATA6PJ33KSITALAA
          pkg/contractdsl/v1/options.pb.go	d96ae7768a46b998ecb57271b06e0b716484f164	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/contractdsl/v1/options.pb.go?token=AC2ZLP7QHSFBSJW5RWJT7HTKSITMRAA
          pkg/operationplan/plan.go	8df40dc79842d2c4d04b3720a7cd51c733a19e8f	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/operationplan/plan.go?token=AC2ZLP4M6YF4GYNSM4GHWILKSITMXAA
          pkg/operationplan/plan_test.go	b771636580b6e90e320ca6d0e27205afe1c42533	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/pkg/operationplan/plan_test.go?token=AC2ZLPZAYNA7WR3DBA6BSCLKSITMXAA
          AGENTS.md	570c4b91c5d683648ace6ddd4aa33cf6acfceea7	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/AGENTS.md?token=AC2ZLPYUOEKVQVDITILJAELKSHXILAA
          PROJECT_MEMORY.md	893d2b1d12e5690db20267443eb340875fde4a84	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/PROJECT_MEMORY.md?token=AC2ZLP6UTEOZ6PCFORIGH4LKSHXILAA
          README.md	be3f35738fe24ba43612cfedf43f205872f00319	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/README.md?token=AC2ZLP35RW4LERLGD2TSIJLKSHXILAA
          .github/workflows/production.yml	085709ae1e949992f1616bd03886a618f2e1ccd1	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/.github/workflows/production.yml?token=AC2ZLPZ4H5PYRUUTY2MHDE3KSITRRAA
          docs/waves/C9-operation-contract-runtime.md	507bdae343bca7e21e14438f565478126591f534	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/docs/waves/C9-operation-contract-runtime.md?token=AC2ZLPYFSR6BT5LM3BQQKUDKSITP5AA
          docs/waves/C9.7-execution-semantics-closure.md	c1053ae7abc99416b13d2d976695cd6ed2818d59	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/docs/waves/C9.7-execution-semantics-closure.md?token=AC2ZLP3COUYHEZ4G6XSAMLTKSITP5AA
          docs/waves/C9.8-canonical-internal-operations.md	d2624b64c00893643ec00b3c22f285b78bed27cc	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/docs/waves/C9.8-canonical-internal-operations.md?token=AC2ZLP3VQLET3F445AT4FH3KSITP5AA
          docs/waves/C9.9-baseline-conformance-closure.md	66d06bc212effcd2f6e11dc6e938f5c8154b8cc4	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/docs/waves/C9.9-baseline-conformance-closure.md?token=AC2ZLP7Z6PNY4KEB3VD2RHDKSITP5AA
          docs/waves/R0-c9-8-release-closure.md	fbd6442cb41caf56452a1477cc95b4607ea94e44	https://raw.githubusercontent.com/hvritual/yunka.io/agent/c9-9-baseline-conformance-closure/docs/waves/R0-c9-8-release-closure.md?token=AC2ZLP4DNFD5ATQUTRSP73LKSITP5AA
          EOF

          while IFS=$'\t' read -r path sha url; do
            [[ -n "$path" ]] || continue
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location --retry 3 "$url" -o "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$sha" || { echo "blob mismatch $path: $actual != $sha" >&2; exit 1; }
          done < "$work/overlay.tsv"

          git init -q
          git config user.name c9-9-closure
          git config user.email c9-9-closure@invalid.local
          git add -A
          git commit -qm 'C9.9 exact closure tree'
          git status --short
          echo "YUNKA_ROOT=$RUNNER_TEMP/yunka.io" >> "$GITHUB_ENV"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source "$YUNKA_ROOT/tools/toolchain.env"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: true
          cache-dependency-path: |
            go.sum
            ${{ env.YUNKA_ROOT }}/app/go.sum
            ${{ env.YUNKA_ROOT }}/framework/go.sum
            ${{ env.YUNKA_ROOT }}/gateway/go.sum
            ${{ env.YUNKA_ROOT }}/pkg/go.sum

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Verify exact Yunka closure on MySQL 8.4
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          cd "$YUNKA_ROOT"
          make verify-production
          git diff --exit-code

      - name: Regenerate real Biz consumer
        shell: bash
        run: |
          set -euo pipefail
          make generate
          git status --short > "$RUNNER_TEMP/biz-generated-status.txt"
          git diff --name-only > "$RUNNER_TEMP/biz-generated-files.txt"
          cat "$RUNNER_TEMP/biz-generated-files.txt"

      - name: Assert final generated-state contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'rpc ValidateTransferTarget' contracts/proto contracts/gen
          ! grep -R -n 'RegisterSiteManagementOperationExecutor' modules internal/deviceops/transport || true
          test ! -e internal/deviceops/transport/rest/zz_yunka_site_management_operation_executor_gen.go
          test ! -e internal/deviceops/transport/rpc/zz_yunka_site_management_operation_executor_gen.go
          grep -R -n 'operation.ExecuteChildTyped' internal/deviceops/application/zz_yunka_device_transfer_capability_ports_gen.go
          grep -R -n 'ValidateTransferTarget' internal/deviceops/application/zz_yunka_device_transfer_capability_ports_gen.go
          python3 - <<'PY'
          import json
          p=json.load(open('contracts/generated/operation-plans.json'))
          ops={x['operationId']:x for x in p['operations']}
          op=ops['site.validate_transfer_target']
          assert op['bindings'].get('rpc','') == '', op
          assert not op['bindings'].get('http'), op
          assert op['application'] == 'site_management', op
          print('internal operation plan:', op['operationId'], op['bindings'])
          PY
          ! grep -n 'ValidateTransferTargetRequest' contracts/generated/openapi.json
          ! grep -n 'ValidateTransferTargetRequest' contracts/generated/client.ts

      - name: Verify real Biz consumer and MySQL pressure
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          make verify
          make pressure

      - name: Package regenerated consumer evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/biz-c9-9-regenerated.tar.gz" .
          sha256sum "$RUNNER_TEMP/biz-c9-9-regenerated.tar.gz" > "$RUNNER_TEMP/biz-c9-9-regenerated.tar.gz.sha256"
          cp "$RUNNER_TEMP/biz-generated-status.txt" "$RUNNER_TEMP/" 2>/dev/null || true
          cp "$RUNNER_TEMP/biz-generated-files.txt" "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Upload regenerated consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biz-c9-9-regenerated
          path: |
            ${{ runner.temp }}/biz-c9-9-regenerated.tar.gz
            ${{ runner.temp }}/biz-c9-9-regenerated.tar.gz.sha256
            ${{ runner.temp }}/biz-generated-status.txt
            ${{ runner.temp }}/biz-generated-files.txt
          if-no-files-found: warn
          retention-days: 1
