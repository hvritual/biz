name: c9-9-finalize-generated-truth

on:
  push:
    branches:
      - agent/c9-9-conformance-closure
    paths:
      - .github/workflows/c9-9-finalize-generated-truth.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yunka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact Yunka C9.8 product tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/c99-final"
          mkdir -p "$work/source"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/hvritual/biz/actions/artifacts/9711750449/zip' \
            -o "$work/base.zip"
          echo 'fcf13e6f56f0dcfdf2997cf75f539d15af844e45033c23e0977dda98ce00d267  '"$work/base.zip" | sha256sum -c -
          unzip -q "$work/base.zip" -d "$work/source"
          echo '34c61442846d9521215099c187dbfd43b948b644138f3554dd2eb07b475f91b1  '"$work/source/yunka-source.zip" | sha256sum -c -
          unzip -q "$work/source/yunka-source.zip" -d "$work/source/inner"
          echo 'b86b15e8690b8162559af7ca3c5e200db402f81636e6ecfd10468b6e15f1d7a1  '"$work/source/inner/yunka-c9-8.tar.gz" | sha256sum -c -
          test "$(git hash-object .c9-9-control/c9-8-product.patch)" = 'fdc99cc58007397b11d5b06958ce2c8f4facdf88'

          YUNKA_ROOT="$(dirname "$GITHUB_WORKSPACE")/yunka.io"
          rm -rf "$YUNKA_ROOT"
          mkdir -p "$YUNKA_ROOT"
          tar -xzf "$work/source/inner/yunka-c9-8.tar.gz" -C "$YUNKA_ROOT"
          cd "$YUNKA_ROOT"
          rm -f .github/workflows/c9-8-framework-export.yml .github/workflows/c9-8-real-biz-control.yml tools/c9-8-biz-source-url.txt .github/workflows/c9-production.yml
          git init -q
          git config user.name c9-9-closure
          git config user.email c9-9-closure@invalid.local
          git add -A
          git commit -qm 'C9.7 exact base'
          git apply --check "$GITHUB_WORKSPACE/.c9-9-control/c9-8-product.patch"
          git apply "$GITHUB_WORKSPACE/.c9-9-control/c9-8-product.patch"
          git add -A
          git commit -qm 'C9.8 exact product tree'
          echo "YUNKA_ROOT=$YUNKA_ROOT" >> "$GITHUB_ENV"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source "$YUNKA_ROOT/tools/toolchain.env"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Verify Yunka production baseline
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          cd "$YUNKA_ROOT"
          make contract
          make verify-production

      - name: Generate complete Biz truth and assert exact delta
        shell: bash
        run: |
          set -euo pipefail
          make generate
          git status --porcelain=v1 | sort > "$RUNNER_TEMP/generated.actual"
          cat > "$RUNNER_TEMP/generated.expected" <<'EOF'
           M contracts/gen/deviceops/v1/deviceops.pb.go
           M contracts/gen/deviceops/v1/deviceops_grpc.pb.go
           M contracts/generated/client.ts
           M contracts/generated/manifest.json
           M contracts/generated/openapi.json
           M contracts/generated/operation-plans.json
           M internal/deviceops/application/zz_yunka_device_management_application_port_gen.go
           M internal/deviceops/policy/zz_yunka_device_management_operation_plan_gen.go
           M internal/deviceops/policy/zz_yunka_device_management_operation_policy_gen.go
           M internal/deviceops/transport/rest/zz_yunka_device_management_operation_executor_gen.go
           M internal/deviceops/transport/rpc/zz_yunka_device_management_operation_executor_gen.go
          ?? internal/deviceops/application/zz_yunka_device_transfer_application_port_gen.go
          ?? internal/deviceops/application/zz_yunka_device_transfer_capability_ports_gen.go
          ?? internal/deviceops/application/zz_yunka_site_management_application_port_gen.go
          ?? internal/deviceops/policy/zz_yunka_device_transfer_operation_plan_gen.go
          ?? internal/deviceops/policy/zz_yunka_device_transfer_operation_policy_gen.go
          ?? internal/deviceops/policy/zz_yunka_domain_operation_policy_gen.go
          ?? internal/deviceops/policy/zz_yunka_site_management_operation_plan_gen.go
          ?? internal/deviceops/policy/zz_yunka_site_management_operation_policy_gen.go
          ?? internal/deviceops/transport/rest/zz_yunka_device_transfer_operation_executor_gen.go
          ?? internal/deviceops/transport/rpc/zz_yunka_device_transfer_operation_executor_gen.go
          EOF
          sort -o "$RUNNER_TEMP/generated.expected" "$RUNNER_TEMP/generated.expected"
          diff -u "$RUNNER_TEMP/generated.expected" "$RUNNER_TEMP/generated.actual"

      - name: Build final cleaned commit locally
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/c9-pressure-export.yml <<'EOF'
          name: c9-biz-pressure-export

          on:
            push:
              branches:
                - agent/c9-biz-pressure-conformance
                - agent/c9-7-biz-conformance
                - agent/c9-8-cross-application-conformance

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    ref: ${{ github.sha }}
                    fetch-depth: 0
                - name: Build source payload
                  shell: bash
                  run: |
                    set -euo pipefail
                    git archive --format=tar.gz --output="$RUNNER_TEMP/biz-c9-pressure.tar.gz" HEAD
                    sha256sum "$RUNNER_TEMP/biz-c9-pressure.tar.gz" > "$RUNNER_TEMP/biz-c9-pressure.tar.gz.sha256"
                - name: Upload source payload
                  uses: actions/upload-artifact@v4
                  with:
                    name: biz-c9-pressure-source
                    path: |
                      ${{ runner.temp }}/biz-c9-pressure.tar.gz
                      ${{ runner.temp }}/biz-c9-pressure.tar.gz.sha256
                    if-no-files-found: error
                    retention-days: 1
          EOF
          rm -rf .c9-9-control
          rm -f \
            .github/workflows/c9-9-capture-yunka-base.yml \
            .github/workflows/c9-9-exact-closure.yml \
            .github/workflows/c9-9-regeneration-evidence.yml \
            .github/workflows/c9-9-finalize-generated-truth.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'build: sync C9.9 generated consumer truth'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Zero-drift qualification on final commit
        shell: bash
        env:
          YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/yunka_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
        run: |
          set -euo pipefail
          make generate
          test -z "$(git status --porcelain=v1)"
          ! grep -R -n 'rpc ValidateTransferTarget' contracts/proto contracts/gen
          ! grep -R -n 'RegisterSiteManagementOperationExecutor' modules internal/deviceops/transport
          test ! -e internal/deviceops/transport/rest/zz_yunka_site_management_operation_executor_gen.go
          test ! -e internal/deviceops/transport/rpc/zz_yunka_site_management_operation_executor_gen.go
          grep -q 'operation.ExecuteChildTyped' internal/deviceops/application/zz_yunka_device_transfer_capability_ports_gen.go
          python3 - <<'PY'
          import json
          p=json.load(open('contracts/generated/operation-plans.json'))
          assert p['schemaVersion'] == 2
          ops={x['operationId']:x for x in p['operations']}
          assert sorted(ops) == ['device.create','device.delete','device.get','device.list','device.transfer','device.update','site.validate_transfer_target']
          internal=ops['site.validate_transfer_target']
          assert internal['application'] == 'site_management'
          assert internal['bindings'] == {}
          transfer=ops['device.transfer']
          assert transfer['composition']['requiresOperations'] == ['device.update','site.validate_transfer_target']
          assert transfer['composition']['permissionClosure'] == ['device.update','site.read']
          PY
          make verify
          make pressure
          test -z "$(git status --porcelain=v1)"

      - name: Push verified final commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_COMMIT"
          git push origin "HEAD:agent/c9-9-conformance-closure"
