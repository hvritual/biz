name: c9-biz-pressure

on:
  push:
    branches:
      - agent/c9-biz-pressure-conformance
      - agent/c9-7-biz-conformance
  pull_request:

permissions:
  contents: read

jobs:
  source-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify C9.7 execution boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'authz.NewExecutionSecurity' modules/deviceops/module.go
          grep -q 'operation.NewExecutorWithOptions' modules/deviceops/module.go
          grep -q 'requestscope.NewGORMExecutionFactory' modules/deviceops/module.go
          grep -q 'devicerest.RegisterOperationExecutor' modules/deviceops/module.go
          grep -q 'devicerpc.RegisterOperationExecutor' modules/deviceops/module.go
          ! grep -q 'authz.NewOperationRuntime' modules/deviceops/module.go
          ! grep -q 'SecuredUnaryServerInterceptor' modules/deviceops/module.go
          ! grep -R -n 'requestscope.Execute' internal/deviceops/application
          ! grep -R -n 'requestscope.GORMFrom' internal/deviceops/application
          ! grep -R -n 'gorm.io/gorm' internal/deviceops/application
          ! grep -R -n 'TransactionalStore' internal/deviceops/application
          grep -R -q 'requestscope.Join' internal/deviceops/application
          grep -q 'service.stager.Stage' internal/deviceops/application/remote_saga.go
          test ! -e internal/deviceops/transport/rest/zz_yunka_device_management_rest_adapter_gen.go
          test ! -e internal/deviceops/transport/rpc/zz_yunka_device_management_rpc_adapter_gen.go
          test -e internal/deviceops/transport/rest/zz_yunka_device_management_operation_executor_gen.go
          test -e internal/deviceops/transport/rpc/zz_yunka_device_management_operation_executor_gen.go
          test -e contracts/generated/operation-plans.json
      - name: Verify OperationPlan v2 execution semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('contracts/generated/operation-plans.json').read_text())
          assert data['schemaVersion'] == 2
          ids = [item['operationId'] for item in data['operations']]
          assert ids == sorted(ids), ids
          assert ids == ['device.create','device.delete','device.get','device.list','device.update'], ids
          by_id = {item['operationId']: item for item in data['operations']}
          for item in data['operations']:
              assert item['security']['tenantRequired'] is True
              assert item['security']['authentication'] == ['api-key']
              assert item['bindings']['rpc'].startswith('/deviceops.v1.DeviceApplication/')
          assert by_id['device.list']['execution'] == {'transaction':'read_only','idempotency':'none'}
          assert by_id['device.get']['execution'] == {'transaction':'read_only','idempotency':'none'}
          for op in ('device.create','device.update','device.delete'):
              assert by_id[op]['execution'] == {'transaction':'local','idempotency':'required'}
          PY
      - name: Verify pressure ledger and real slices
        shell: bash
        run: |
          set -euo pipefail
          test -e docs/pressure/C9-framework-pressure.md
          test -e internal/deviceops/application/local_composition.go
          test -e internal/deviceops/application/remote_saga.go
          test -e integration/c9_pressure_mysql_test.go
          grep -q 'FP-C9-002' docs/pressure/C9-framework-pressure.md
          grep -q 'FP-C9-003' docs/pressure/C9-framework-pressure.md
          grep -q 'FP-C9-004' docs/pressure/C9-framework-pressure.md
