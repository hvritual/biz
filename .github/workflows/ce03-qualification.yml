name: CE-03 qualification

on:
  push:
    branches: [main, feat/ce-03-capability-mapping]
    paths:
      - .github/workflows/ce03-qualification.yml
      - contracts/**
      - internal/commercial/**
      - internal/architecture/**
      - internal/access/application/**
      - internal/deviceops/application/**
      - cmd/commercial-catalog/**
      - scripts/ce03_*.py
      - scripts/test_ce03_*.py
      - docs/commercial-entitlements/**
      - Makefile
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  YUNKA_TEST_RESET_FIXTURES: "1"
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_ce03?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce03}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        name: Lock sources and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce03"
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          printf 'biz=%s\nyunka=%s\n' "$GITHUB_SHA" "$YUNKA_SHA" > "$RUNNER_TEMP/ce03/sources.txt"
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go_version }}', cache: false}
      - name: Install locked protobuf tools
        env: {RELEASE: '${{ steps.lock.outputs.protoc_release }}', CHECKSUM: '${{ steps.lock.outputs.protoc_sha }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - id: baseline
        name: Select trusted previous release for compatibility
        run: |
          set -euo pipefail
          baseline="$BASE_SHA"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || "$baseline" == 0000000000000000000000000000000000000000 ]]; then
            baseline="$(git -C biz rev-parse origin/main)"
          fi
          git -C biz cat-file -e "$baseline^{commit}"
          echo "baseline=$baseline" | tee "$RUNNER_TEMP/ce03/baseline.log"
          path=contracts/commercial/generated/catalog.json
          if [ -n "$(git -C biz ls-tree --name-only "$baseline" -- "$path")" ]; then
            git -C biz show "$baseline:$path" > "$RUNNER_TEMP/ce03/baseline.json"
            echo "path=$RUNNER_TEMP/ce03/baseline.json" >> "$GITHUB_OUTPUT"
          else
            test -z "$(git -C biz ls-tree --name-only "$baseline" -- contracts/commercial/operation-capabilities.v1.json)"
            echo 'FIRST_RELEASE_NO_PREVIOUS_CATALOG' | tee -a "$RUNNER_TEMP/ce03/baseline.log"
            echo 'path=' >> "$GITHUB_OUTPUT"
          fi
      - name: Check and regenerate without drift
        env: {COMMERCIAL_BASELINE: '${{ steps.baseline.outputs.path }}'}
        run: |
          set -euo pipefail
          make -C biz yunka-source-check workspace-check 2>&1 | tee "$RUNNER_TEMP/ce03/resolution.log"
          make -C biz check 2>&1 | tee "$RUNNER_TEMP/ce03/check-before.log"
          for pass in 1 2; do
            make -C biz generate 2>&1 | tee "$RUNNER_TEMP/ce03/generate-$pass.log"
            git -C biz diff --exit-code
            test -z "$(git -C biz status --porcelain)"
          done
          make -C biz check 2>&1 | tee "$RUNNER_TEMP/ce03/check-after.log"
      - name: Run CE-03 and real CE-02 MySQL regressions
        run: |
          set -euo pipefail
          go -C biz test -count=1 -json ./internal/commercial/capabilitymap ./internal/architecture -run '^TestCE03' | tee "$RUNNER_TEMP/ce03/focused.jsonl"
          go -C biz test -count=1 -tags=integration -json ./integration -run '^TestCE02' | tee "$RUNNER_TEMP/ce03/mysql.jsonl"
          go -C biz test -count=1 -json ./... | tee "$RUNNER_TEMP/ce03/all.jsonl"
          go -C biz vet ./... 2>&1 | tee "$RUNNER_TEMP/ce03/vet.log"
          go -C biz build ./... 2>&1 | tee "$RUNNER_TEMP/ce03/build.log"
          python3 biz/docs/commercial-entitlements/tools/check_plan.py | tee "$RUNNER_TEMP/ce03/plan.log"
          python3 -m unittest discover -s biz/docs/commercial-entitlements/tools -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ce03/plan-tests.log"
          python3 -m unittest discover -s biz/scripts -p 'test_ce03_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ce03/evidence-tests.log"
      - name: Capture actual counts and main receipt checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, os, subprocess, sys
          sys.path.insert(0, 'biz/scripts')
          from ce03_test_events import summarize
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'ce03'
          task_root = Path('biz/docs/commercial-entitlements')
          task = next(t for t in json.loads((task_root/'tasks.json').read_text())['tasks'] if t['id']=='CE-03')
          summary = {'task_id':'CE-03', 'verified_commit':os.environ['GITHUB_SHA'], 'framework_commit':os.environ['YUNKA_SHA'], 'qualification':'PASS', 'task_status':task['status'], 'suites':{}}
          for name in ('focused','mysql','all'):
              rows = [json.loads(line) for line in (root/(name+'.jsonl')).read_text().splitlines()]
              summary['suites'][name] = summarize(rows)
          catalog = json.loads(Path('biz/contracts/commercial/generated/catalog.json').read_text())
          summary['catalog'] = {'operations':len(catalog['operations']), 'capabilities':len(catalog['capabilities']), 'classifications':dict(collections.Counter(o['classification'] for o in catalog['operations'])), 'consumers':dict(collections.Counter(o['consumer_type'] for o in catalog['operations'])), 'child_edges':sum(len(o['children']) for o in catalog['operations'])}
          if task['status']=='DONE':
              subprocess.run(['git','-C','biz','fetch','origin','main:refs/remotes/origin/main'], check=True)
              command = ['python3',str(task_root/'tools/check_round.py'),'--task','CE-03']
              if os.environ['GITHUB_REF']=='refs/heads/main': command.append('--require-main')
              result = subprocess.run(command, text=True, capture_output=True, check=True)
              (root/'round.log').write_text('COMMAND: '+' '.join(command)+'\n'+result.stdout+result.stderr)
              summary['round_check']='PASS'
          else:
              summary['round_check']='QUALIFIED_NOT_DONE'
          summary['sha256'] = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          git -C biz diff --exit-code
          git -C biz status --porcelain
          test -z "$(git -C biz status --porcelain)"
          test -z "$(git -C yunka.io status --porcelain)"
          cp biz/contracts/commercial/generated/catalog.json "$RUNNER_TEMP/ce03/catalog.json"
          cp biz/contracts/commercial/generated/catalog.ts "$RUNNER_TEMP/ce03/catalog.ts"
          git -C biz archive HEAD -o "$RUNNER_TEMP/ce03/biz-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce03-${{ github.sha }}', path: '${{ runner.temp }}/ce03', retention-days: 30, if-no-files-found: error}
