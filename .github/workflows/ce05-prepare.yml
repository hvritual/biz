name: CE-05 one-time locked generation
on:
  push:
    branches: [feat/ce-05-enforcement]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'hvritual/biz' && github.ref == 'refs/heads/feat/ce-05-enforcement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, fetch-depth: 0}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb, path: yunka.io, persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.25.13', cache: false}
      - name: Install locked generators
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$PROTOC_LINUX_X86_64_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: Apply declared changes and reproduce generated closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce05-prepare"
          cd biz
          {
            python3 scripts/ce05_prepare.py
            gofmt -w contracts/commercial/embed.go internal/commercial/ports/decision_reader.go internal/commercial/infrastructure/persistence/entitlement_current.go internal/commercial/modulecatalog/current_catalog.go internal/commercial/application/entitlementmanagement/reader.go internal/commercial/enforcement/*.go internal/bizruntime/device_entitlements.go internal/bizruntime/runtime.go internal/deviceops/application/service.go internal/deviceops/security/scope.go internal/architecture/ce05_enforcement_test.go integration/ce05*.go integration/c9_8_cross_application_mysql_test.go integration/deviceops_mysql_test.go integration/b12_member_runtime_mysql_test.go
            make generate
            make check
            go test ./...
            go test -tags=integration ./integration -run '^$'
            go vet ./...
            go build ./...
          } 2>&1 | tee "$RUNNER_TEMP/ce05-prepare/build.log"
      - name: Commit generated closure only to authorized feature branch
        run: |
          set -euo pipefail
          cd biz
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/ce-05-enforcement | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/ce05-prepare.yml scripts/ce05_prepare.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(ce-05): reproduce locked contracts and remove preparation tooling'
          git push origin HEAD:refs/heads/feat/ce-05-enforcement
      - name: Capture source without credentials
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ce05-prepare"
          tar --exclude=.git -cf "$RUNNER_TEMP/ce05-prepare/biz-source.tar" -C biz .
          git -C biz rev-parse HEAD > "$RUNNER_TEMP/ce05-prepare/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce05-prepare-${{ github.sha }}', path: '${{ runner.temp }}/ce05-prepare', retention-days: 7, if-no-files-found: error}
