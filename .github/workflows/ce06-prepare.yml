name: CE-06 one-time locked preparation
on:
  push:
    branches: [feat/ce-06-snapshots]
    paths: [scripts/ce06_prepare_source.py, .github/workflows/ce06-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/ce-06-snapshots
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go_version }}', cache: false}
      - name: Install locked generators
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$PROTOC_LINUX_X86_64_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: Apply explicit source edits and reproduce generated closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce06-prepare"
          cd biz
          git merge-base --is-ancestor e8a4301ac34bd780be15ba3ed83b35e823015dc2 HEAD
          python3 scripts/ce06_prepare_source.py
          rm scripts/ce06_prepare_source.py .github/workflows/ce06-prepare.yml
          make generate 2>&1 | tee "$RUNNER_TEMP/ce06-prepare/generate.log"
          make check 2>&1 | tee "$RUNNER_TEMP/ce06-prepare/check.log"
          go test -count=1 -json ./... | tee "$RUNNER_TEMP/ce06-prepare/all.jsonl"
          go test -tags=integration ./integration -run '^$' 2>&1 | tee "$RUNNER_TEMP/ce06-prepare/integration-compile-only.log"
          go vet ./...
          go build ./...
      - name: Commit only to the authorized feature branch
        run: |
          set -euo pipefail
          cd biz
          test "$GITHUB_REF" = refs/heads/feat/ce-06-snapshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts internal integration docs/commercial-entitlements scripts/ce06_qualify.sh scripts/ce06_prepare_source.py .github/workflows/ce06-qualification.yml .github/workflows/ce06-prepare.yml
          git commit -m 'build(ce-06): reproduce locked source and generated contracts'
          git push origin HEAD:refs/heads/feat/ce-06-snapshots
      - name: Capture tracked source without credentials
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ce06-prepare"
          git -C biz archive HEAD -o "$RUNNER_TEMP/ce06-prepare/source.tar"
          git -C biz diff > "$RUNNER_TEMP/ce06-prepare/uncommitted.patch"
          git -C biz status --porcelain > "$RUNNER_TEMP/ce06-prepare/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce06-prepare-${{ github.sha }}', path: '${{ runner.temp }}/ce06-prepare', retention-days: 7, if-no-files-found: error}
