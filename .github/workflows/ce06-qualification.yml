name: CE-06 qualification

on:
  workflow_call:
    inputs:
      enforce_performance:
        type: boolean
        required: false
        default: false
      performance_target_seconds:
        type: number
        required: false
        default: 120
      performance_hard_seconds:
        type: number
        required: false
        default: 180
  workflow_dispatch:
permissions:
  contents: read
env:
  YUNKA_TEST_RESET_FIXTURES: "1"
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_ce06?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    steps:
      - name: Start CE06 performance clock
        run: date +%s > "$RUNNER_TEMP/ce06.started"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Start workflow-owned durable MySQL
        run: bash biz/scripts/ci_commercial_mysql.sh start ce06
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        name: Lock toolchain and source
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: true
          cache-dependency-path: biz/go.sum
      - name: Install locked protobuf generators
        env: {RELEASE: '${{ steps.lock.outputs.protoc_release }}', CHECKSUM: '${{ steps.lock.outputs.protoc_sha }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: Qualify snapshots, real contention and database restart
        run: bash biz/scripts/ce06_qualify.sh
      - name: Write ce06 performance receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --surface ce06
            --lane qualify
            --started-file "$RUNNER_TEMP/ce06.started"
            --target-seconds "${{ inputs.performance_target_seconds || 120 }}"
            --hard-seconds "${{ inputs.performance_hard_seconds || 180 }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/ce06/performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 biz/scripts/ci_performance_receipt.py "${args[@]}"
      - name: Stop workflow-owned MySQL
        if: always()
        run: bash biz/scripts/ci_commercial_mysql.sh stop ce06
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce06-${{ env.CANDIDATE_SHA }}', path: '${{ runner.temp }}/ce06', retention-days: 30, if-no-files-found: error}
