name: CE-08 acceptance round
on:
  push:
    branches: [control/ce08-completion-20260910]
    paths: ['.github/workflows/ce08-acceptance-round.yml']
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce08_round}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YUNKA_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/biz_ce08_round?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true'
      BIZ_SHA: db75df962883202975bacf25a49564ff2983ed4e
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.BIZ_SHA }}', path: biz, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - name: Capture fixed sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce08-round"
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          git -C biz archive --format=tar.gz HEAD > "$RUNNER_TEMP/ce08-round/biz-source.tar.gz"
          git -C yunka.io archive --format=tar.gz HEAD > "$RUNNER_TEMP/ce08-round/yunka-source.tar.gz"
          printf 'biz=%s\nyunka=%s\n' "$BIZ_SHA" "$YUNKA_SHA" > "$RUNNER_TEMP/ce08-round/sources.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'ce08-fixed-source-${{ env.BIZ_SHA }}', path: '${{ runner.temp }}/ce08-round', if-no-files-found: error}
      - id: lock
        run: source yunka.io/tools/toolchain.env && echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: Actual MySQL acceptance
        working-directory: biz
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration -json ./integration -run '^TestCE08MySQL' 2>&1 | tee "$RUNNER_TEMP/ce08-round/mysql.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce08-acceptance-${{ env.BIZ_SHA }}', path: '${{ runner.temp }}/ce08-round', if-no-files-found: error}
