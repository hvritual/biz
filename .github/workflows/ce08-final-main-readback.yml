name: CE-08 final main readback
on:
  push:
    branches: [control/ce08-completion-20260910]
    paths: ['.github/workflows/ce08-final-main-readback.yml']
permissions: {contents: read, actions: read, checks: read}
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: fed9051bae618ab28df200038682f808c82e854b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.TARGET_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Capture terminal final-main qualifications
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce08-final-main"
          python3 - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ce08-final-main';sha=os.environ['TARGET_SHA']
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/hvritual/biz/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2)
          assert get('git/ref/heads/main')['object']['sha']==sha,'main moved before readback'
          for attempt in range(60):
              response=get('actions/runs?head_sha='+sha+'&event=push&per_page=100');runs=response['workflow_runs']
              assert response['total_count']==len(runs) and runs,'incomplete main workflow inventory'
              if all(r['status']=='completed' for r in runs):break
              time.sleep(10)
          else:raise RuntimeError('main workflows did not terminate within bounded readback')
          compact=[]
          for r in runs:
              assert r['head_sha']==sha and r['head_branch']=='main' and r['event']=='push'
              arts=get('actions/runs/'+str(r['id'])+'/artifacts?per_page=100')
              assert arts['total_count']==len(arts['artifacts'])
              compact.append({'run_id':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion'],'artifacts':[{'id':a['id'],'name':a['name'],'digest':a.get('digest'),'expired':a['expired']} for a in arts['artifacts']]})
          result={'verified_commit':sha,'event':'push','branch':'main','workflows':compact}
          checks=get('commits/'+sha+'/check-runs?per_page=100');assert checks['total_count']==len(checks['check_runs'])
          result['checks']=[{'id':c['id'],'name':c['name'],'head_sha':c['head_sha'],'status':c['status'],'conclusion':c['conclusion']} for c in checks['check_runs']]
          (out/'main-checks.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          assert all(r['conclusion']=='success' for r in runs),'non-success final-main workflow'
          assert result['checks'] and all(c['head_sha']==sha and c['status']=='completed' and c['conclusion']=='success' for c in result['checks']),'non-success final-main check'
          assert get('git/ref/heads/main')['object']['sha']==sha,'main moved during readback'
          PY
      - name: Verify DONE ledger and require-main gates on actual latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          python3 docs/commercial-entitlements/tools/check_plan.py | tee "$RUNNER_TEMP/ce08-final-main/plan.log"
          python3 -m unittest discover -s docs/commercial-entitlements/tools -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ce08-final-main/gate-tests.log"
          python3 - <<'PY' | tee "$RUNNER_TEMP/ce08-final-main/round.log"
          import json,subprocess
          from pathlib import Path
          tasks=json.loads(Path('docs/commercial-entitlements/tasks.json').read_text())['tasks']
          ce08=next(t for t in tasks if t['id']=='CE-08')
          assert ce08['status']=='DONE' and ce08['integration_commit']=='6e2be5e68ad34a834cc579afbf6a4a55dfd43b78'
          assert next(t for t in tasks if t['id']=='CE-09')['status']=='PLANNED'
          for t in tasks:
              if t['status']!='DONE':continue
              cmd=['python3','docs/commercial-entitlements/tools/check_round.py','--task',t['id'],'--require-main']
              print('COMMAND: '+' '.join(cmd),flush=True);subprocess.run(cmd,check=True)
          print('CE08_FINAL_MAIN_READBACK=PASS')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/ce08-final-main/verified-commit.txt"
          git archive HEAD -o "$RUNNER_TEMP/ce08-final-main/biz-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce08-final-main-readback-${{ env.TARGET_SHA }}', path: '${{ runner.temp }}/ce08-final-main', if-no-files-found: error, retention-days: 30}
