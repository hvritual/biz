name: CE-08 finalize branch
on: {push: {branches: [feat/ce-08-default-subscription-bootstrap], paths: ['.github/workflows/ce08-finalize-branch.yml']}}
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, fetch-depth: 0, persist-credentials: true}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        run: |
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"; echo "protoc=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"; echo "sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: tools
        env: {R: '${{ steps.lock.outputs.protoc }}', S: '${{ steps.lock.outputs.sha }}'}
        run: |
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"; echo "$S  $RUNNER_TEMP/p.zip"|sha256sum -c -; unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/p"; make -C yunka.io rpc-tools; echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: close declared graph, generate and push
        working-directory: biz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('contracts/commercial/operation-capabilities.v1.json');d=json.loads(p.read_text());ops=d['operations'];by={x['operation_id']:x for x in ops}
          child={'operation_id':'commercial.subscription.bootstrap_base','mode':'always','source':'internal/access/application/tenantlifecycle/internal/usecase/service.go#CreateTenant'}
          if child['operation_id'] not in [x['operation_id'] for x in by['tenant.create']['children']]: by['tenant.create']['children'].append(child)
          new={
          'commercial.subscription.bootstrap_base':('foundation_exempt',[{'operation_id':'commercial.plan.eligibility','mode':'always','source':'internal/commercial/application/subscriptionmanagement/internal/usecase/service.go#BootstrapBaseSubscription'}]),
          'commercial.subscription.rule.put':('platform_management',[{'operation_id':'commercial.plan.eligibility','mode':'always','source':'internal/commercial/application/subscriptionmanagement/internal/usecase/service.go#PutDefaultSubscriptionRule'}]),
          'commercial.subscription.rule.list':('platform_management',[]),'commercial.subscription.get':('platform_management',[])}
          for k,(c,ch) in new.items():
            if k not in by: ops.append({'operation_id':k,'classification':c,'capability_codes':[],'children':ch,'exemption_reason':'CE-08 platform default subscription control/bootstrap; never a tenant-purchased business operation and never bypasses IAM.'})
          d['mapping_version']='5';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          q=Path('internal/access/application/tenantlifecycle/internal/usecase/service.go');s=q.read_text()
          if 'commercialv1 "github.com/hvritual/biz/contracts/gen/commercial/v1"' not in s:
            s=s.replace('accessv1 "github.com/hvritual/biz/contracts/gen/access/v1"','accessv1 "github.com/hvritual/biz/contracts/gen/access/v1"\n\tcommercialv1 "github.com/hvritual/biz/contracts/gen/commercial/v1"')
            s=s.replace('strings.TrimSpace(request.GetOwnerEmail()) == "" {','strings.TrimSpace(request.GetOwnerEmail()) == "" || strings.TrimSpace(request.GetRequestId()) == "" || strings.TrimSpace(request.GetSalesScope()) == "" {',1)
            s=s.replace('roles := service.capabilities.AccessTenantRolePermission()\n\tif members == nil || roles == nil {','roles := service.capabilities.AccessTenantRolePermission()\n\tsubscriptions := service.capabilities.CommercialSubscriptionManagement()\n\tif members == nil || roles == nil || subscriptions == nil {',1)
            marker='\treturn tenantDTO(tenant), nil\n}\n\nfunc (service *service) GetTenant';insert='\tif _, err := subscriptions.BootstrapBaseSubscription(ctx, &commercialv1.BootstrapTenantSubscriptionRequest{RequestId: strings.TrimSpace(request.GetRequestId()), TenantId: tenant.ID, SalesScope: strings.TrimSpace(request.GetSalesScope())}); err != nil {\n\t\treturn nil, err\n\t}\n\treturn tenantDTO(tenant), nil\n}\n\nfunc (service *service) GetTenant';s=s.replace(marker,insert,1);q.write_text(s)
          PY
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/p/bin/protoc"
          gofmt -w internal/access/application/tenantlifecycle/internal/usecase/service.go internal/commercial/application/subscriptionmanagement internal/commercial/domain/subscription internal/commercial/infrastructure/persistence/subscription*.go internal/commercial/ports/subscription.go
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts internal; git commit -m 'chore(ce-08): close generated subscription graph'; git push origin HEAD:${GITHUB_REF_NAME}
