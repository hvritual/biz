name: CE-08 finalize candidate
on:
  push:
    branches: [control/ce08-completion-20260910]
    paths: ['.github/workflows/ce08-finalize-candidate.yml']
permissions: {contents: write}
concurrency: {group: ce08-product-writer, cancel-in-progress: false}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce08_final}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
      BASE_SHA: 4573e7fcafa7610f6bba308d3c511218cb1dfb5c
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/biz_ce08_final?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: fix/ce-08-complete, path: biz, fetch-depth: 0, persist-credentials: true}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        run: |
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "p=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "s=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ce08"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: Locked generators
        env: {R: '${{ steps.lock.outputs.p }}', S: '${{ steps.lock.outputs.s }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"
          echo "$S  $RUNNER_TEMP/p.zip"|sha256sum -c -
          unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/protoc"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Finalize test pin and restart qualification
        working-directory: biz
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4b142fa54fc1b57bf8c0352255930a74e62c9390
          python3 - <<'PY'
          from pathlib import Path
          hits=0
          for p in Path('internal/architecture').glob('ce01*.go'):
              s=p.read_text()
              if '6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb' not in s: continue
              s=s.replace('6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb','33b98ceba57494abda2299e4f0290a5651dab4bc')
              s=s.replace('v0.0.0-20260902030847-6ba99c1440dc','v0.0.0-20260910080749-33b98ceba574')
              p.write_text(s); hits+=1
          assert hits==1, hits
          p=Path('scripts/ce08_qualify.sh');s=p.read_text()
          s=s.replace('./internal/access/policy -run', './internal/access/policy ./internal/bizruntime -run')
          anchor="go test -count=1 -tags=integration -json ./integration -run '^(TestB122"
          pos=s.index(anchor)
          restart='''export CE08_RESTART_RECEIPT="$out/restart-receipt.json"
          go test -count=1 -tags=integration -json ./integration -run '^TestCE08PersistenceBeforeRestart$' | tee "$out/restart-before.jsonl"
          : "${MYSQL_CONTAINER_ID:?workflow-owned MySQL required}"
          before_start="$(docker inspect -f '{{.State.StartedAt}}' "$MYSQL_CONTAINER_ID")"
          docker restart "$MYSQL_CONTAINER_ID" | tee "$out/restart.log"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$MYSQL_CONTAINER_ID" mysqladmin ping -h 127.0.0.1 -proot --silent >> "$out/restart.log" 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          after_start="$(docker inspect -f '{{.State.StartedAt}}' "$MYSQL_CONTAINER_ID")"
          test "$before_start" != "$after_start"
          printf 'before=%s\\nafter=%s\\n' "$before_start" "$after_start" >> "$out/restart.log"
          go test -count=1 -tags=integration -json ./integration -run '^TestCE08PersistenceAfterRestart$' | tee "$out/restart-after.jsonl"
          '''
          s=s[:pos]+restart+s[pos:]
          s=s.replace("'focused','mysql','race','b12-bootstrap'", "'focused','mysql','race','restart-before','restart-after','b12-bootstrap'")
          p.write_text(s)
          PY
          gofmt -w integration/ce08_authority_mysql_test.go internal/bizruntime/tenant_creation_replay_test.go internal/commercial/domain/subscription/ce08_ordering_test.go internal/architecture/ce01*.go
          make generate
          make commercial-generate
          git diff --check
          go test -count=1 ./internal/bizruntime ./internal/architecture ./internal/commercial/domain/subscription
          go test -count=1 -tags=integration ./integration -run '^$'
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(ce-08): lock compatibility qualification and verify durable restart'
          git push origin HEAD:fix/ce-08-complete
          git archive HEAD -o "$RUNNER_TEMP/ce08/biz-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/ce08/candidate-commit.txt"
      - name: Execute complete qualification
        env: {MYSQL_CONTAINER_ID: '${{ job.services.mysql.id }}'}
        run: bash biz/scripts/ce08_qualify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce08-strengthened-${{ github.sha }}', path: '${{ runner.temp }}/ce08', if-no-files-found: error}
