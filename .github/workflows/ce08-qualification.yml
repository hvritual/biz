name: CE-08 qualification
on:
  push:
    branches: [feat/ce-08-default-subscription-bootstrap]
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env: {YUNKA_SHA: 6ba99c1440dc6c9416f6afd08f3282e35fa5a3fb, BIZ_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/biz?parseTime=true&multiStatements=true'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        run: source yunka.io/tools/toolchain.env && echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT" && echo "p=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT" && echo "s=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: install locked generators
        env: {R: '${{ steps.lock.outputs.p }}', S: '${{ steps.lock.outputs.s }}'}
        run: |
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"; echo "$S  $RUNNER_TEMP/p.zip"|sha256sum -c -; unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/p"; make -C yunka.io rpc-tools; echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: immutable generation, compile and tests
        working-directory: biz
        run: |
          set -euo pipefail
          make check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/p/bin/protoc"
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/p/bin/protoc"
          test -z "$(git status --porcelain)"
          go test ./...
          go test -race ./internal/commercial/application/subscriptionmanagement/... ./internal/access/application/tenantlifecycle/...
          go vet ./...
          go build ./...
