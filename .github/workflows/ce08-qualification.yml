name: CE-08 qualification

on:
  workflow_call:
  workflow_dispatch:
permissions: {contents: read}
env:
  YUNKA_TEST_RESET_FIXTURES: "1"
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_ce08?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce08}
        ports: ['3306:3306']
        options: >-
          --tmpfs /var/lib/mysql:rw,nosuid,size=1g
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=2s --health-timeout=2s --health-retries=45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: biz, ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        name: Lock toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: true
          cache-dependency-path: biz/go.sum
      - name: Qualify atomic default subscription bootstrap
        env: {MYSQL_CONTAINER_ID: '${{ job.services.mysql.id }}'}
        run: bash biz/scripts/ce08_qualify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce08-${{ github.sha }}', path: '${{ runner.temp }}/ce08', retention-days: 30, if-no-files-found: error}
