name: CE-08 transport acceptance
on:
  push:
    branches: [control/ce08-completion-20260910]
    paths: ['.github/workflows/ce08-transport-acceptance.yml']
permissions: {contents: write}
concurrency: {group: ce08-product-writer, cancel-in-progress: false}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce08_transport}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
      BASE_SHA: 4573e7fcafa7610f6bba308d3c511218cb1dfb5c
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/biz_ce08_transport?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: fix/ce-08-complete, path: biz, fetch-depth: 0, persist-credentials: true}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - id: lock
        run: |
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "p=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "s=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ce08"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: Locked generators
        env: {R: '${{ steps.lock.outputs.p }}', S: '${{ steps.lock.outputs.s }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"
          echo "$S  $RUNNER_TEMP/p.zip"|sha256sum -c -
          unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/protoc"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Preserve generated transport contract and add typed RPC assertions
        working-directory: biz
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d33ad10c27b66fba1696aa382e5bd1f545d7c652
          python3 - <<'PY'
          from pathlib import Path
          p=Path('integration/ce08_subscription_mysql_test.go');s=p.read_text()
          s=s.replace('base          string','base          string\n grpcAddress string')
          s=s.replace('base:          "http://" + started.HTTPAddress(),','base:          "http://" + started.HTTPAddress(),\n grpcAddress: started.GRPCAddress(),')
          assert 'grpcAddress: started.GRPCAddress()' in s
          p.write_text(s)
          p=Path('integration/ce08_authority_mysql_test.go');s=p.read_text()
          s=s.replace('if !strings.Contains(string(r.body), "NO_ELIGIBLE_DEFAULT") {','if r.status != http.StatusBadRequest || strings.TrimSpace(string(r.body)) != "application request failed" {')
          s=s.replace('r.status != http.StatusConflict','r.status != http.StatusBadRequest')
          anchor='\tce08Unchanged(t, e, before, receipts, grants)\n}\nfunc TestCE08MySQLCorrupt'
          assert anchor in s
          s=s.replace(anchor, '\tce08RPCError(t,e,id,\"o-\"+id,id,\"default\",codes.FailedPrecondition,\"SUBSCRIPTION_NO_ELIGIBLE_DEFAULT\")\n'+anchor)
          anchor='\t\tt.Fatalf("business payload conflict=%d %v %s", r.status, r.err, r.body)\n\t}\n}'
          assert anchor in s
          s=s.replace(anchor,anchor[:-1]+'\tce08RPCError(t,other,"changed payload",owner,id,"default",codes.Aborted,"TENANT_CREATION_REQUEST_CONFLICT")\n}')
          s+='''
          func ce08RPCError(t *testing.T,e *ce08Environment,name,owner,requestID,scope string,want codes.Code,reason string){
           t.Helper()
           before:=ce08Snapshot(t,e.db)
           receipts:=ce08Count(t,e,"biz_tenant_creation_receipts")
           grants:=ce08Count(t,e,"biz_permission_grants")
           conn,err:=grpc.DialContext(context.Background(),e.grpcAddress,grpc.WithTransportCredentials(insecure.NewCredentials()))
           if err!=nil{t.Fatal(err)};defer conn.Close()
           _,err=accessv1.NewTenantLifecycleApplicationClient(conn).CreateTenant(e.ctx(),&accessv1.CreateTenantRequest{Name:name,OwnerUserId:owner,OwnerEmail:owner+"@example.invalid",RequestId:requestID,SalesScope:scope})
           if status.Code(err)!=want||status.Convert(err).Message()!=reason{t.Fatalf("RPC error=%v want=%s/%s",err,want,reason)}
           ce08Unchanged(t,e,before,receipts,grants)
          }
          '''
          p.write_text(s)
          PY
          gofmt -w integration/ce08_subscription_mysql_test.go integration/ce08_authority_mysql_test.go
          git diff --check
          go test -count=1 -tags=integration ./integration -run '^$'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integration
          git commit -m 'test(ce-08): verify real transport errors and mutation-free rejection'
          git push origin HEAD:fix/ce-08-complete
          git archive HEAD -o "$RUNNER_TEMP/ce08/biz-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/ce08/candidate-commit.txt"
      - name: Execute complete qualification
        env: {MYSQL_CONTAINER_ID: '${{ job.services.mysql.id }}'}
        run: bash biz/scripts/ce08_qualify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce08-transport-${{ github.sha }}', path: '${{ runner.temp }}/ce08', if-no-files-found: error}
