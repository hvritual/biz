name: CE-10 final main readback
on:
  push:
    branches: [control/ce10-delivery-20260910]
    paths: ['.github/workflows/ce10-final-main-readback-20260911.yml']
permissions: {contents: read}
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINAL_SHA: c660bccad241d0fbf6ede27959c2ac1e3a5da93a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.FINAL_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Verify latest main and CE-10 final completion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce10-final"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          python3 docs/commercial-entitlements/tools/check_plan.py | tee "$RUNNER_TEMP/ce10-final/plan.log"
          python3 -m unittest discover -s docs/commercial-entitlements/tools -p 'test_*.py' -v > "$RUNNER_TEMP/ce10-final/gates.log" 2>&1
          python3 docs/commercial-entitlements/tools/check_round.py --task CE-10 --require-main | tee "$RUNNER_TEMP/ce10-final/round.log"
          python3 - <<'PY' > "$RUNNER_TEMP/ce10-final/state.json"
          import json
          from pathlib import Path
          p=json.loads(Path('docs/commercial-entitlements/tasks.json').read_text())
          ce10=next(t for t in p['tasks'] if t['id']=='CE-10')
          ce11=next(t for t in p['tasks'] if t['id']=='CE-11')
          assert ce10['status']=='DONE'
          assert ce10['integration_commit']=='5bb4f87aa59856aad585cdc1e7e53016b6920380'
          assert ce10['evidence']=='evidence/CE-10.md'
          assert ce10['verification']=='evidence/CE-10-verification.json'
          assert ce11['status']=='PLANNED'
          proof=json.loads(Path('docs/commercial-entitlements/evidence/CE-10-verification.json').read_text())
          assert proof['verified_commit']==ce10['integration_commit'] and proof['result']=='PASS'
          print(json.dumps({'main':'c660bccad241d0fbf6ede27959c2ac1e3a5da93a','ce10':ce10,'ce11_status':ce11['status'],'proof_result':proof['result']},indent=2,ensure_ascii=False))
          PY
          git archive HEAD -o "$RUNNER_TEMP/ce10-final/final-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ce10-final-main-readback-c660bccad241d0fbf6ede27959c2ac1e3a5da93a
          path: '${{ runner.temp }}/ce10-final'
          retention-days: 30
          if-no-files-found: error
