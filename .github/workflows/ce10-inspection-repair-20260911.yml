name: CE-10 inspection repair and revalidation
on:
  push:
    branches: [control/ce10-delivery-20260910]
    paths: ['.github/workflows/ce10-inspection-repair-20260911.yml']
permissions: {contents: write}
concurrency: {group: ce10-product-writer, cancel-in-progress: false}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: biz_ce10_repair}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
      YUNKA_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/biz_ce10_repair?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: feat/ce-10-durable-provisioning, path: biz, fetch-depth: 0, persist-credentials: true}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}
      - id: lock
        run: |
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "p=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "s=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ce10-repair"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: Locked generators
        env: {R: '${{ steps.lock.outputs.p }}', S: '${{ steps.lock.outputs.s }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"
          echo "$S  $RUNNER_TEMP/p.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/protoc"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Apply only reviewed product corrections
        working-directory: biz
        run: |
          set -euo pipefail
          python3 ../control/.ce10/inspection-repair-20260911.py | tee "$RUNNER_TEMP/ce10-repair/patch-manifest.json"
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/ce10-inspection-changed.json'))
          paths+=['integration/ce10_provisioning_mysql_test.go','internal/commercial/infrastructure/persistence/ce10_outbox_lock_mysql_test.go']
          subprocess.run(['gofmt','-w']+[p for p in paths if p.endswith('.go')],check=True)
          PY
          make commercial-generate > "$RUNNER_TEMP/ce10-repair/commercial-generate.log" 2>&1
          git diff --check
          python3 - <<'PY'
          import json,subprocess
          allowed=set(json.load(open('/tmp/ce10-inspection-changed.json')))
          allowed.update(['integration/ce10_provisioning_mysql_test.go','internal/commercial/infrastructure/persistence/ce10_outbox_lock_mysql_test.go','contracts/commercial/generated/catalog.json','contracts/commercial/generated/types.ts'])
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          actual.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert actual<=allowed,sorted(actual-allowed)
          assert not any(p.startswith(('server/','.github/')) for p in actual)
          subprocess.run(['git','add','--']+sorted(actual),check=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(ce-10): fence expired delivery leases and declare authenticated process entries'
          git push origin HEAD:feat/ce-10-durable-provisioning
          git rev-parse HEAD > "$RUNNER_TEMP/ce10-repair/source.txt"
          git -C ../yunka.io rev-parse HEAD >> "$RUNNER_TEMP/ce10-repair/source.txt"
          git archive HEAD -o "$RUNNER_TEMP/ce10-repair/biz-source.tar"
      - name: Execute independent database suites and retained negative tests
        env: {MYSQL_CONTAINER_ID: '${{ job.services.mysql.id }}'}
        working-directory: biz
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/ce10-repair"
          run_suite() {
            name="$1"; shift
            printf '%s\n' "$*" > "$out/$name.command"
            "$@" > "$out/$name.jsonl" 2> "$out/$name.stderr"
            echo $? > "$out/$name.exit"
          }
          make yunka-source-check workspace-check > "$out/workspace.log" 2>&1; echo $? > "$out/workspace.exit"
          make check > "$out/check.log" 2>&1; echo $? > "$out/check.exit"
          make generate > "$out/generate-1.log" 2>&1; echo $? > "$out/generate-1.exit"
          git diff --exit-code > "$out/generate-1-diff.log" 2>&1; echo $? > "$out/generate-1-diff.exit"
          make generate > "$out/generate-2.log" 2>&1; echo $? > "$out/generate-2.exit"
          git diff --exit-code > "$out/generate-2-diff.log" 2>&1; echo $? > "$out/generate-2-diff.exit"
          run_suite focused go test -timeout=2m -count=1 -json ./internal/commercial/... ./internal/bizruntime -run '^TestCE10'
          run_suite persistence go test -timeout=2m -count=1 -tags=integration -json ./internal/commercial/infrastructure/persistence -run '^TestCE10MySQL'
          run_suite mysql go test -timeout=8m -count=1 -tags=integration -json ./integration -run '^TestCE10MySQL'
          run_suite race go test -timeout=8m -race -count=1 -tags=integration -json ./integration -run '^TestCE10MySQL'
          # Legacy suites share their configured schema. Give each group its own
          # schema: CE02's deliberate custom catalog fixtures must not pollute CE04.
          for group in CE09 CE08 CE07 CE06 CE05 CE04 CE02 B12; do
            schema="ce10_reg_${group,,}"
            docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot -e "CREATE DATABASE $schema" > "$out/$group-db.log" 2>&1
            created=$?; echo "$created" > "$out/$group-db.exit"
            if [ "$created" -ne 0 ]; then continue; fi
            export YUNKA_TEST_MYSQL_DSN="root:root@tcp(127.0.0.1:3306)/$schema?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true"
            pattern="^Test${group}MySQL"
            if [ "$group" = CE02 ]; then pattern='^TestCE02'; fi
            if [ "$group" = B12 ]; then pattern='^Test(B122|B123|B124|B125|B126|AG02OwnerInvariantUsesCurrentReadAfterSnapshot)'; fi
            run_suite "$group" go test -timeout=5m -count=1 -tags=integration -json ./integration -run "$pattern"
          done
          run_suite all go test -timeout=5m -count=1 -json ./...
          go vet ./... > "$out/vet.log" 2>&1; echo $? > "$out/vet.exit"
          go build ./... > "$out/build.log" 2>&1; echo $? > "$out/build.exit"
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts');from ce03_test_events import summarize
          out=Path(os.environ['RUNNER_TEMP'])/'ce10-repair'
          result={'candidate':(out/'source.txt').read_text().splitlines()[0],'framework':os.environ['YUNKA_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'suites':{},'commands':{}}
          ok=True
          for name in ['focused','persistence','mysql','race','CE09','CE08','CE07','CE06','CE05','CE04','CE02','B12','all']:
            path=out/(name+'.jsonl');events=[json.loads(l) for l in path.read_text().splitlines()] if path.exists() else []
            rc=int((out/(name+'.exit')).read_text()) if (out/(name+'.exit')).exists() else -1
            try: counts=summarize(events)
            except ValueError:
              counts={'failed_test_events':[e.get('Test') for e in events if e.get('Action')=='fail' and e.get('Test')], 'package_failures':[e.get('Package') for e in events if e.get('Action')=='fail' and not e.get('Test')], 'passed_test_events':sum(e.get('Action')=='pass' and bool(e.get('Test')) for e in events)}
              ok=False
            result['suites'][name]={'exit_code':rc,**counts}
            ok=ok and rc==0 and counts.get('leaf_tests',0)>0 and counts.get('failed',1)==0 and counts.get('skipped',1)==0
          for p in out.glob('*.exit'):
            rc=int(p.read_text());result['commands'][p.stem]=rc;ok=ok and rc==0
          result['result']='PASS' if ok else 'FAIL'
          result['sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          (out/'summary.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2));sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce10-repair-${{ github.sha }}', path: '${{ runner.temp }}/ce10-repair', retention-days: 30, if-no-files-found: error}
