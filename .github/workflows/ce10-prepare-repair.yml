name: CE-10 prepared boundary qualification
on:
  push:
    branches: [control/ce10-delivery-20260910]
    paths: ['.github/workflows/ce10-prepare-repair.yml']
permissions: {contents: write}
concurrency: {group: ce10-product-writer, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
      CE10_BASE: 12f33db5632a81c04b9de7634b5d37baf5a2bb1a
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: feat/ce-10-durable-provisioning, path: biz, fetch-depth: 0, persist-credentials: true}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hvritual/yunka.io, ref: '${{ env.YUNKA_SHA }}', path: yunka.io, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}
      - id: lock
        run: |
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "p=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "s=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ce10-prepare"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '${{ steps.lock.outputs.go }}', cache: false}
      - name: Install locked generators
        env: {R: '${{ steps.lock.outputs.p }}', S: '${{ steps.lock.outputs.s }}'}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/protocolbuffers/protobuf/releases/download/v${R}/protoc-${R}-linux-x86_64.zip" -o "$RUNNER_TEMP/p.zip"
          echo "$S  $RUNNER_TEMP/p.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/protoc"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Integrate generate and execute complete compile qualification
        working-directory: biz
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cd28c6221a59822c656d0b63852349cf6570ab72
          test "$(git rev-parse origin/main)" = "$CE10_BASE"
          python3 ../control/.ce10/integrate.py | tee "$RUNNER_TEMP/ce10-prepare/integration.log"
          python3 ../control/.ce10/contract-gate.py
          git diff --name-only "$CE10_BASE" -- '*.go' | xargs -r gofmt -w
          make generate 2>&1 | tee "$RUNNER_TEMP/ce10-prepare/generate.log"
          make commercial-generate 2>&1 | tee "$RUNNER_TEMP/ce10-prepare/commercial-generate.log"
          make check 2>&1 | tee "$RUNNER_TEMP/ce10-prepare/check.log"
          go test -timeout=5m -count=1 -json ./... | tee "$RUNNER_TEMP/ce10-prepare/all.jsonl"
          go test -timeout=5m -count=1 -tags=integration ./integration -run '^$' 2>&1 | tee "$RUNNER_TEMP/ce10-prepare/integration-compile.log"
          git diff --check
          test -z "$(git diff --name-only HEAD -- .github/workflows go.mod go.sum)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(ce-10): integrate generated provisioning and transactional outbox runtime'
          git push origin HEAD:feat/ce-10-durable-provisioning
          git rev-parse HEAD > "$RUNNER_TEMP/ce10-prepare/candidate-commit.txt"
          git archive HEAD -o "$RUNNER_TEMP/ce10-prepare/biz-source.tar"
      - name: Preserve attempted source and failure details
        if: always()
        working-directory: biz
        run: |
          mkdir -p "$RUNNER_TEMP/ce10-prepare"
          git diff --binary HEAD > "$RUNNER_TEMP/ce10-prepare/uncommitted.patch"
          git status --short > "$RUNNER_TEMP/ce10-prepare/status.txt"
          tar --exclude=.git --exclude=.yunka/runtime --exclude=.yunka/bin -cf "$RUNNER_TEMP/ce10-prepare/attempted-source.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ce10-prepared-${{ github.sha }}', path: '${{ runner.temp }}/ce10-prepare', if-no-files-found: error, retention-days: 30}
