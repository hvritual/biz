name: CE-10 qualification

on:
  workflow_call:
    inputs:
      enforce_performance:
        description: Enforce targeted CE10 performance acceptance
        required: false
        type: boolean
        default: false
      performance_target_seconds:
        description: Target CE10 qualification duration
        required: false
        type: number
        default: 180
      performance_hard_seconds:
        description: Diagnostic CE10 hard performance budget
        required: false
        type: number
        default: 240
  workflow_dispatch:

permissions: {contents: read}

env:
  YUNKA_TEST_RESET_FIXTURES: "1"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Start CE10 performance clock
        run: date +%s > "$RUNNER_TEMP/ce10.started"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: biz
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: '${{ env.YUNKA_SHA }}'
          path: yunka.io
          persist-credentials: false

      - id: lock
        name: Lock source and toolchain
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: true
          cache-dependency-path: biz/go.sum

      - name: Install locked generators
        env:
          RELEASE: '${{ steps.lock.outputs.protoc_release }}'
          CHECKSUM: '${{ steps.lock.outputs.protoc_sha }}'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip" \
            -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Qualify durable provisioning, recovery and outbox delivery
        run: bash biz/scripts/ce10_qualify.sh

      - name: Write CE10 performance receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        run: |
          set -euo pipefail
          args=(
            --surface ce10
            --lane qualify
            --started-file "$RUNNER_TEMP/ce10.started"
            --target-seconds "${{ inputs.performance_target_seconds }}"
            --hard-seconds "${{ inputs.performance_hard_seconds }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/ce10-performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 biz/scripts/ci_performance_receipt.py "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'ce10-${{ github.event.pull_request.head.sha || github.sha }}'
          path: |
            ${{ runner.temp }}/ce10
            ${{ runner.temp }}/ce10-performance.json
          retention-days: 30
          if-no-files-found: error
