name: CE-11 final receipt builder
on:
  push:
    branches: [control/ce11-final-receipt-20260911]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35031f9ffd96dde62d5425125f1250dc1ba8e361
          fetch-depth: 0
      - name: Lock verified business main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "35031f9ffd96dde62d5425125f1250dc1ba8e361"
          test "$(git rev-parse origin/main)" = "35031f9ffd96dde62d5425125f1250dc1ba8e361"
          git switch -c docs/ce-11-final-receipt-20260911
      - name: Build exactly three CE-11 receipt files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('docs/commercial-entitlements')
          tasks_path = root / 'tasks.json'
          plan = json.loads(tasks_path.read_text(encoding='utf-8'))
          matches = [t for t in plan['tasks'] if t['id'] == 'CE-11']
          assert len(matches) == 1
          task = matches[0]
          assert task['status'] == 'PLANNED', task
          assert task.get('blocker') is None
          task['status'] = 'DONE'
          task['evidence'] = 'evidence/CE-11.md'
          task['integration_commit'] = '35031f9ffd96dde62d5425125f1250dc1ba8e361'
          task['verification'] = 'evidence/CE-11-verification.json'
          tasks_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evidence = '''# CE-11 Vue 前端基线选择与受控集成执行回执

## 范围与结果

CE-11 已完成 Vue 前端基线选择、受控移植、浏览器验收和实际 business-main 回读。业务实现通过 PR #48 合入 `35031f9ffd96dde62d5425125f1250dc1ba8e361`。本任务只证明前端基础工程和已确认视觉/交互基线可用；CE-12 可信会话、CE-13 商业管理真接口、CE-14 权益过滤均未实现。

## 基线与依赖

依赖 CE-01 已为 DONE。后端起始主线固定为 `c660bccad241d0fbf6ede27959c2ac1e3a5da93a`。采用 PR #19 / `feat/coffeelink-vue-console@c59324393a616ac98b1f40b93603014e26baacf4` 的完整 Vue 工程，固定 `web/` tree `73b35af0db79c1116054c31c55e9d6b0601d59de`。`build/coffeelink-visual-verify@911ab19122ec009de8028fdc4b293b1358127be1` 因固定提交中的 `web/` 仅含 `.gitignore` 与 `package.json`，不具备完整可运行源码，未作为基线。客户经营及点位租赁后续 UI 分支亦未合入 CE-11。

## 变更清单

以 Git tree 级方式只引入 `web/**`、前端 workflow 和 CE-11 决策文档；没有整体合并历史分支，也没有替换当前 Go `internal/**`、`contracts/**`、`cmd/**`、Go module、数据库或授权逻辑。保留 Vue 3、TypeScript、Vite、Vue Router、Pinia 和 Lucide。preview 明确通过 `VITE_DATA_MODE=preview` 隔离，不允许生产 API 失败静默回退。CI actions 已锁定精确 SHA，并增加 TestCE11、非零 E2E、截图数量/尺寸与截图 SHA256 机器门禁。

## 验证命令与结果

最终业务 PR head `7e10f6d1f3c2dd054af311e69d6dc79709b54991` 的 14/14 PR workflows 全部 SUCCESS。前端 PR run `34566388750` 实际执行 Node 22 下 `npm ci`、`npm run check`、Chromium/CJK 安装和 `npm run test:e2e`：架构检查覆盖 63 个源码文件，Vitest 19/19，Playwright 11/11，包含实际 `TestCE11`，并输出 `CE11_VISUAL_EVIDENCE=PASS`。PR artifact `10186188021`，ZIP SHA256 `5973a0c6e0d8ab0619a81016ca1937f34eed062b834bd6d91898ffc87560cc17`。

实际 business-main `35031f9ffd96dde62d5425125f1250dc1ba8e361` 上重新运行前端及所有现有回归，13/13 workflows 全部 completed/success。main 前端 run `34566832776` 重新得到 19 个 unit、11 个 E2E、0 failed/0 skipped；artifact `10186334999`，ZIP SHA256 `1b5e0510230c2af727ae6420e131f2fbd038fe22828677e235f0656256643473`。独立下载复核得到 43 个 artifact 文件、19 张截图；1366×768、1440×900、390×844 的普通态和菜单展开态六张关键截图尺寸均精确匹配。runtime run `34566832817`、CE round receipts run `34566832758` 以及 CE-02～CE-10 历史资格均成功。

## 反例与故障验证

候选选择阶段拒绝了不完整的 `911ab191…` web 树，未以缺失源码的历史验证分支冒充可运行基线。`TestCE11` 明确验证 480px 浮层、不推动 main content、无子菜单 chevron、6 个逐行快捷入口；既有 E2E 同时覆盖收起导航、租户切换状态清理、路由无运行时错误及三个 viewport 无页面级横向溢出。CI 对缺失 TestCE11、E2E 为零、关键截图缺失或尺寸错误均 fail closed。

## 风险与回滚

`npm ci` 当前报告 2 个 moderate severity dependency findings；`lucide-vue-next@0.468.0` 和当前 ESLint 版本存在 deprecated 警告。CE-11 未通过 `npm audit fix --force` 或替换 UI 技术栈来掩盖这些事实，后续依赖维护需单独评估。当前仅为 preview 基线，不代表生产身份、生产 API 或商业操作已接通。回滚只撤销 CE-11 新增 `web/**`、前端 workflow 和 CE-11 文档，不回退后端主线或 CE-01～CE-10 数据/能力。

## 集成与回读

PR #48 已以 expected head 正常合并，integration/verified commit 均为 `35031f9ffd96dde62d5425125f1250dc1ba8e361`。该 SHA 上 13/13 push workflows 终态 SUCCESS；最后长尾 CE-08、CE-09、CE-10 资格均正常完成，没有以 PR merge-ref 代替 business-main 验证。本 final receipt 只允许新增本回执、机器证明并将 CE-11 台账置 DONE；最终 `--require-main` 必须在 receipt 合入后的最新 main 再执行。

## 自检

Scope check：无 CE-12/13/14、无 Go 授权/数据库改动。Dependency check：CE-01 DONE。Architecture check：63 个前端源码文件门禁通过。Test identity check：`TestCE11` 实际执行。Visual check：19 张真实截图，三种要求 viewport 均有普通态和展开态。Backend preservation check：业务 PR 相对起始 main 的产品差异限定在 `web/**`、前端 workflow 与 CE-11 决策文档。Completion check：本回执不把 candidate 或 PR 成功冒充最终 latest-main `--require-main`；该门禁留给 receipt merge 后执行。
'''
          (root / 'evidence' / 'CE-11.md').write_text(evidence, encoding='utf-8')

          proof = {
            'schema_version': 1,
            'task_id': 'CE-11',
            'verified_commit': '35031f9ffd96dde62d5425125f1250dc1ba8e361',
            'result': 'PASS',
            'checks': [
              {
                'command': 'npm run check',
                'exit_code': 0,
                'tests_passed': 19,
                'tests_failed': 0,
                'evidence': 'business-main CoffeeLink run 34566832776: type-check/lint/architecture/unit/build success; 19 Vitest tests passed'
              },
              {
                'command': 'npm run test:e2e',
                'exit_code': 0,
                'tests_passed': 11,
                'tests_failed': 0,
                'evidence': 'business-main CoffeeLink run 34566832776 / artifact 10186334999: 11 Playwright tests, TestCE11 present, zero unexpected/skipped'
              },
              {
                'command': 'CE11 visual evidence verifier',
                'exit_code': 0,
                'tests_passed': 0,
                'tests_failed': 0,
                'evidence': 'artifact 10186334999 sha256 1b5e0510230c2af727ae6420e131f2fbd038fe22828677e235f0656256643473; 19 screenshots; six required viewport screenshots exact size'
              },
              {
                'command': 'business-main workflow/readback gate',
                'exit_code': 0,
                'tests_passed': 0,
                'tests_failed': 0,
                'evidence': 'main 35031f9ffd96dde62d5425125f1250dc1ba8e361: 13/13 workflow runs completed success including runtime and CE-02 through CE-10 regressions'
              }
            ]
          }
          (root / 'evidence' / 'CE-11-verification.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Enforce receipt scope and candidate gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
            'docs/commercial-entitlements/evidence/CE-11.md',
            'docs/commercial-entitlements/evidence/CE-11-verification.json',
            'docs/commercial-entitlements/tasks.json',
          }
          tracked = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = tracked | untracked
          assert actual == expected, (actual, expected)
          PY
          python3 docs/commercial-entitlements/tools/check_plan.py
          python3 -m unittest discover -s docs/commercial-entitlements/tools -p 'test_*.py' -v
          git fetch origin main
          test "$(git rev-parse origin/main)" = "35031f9ffd96dde62d5425125f1250dc1ba8e361"
          python3 docs/commercial-entitlements/tools/check_round.py --task CE-11 --main-ref origin/main
      - name: Commit and push final receipt candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add docs/commercial-entitlements/evidence/CE-11.md docs/commercial-entitlements/evidence/CE-11-verification.json docs/commercial-entitlements/tasks.json
          git commit -m 'docs(ce-11): record verified frontend baseline receipt'
          git push origin HEAD:refs/heads/docs/ce-11-final-receipt-20260911
          echo "CE11_RECEIPT_CANDIDATE=$(git rev-parse HEAD)"
