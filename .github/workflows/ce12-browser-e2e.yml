name: CE-12 browser identity E2E

on:
  workflow_call:
    inputs:
      enforce_performance:
        description: Enforce targeted CE12 browser performance acceptance
        required: false
        type: boolean
        default: false
      performance_target_seconds:
        description: Target CE12 browser qualification duration
        required: false
        type: number
        default: 150
      performance_hard_seconds:
        description: Diagnostic CE12 browser hard performance budget
        required: false
        type: number
        default: 180
  workflow_dispatch:

permissions:
  contents: read

env:
  YUNKA_TEST_RESET_FIXTURES: "1"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BIZ_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_ce12_browser?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      CE12_E2E_ENV_FILE: /tmp/ce12-browser.json
      CE12_BIZ_BASE_URL: http://127.0.0.1:18080
    steps:
      - name: Start CE12 browser performance clock
        run: date +%s > "$RUNNER_TEMP/ce12-browser.started"

      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BIZ_SHA }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Start isolated CE12 MySQL preparation
        shell: bash
        run: |
          set -euo pipefail
          container="ce12-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container" >/dev/null 2>&1 || true
          export CE12_MYSQL_CONTAINER="$container"
          echo "CE12_MYSQL_CONTAINER=$container" >> "$GITHUB_ENV"
          date +%s > "$RUNNER_TEMP/ce12-mysql.started"
          nohup bash -c '
            set -euo pipefail
            docker pull mysql:8.4
            docker run               --name "$CE12_MYSQL_CONTAINER"               --tmpfs /var/lib/mysql:rw,nosuid,size=1g               -e MYSQL_ROOT_PASSWORD=root               -e MYSQL_DATABASE=biz_ce12_browser               -p 127.0.0.1:3306:3306               -d mysql:8.4
          ' >"$RUNNER_TEMP/ce12-mysql-launch.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ce12-mysql-launch.pid"

      - name: Checkout exact Yunka compatibility baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: true
          cache-dependency-path: biz/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Verify exact sources and format
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$BIZ_SHA"
          echo "CE12_BIZ_EXACT_HEAD=$BIZ_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          bad="$(gofmt -l             biz/internal/access/infrastructure/persistence/first_party_idp.go             biz/internal/access/infrastructure/persistence/first_party_idp_security.go             biz/internal/access/infrastructure/persistence/login_identifier.go             biz/internal/access/infrastructure/persistence/login_identifier_test.go             biz/internal/access/infrastructure/persistence/web_session.go             biz/internal/bizruntime/config.go             biz/internal/bizruntime/first_party_idp.go             biz/internal/bizruntime/first_party_idp_hardening_test.go             biz/internal/bizruntime/first_party_idp_server.go             biz/internal/bizruntime/first_party_native_login.go             biz/internal/bizruntime/oidc_static.go             biz/internal/bizruntime/web_auth.go             biz/integration/ce12_browser_seed_test.go             biz/cmd/biz-idp/main.go             biz/cmd/biz-idp/notification_sender.go             biz/cmd/biz-idp/notification_sender_qualification.go             biz/cmd/biz-idp-credential/main.go)"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }

      - name: Build CE12 browser runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          go -C biz build -tags=qualification -o "$RUNNER_TEMP/ce12-idp-qualification" ./cmd/biz-idp >"$RUNNER_TEMP/ce12-build-idp.log" 2>&1
          go -C biz build -o "$RUNNER_TEMP/ce12-biz" ./cmd/biz >"$RUNNER_TEMP/ce12-build-biz.log" 2>&1
          echo "CE12_RUNTIME_BUILD_SECONDS=$(( $(date +%s) - started ))"

      - name: Install browser E2E dependencies
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "CE12_BROWSER_DEPS_SECONDS=$(( $(date +%s) - started ))"

      - name: Wait for CE12 MySQL
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$CE12_MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -proot --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/ce12-mysql-launch.log" >&2 || true
            docker logs "$CE12_MYSQL_CONTAINER" >&2 || true
            exit 1
          fi
          echo "CE12_MYSQL_READY_SECONDS=$(( $(date +%s) - $(cat "$RUNNER_TEMP/ce12-mysql.started") ))"

      - name: Seed real member authority and three tenant outcomes
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^TestCE12BrowserSeed$'
          test -s "$CE12_E2E_ENV_FILE"

      - name: Generate qualification IdP signing key ring
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/ce12-idp-signing.pem" >/dev/null 2>&1
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/ce12-idp-previous.pem" >/dev/null 2>&1
          chmod 600 "$RUNNER_TEMP/ce12-idp-signing.pem" "$RUNNER_TEMP/ce12-idp-previous.pem"

      - name: Start first-party OIDC IdP
        shell: bash
        run: |
          set -euo pipefail
          export YUNKA_BIZ_MYSQL_DSN="$YUNKA_TEST_MYSQL_DSN"
          export YUNKA_BIZ_IDP_PUBLIC_URL="http://127.0.0.1:18081"
          export YUNKA_BIZ_IDP_REDIRECT_URL="http://127.0.0.1:18080/auth/callback"
          export YUNKA_BIZ_IDP_POST_LOGOUT_REDIRECT_URL="http://127.0.0.1:18080/"
          export YUNKA_BIZ_IDP_CLIENT_ID="biz-web"
          export YUNKA_BIZ_IDP_SIGNING_KEY_FILE="$RUNNER_TEMP/ce12-idp-signing.pem"
          export YUNKA_BIZ_IDP_PREVIOUS_SIGNING_KEY_FILES="$RUNNER_TEMP/ce12-idp-previous.pem"
          export YUNKA_BIZ_IDP_COOKIE_SECURE="false"
          export YUNKA_BIZ_PRIVACY_AGREEMENT_VERSION="ce12-v1"
          export YUNKA_BIZ_PRIVACY_POLICY_URL="https://example.invalid/privacy"
          export YUNKA_BIZ_TERMS_URL="https://example.invalid/terms"
          export YUNKA_BIZ_PRIVACY_RECONSENT_POLICY="current_version_required"
          export YUNKA_BIZ_IDP_LISTEN="127.0.0.1:18081"
          export YUNKA_BIZ_IDP_AUTO_MIGRATE="true"
          export YUNKA_BIZ_IDP_REMEMBER_IDENTIFIER_TTL="24h"
          export YUNKA_BIZ_VERIFICATION_CODE_TTL="5m"
          export YUNKA_BIZ_VERIFICATION_AUTHORIZATION_TTL="2m"
          export YUNKA_BIZ_VERIFICATION_RESEND_INTERVAL="60s"
          export YUNKA_BIZ_VERIFICATION_SEND_LIMIT_WINDOW="1h"
          export YUNKA_BIZ_VERIFICATION_MAX_SENDS_PER_WINDOW="5"
          export YUNKA_BIZ_VERIFICATION_MAX_TRIES="5"
          export YUNKA_BIZ_VERIFICATION_CODE_DIGITS="6"
          export YUNKA_BIZ_SECURITY_NOTIFICATION_PROVIDER="disabled"
          verification_key="$(printf 'KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK' | base64 -w0)"
          verification_hmac="$(printf 'HHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH' | base64 -w0)"
          export YUNKA_BIZ_VERIFICATION_ACTIVE_KEY_VERSION="v1"
          export YUNKA_BIZ_VERIFICATION_KEYS_JSON="{\"v1\":\"$verification_key\"}"
          export YUNKA_BIZ_VERIFICATION_HMAC_KEY_B64="$verification_hmac"
          export YUNKA_BIZ_IDP_QUALIFICATION_NOTIFICATION_FILE="$RUNNER_TEMP/ce12-otp.jsonl"
          : > "$YUNKA_BIZ_IDP_QUALIFICATION_NOTIFICATION_FILE"
          chmod 600 "$YUNKA_BIZ_IDP_QUALIFICATION_NOTIFICATION_FILE"
          echo "CE12_OTP_FILE=$YUNKA_BIZ_IDP_QUALIFICATION_NOTIFICATION_FILE" >> "$GITHUB_ENV"
          nohup "$RUNNER_TEMP/ce12-idp-qualification" >"$RUNNER_TEMP/ce12-idp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ce12-idp.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/healthz
          curl -fsS http://127.0.0.1:18081/idp/.well-known/openid-configuration | tee "$RUNNER_TEMP/ce12-discovery.json"
          curl -fsS http://127.0.0.1:18081/idp/jwks | tee "$RUNNER_TEMP/ce12-jwks.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'ce12-jwks.json').read_text())
          keys = payload.get('keys', [])
          assert len(keys) == 2, keys
          kids = {key.get('kid') for key in keys}
          assert None not in kids and len(kids) == 2, keys
          print('CE12_IDP_KEY_ROLLOVER=PASS')
          PY

      - name: Start Biz BFF resource server
        shell: bash
        run: |
          set -euo pipefail
          export YUNKA_BIZ_MYSQL_DSN="$YUNKA_TEST_MYSQL_DSN"
          export YUNKA_BIZ_HTTP_LISTEN="127.0.0.1:18080"
          export YUNKA_BIZ_GRPC_LISTEN="127.0.0.1:18082"
          export YUNKA_BIZ_AUTO_MIGRATE="true"
          export YUNKA_BIZ_OIDC_ISSUER="http://127.0.0.1:18081/idp"
          export YUNKA_BIZ_OIDC_CLIENT_ID="biz-web"
          export YUNKA_BIZ_OIDC_REDIRECT_URL="http://127.0.0.1:18080/auth/callback"
          export YUNKA_BIZ_OIDC_POST_LOGOUT_REDIRECT_URL="http://127.0.0.1:18080/"
          export YUNKA_BIZ_OIDC_COOKIE_SECURE="false"
          export YUNKA_BIZ_OIDC_SCOPES="openid profile email"
          nohup "$RUNNER_TEMP/ce12-biz" >"$RUNNER_TEMP/ce12-biz.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ce12-biz.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz

      - name: Start CoffeeLink API-mode UI
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          nohup env VITE_DATA_MODE=api BIZ_DEV_API_TARGET="$CE12_BIZ_BASE_URL" npm run dev -- --host 127.0.0.1 --port 15173 >"$RUNNER_TEMP/ce12-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ce12-web.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15173/ >/dev/null

      - name: Run complete browser trust chain
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config playwright.ce12.config.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('test-results/ce12-results.json').read_text())
          stats = result['stats']
          assert stats.get('unexpected', 0) == 0, stats
          serialized = json.dumps(result)
          required = [
              'TestCE12BrowserRealIdPToSessionTenantIAMEntitlement',
              'TestCE12BrowserRealTenantBrandAppearanceAndStaleReadback',
              'TestEnterprise171CrossTabTenantIsolationBackNavigationAndStaleContext',
              'TestEnterprise172UsernamePhoneEmailPasswordOTPMatrix',
              'TestEnterprise173PasswordRecoveryRevokesSessionsAndChangesCredential',
              'TestEnterprise173SelfPasswordChangeUIRevokesCurrentSession',
              'TestEnterprise173AdminRecoveryIsPermissionedScopedAndPolicyBlocked',
              'TestEnterprise175AuthorizedNavigationButtonsAndDeepLinksFailClosed',
          ]
          for title in required:
              assert title in serialized, f'CE-12 browser acceptance evidence missing: {title}'
          assert stats.get('expected', 0) >= len(required), stats
          print('CE12_BROWSER_AUTHORITY_CHAIN=PASS')
          print('CE12_THEME_APPEARANCE_AUTHORITY=PASS')
          PY

      - name: Write CE12 browser performance receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        run: |
          set -euo pipefail
          args=(
            --surface ce12-browser
            --lane browser-e2e
            --started-file "$RUNNER_TEMP/ce12-browser.started"
            --target-seconds "${{ inputs.performance_target_seconds }}"
            --hard-seconds "${{ inputs.performance_hard_seconds }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/ce12-browser-performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 biz/scripts/ci_performance_receipt.py "${args[@]}"

      - name: Capture qualification evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p biz/web/test-results
          cp "$RUNNER_TEMP/ce12-idp.log" biz/web/test-results/ce12-idp.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-biz.log" biz/web/test-results/ce12-biz.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-web.log" biz/web/test-results/ce12-web.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-discovery.json" biz/web/test-results/ce12-discovery.json 2>/dev/null
          cp "$RUNNER_TEMP/ce12-jwks.json" biz/web/test-results/ce12-jwks.json 2>/dev/null
          cp "$RUNNER_TEMP/ce12-build-biz.log" biz/web/test-results/ce12-build-biz.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-build-idp.log" biz/web/test-results/ce12-build-idp.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-browser-deps.log" biz/web/test-results/ce12-browser-deps.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-mysql-launch.log" biz/web/test-results/ce12-mysql-launch.log 2>/dev/null
          cp "$RUNNER_TEMP/ce12-browser-performance.json" biz/web/test-results/ce12-browser-performance.json 2>/dev/null
          rm -f "$RUNNER_TEMP/ce12-otp.jsonl"
          find biz/web/test-results -maxdepth 1 -type f ! -name ce12-evidence-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > biz/web/test-results/ce12-evidence-sha256.txt

      - name: Stop CE-12 servers and MySQL
        if: always()
        shell: bash
        run: |
          set +e
          test ! -f "$RUNNER_TEMP/ce12-web.pid" || kill "$(cat "$RUNNER_TEMP/ce12-web.pid")" 2>/dev/null
          test ! -f "$RUNNER_TEMP/ce12-biz.pid" || kill "$(cat "$RUNNER_TEMP/ce12-biz.pid")" 2>/dev/null
          test ! -f "$RUNNER_TEMP/ce12-idp.pid" || kill "$(cat "$RUNNER_TEMP/ce12-idp.pid")" 2>/dev/null
          docker rm -f "${CE12_MYSQL_CONTAINER:-}" >/dev/null 2>&1 || true

      - name: Verify candidate worktree remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C biz status --porcelain)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ce12-browser-e2e-${{ env.BIZ_SHA }}
          path: biz/web/test-results
          retention-days: 30
          if-no-files-found: error
