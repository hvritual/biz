name: CE-12 gofmt repair
on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-format-diff.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.25.13', cache: false}
      - name: Apply exact gofmt and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/access/infrastructure/persistence/first_party_idp.go \
            internal/bizruntime/first_party_idp.go \
            integration/ce12_browser_seed_test.go
          if git diff --quiet; then
            echo 'CE12_GOFMT=ALREADY_CLEAN'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/access/infrastructure/persistence/first_party_idp.go \
            internal/bizruntime/first_party_idp.go \
            integration/ce12_browser_seed_test.go
          git commit -m 'style(ce-12): apply gofmt to first-party identity slice'
          git push origin HEAD:feat/ce-12-first-party-idp-e2e
