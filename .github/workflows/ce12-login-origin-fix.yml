name: CE-12 IdP form origin repair

on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-login-origin-fix.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: e323ee5833d929b5b1d0494fc29aae0aaa2b6f4a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          path: biz
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: '${{ env.YUNKA_SHA }}'
          path: yunka.io
          persist-credentials: false
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: false
      - name: Patch form origin semantics and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 biz/tools/ce12_login_origin_fix.py
          gofmt -w biz/internal/bizruntime/first_party_idp.go biz/internal/bizruntime/first_party_idp_hardening_test.go
          git -C biz diff --check
      - name: Qualify repair before commit
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 ./internal/bizruntime -run '^TestCE12'
          go -C biz test -count=1 ./...
          go -C biz vet ./...
          go -C biz build ./cmd/biz ./cmd/biz-idp ./cmd/biz-idp-credential
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git -C biz config user.name 'github-actions[bot]'
          git -C biz config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C biz add internal/bizruntime/first_party_idp.go internal/bizruntime/first_party_idp_hardening_test.go
          git -C biz commit -m 'fix(ce-12): preserve IdP form origin for transaction cookie'
          git -C biz push origin HEAD:feat/ce-12-first-party-idp-e2e
