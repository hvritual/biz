name: CE-12 atomic credential lifecycle

on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-production-hardening.yml']

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YUNKA_SHA: e323ee5833d929b5b1d0494fc29aae0aaa2b6f4a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          path: biz
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: '${{ env.YUNKA_SHA }}'
          path: yunka.io
          persist-credentials: false
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: false
      - name: Apply atomic credential patch
        shell: bash
        run: |
          set -euo pipefail
          python3 biz/tools/ce12_atomic_credentials.py
          gofmt -w \
            biz/internal/access/infrastructure/persistence/first_party_idp.go \
            biz/internal/access/infrastructure/persistence/first_party_idp_security.go
      - name: Qualify atomic credential lifecycle
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 ./internal/access/infrastructure/persistence ./internal/bizruntime
          go -C biz test -count=1 ./...
          go -C biz vet ./...
          go -C biz build ./cmd/biz ./cmd/biz-idp ./cmd/biz-idp-credential
      - name: Commit verified production code only
        shell: bash
        run: |
          set -euo pipefail
          git -C biz config user.name 'github-actions[bot]'
          git -C biz config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C biz add \
            internal/access/infrastructure/persistence/first_party_idp.go \
            internal/access/infrastructure/persistence/first_party_idp_security.go
          git -C biz commit -m 'fix(ce-12): make credential rotation and revocation atomic'
          git -C biz push origin HEAD:feat/ce-12-first-party-idp-e2e
