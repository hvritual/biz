name: CE-12 production IdP hardening

on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-production-hardening.yml']

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YUNKA_SHA: e323ee5833d929b5b1d0494fc29aae0aaa2b6f4a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          path: biz
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: '${{ env.YUNKA_SHA }}'
          path: yunka.io
          persist-credentials: false
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '${{ steps.lock.outputs.go_version }}'
          cache: false
      - name: Apply production hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('biz')

          def replace(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Web sessions must preserve their true authentication provenance.
          replace('internal/access/infrastructure/persistence/web_session.go', '''const (
\tWebActorUser     = "user"
\tWebActorPlatform = "platform"
\t// Current Biz operation contracts classify server-issued credentials as
\t// api-key authentication. A browser never receives an API key: after OIDC
\t// verification the BFF replaces provider tokens with a server-side session,
\t// and only that trusted server session is projected into this existing
\t// contract authentication class. Session origin remains explicit in the Web
\t// session context and cannot be supplied by an arbitrary header.
\tAuthMethodWeb = identity.AuthMethodAPIKey
)''', '''const (
\tWebActorUser     = "user"
\tWebActorPlatform = "platform"
\t// A browser never supplies this value. The BFF sets it only after validating
\t// the opaque server-side session and resolving the authoritative actor.
\tAuthMethodWeb = "web-session"
)''')

          # Do not hide datastore failures as bad credentials; only an active
          # throttle is intentionally indistinguishable from bad credentials.
          replace('internal/access/infrastructure/persistence/first_party_idp_security.go', '''\tif err := store.database.WithContext(ctx).Transaction(func(tx *gorm.DB) error {
\t\tvar row firstPartyLoginThrottleRecord
\t\terr := tx.Clauses(clause.Locking{Strength: "UPDATE"}).Where("identity_hash = ?", identityHash).First(&row).Error
\t\tif err != nil && !errors.Is(err, gorm.ErrRecordNotFound) {
\t\t\treturn err
\t\t}
\t\tif err == nil && row.BlockedUntil != nil && row.BlockedUntil.After(now) {
\t\t\treturn ErrInvalidUserCredentials
\t\t}
\t\treturn nil
\t}); err != nil {
\t\tconsumeDummyPasswordWork(password)
\t\t_ = store.recordFirstPartyLoginAudit(ctx, now, "throttled", "", identityHash, sourceHash)
\t\treturn LocalUserIdentity{}, ErrInvalidUserCredentials
\t}''', '''\terr := store.database.WithContext(ctx).Transaction(func(tx *gorm.DB) error {
\t\tvar row firstPartyLoginThrottleRecord
\t\terr := tx.Clauses(clause.Locking{Strength: "UPDATE"}).Where("identity_hash = ?", identityHash).First(&row).Error
\t\tif err != nil && !errors.Is(err, gorm.ErrRecordNotFound) {
\t\t\treturn err
\t\t}
\t\tif err == nil && row.BlockedUntil != nil && row.BlockedUntil.After(now) {
\t\t\treturn ErrInvalidUserCredentials
\t\t}
\t\treturn nil
\t})
\tif err != nil {
\t\tif !errors.Is(err, ErrInvalidUserCredentials) {
\t\t\treturn LocalUserIdentity{}, err
\t\t}
\t\tconsumeDummyPasswordWork(password)
\t\t_ = store.recordFirstPartyLoginAudit(ctx, now, "throttled", "", identityHash, sourceHash)
\t\treturn LocalUserIdentity{}, ErrInvalidUserCredentials
\t}''')

