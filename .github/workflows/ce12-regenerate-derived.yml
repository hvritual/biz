name: CE-12 regenerate contract-derived artifacts

on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-regenerate-derived.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YUNKA_SHA: 33b98ceba57494abda2299e4f0290a5651dab4bc
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout locked Yunka generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protobuf toolchain
        shell: bash
        env:
          RELEASE: ${{ steps.lock.outputs.protoc_release }}
          CHECKSUM: ${{ steps.lock.outputs.protoc_sha }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Regenerate and constrain ownership
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate
          git -C biz diff --check
          mapfile -t changed < <(git -C biz diff --name-only)
          test ${#changed[@]} -gt 0
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              contracts/gen/*|contracts/generated/*|contracts/commercial/generated/*|contracts/third_party/yunka/dsl/v1/options.proto|internal/*/policy/zz_yunka_*|internal/*/transport/rest/zz_yunka_*|internal/*/transport/rpc/zz_yunka_*) ;;
              *) echo "unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done
          git -C biz diff --binary > "$RUNNER_TEMP/generated-before.patch"
          make -C biz check
          make -C biz generate
          git -C biz diff --binary > "$RUNNER_TEMP/generated-after.patch"
          cmp "$RUNNER_TEMP/generated-before.patch" "$RUNNER_TEMP/generated-after.patch"

      - name: Regression after regeneration
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 ./...
          go -C biz vet ./...
          go -C biz build ./cmd/biz ./cmd/biz-idp ./cmd/biz-idp-credential

      - name: Commit verified derived artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git -C biz config user.name 'github-actions[bot]'
          git -C biz config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C biz add contracts/gen contracts/generated contracts/commercial/generated contracts/third_party/yunka/dsl/v1/options.proto internal/*/policy internal/*/transport/rest internal/*/transport/rpc
          test -n "$(git -C biz diff --cached --name-only)"
          git -C biz commit -m 'chore(ce-12): refresh contract-derived artifacts'
          git -C biz push origin HEAD:feat/ce-12-first-party-idp-e2e
