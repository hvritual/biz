name: CE-12 web auth gofmt

on:
  push:
    branches: [feat/ce-12-first-party-idp-e2e]
    paths: ['.github/workflows/ce12-web-auth-gofmt.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format single file
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/bizruntime/web_auth.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/bizruntime/web_auth.go
          if git diff --cached --quiet; then
            echo 'CE12_WEB_AUTH_GOFMT=ALREADY_CLEAN'
            exit 0
          fi
          git commit -m 'style(ce-12): format web auth boundary'
          git push origin HEAD:feat/ce-12-first-party-idp-e2e
