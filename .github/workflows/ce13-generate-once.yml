name: CE-13 one-shot canonical generation

on:
  push:
    branches: [fix/ce13-platform-commercial-web-session]
    paths:
      - .github/workflows/ce13-generate-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: e323ee5833d929b5b1d0494fc29aae0aaa2b6f4a
    steps:
      - name: Checkout exact Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ce13-platform-commercial-web-session
          path: biz
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact Yunka compatibility baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"
          echo "protoc_gen_go_version=${PROTOC_GEN_GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_gen_go_grpc_version=${PROTOC_GEN_GO_GRPC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protobuf toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.lock.outputs.protoc_release }}/protoc-${{ steps.lock.outputs.protoc_release }}-linux-x86_64.zip" \
            -o "$archive"
          echo "${{ steps.lock.outputs.protoc_sha }}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/protobuf-bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${{ steps.lock.outputs.protoc_gen_go_version }}"
          GOBIN="$RUNNER_TEMP/protobuf-bin" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ steps.lock.outputs.protoc_gen_go_grpc_version }}"
          echo "$RUNNER_TEMP/protobuf-bin" >> "$GITHUB_PATH"
          test -x "$RUNNER_TEMP/protobuf-bin/protoc-gen-go"
          test -x "$RUNNER_TEMP/protobuf-bin/protoc-gen-go-grpc"

      - name: Generate canonical Biz artifacts
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          make -C biz check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Verify generator changed only generated surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed_prefixes = (
              'contracts/gen/',
              'contracts/generated/',
              'contracts/commercial/generated/',
              'internal/',
          )
          allowed_exact = {'contracts/commercial/operation-capabilities.v1.json', 'go.mod', 'go.sum'}
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          bad = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if bad:
              raise SystemExit('generator changed non-generated files: ' + ', '.join(bad))
          print('CE13_GENERATED_FILES=' + str(len(changed)))
          PY

      - name: Commit canonical generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          git add contracts/gen contracts/generated contracts/commercial internal go.mod go.sum
          if git diff --cached --quiet; then
            echo "CE13_GENERATION_NO_DIFF=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ce13): regenerate platform web-session contracts"
          git push origin HEAD:fix/ce13-platform-commercial-web-session
