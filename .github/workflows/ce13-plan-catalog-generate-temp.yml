name: CE-13 plan catalog contract generation (temporary)

on:
  push:
    branches: [feat/ce13-plan-catalog-discovery]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YUNKA_SHA: e323ee5833d929b5b1d0494fc29aae0aaa2b6f4a
    steps:
      - name: Checkout exact Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: biz
          ref: feat/ce13-plan-catalog-discovery
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"
          echo "protoc_gen_go_version=${PROTOC_GEN_GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_gen_go_grpc_version=${PROTOC_GEN_GO_GRPC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protobuf and Yunka RPC tools
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.lock.outputs.protoc_release }}/protoc-${{ steps.lock.outputs.protoc_release }}-linux-x86_64.zip" \
            -o "$archive"
          echo "${{ steps.lock.outputs.protoc_sha }}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/protobuf-bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${{ steps.lock.outputs.protoc_gen_go_version }}"
          GOBIN="$RUNNER_TEMP/protobuf-bin" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ steps.lock.outputs.protoc_gen_go_grpc_version }}"
          echo "$RUNNER_TEMP/protobuf-bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Generate through repository contract chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          git -C biz status --short

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git -C biz status --porcelain)"; then
            echo "generation already clean"
            exit 0
          fi
          git -C biz config user.name "github-actions[bot]"
          git -C biz config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C biz add -A
          git -C biz commit -m "chore(ce13): regenerate plan discovery contract"
          git -C biz push origin HEAD:feat/ce13-plan-catalog-discovery
