name: CE340 recovery authoring
on:
  push:
    branches: [chore/ci-proof-ce340-recovery-authoring]
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fd6b34b2f167ba2b30aa0ac18cb33f2d8ba54ac5
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e31cf717521ebbeaf14aac6f5b84d695637ce3dc
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact eight-file proposal, no CI changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce340-recovery"
          echo '8f9bfc62ee7a646e69c8ca876214aba9c9ff19cc6e13451ff53d684a9adb7f63  control/tools/ce340-recovery.patch' | sha256sum -c -
          test "$(git -C source rev-parse HEAD)" = e31cf717521ebbeaf14aac6f5b84d695637ce3dc
          git -C source apply --check --unidiff-zero ../control/tools/ce340-recovery.patch
          git -C source apply --index --unidiff-zero ../control/tools/ce340-recovery.patch
          test "$(git -C source write-tree)" = da8dae0aa1fcee76223c1fb4e432263afdbed25c
          echo 'e5b335e5dfcdc6d1cbac6cd50dc3a1640e7769396a2447e3685ff763a6622386  control/tools/ce340-recovery-fixes.patch' | sha256sum -c -
          git -C source apply --index --unidiff-zero ../control/tools/ce340-recovery-fixes.patch
          test "$(git -C source write-tree)" = 6bb97865a91e5875377439dcb8f58b0aff20ffd3
          git -C source diff --cached --check
          test -z "$(git -C source diff --cached --name-only -- .github server go.mod go.sum contracts)"
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source commit -m 'fix(commercial): recover original first subscription after reload' -m 'Refs #340. Preserve original request identity and server-authoritative recovery, isolate tenant results, read exact plan names, and exercise lost-reply recovery. Qualification pending; no framework or CI changes.'
          git -C source rev-parse HEAD > "$RUNNER_TEMP/ce340-recovery/candidate-sha.txt"
          git -C source rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ce340-recovery/tree.txt"
          git -C source archive --format=tar --output="$RUNNER_TEMP/ce340-recovery/source.tar" HEAD
          git -C source diff --binary e31cf717521ebbeaf14aac6f5b84d695637ce3dc HEAD > "$RUNNER_TEMP/ce340-recovery/changes.patch"
          (cd source && python3 -B scripts/check_ci_source_safety.py --base-ref e31cf717521ebbeaf14aac6f5b84d695637ce3dc)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Full existing Web Fast Gate
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check 2>&1 | tee "$RUNNER_TEMP/ce340-recovery/web-check.log"
      - name: Deterministic first-subscription browser fixture, not real API proof
        working-directory: source/web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test e2e/ce13-tenant-entitlements.spec.ts 2>&1 | tee "$RUNNER_TEMP/ce340-recovery/browser-fixture.log"
          git diff --exit-code
      - name: Publish candidate branch without merging or advancing business PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=feat/platform-first-subscription-recovery-340
          test -z "$(git -C source ls-remote --heads origin "refs/heads/$branch")"
          candidate=$(git -C source rev-parse HEAD)
          git -C source push origin "$candidate:refs/heads/$branch"
          test "$(git -C source ls-remote origin "refs/heads/$branch" | cut -f1)" = "$candidate"
          echo PASS > "$RUNNER_TEMP/ce340-recovery/web-qualification.txt"
      - name: Retain source, logs and exact browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ce340-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ce340-recovery/
            source/web/test-results/
          if-no-files-found: error
          retention-days: 14
