name: CE340 secure consumer authoring
on:
  push:
    branches: [chore/ci-proof-ce340-secure-consumer-authoring]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GITHUB_HEAD_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 40ae9c0116e449c2461fec55f3d01890828089ee
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 6be63bfedf622a9c123bd24f7fd18b62882ee1e9
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Load exact source and toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = chore/ci-proof-ce340-secure-consumer-authoring
          test "$(git -C biz rev-parse HEAD)" = 40ae9c0116e449c2461fec55f3d01890828089ee
          test "$(git -C yunka.io rev-parse HEAD)" = 6be63bfedf622a9c123bd24f7fd18b62882ee1e9
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ce340-consumer"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/ce340-consumer/control-sha.txt"
          git -C biz rev-parse HEAD > "$RUNNER_TEMP/ce340-consumer/base-sha.txt"
          git -C yunka.io rev-parse HEAD > "$RUNNER_TEMP/ce340-consumer/framework-sha.txt"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go }}
          cache: false
      - name: Install unchanged pinned generators
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$PROTOC_LINUX_X86_64_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/proto-bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOC_GEN_GO_VERSION"
          GOBIN="$RUNNER_TEMP/proto-bin" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$PROTOC_GEN_GO_GRPC_VERSION"
          GOBIN="$RUNNER_TEMP/proto-bin" go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          echo "$RUNNER_TEMP/proto-bin" >> "$GITHUB_PATH"
      - name: Update single source lock and exact workflow consumers
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import sys, subprocess
          sys.path.insert(0, 'scripts')
          from literal_patch import apply, blob_sha
          old = '06076ce2fc170c89c7356ee070d74ebf1de340cf'
          new = '6be63bfedf622a9c123bd24f7fd18b62882ee1e9'
          oldver = 'v0.0.0-20261007114540-06076ce2fc17'
          newver = 'v0.0.0-20261008001646-6be63bfedf62'
          paths = [Path('.yunka/source.env'), Path('go.mod'), *Path('.github/workflows').glob('*.yml')]
          for path in paths:
              before = path.read_text()
              after = before.replace(old, new).replace(oldver, newver)
              if path.as_posix() == '.yunka/source.env':
                  after = after.replace('fix/c9-rest-not-found-status', 'fix/ce340-compatible-security')
              if before != after:
                  apply(path, blob_sha(path.read_bytes()), before, after)
          subprocess.run(['go', 'mod', 'tidy'], check=True)
          PYCODE
          make generate
          make workspace-check yunka-source-check
          python3 -B scripts/check_ci_source_safety.py --base-ref 40ae9c0116e449c2461fec55f3d01890828089ee
          python3 -B -m unittest discover -s scripts -p 'test_ci_source_safety.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_literal_patch.py' -v
          python3 -B - <<'PYCODE'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed = {'.yunka/source.env', 'go.mod', 'go.sum', 'go.work.sum'}
          assert changed and all(p in allowed or p.startswith('.github/workflows/') for p in changed), changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          subprocess.run(['git','add','--',*changed],check=True)
          PYCODE
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci-proof): pin security-qualified CE340 compatibility' -m 'Refs #355 and #340. Exact framework source 6be63bfedf62 with dependency graph generated by locked tools. Consumer qualification pending. No business source or gate semantics changed.'
          git rev-parse HEAD > "$RUNNER_TEMP/ce340-consumer/candidate-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ce340-consumer/candidate-tree.txt"
          git diff --binary 40ae9c0116e449c2461fec55f3d01890828089ee HEAD > "$RUNNER_TEMP/ce340-consumer/consumer.patch"
          git archive --format=tar --output="$RUNNER_TEMP/ce340-consumer/source.tar" HEAD
      - name: Exact consumer checks and current vulnerability scan
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          make check consumer-certify 2>&1 | tee "$RUNNER_TEMP/ce340-consumer/qualification.log"
          govulncheck ./... 2>&1 | tee "$RUNNER_TEMP/ce340-consumer/vulnerability.log"
          make generate 2>&1 | tee "$RUNNER_TEMP/ce340-consumer/determinism.log"
          test -z "$(git status --porcelain)"
          echo PASS > "$RUNNER_TEMP/ce340-consumer/result.txt"
      - name: Publish isolated consumer candidate, never merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=chore/ci-proof-ce340-secure-consumer
          test -z "$(git -C biz ls-remote --heads origin "refs/heads/$branch")"
          candidate=$(git -C biz rev-parse HEAD)
          git -C biz push origin "$candidate:refs/heads/$branch"
          test "$(git -C biz ls-remote origin "refs/heads/$branch" | cut -f1)" = "$candidate"
      - name: Preserve candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ce340-secure-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ce340-consumer/
          if-no-files-found: error
          retention-days: 14
