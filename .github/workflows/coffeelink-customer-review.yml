name: CoffeeLink customer UI review workspace
on:
  push:
    branches: [build/coffeelink-customer-review]
    paths: ['.github/workflows/coffeelink-customer-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 911ab19122ec009de8028fdc4b293b1358127be1
          fetch-depth: 0
          persist-credentials: false
      - name: Restore only the fixed baseline frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root = Path('.github/coffeelink-transfer')
          packed = base64.b64decode(''.join((root / f'part-{i}.b64').read_text() for i in range(5)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '6fa5c3f6b57d58a0a72a9b0ca0786b309fdce90909cfb4f03301cc2e5e5f3164'
          files = json.loads(lzma.decompress(packed))
          def write_files(data):
              for name, value in data.items():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith('web/') or name == '.github/workflows/coffeelink-web.yml'
                  assert path.suffix.lower() not in ('.ttf', '.otf', '.woff', '.woff2')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  if path.suffix in ('.png', '.webp'):
                      path.write_bytes(base64.b64decode(value, validate=True))
                  else:
                      path.write_text(value, encoding='utf-8')
          write_files(files)
          patch = root / 'patches.json'
          if patch.exists(): write_files(json.loads(patch.read_text()))
          changes = root / 'replacements.json'
          if changes.exists():
              for name, edits in json.loads(changes.read_text()).items():
                  path = Path(name)
                  assert name.startswith('web/') and '..' not in path.parts
                  text = path.read_text(encoding='utf-8')
                  for before, after in edits:
                      assert text.count(before) == 1, name
                      text = text.replace(before, after, 1)
                  path.write_text(text, encoding='utf-8')
          manifest = {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('web').rglob('*')) if p.is_file()}
          Path('/tmp/restored-web-sha256.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False))
          print('Restored files:', len(manifest))
          PY
      - name: Archive pinned source and local git history
        run: |
          git bundle create /tmp/biz-baseline.bundle HEAD
          tar --exclude=.git --exclude=node_modules -czf /tmp/biz-restored-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: coffeelink-pinned-review-source
          path: |
            /tmp/biz-baseline.bundle
            /tmp/biz-restored-source.tgz
            /tmp/restored-web-sha256.json
          retention-days: 3
