name: CoffeeLink site rental review
on:
  push:
    branches: [feat/coffeelink-site-rental]
    paths: ['.github/workflows/coffeelink-site-rental.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04dedc3826e23754f0cffa13ed5c27b5c4224071
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot exact baseline source and hashes
        run: |
          git bundle create /tmp/biz-site-baseline.bundle HEAD
          tar --exclude=.git -czf /tmp/biz-site-baseline.tgz .
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          Path('/tmp/biz-site-baseline-sha256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('web').rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: biz-site-baseline
          path: |
            /tmp/biz-site-baseline.bundle
            /tmp/biz-site-baseline.tgz
            /tmp/biz-site-baseline-sha256.json
          retention-days: 7
