name: CoffeeLink Vue console
on:
  workflow_call:
    inputs:
      skip_fast_check:
        description: Fast Gate already passed in PR Qualification
        required: false
        type: boolean
        default: false
      enforce_performance:
        description: Enforce targeted CoffeeLink performance acceptance
        required: false
        type: boolean
        default: false
      performance_target_seconds:
        description: Target lane duration for targeted performance acceptance
        required: false
        type: number
        default: 180
      performance_hard_seconds:
        description: Diagnostic hard performance budget before classification as exceeded
        required: false
        type: number
        default: 240
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Start CoffeeLink core performance clock
        run: date +%s > "$RUNNER_TEMP/coffeelink-core.started"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Run canonical Web Fast Gate
        if: ${{ !inputs.skip_fast_check }}
        run: npm run check
        working-directory: web
      - name: Install core headless browser and Chinese text support
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps --only-shell chromium
          if ! fc-match "Noto Sans CJK SC" | grep -qi 'Noto Sans CJK'; then
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-match "Noto Sans CJK SC"
      - name: Build default CoffeeLink bundle
        run: npx vite build
        working-directory: web
      - name: Run CoffeeLink core E2E
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t core_specs < <(
            find e2e -maxdepth 1 -type f -name '*.spec.ts' ! -name 'site-rental.spec.ts' -print | sort
          )
          test "${#core_specs[@]}" -gt 0
          npx playwright test --workers=4 "${core_specs[@]}"
      - name: Verify visual contract evidence
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          root = Path('test-results')
          results = json.loads((root / 'results.json').read_text())
          stats = results['stats']
          assert stats.get('unexpected', 0) == 0, stats
          expected = stats.get('expected', 0)
          assert expected >= 20, stats
          serialized = json.dumps(results, ensure_ascii=False)
          assert 'TestCE11' in serialized, 'TestCE11 acceptance identity missing'
          assert 'platform overview WorkbenchPage captures the four CoffeeLink V1.1 viewports' in serialized
          assert 'platform tenant ListPage captures the four CoffeeLink V1.1 viewports' in serialized
          assert 'platform module catalog ListPage captures the four CoffeeLink V1.1 viewports' in serialized
          assert 'platform plan WorkbenchPage captures the four CoffeeLink V1.1 viewports' in serialized
          assert 'platform entitlement WorkbenchPage captures the four CoffeeLink V1.1 viewports' in serialized
          assert 'grouped customer and rental menus capture all CoffeeLink acceptance viewports' in serialized
          assert 'rental collection workspaces capture all CoffeeLink acceptance viewports' in serialized

          shots = root / 'screenshots'
          required = {
              'responsive-1366.png': (1366, 768),
              'responsive-menu-1366.png': (1366, 768),
              'responsive-1440.png': (1440, 900),
              'responsive-menu-1440.png': (1440, 900),
              'responsive-390.png': (390, 844),
              'responsive-menu-390.png': (390, 844),
              'platform-overview-1366.png': (1366, 768),
              'platform-overview-1440.png': (1440, 900),
              'platform-overview-1536.png': (1536, 1024),
              'platform-overview-390.png': (390, 844),
              'platform-tenants-1366.png': (1366, 768),
              'platform-tenants-menu-1366.png': (1366, 768),
              'platform-tenants-collapsed-menu-1366.png': (1366, 768),
              'platform-tenants-1440.png': (1440, 900),
              'platform-tenants-1536.png': (1536, 1024),
              'platform-tenants-390.png': (390, 844),
              'platform-modules-1366.png': (1366, 768),
              'platform-modules-1440.png': (1440, 900),
              'platform-modules-1536.png': (1536, 1024),
              'platform-modules-390.png': (390, 844),
              'platform-plans-1366.png': (1366, 768),
              'platform-plans-1440.png': (1440, 900),
              'platform-plans-1536.png': (1536, 1024),
              'platform-plans-390.png': (390, 844),
              'platform-entitlements-1366.png': (1366, 768),
              'platform-entitlements-1440.png': (1440, 900),
              'platform-entitlements-1536.png': (1536, 1024),
              'platform-entitlements-390.png': (390, 844),
              'menu-customer-1366.png': (1366, 768),
              'menu-customer-1440.png': (1440, 900),
              'menu-customer-1536.png': (1536, 1024),
              'menu-customer-390.png': (390, 844),
              'menu-rental-1366.png': (1366, 768),
              'menu-rental-1440.png': (1440, 900),
              'menu-rental-1536.png': (1536, 1024),
              'menu-rental-390.png': (390, 844),
          }
          for flow in ['delivery', 'service', 'payment', 'returns']:
              for width, height in [(1366, 768), (1440, 900), (1536, 1024), (390, 844)]:
                  required[f'rental-{flow}-{width}.png'] = (width, height)

          gallery = Path('screenshots')
          gallery_pngs = list(gallery.glob('*.png'))
          compatibility_pngs = list(shots.glob('*.png'))
          actual_pngs = gallery_pngs + compatibility_pngs
          assert len(actual_pngs) >= 66, len(actual_pngs)
          for name, want in required.items():
              data = (shots / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == want, (name, width, height, want)
          print(
              f'UI_CONTRACT_VISUAL_EVIDENCE=PASS e2e={expected} '
              f'gallery={len(gallery_pngs)} compatibility={len(compatibility_pngs)} '
              'contracts=CoffeeLink-V1.1 enterprise-member-api=PASS enterprise-role-api=PASS'
          )
          PY
          sha256sum screenshots/*.png test-results/screenshots/*.png | sort > test-results/screenshot-sha256.txt
      - name: Record tested source provenance
        if: always()
        working-directory: web
        run: node scripts/collect-ui-evidence.mjs
      - name: Write CoffeeLink core performance receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        run: |
          set -euo pipefail
          args=(
            --lane core
            --started-file "$RUNNER_TEMP/coffeelink-core.started"
            --target-seconds "${{ inputs.performance_target_seconds }}"
            --hard-seconds "${{ inputs.performance_hard_seconds }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/coffeelink-core-performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 scripts/coffeelink_performance.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coffeelink-visual-review
          path: |
            web/screenshots
            web/test-results
            web/dist
            ${{ runner.temp }}/coffeelink-core-performance.json
          if-no-files-found: error
          retention-days: 14

  site-rental:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Start CoffeeLink site-rental performance clock
        run: date +%s > "$RUNNER_TEMP/coffeelink-site-rental.started"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install site-rental headless browser and Chinese text support
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps --only-shell chromium
          if ! fc-match "Noto Sans CJK SC" | grep -qi 'Noto Sans CJK'; then
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-match "Noto Sans CJK SC"
      - name: Build default CoffeeLink bundle
        run: npx vite build
        working-directory: web
      - name: Run serial site-rental E2E
        run: npx playwright test --workers=1 e2e/site-rental.spec.ts
        working-directory: web
      - name: Verify site-rental evidence
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          results = json.loads(Path('test-results/results.json').read_text())
          stats = results['stats']
          assert stats.get('unexpected', 0) == 0, stats
          serialized = json.dumps(results, ensure_ascii=False)
          required = [
              'site list, actual linked records, and existing connected navigation',
              'billing draft, dispute, resolution and frozen snapshot form a single-record loop',
              'responsive views and dialogs are reachable without viewport overflow or console errors',
              'expired contract has no current quote while historical versions remain available',
          ]
          for title in required:
              assert title in serialized, f'missing site-rental evidence: {title}'
          print(f'SITE_RENTAL_E2E=PASS expected={stats.get("expected", 0)} required={len(required)}')
          PY
      - name: Write CoffeeLink site-rental performance receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        run: |
          set -euo pipefail
          args=(
            --lane site-rental
            --started-file "$RUNNER_TEMP/coffeelink-site-rental.started"
            --target-seconds "${{ inputs.performance_target_seconds }}"
            --hard-seconds "${{ inputs.performance_hard_seconds }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/coffeelink-site-rental-performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 scripts/coffeelink_performance.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coffeelink-site-rental-review
          path: |
            web/screenshots/site-rental
            web/test-results
            ${{ runner.temp }}/coffeelink-site-rental-performance.json
          if-no-files-found: error
          retention-days: 14
