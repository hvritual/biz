name: CoffeeLink Vue console
on:
  push:
    branches: [main, feat/coffeelink-vue-console]
    paths: ['web/**', '.github/workflows/coffeelink-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/coffeelink-web.yml']
concurrency:
  group: coffeelink-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Install browser and Chinese text support
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
        working-directory: web
      - name: Verify visual contract evidence
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          root = Path('test-results')
          results = json.loads((root / 'results.json').read_text())
          stats = results['stats']
          assert stats.get('unexpected', 0) == 0, stats
          expected = stats.get('expected', 0)
          assert expected >= 14, stats
          serialized = json.dumps(results, ensure_ascii=False)
          assert 'TestCE11' in serialized, 'TestCE11 acceptance identity missing'
          assert 'platform overview WorkbenchPage captures the four CoffeeLink V1.1 viewports' in serialized, 'platform overview visual contract test missing'
          assert 'platform tenant ListPage captures the four CoffeeLink V1.1 viewports' in serialized, 'platform tenant visual contract test missing'

          shots = root / 'screenshots'
          required = {
              'responsive-1366.png': (1366, 768),
              'responsive-menu-1366.png': (1366, 768),
              'responsive-1440.png': (1440, 900),
              'responsive-menu-1440.png': (1440, 900),
              'responsive-390.png': (390, 844),
              'responsive-menu-390.png': (390, 844),
              'platform-overview-1366.png': (1366, 768),
              'platform-overview-1440.png': (1440, 900),
              'platform-overview-1536.png': (1536, 1024),
              'platform-overview-390.png': (390, 844),
              'platform-tenants-1366.png': (1366, 768),
              'platform-tenants-menu-1366.png': (1366, 768),
              'platform-tenants-collapsed-menu-1366.png': (1366, 768),
              'platform-tenants-1440.png': (1440, 900),
              'platform-tenants-1536.png': (1536, 1024),
              'platform-tenants-390.png': (390, 844),
          }
          gallery_pngs = list(Path('screenshots').glob('*.png'))
          compatibility_pngs = list(shots.glob('*.png'))
          actual_pngs = gallery_pngs + compatibility_pngs
          assert len(actual_pngs) >= 22, len(actual_pngs)
          for name, want in required.items():
              data = (shots / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == want, (name, width, height, want)
          print(
              f'UI_CONTRACT_VISUAL_EVIDENCE=PASS e2e={expected} '
              f'gallery={len(gallery_pngs)} compatibility={len(compatibility_pngs)} '
              'contracts=CoffeeLink-V1.1'
          )
          PY
          sha256sum screenshots/*.png test-results/screenshots/*.png | sort > test-results/screenshot-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coffeelink-visual-review
          path: |
            web/screenshots
            web/test-results
            web/dist
          if-no-files-found: error
          retention-days: 14
