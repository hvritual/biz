name: CoffeeLink Vue console
on:
  push:
    branches: [main, feat/coffeelink-vue-console]
    paths: ['web/**', '.github/workflows/coffeelink-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/coffeelink-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Install browser and Chinese text support
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffeelink-visual-review
          path: |
            web/test-results
            web/dist
          retention-days: 14
