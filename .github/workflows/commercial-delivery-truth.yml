name: Commercial delivery reference qualification
on:
  pull_request:
    paths:
      - 'docs/commercial-entitlements/**'
      - 'scripts/*commercial_delivery*'
      - 'contracts/generated/operation-plans.json'
      - 'web/ui-contracts.json'
      - 'web/src/features/platform/**'
      - 'web/src/features/enterprise/**'
      - '.agents/**'
      - 'Makefile'
      - 'web/AGENTS.md'
      - '.github/workflows/commercial-delivery-truth.yml'
  push:
    branches: [main, chore/ci-proof-commercial-delivery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source safety and existing governance tests
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/ci_safety_requirements.txt
          base="$BASE_REF"
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base='85c26640a23ed74d0c51cfe62deb4e1b8e5d8a85'
          fi
          python3 scripts/check_ci_source_safety.py --base-ref "$base"
          python3 -m unittest discover -s scripts -p 'test_ci_source_safety.py' -v
      - name: Plan structure and isolated negative tests
        run: |
          set -euo pipefail
          python3 docs/commercial-entitlements/tools/check_plan.py
          python3 -m unittest discover -s scripts -p 'test_commercial_delivery.py' -v
      - name: Exact candidate reference inventory
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 scripts/check_commercial_delivery.py --report "$RUNNER_TEMP/commercial-delivery.json"
      - name: Preserve reference report (not runtime certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-delivery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/commercial-delivery.json
          if-no-files-found: warn
          retention-days: 14
