name: Diagnose CE failed jobs

on:
  push:
    branches:
      - chore/local-account-delivery

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Emit sanitized failure annotations
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const owner = "hvritual";
            const repo = "biz";
            const expectedRef = "refs/heads/chore/local-account-delivery";
            const jobs = [
              { id: 103593276184, run: 34708663152 },
              { id: 103593276712, run: 34708663277 },
              { id: 103593276641, run: 34708663322 },
              { id: 103593276199, run: 34708663154 },
            ];
            const sensitive = /(token|secret|password|dsn|authorization|cookie|environment|jdbc|postgres|\b(?:insert\s+into|select\s+|update\s+|delete\s+)\b)/i;
            const failure = /^--- FAIL:/i;
            const location = /(?:_test\.go|\.spec\.ts):\d+:/;
            if (context.ref !== expectedRef) {
              core.setFailed("unexpected ref");
              return;
            }
            const sanitize = (line) => {
              const value = line.replace(/\x1b\[[0-9;]*m/g, "").trim();
              if (!value || sensitive.test(value)) return null;
              return value.length > 360 ? value.slice(0, 360) + "…" : value;
            };
            const { execFileSync } = require("node:child_process");
            const { mkdtempSync, rmSync, writeFileSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const emit = (job, source, text) => {
              const lines = text.split(/\r?\n/);
              const emitted = new Set();
              let count = 0;
              for (let index = 0; index < lines.length && count < 12; index++) {
                if (!failure.test(lines[index])) continue;
                const safe = [];
                for (let offset = 0; offset <= 5 && index + offset < lines.length; offset++) {
                  const line = sanitize(lines[index + offset]);
                  if (line && (offset === 0 || location.test(line))) safe.push(line);
                }
                const message = safe.join("\n");
                if (!message || emitted.has(message)) continue;
                emitted.add(message);
                core.error(`job ${job}: sanitized test failure marker from ${source}\n${message}`, { title: "CE sanitized diagnosis" });
                count++;
              }
              return count;
            };
            for (const job of jobs) {
              let count = 0;
              const response = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/jobs/${job.id}/logs`,
                {
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                  redirect: "follow",
                },
              );
              if (!response.ok) {
                core.error(`job ${job.id}: log download unavailable`, { title: "CE sanitized diagnosis" });
              } else {
                count = emit(job.id, "job log", await response.text());
              }
              if (count > 0) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: job.run, per_page: 100,
              });
              const directory = mkdtempSync(join(tmpdir(), "ce-sanitized-"));
              try {
                for (const artifact of artifacts) {
                  const archive = await fetch(artifact.archive_download_url, {
                    headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` },
                    redirect: "follow",
                  });
                  if (!archive.ok) continue;
                  const archivePath = join(directory, `${artifact.id}.zip`);
                  writeFileSync(archivePath, Buffer.from(await archive.arrayBuffer()), { mode: 0o600 });
                  const names = execFileSync("unzip", ["-Z1", archivePath], { encoding: "utf8", maxBuffer: 2 * 1024 * 1024 })
                    .split(/\r?\n/).filter((name) => /(?:\.jsonl|\.log|summary\.json)$/i.test(name));
                  for (const name of names) {
                    if (count >= 12) break;
                    const text = execFileSync("unzip", ["-p", archivePath, name], { encoding: "utf8", maxBuffer: 8 * 1024 * 1024 });
                    let candidate = text;
                    if (/\.jsonl$/i.test(name)) {
                      const records = text.split(/\r?\n/).flatMap((line) => {
                        try {
                          return [JSON.parse(line)];
                        } catch {
                          return [];
                        }
                      });
                      const failed = records.some((value) => /fail/i.test(String(value.Action ?? value.action ?? "")));
                      candidate = failed
                        ? records.filter((value) => /output/i.test(String(value.Action ?? value.action ?? "")))
                          .map((value) => String(value.Output ?? value.output ?? "")).join("\n")
                        : "";
                    }
                    count += emit(job.id, "artifact", candidate);
                  }
                }
              } finally {
                rmSync(directory, { recursive: true, force: true });
              }
              if (count === 0) core.error(`job ${job.id}: no safe test failure or assertion location found in log or artifacts`, { title: "CE sanitized diagnosis" });
            }
