name: domain-generate

on:
  push:
    branches:
      - agent/domain-internal-refactor

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[domain-generated]') && !contains(github.event.head_commit.message, '[skip-domain-run]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Checkout green yunka.io
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 42bc11447dc4f9aa79b21d22193712a29a0baf78
          token: ${{ secrets.YUNKA_REPO_TOKEN }}
          path: .yunka-src
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.13
          cache: false
      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          source .yunka-src/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            --output "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$install_root"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          echo "YUNKA_PROTOC_INCLUDE=$install_root/include" >> "$GITHUB_ENV"
      - name: Generate and compile domains
        shell: bash
        env:
          YUNKA_SRC: ${{ github.workspace }}/.yunka-src
        run: bash scripts/generate_internal_domains.sh
      - name: Commit exact generated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .yunka-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .yunka internal go.mod go.sum
          git commit -m "feat: generate iam site device domains [domain-generated]"
          git push origin HEAD:agent/domain-internal-refactor
