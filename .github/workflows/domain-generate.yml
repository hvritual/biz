name: domain-transfer

on:
  push:
    branches:
      - agent/domain-internal-refactor

permissions:
  contents: write

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[domain-transferred]') && !contains(github.event.head_commit.message, '[skip-domain-transfer]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and install exact generated domains
        shell: bash
        run: |
          set -euo pipefail
          for domain in iam site device; do
            cat .yunka-transfer/${domain}.tar.gz.b64.part* | base64 -d > "$RUNNER_TEMP/${domain}.tar.gz"
            expected="$(tr -d '\r\n' < .yunka-transfer/${domain}.tar.gz.sha256)"
            echo "${expected}  $RUNNER_TEMP/${domain}.tar.gz" | sha256sum -c -
          done
          rm -rf internal/iam internal/site internal/device
          mkdir -p internal
          for domain in iam site device; do
            tar -xzf "$RUNNER_TEMP/${domain}.tar.gz" -C internal
          done
          mkdir -p .yunka
          cat > .yunka/project.json <<'EOF'
          {
            "version": 1,
            "database": {
              "tablePrefix": "biz"
            }
          }
          EOF
      - name: Commit exact generated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .yunka-transfer
          git rm -f scripts/generate_internal_domains.sh 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A internal .yunka .yunka-transfer scripts/generate_internal_domains.sh
          git commit -m "feat: install verified yunka domains [domain-transferred]"
          git push origin HEAD:agent/domain-internal-refactor
