name: EC-RI-02 backend finalize

on:
  push:
    branches: [feat/enterprise-member-profile-role-binding]
    paths: ['.github/workflows/ec-ri-02-backend-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-member-profile-role-binding
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Reuse backend implementation payload
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/ec-ri-02-apply.sh"
          from pathlib import Path
          text = Path('.github/workflows/ec-ri-02-backend-implement.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(text) if line.strip() == '- name: Apply backend implementation')
          run_line = next(i for i in range(start + 1, len(text)) if text[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(text)) if text[i].strip() == '- name: Verify Access package')
          lines = text[run_line + 1:end]
          nonempty = [len(line) - len(line.lstrip()) for line in lines if line.strip()]
          indent = min(nonempty)
          for line in lines:
              print(line[indent:] if line.strip() else '')
          PY
          bash "$RUNNER_TEMP/ec-ri-02-apply.sh"
      - name: Verify Access package
        working-directory: biz
        run: go test ./internal/access/...
      - name: Commit verified backend slice
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/access
          if git diff --cached --quiet; then
            echo 'No backend diff to commit'
            exit 0
          fi
          git commit -m 'feat(access): persist member profiles and derive role bindings'
          git push origin HEAD:feat/enterprise-member-profile-role-binding
