name: EC-RI-02 backend implementation

on:
  push:
    branches: [feat/enterprise-member-profile-role-binding]
    paths: ['.github/workflows/ec-ri-02-backend-implement.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-member-profile-role-binding
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Apply backend implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/access/infrastructure/persistence/store.go')
          text = path.read_text()
          old = '''type membershipRecord struct {
          \tTenantID  string    `gorm:"column:tenant_id;primaryKey;size:64"`
          \tUserID    string    `gorm:"column:user_id;primaryKey;size:64"`
          \tStatus    string    `gorm:"column:status;size:32;not null;index"`
          \tVersion   uint64    `gorm:"column:version;not null;default:1"`
          \tCreatedAt time.Time `gorm:"column:created_at;not null"`
          \tUpdatedAt time.Time `gorm:"column:updated_at;not null"`
          }'''
          new = '''type membershipRecord struct {
          \tTenantID     string    `gorm:"column:tenant_id;primaryKey;size:64"`
          \tUserID       string    `gorm:"column:user_id;primaryKey;size:64"`
          \tStatus       string    `gorm:"column:status;size:32;not null;index"`
          \tName         string    `gorm:"column:name;size:100;not null;default:''"`
          \tPhone        string    `gorm:"column:phone;size:40;not null;default:''"`
          \tEmployeeID   string    `gorm:"column:employee_id;size:64;not null;default:''"`
          \tPosition     string    `gorm:"column:position;size:100;not null;default:''"`
          \tDepartmentID string    `gorm:"column:department_id;size:64;not null;default:'';index"`
          \tVersion      uint64    `gorm:"column:version;not null;default:1"`
          \tCreatedAt    time.Time `gorm:"column:created_at;not null"`
          \tUpdatedAt    time.Time `gorm:"column:updated_at;not null"`
          }'''
          if old not in text:
              raise SystemExit('membershipRecord marker not found')
          path.write_text(text.replace(old, new))
          PY
          cat > internal/access/infrastructure/persistence/member.go <<'GO'
          package persistence

          import (
          	"context"
          	"errors"
          	"sort"
          	"strings"
          	"time"

          	"github.com/go-sql-driver/mysql"
          	"github.com/hvritual/biz/internal/access/domain"
          	"github.com/hvritual/biz/internal/access/ports"
          	"gorm.io/gorm"
          	"gorm.io/gorm/clause"
          	"yunka.io/framework/requestscope"
          )

          type TenantMemberRepository struct { database *gorm.DB }

          func NewTenantMemberRepository(database *gorm.DB) (*TenantMemberRepository, error) {
          	if database == nil { return nil, errors.New("access persistence: tenant member database is required") }
          	return &TenantMemberRepository{database: database}, nil
          }

          func (repository *TenantMemberRepository) Invite(ctx context.Context, tenantID, proposedUserID, email string, now time.Time) (domain.Membership, error) {
          	if repository == nil || repository.database == nil { return domain.Membership{}, errors.New("access persistence: tenant member repository unavailable") }
          	tenantID, proposedUserID, email = strings.TrimSpace(tenantID), strings.TrimSpace(proposedUserID), strings.TrimSpace(email)
          	if tenantID == "" || proposedUserID == "" || email == "" { return domain.Membership{}, errors.New("access persistence: invite requires tenant, user and email") }
          	db := repository.database.WithContext(ctx)
          	var user userRecord
          	err := db.Where("email = ?", email).First(&user).Error
          	if err != nil {
          		if !errors.Is(err, gorm.ErrRecordNotFound) { return domain.Membership{}, err }
          		user = userRecord{ID: proposedUserID, Email: email, Status: "active", CreatedAt: now}
          		if createErr := db.Create(&user).Error; createErr != nil {
          			var mysqlErr *mysql.MySQLError
          			if !errors.As(createErr, &mysqlErr) || mysqlErr.Number != 1062 { return domain.Membership{}, createErr }
          			user = userRecord{}
          			if lookupErr := db.Clauses(clause.Locking{Strength: "UPDATE"}).Where("email = ?", email).First(&user).Error; lookupErr != nil { return domain.Membership{}, lookupErr }
          		}
          	}
          	var existing membershipRecord
          	if err := db.Where("tenant_id = ? AND user_id = ?", tenantID, user.ID).First(&existing).Error; err == nil { return domain.Membership{}, ports.ErrTenantMemberExists } else if !errors.Is(err, gorm.ErrRecordNotFound) { return domain.Membership{}, err }
          	member := domain.NewInvitedMembership(tenantID, user.ID, user.Email, now)
          	row := membershipRecord{TenantID: member.TenantID, UserID: member.UserID, Status: member.Status, Version: member.Version, CreatedAt: member.CreatedAt, UpdatedAt: member.UpdatedAt}
          	if err := db.Create(&row).Error; err != nil { return domain.Membership{}, err }
          	return member, nil
          }

          func (repository *TenantMemberRepository) Bootstrap(ctx context.Context, tenantID, userID, email string, now time.Time) (domain.Membership, error) {
          	if repository == nil || repository.database == nil { return domain.Membership{}, errors.New("access persistence: tenant member repository unavailable") }
          	tenantID, userID, email = strings.TrimSpace(tenantID), strings.TrimSpace(userID), strings.TrimSpace(email)
          	if tenantID == "" || userID == "" || email == "" { return domain.Membership{}, errors.New("access persistence: bootstrap requires tenant, user and email") }
          	db := repository.database.WithContext(ctx)
          	var user userRecord
          	if err := db.Where("id = ?", userID).First(&user).Error; err != nil {
          		if !errors.Is(err, gorm.ErrRecordNotFound) { return domain.Membership{}, err }
          		user = userRecord{ID: userID, Email: email, Status: "active", CreatedAt: now}
          		if err := db.Create(&user).Error; err != nil { return domain.Membership{}, err }
          	} else if user.Email != email { return domain.Membership{}, ports.ErrTenantMemberConflict }
          	var existing membershipRecord
          	if err := db.Where("tenant_id = ? AND user_id = ?", tenantID, userID).First(&existing).Error; err == nil {
          		if existing.Status != domain.TenantMemberStatusActive { return domain.Membership{}, ports.ErrTenantMemberConflict }
          		return repository.memberFromRecord(ctx, existing)
          	} else if !errors.Is(err, gorm.ErrRecordNotFound) { return domain.Membership{}, err }
          	member := domain.NewActiveMembership(tenantID, userID, email, now)
          	row := membershipRecord{TenantID: member.TenantID, UserID: member.UserID, Status: member.Status, Version: member.Version, CreatedAt: member.CreatedAt, UpdatedAt: member.UpdatedAt}
          	if err := db.Create(&row).Error; err != nil { return domain.Membership{}, err }
          	return member, nil
          }

          func (repository *TenantMemberRepository) Get(ctx context.Context, tenantID, userID string) (domain.Membership, error) {
          	if repository == nil || repository.database == nil { return domain.Membership{}, errors.New("access persistence: tenant member repository unavailable") }
          	var row membershipRecord
          	if err := repository.database.WithContext(ctx).Where("tenant_id = ? AND user_id = ?", tenantID, userID).First(&row).Error; err != nil {
          		if errors.Is(err, gorm.ErrRecordNotFound) { return domain.Membership{}, ports.ErrTenantMemberNotFound }
          		return domain.Membership{}, err
          	}
          	return repository.memberFromRecord(ctx, row)
          }

          func (repository *TenantMemberRepository) List(ctx context.Context, tenantID string) ([]domain.Membership, error) {
          	if repository == nil || repository.database == nil { return nil, errors.New("access persistence: tenant member repository unavailable") }
          	type row struct { TenantID, UserID, Email, Status, Name, Phone, EmployeeID, Position, DepartmentID string; Version uint64; CreatedAt, UpdatedAt time.Time }
          	var rows []row
          	if err := repository.database.WithContext(ctx).Table("biz_memberships m").
          		Select("m.tenant_id, m.user_id, u.email, m.status, m.name, m.phone, m.employee_id, m.position, m.department_id, m.version, m.created_at, m.updated_at").
          		Joins("JOIN biz_users u ON u.id = m.user_id").Where("m.tenant_id = ?", tenantID).
          		Order("m.created_at ASC, m.user_id ASC").Scan(&rows).Error; err != nil { return nil, err }
          	members := make([]domain.Membership, 0, len(rows))
          	for _, value := range rows {
          		members = append(members, domain.Membership{TenantID: value.TenantID, UserID: value.UserID, Email: value.Email, Status: value.Status, Name: value.Name, Phone: value.Phone, EmployeeID: value.EmployeeID, Position: value.Position, DepartmentID: value.DepartmentID, Version: value.Version, DerivedDataScope: domain.DataScopeNone, CreatedAt: value.CreatedAt, UpdatedAt: value.UpdatedAt})
          	}
          	if err := repository.enrichMemberAccess(ctx, members); err != nil { return nil, err }
          	return members, nil
          }

          func (repository *TenantMemberRepository) Update(ctx context.Context, member *domain.Membership, expectedVersion uint64) error {
          	if repository == nil || repository.database == nil || member == nil || expectedVersion == 0 { return errors.New("access persistence: member update requires repository, value and version") }
          	result := repository.database.WithContext(ctx).Model(&membershipRecord{}).
          		Where("tenant_id = ? AND user_id = ? AND version = ?", member.TenantID, member.UserID, expectedVersion).
          		Updates(map[string]any{"status": member.Status, "name": member.Name, "phone": member.Phone, "employee_id": member.EmployeeID, "position": member.Position, "department_id": member.DepartmentID, "updated_at": member.UpdatedAt, "version": gorm.Expr("version + 1")})
          	if result.Error != nil { return result.Error }
          	if result.RowsAffected != 1 {
          		var count int64
          		if err := repository.database.WithContext(ctx).Model(&membershipRecord{}).Where("tenant_id = ? AND user_id = ?", member.TenantID, member.UserID).Count(&count).Error; err != nil { return err }
          		if count == 0 { return ports.ErrTenantMemberNotFound }
          		return ports.ErrTenantMemberConflict
          	}
          	member.Version = expectedVersion + 1
          	return nil
          }

          func (repository *TenantMemberRepository) memberFromRecord(ctx context.Context, row membershipRecord) (domain.Membership, error) {
          	var user userRecord
          	if err := repository.database.WithContext(ctx).Where("id = ?", row.UserID).First(&user).Error; err != nil { return domain.Membership{}, err }
          	members := []domain.Membership{{TenantID: row.TenantID, UserID: row.UserID, Email: user.Email, Status: row.Status, Name: row.Name, Phone: row.Phone, EmployeeID: row.EmployeeID, Position: row.Position, DepartmentID: row.DepartmentID, Version: row.Version, DerivedDataScope: domain.DataScopeNone, CreatedAt: row.CreatedAt, UpdatedAt: row.UpdatedAt}}
          	if err := repository.enrichMemberAccess(ctx, members); err != nil { return domain.Membership{}, err }
          	return members[0], nil
          }

          func (repository *TenantMemberRepository) enrichMemberAccess(ctx context.Context, members []domain.Membership) error {
          	if len(members) == 0 { return nil }
          	tenantID := members[0].TenantID
          	userIDs := make([]string, 0, len(members)); index := make(map[string]int, len(members))
          	for i := range members { userIDs = append(userIDs, members[i].UserID); index[members[i].UserID] = i; members[i].Roles = nil; members[i].DerivedDataScope = domain.DataScopeNone }
          	type accessRow struct { UserID, RoleID, RoleName, RoleStatus, Scope string }
          	var rows []accessRow
          	if err := repository.database.WithContext(ctx).Table("biz_member_roles mr").
          		Select("mr.user_id, r.id AS role_id, r.name AS role_name, r.status AS role_status, COALESCE(pg.scope, '') AS scope").
          		Joins("JOIN biz_roles r ON r.id = mr.role_id AND r.tenant_id = mr.tenant_id").
          		Joins("LEFT JOIN biz_permission_grants pg ON pg.role_id = r.id AND pg.tenant_id = r.tenant_id").
          		Where("mr.tenant_id = ? AND mr.user_id IN ?", tenantID, userIDs).
          		Order("mr.user_id ASC, r.name ASC, r.id ASC").Scan(&rows).Error; err != nil { return err }
          	seen := map[string]map[string]bool{}
          	for _, row := range rows {
          		i, ok := index[row.UserID]; if !ok { continue }
          		if seen[row.UserID] == nil { seen[row.UserID] = map[string]bool{} }
          		if !seen[row.UserID][row.RoleID] { members[i].Roles = append(members[i].Roles, domain.MemberRoleSummary{ID: row.RoleID, Name: row.RoleName, Status: row.RoleStatus}); seen[row.UserID][row.RoleID] = true }
          		if row.RoleStatus == domain.TenantRoleStatusActive && scopeRank(domain.DataScope(row.Scope)) > scopeRank(members[i].DerivedDataScope) { members[i].DerivedDataScope = domain.DataScope(row.Scope) }
          	}
          	for i := range members { sort.Slice(members[i].Roles, func(a, b int) bool { if members[i].Roles[a].Name == members[i].Roles[b].Name { return members[i].Roles[a].ID < members[i].Roles[b].ID }; return members[i].Roles[a].Name < members[i].Roles[b].Name }) }
          	return nil
          }

          func scopeRank(scope domain.DataScope) int { switch scope { case domain.DataScopeSelf: return 1; case domain.DataScopeSites: return 2; case domain.DataScopeAll: return 3; default: return 0 } }

          func NewTenantMemberRepositoryFactory(database *gorm.DB) (requestscope.RepositoryFactory[ports.TenantMemberRepositories], error) {
          	if database == nil { return nil, errors.New("access persistence: database is required") }
          	return requestscope.GORMRepositories(func(_ context.Context, transaction *gorm.DB) (ports.TenantMemberRepositories, error) {
          		member, err := NewTenantMemberRepository(transaction); if err != nil { return ports.TenantMemberRepositories{}, err }
          		return ports.TenantMemberRepositories{Member: member}, nil
          	}), nil
          }
          GO
          cat > internal/access/application/tenant_member_lifecycle.go <<'GO'
          package application

          import (
          	"context"
          	"crypto/rand"
          	"encoding/hex"
          	"errors"
          	"strings"
          	"time"

          	accessv1 "github.com/hvritual/biz/contracts/gen/access/v1"
          	"github.com/hvritual/biz/internal/access/domain"
          	"github.com/hvritual/biz/internal/access/ports"
          	"yunka.io/framework/core/identity"
          	"yunka.io/framework/requestscope"
          )

          var ( ErrInvalidTenantMemberRequest = errors.New("access: invalid tenant member request"); ErrTenantContextRequired = errors.New("access: trusted tenant context is required") )

          type TenantMemberLifecycleService struct { repositories requestscope.RepositoryFactory[ports.TenantMemberRepositories]; capabilities TenantMemberLifecycleCapabilities }

          func NewTenantMemberLifecycleService(repositories requestscope.RepositoryFactory[ports.TenantMemberRepositories], capabilities TenantMemberLifecycleCapabilities) (*TenantMemberLifecycleService, error) {
          	if repositories == nil { return nil, errors.New("access: tenant member repository factory is required") }
          	if capabilities == nil || capabilities.AccessTenantRolePermission() == nil { return nil, errors.New("access: tenant member role capability is required") }
          	return &TenantMemberLifecycleService{repositories: repositories, capabilities: capabilities}, nil
          }

          func (service *TenantMemberLifecycleService) InviteTenantMember(ctx context.Context, request *accessv1.InviteTenantMemberRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetEmail()) == "" { return nil, ErrInvalidTenantMemberRequest }
          	tenantID, err := trustedTenantID(ctx); if err != nil { return nil, err }
          	email := strings.TrimSpace(strings.ToLower(request.GetEmail()))
          	member, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantMemberRepositories]) (domain.Membership, error) { return scope.Repositories().Member.Invite(scope.Context(), tenantID, newMemberUserID(), email, time.Now().UTC()) })
          	if err != nil { return nil, err }; return tenantMemberDTO(member), nil
          }

          func (service *TenantMemberLifecycleService) BootstrapTenantOwnerMember(ctx context.Context, request *accessv1.BootstrapTenantOwnerMemberRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetTenantId()) == "" || strings.TrimSpace(request.GetUserId()) == "" || strings.TrimSpace(request.GetEmail()) == "" { return nil, ErrInvalidTenantMemberRequest }
          	member, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantMemberRepositories]) (domain.Membership, error) { return scope.Repositories().Member.Bootstrap(scope.Context(), strings.TrimSpace(request.GetTenantId()), strings.TrimSpace(request.GetUserId()), strings.TrimSpace(strings.ToLower(request.GetEmail())), time.Now().UTC()) })
          	if err != nil { return nil, err }; return tenantMemberDTO(member), nil
          }

          func (service *TenantMemberLifecycleService) GetTenantMember(ctx context.Context, request *accessv1.GetTenantMemberRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetUserId()) == "" { return nil, ErrInvalidTenantMemberRequest }
          	tenantID, err := trustedTenantID(ctx); if err != nil { return nil, err }
          	member, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantMemberRepositories]) (domain.Membership, error) { return scope.Repositories().Member.Get(scope.Context(), tenantID, strings.TrimSpace(request.GetUserId())) })
          	if err != nil { return nil, err }; return tenantMemberDTO(member), nil
          }

          func (service *TenantMemberLifecycleService) ListTenantMembers(ctx context.Context, _ *accessv1.ListTenantMembersRequest) (*accessv1.ListTenantMembersResponse, error) {
          	tenantID, err := trustedTenantID(ctx); if err != nil { return nil, err }
          	members, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantMemberRepositories]) ([]domain.Membership, error) { return scope.Repositories().Member.List(scope.Context(), tenantID) })
          	if err != nil { return nil, err }
          	response := &accessv1.ListTenantMembersResponse{Members: make([]*accessv1.TenantMemberDTO, 0, len(members))}; for _, member := range members { response.Members = append(response.Members, tenantMemberDTO(member)) }; return response, nil
          }

          func (service *TenantMemberLifecycleService) UpdateTenantMemberProfile(ctx context.Context, request *accessv1.UpdateTenantMemberProfileRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetUserId()) == "" || request.GetVersion() == 0 { return nil, ErrInvalidTenantMemberRequest }
          	return service.mutate(ctx, strings.TrimSpace(request.GetUserId()), request.GetVersion(), nil, func(member *domain.Membership) error { return member.UpdateProfile(request.GetName(), request.GetPhone(), request.GetEmployeeId(), request.GetPosition(), request.GetDepartmentId(), time.Now().UTC()) })
          }

          func (service *TenantMemberLifecycleService) ActivateTenantMember(ctx context.Context, request *accessv1.ActivateTenantMemberRequest) (*accessv1.TenantMemberDTO, error) { if request == nil || strings.TrimSpace(request.GetUserId()) == "" || request.GetVersion() == 0 { return nil, ErrInvalidTenantMemberRequest }; return service.mutate(ctx, strings.TrimSpace(request.GetUserId()), request.GetVersion(), nil, func(member *domain.Membership) error { return member.Activate(time.Now().UTC()) }) }

          func (service *TenantMemberLifecycleService) SuspendTenantMember(ctx context.Context, request *accessv1.SuspendTenantMemberRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetUserId()) == "" || request.GetVersion() == 0 { return nil, ErrInvalidTenantMemberRequest }; userID := strings.TrimSpace(request.GetUserId())
          	return service.mutate(ctx, userID, request.GetVersion(), func(callCtx context.Context) error { _, err := service.capabilities.AccessTenantRolePermission().AssertTenantMemberDeactivationAllowed(callCtx, &accessv1.AssertTenantMemberDeactivationAllowedRequest{UserId: userID}); return err }, func(member *domain.Membership) error { return member.Suspend(time.Now().UTC()) })
          }

          func (service *TenantMemberLifecycleService) RemoveTenantMember(ctx context.Context, request *accessv1.RemoveTenantMemberRequest) (*accessv1.TenantMemberDTO, error) {
          	if request == nil || strings.TrimSpace(request.GetUserId()) == "" || request.GetVersion() == 0 { return nil, ErrInvalidTenantMemberRequest }; userID := strings.TrimSpace(request.GetUserId())
          	return service.mutate(ctx, userID, request.GetVersion(), func(callCtx context.Context) error { _, err := service.capabilities.AccessTenantRolePermission().AssertTenantMemberDeactivationAllowed(callCtx, &accessv1.AssertTenantMemberDeactivationAllowedRequest{UserId: userID}); return err }, func(member *domain.Membership) error { return member.Remove(time.Now().UTC()) })
          }

          func (service *TenantMemberLifecycleService) mutate(ctx context.Context, userID string, expectedVersion uint64, beforeApply func(context.Context) error, apply func(*domain.Membership) error) (*accessv1.TenantMemberDTO, error) {
          	tenantID, err := trustedTenantID(ctx); if err != nil { return nil, err }
          	member, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantMemberRepositories]) (domain.Membership, error) {
          		current, err := scope.Repositories().Member.Get(scope.Context(), tenantID, userID); if err != nil { return domain.Membership{}, err }
          		if current.Version != expectedVersion { return domain.Membership{}, ports.ErrTenantMemberConflict }
          		if beforeApply != nil { if err := beforeApply(scope.Context()); err != nil { return domain.Membership{}, err } }
          		if err := apply(&current); err != nil { return domain.Membership{}, err }
          		if err := scope.Repositories().Member.Update(scope.Context(), &current, expectedVersion); err != nil { return domain.Membership{}, err }
          		return current, nil
          	})
          	if err != nil { return nil, err }; return tenantMemberDTO(member), nil
          }

          func trustedTenantID(ctx context.Context) (string, error) { principal, ok := identity.FromContext(ctx); if !ok || !principal.Authenticated || strings.TrimSpace(principal.TenantID) == "" { return "", ErrTenantContextRequired }; return strings.TrimSpace(principal.TenantID), nil }

          func tenantMemberDTO(member domain.Membership) *accessv1.TenantMemberDTO {
          	roles := make([]*accessv1.TenantMemberRoleDTO, 0, len(member.Roles)); for _, role := range member.Roles { roles = append(roles, &accessv1.TenantMemberRoleDTO{RoleId: role.ID, RoleName: role.Name, RoleStatus: role.Status}) }
          	return &accessv1.TenantMemberDTO{UserId: member.UserID, Email: member.Email, Status: tenantMemberStatusDTO(member.Status), Version: member.Version, Name: member.Name, Phone: member.Phone, EmployeeId: member.EmployeeID, Position: member.Position, DepartmentId: member.DepartmentID, Roles: roles, DerivedDataScope: string(member.DerivedDataScope)}
          }

          func tenantMemberStatusDTO(status string) accessv1.TenantMemberStatus { switch status { case domain.TenantMemberStatusInvited: return accessv1.TenantMemberStatus_TENANT_MEMBER_STATUS_INVITED; case domain.TenantMemberStatusActive: return accessv1.TenantMemberStatus_TENANT_MEMBER_STATUS_ACTIVE; case domain.TenantMemberStatusSuspended: return accessv1.TenantMemberStatus_TENANT_MEMBER_STATUS_SUSPENDED; case domain.TenantMemberStatusRemoved: return accessv1.TenantMemberStatus_TENANT_MEMBER_STATUS_REMOVED; default: return accessv1.TenantMemberStatus_TENANT_MEMBER_STATUS_UNSPECIFIED } }

          func newMemberUserID() string { var value [16]byte; if _, err := rand.Read(value[:]); err != nil { panic(err) }; return hex.EncodeToString(value[:]) }
          GO
          cat > internal/access/infrastructure/persistence/migrations/0003_ec_ri_02_member_profile.sql <<'SQL'
          ALTER TABLE biz_memberships
            ADD COLUMN name VARCHAR(100) NOT NULL DEFAULT '',
            ADD COLUMN phone VARCHAR(40) NOT NULL DEFAULT '',
            ADD COLUMN employee_id VARCHAR(64) NOT NULL DEFAULT '',
            ADD COLUMN position VARCHAR(100) NOT NULL DEFAULT '',
            ADD COLUMN department_id VARCHAR(64) NOT NULL DEFAULT '',
            ADD INDEX idx_biz_memberships_department (tenant_id, department_id);
          SQL
          gofmt -w internal/access/domain/model.go internal/access/infrastructure/persistence/store.go internal/access/infrastructure/persistence/member.go internal/access/application/tenant_member_lifecycle.go
      - name: Verify Access package
        run: go test ./internal/access/...
      - name: Commit backend slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/access
          git commit -m "feat(access): persist member profiles and derive role bindings"
          git push origin HEAD:feat/enterprise-member-profile-role-binding
