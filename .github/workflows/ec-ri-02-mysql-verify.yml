name: EC-RI-02 MySQL verification

on:
  push:
    branches: [feat/enterprise-member-profile-role-binding]
    paths:
      - '.github/workflows/ec-ri-02-mysql-verify.yml'
      - 'contracts/**'
      - 'internal/access/**'
      - 'internal/bizruntime/**'
      - 'integration/ec_ri_02_member_profile_mysql_test.go'

permissions:
  contents: read

env:
  YUNKA_TEST_RESET_FIXTURES: "1"

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_ec_ri_02?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_ec_ri_02
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout locked Yunka source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run EC-RI-02 real MySQL evidence
        run: go -C biz test -count=1 -tags=integration ./integration -run '^TestB123ECIR02'
