name: EC-RI-02 web verification

on:
  push:
    branches: [feat/enterprise-member-profile-role-binding]
    paths:
      - '.github/workflows/ec-ri-02-web-verify.yml'
      - 'web/src/services/runtime/api.ts'
      - 'web/src/services/enterprise/memberRuntime.ts'
      - 'web/src/views/enterprise/**'
      - 'web/src/components/enterprise/**'
      - 'web/e2e/enterprise-members-real.spec.ts'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Static web checks
        run: npm run check
        working-directory: web
      - name: Install Chromium and CJK fonts
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: API-mode member E2E and visual evidence
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          VITE_DATA_MODE=api npm run build
          ENTERPRISE_MEMBER_REAL_E2E=1 npx playwright test e2e/enterprise-members-real.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          import struct
          required = {
              'enterprise-members-real-1366.png': (1366, 768),
              'enterprise-members-real-1440.png': (1440, 900),
              'enterprise-members-real-1536.png': (1536, 1024),
              'enterprise-members-real-390.png': (390, 844),
          }
          root = Path('screenshots')
          for name, want in required.items():
              data = (root / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == want, (name, width, height, want)
          print('EC_RI_02_WEB_VISUALS=PASS')
          PY
      - name: Upload EC-RI-02 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec-ri-02-member-visual-review
          path: |
            web/screenshots
            web/test-results
            web/dist
          if-no-files-found: warn
          retention-days: 7
