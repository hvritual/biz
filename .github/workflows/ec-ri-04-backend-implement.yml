name: ec-ri-04-backend-implement

on:
  push:
    branches:
      - feat/enterprise-organization-department-real-integration
    paths:
      - .github/workflows/ec-ri-04-backend-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-organization-department-real-integration
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Apply runtime wiring
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/access/domain/model.go',
              'var OwnerRequiredPermissions = []string{\n\t"tenant.member.manage",\n\t"tenant.member.read",\n\t"tenant.role.manage",\n\t"tenant.role.read",\n}',
              'var OwnerRequiredPermissions = []string{\n\t"tenant.member.manage",\n\t"tenant.member.read",\n\t"tenant.organization.manage",\n\t"tenant.organization.read",\n\t"tenant.role.manage",\n\t"tenant.role.read",\n}')

          replace('internal/access/application/tenant_member_lifecycle.go',
              'if capabilities == nil || capabilities.AccessTenantRolePermission() == nil {\n\t\treturn nil, errors.New("access: tenant member role capability is required")\n\t}',
              'if capabilities == nil || capabilities.AccessTenantRolePermission() == nil || capabilities.AccessTenantDepartmentManagement() == nil {\n\t\treturn nil, errors.New("access: tenant member role and department capabilities are required")\n\t}')
          replace('internal/access/application/tenant_member_lifecycle.go',
              'return service.mutate(ctx, strings.TrimSpace(request.GetUserId()), request.GetVersion(), nil, func(member *domain.Membership) error {\n\t\treturn member.UpdateProfile(request.GetName(), request.GetPhone(), request.GetEmployeeId(), request.GetPosition(), request.GetDepartmentId(), time.Now().UTC())\n\t})',
              'return service.mutate(ctx, strings.TrimSpace(request.GetUserId()), request.GetVersion(), func(callCtx context.Context) error {\n\t\t_, err := service.capabilities.AccessTenantDepartmentManagement().AssertTenantMemberDepartmentAssignmentAllowed(callCtx, &accessv1.AssertTenantMemberDepartmentAssignmentAllowedRequest{DepartmentId: strings.TrimSpace(request.GetDepartmentId())})\n\t\treturn err\n\t}, func(member *domain.Membership) error {\n\t\treturn member.UpdateProfile(request.GetName(), request.GetPhone(), request.GetEmployeeId(), request.GetPosition(), request.GetDepartmentId(), time.Now().UTC())\n\t})')

          replace('internal/bizruntime/access_skeleton.go',
              'func (factory applicationFactories) BuildAccessTenantMemberLifecycle(dependencies generatedassembly.AccessTenantMemberLifecycleDependencies) (accessapp.TenantMemberLifecycleApplication, error) {\n\tif dependencies.AccessTenantRolePermission == nil {\n\t\treturn nil, errors.New("biz access pressure: tenant member lifecycle role dependency is required")\n\t}\n\tinner, err := accessapp.NewTenantMemberLifecycleService(factory.memberRepositories, tenantMemberLifecycleCapabilities{\n\t\troles: dependencies.AccessTenantRolePermission,\n\t})',
              'func (factory applicationFactories) BuildAccessTenantDepartmentManagement(generatedassembly.AccessTenantDepartmentManagementDependencies) (accessapp.TenantDepartmentManagementApplication, error) {\n\tinner, err := accessapp.NewTenantDepartmentManagementService(factory.departmentRepositories)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn checkedDepartments{inner: inner}, nil\n}\n\nfunc (factory applicationFactories) BuildAccessTenantMemberLifecycle(dependencies generatedassembly.AccessTenantMemberLifecycleDependencies) (accessapp.TenantMemberLifecycleApplication, error) {\n\tif dependencies.AccessTenantRolePermission == nil || dependencies.AccessTenantDepartmentManagement == nil {\n\t\treturn nil, errors.New("biz access pressure: tenant member lifecycle role and department dependencies are required")\n\t}\n\tinner, err := accessapp.NewTenantMemberLifecycleService(factory.memberRepositories, tenantMemberLifecycleCapabilities{\n\t\tdepartments: dependencies.AccessTenantDepartmentManagement,\n\t\troles:       dependencies.AccessTenantRolePermission,\n\t})')
          replace('internal/bizruntime/access_skeleton.go',
              'type tenantMemberLifecycleCapabilities struct {\n\troles accessapp.TenantMemberLifecycleToAccessTenantRolePermissionChildCapability\n}\n\nfunc (capabilities tenantMemberLifecycleCapabilities) AccessTenantRolePermission()',
              'type tenantMemberLifecycleCapabilities struct {\n\tdepartments accessapp.TenantMemberLifecycleToAccessTenantDepartmentManagementChildCapability\n\troles       accessapp.TenantMemberLifecycleToAccessTenantRolePermissionChildCapability\n}\n\nfunc (capabilities tenantMemberLifecycleCapabilities) AccessTenantDepartmentManagement() accessapp.TenantMemberLifecycleToAccessTenantDepartmentManagementChildCapability {\n\treturn capabilities.departments\n}\n\nfunc (capabilities tenantMemberLifecycleCapabilities) AccessTenantRolePermission()')

          replace('internal/bizruntime/runtime.go',
              '\tmemberRepositories          requestscope.RepositoryFactory[accessports.TenantMemberRepositories]\n\troleRepositories',
              '\tmemberRepositories          requestscope.RepositoryFactory[accessports.TenantMemberRepositories]\n\tdepartmentRepositories      requestscope.RepositoryFactory[accessports.TenantDepartmentRepositories]\n\troleRepositories')
          replace('internal/bizruntime/runtime.go',
              '\t\tif err := accessStore.AutoMigrate(ctx); err != nil {\n\t\t\treturn generatedassembly.RuntimeBindings{}, fmt.Errorf("biz runtime: access migrate: %w", err)\n\t\t}',
              '\t\tif err := accessStore.AutoMigrate(ctx); err != nil {\n\t\t\treturn generatedassembly.RuntimeBindings{}, fmt.Errorf("biz runtime: access migrate: %w", err)\n\t\t}\n\t\tif err := accesspersistence.AutoMigrateTenantDepartment(ctx, accessDatabase); err != nil {\n\t\t\treturn generatedassembly.RuntimeBindings{}, fmt.Errorf("biz runtime: tenant department migrate: %w", err)\n\t\t}')
          replace('internal/bizruntime/runtime.go',
              '\tmemberRepositories, err := accesspersistence.NewTenantMemberRepositoryFactory(accessDatabase)\n\tif err != nil {\n\t\treturn generatedassembly.RuntimeBindings{}, err\n\t}\n\troleRepositories, err := accesspersistence.NewTenantRoleRepositoryFactory(accessDatabase)',
              '\tmemberRepositories, err := accesspersistence.NewTenantMemberRepositoryFactory(accessDatabase)\n\tif err != nil {\n\t\treturn generatedassembly.RuntimeBindings{}, err\n\t}\n\tdepartmentRepositories, err := accesspersistence.NewTenantDepartmentRepositoryFactory(accessDatabase)\n\tif err != nil {\n\t\treturn generatedassembly.RuntimeBindings{}, err\n\t}\n\troleRepositories, err := accesspersistence.NewTenantRoleRepositoryFactory(accessDatabase)')
          replace('internal/bizruntime/runtime.go',
              '\t\t\tmemberRepositories:          memberRepositories,\n\t\t\troleRepositories:',
              '\t\t\tmemberRepositories:          memberRepositories,\n\t\t\tdepartmentRepositories:      departmentRepositories,\n\t\t\troleRepositories:')
          PY
          gofmt -w internal/access/domain/model.go internal/access/application/tenant_member_lifecycle.go internal/bizruntime/access_skeleton.go internal/bizruntime/runtime.go internal/access/domain/department.go internal/access/ports/department.go internal/access/infrastructure/persistence/department.go internal/access/application/tenant_department_management.go internal/bizruntime/department_entitlements.go
          git diff --check
      - name: Run Access and runtime compile tests
        working-directory: biz
        shell: bash
        env:
          GOWORK: ${{ github.workspace }}/biz/go.work
        run: |
          set -euo pipefail
          go test ./internal/access/... ./internal/bizruntime/...
      - name: Commit validated backend wiring
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(access): wire tenant department runtime"
          git push origin HEAD:feat/enterprise-organization-department-real-integration
