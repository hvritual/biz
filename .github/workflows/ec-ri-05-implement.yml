                      <label class="field"><span>联系人</span><input v-model="draft.contactName" class="input" maxlength="100" /></label>
                      <label class="field"><span>联系电话</span><input v-model="draft.phone" class="input" maxlength="40" /></label>
                      <label class="field"><span>企业邮箱</span><input v-model="draft.email" class="input" type="email" maxlength="320" /></label>
                      <label class="field"><span>联系地址</span><input v-model="draft.address" class="input" maxlength="500" /></label>
