name: ec-ri-05-implement

on:
  push:
    branches:
      - feat/enterprise-tenant-profile-real-integration
    paths:
      - .github/workflows/ec-ri-05-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout EC-RI-05 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-tenant-profile-real-integration
          path: biz
          fetch-depth: 0

      - name: Load locked Yunka source
        id: consumer_source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout locked Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.consumer_source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked Go
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.toolchain.outputs.protoc_release }}/protoc-${{ steps.toolchain.outputs.protoc_release }}-linux-x86_64.zip" \
            -o "$archive"
          echo "${{ steps.toolchain.outputs.protoc_sha }}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Apply EC-RI-05 source implementation
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          python3 - <<'PY'
          from pathlib import Path
          import json

          def write(path: str, content: str):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          write('contracts/proto/access/v1/tenant_profile.proto', r'''syntax = "proto3";

          package access.v1;

          import "google/api/annotations.proto";
          import "yunka/dsl/v1/options.proto";

          option go_package = "github.com/hvritual/biz/contracts/gen/access/v1;accessv1";
          option (yunka.dsl.v1.domain) = {
            name: "access"
            version: "v1"
          };

          message TenantProfileDTO {
            option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
            string tenant_id = 1;
            string name = 2;
            string short_name = 3;
            string industry = 4;
            string company_size = 5;
            string timezone = 6;
            string contact_name = 7;
            string phone = 8;
            string email = 9;
            string address = 10;
            string description = 11;
            string logo_asset_ref = 12;
            uint64 version = 13;
          }

          message GetTenantProfileRequest {}

          message UpdateTenantProfileRequest {
            string name = 1;
            string short_name = 2;
            string industry = 3;
            string company_size = 4;
            string timezone = 5;
            string contact_name = 6;
            string phone = 7;
            string email = 8;
            string address = 9;
            string description = 10;
            string logo_asset_ref = 11;
            uint64 version = 12;
          }

          service TenantProfileManagementApplication {
            option (yunka.dsl.v1.application) = { name: "tenant_profile_management" };

            rpc GetTenantProfile(GetTenantProfileRequest) returns (TenantProfileDTO) {
              option (google.api.http) = { get: "/v1/tenant/profile" };
              option (yunka.dsl.v1.operation) = {
                id: "tenant.profile.get"
                use_case: "get_tenant_profile"
                permissions: "tenant.organization.read"
                permission_mode: PERMISSION_ALL
                tenant_required: true
                authentication: AUTHENTICATION_API_KEY
                authentication: AUTHENTICATION_WEB_SESSION
                execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
              };
            }

            rpc UpdateTenantProfile(UpdateTenantProfileRequest) returns (TenantProfileDTO) {
              option (google.api.http) = { patch: "/v1/tenant/profile" body: "*" };
              option (yunka.dsl.v1.operation) = {
                id: "tenant.profile.update"
                use_case: "update_tenant_profile"
                permissions: "tenant.organization.manage"
                permission_mode: PERMISSION_ALL
                tenant_required: true
                authentication: AUTHENTICATION_API_KEY
                authentication: AUTHENTICATION_WEB_SESSION
                execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
              };
            }
          }
          '''.replace('          ', ''))

          write('internal/access/domain/tenant_profile.go', r'''package domain

          import (
              "errors"
              "net/mail"
              "strings"
              "time"
          )

          var ErrInvalidTenantProfile = errors.New("access: invalid tenant profile")

          type TenantProfile struct {
              TenantID     string
              Name         string
              ShortName    string
              Industry     string
              CompanySize  string
              Timezone     string
              ContactName  string
              Phone        string
              Email        string
              Address      string
              Description  string
              LogoAssetRef string
              Version      uint64
              CreatedAt    time.Time
              UpdatedAt    time.Time
          }

          func (profile *TenantProfile) Update(name, shortName, industry, companySize, timezone, contactName, phone, email, address, description, logoAssetRef string, now time.Time) error {
              if profile == nil {
                  return ErrInvalidTenantProfile
              }
              name = strings.TrimSpace(name)
              shortName = strings.TrimSpace(shortName)
              industry = strings.TrimSpace(industry)
              companySize = strings.TrimSpace(companySize)
              timezone = strings.TrimSpace(timezone)
              contactName = strings.TrimSpace(contactName)
              phone = strings.TrimSpace(phone)
              email = strings.ToLower(strings.TrimSpace(email))
              address = strings.TrimSpace(address)
              description = strings.TrimSpace(description)
              logoAssetRef = strings.TrimSpace(logoAssetRef)
              if name == "" || shortName == "" || timezone == "" {
                  return ErrInvalidTenantProfile
              }
              if len([]rune(name)) > 200 || len([]rune(shortName)) > 80 || len([]rune(industry)) > 120 || len([]rune(companySize)) > 64 || len([]rune(timezone)) > 64 || len([]rune(contactName)) > 100 || len([]rune(phone)) > 40 || len([]rune(email)) > 320 || len([]rune(address)) > 500 || len([]rune(description)) > 1000 || len([]rune(logoAssetRef)) > 512 {
                  return ErrInvalidTenantProfile
              }
              if email != "" {
                  parsed, err := mail.ParseAddress(email)
                  if err != nil || !strings.EqualFold(parsed.Address, email) {
                      return ErrInvalidTenantProfile
                  }
              }
              if strings.HasPrefix(strings.ToLower(logoAssetRef), "data:") {
                  return ErrInvalidTenantProfile
              }
              profile.Name = name
              profile.ShortName = shortName
              profile.Industry = industry
              profile.CompanySize = companySize
              profile.Timezone = timezone
              profile.ContactName = contactName
              profile.Phone = phone
              profile.Email = email
              profile.Address = address
              profile.Description = description
              profile.LogoAssetRef = logoAssetRef
              profile.UpdatedAt = now
              return nil
          }
          '''.replace('          ', ''))

          write('internal/access/application/tenant_profile_management.go', r'''package application

          import (
              "context"
              "errors"
              "strings"
              "time"

              accessv1 "github.com/hvritual/biz/contracts/gen/access/v1"
              "github.com/hvritual/biz/internal/access/domain"
              "github.com/hvritual/biz/internal/access/ports"
              "yunka.io/framework/requestscope"
          )

          var ErrInvalidTenantProfileRequest = errors.New("access: invalid tenant profile request")

          type TenantProfileManagementService struct {
              repositories requestscope.RepositoryFactory[ports.TenantRepositories]
          }

          func NewTenantProfileManagementService(repositories requestscope.RepositoryFactory[ports.TenantRepositories]) (*TenantProfileManagementService, error) {
              if repositories == nil {
                  return nil, errors.New("access: tenant profile repository factory is required")
              }
              return &TenantProfileManagementService{repositories: repositories}, nil
          }

          func (service *TenantProfileManagementService) GetTenantProfile(ctx context.Context, _ *accessv1.GetTenantProfileRequest) (*accessv1.TenantProfileDTO, error) {
              tenantID, err := trustedTenantID(ctx)
              if err != nil {
                  return nil, err
              }
              profile, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantRepositories]) (domain.TenantProfile, error) {
                  return scope.Repositories().Tenant.GetProfile(scope.Context(), tenantID)
              })
              if err != nil {
                  return nil, err
              }
              return tenantProfileDTO(profile), nil
          }

          func (service *TenantProfileManagementService) UpdateTenantProfile(ctx context.Context, request *accessv1.UpdateTenantProfileRequest) (*accessv1.TenantProfileDTO, error) {
              if request == nil || request.GetVersion() == 0 {
                  return nil, ErrInvalidTenantProfileRequest
              }
              tenantID, err := trustedTenantID(ctx)
              if err != nil {
                  return nil, err
              }
              profile, err := requestscope.JoinValue(ctx, service.repositories, func(scope *requestscope.View[ports.TenantRepositories]) (domain.TenantProfile, error) {
                  repository := scope.Repositories().Tenant
                  current, err := repository.GetProfile(scope.Context(), tenantID)
                  if err != nil {
                      return domain.TenantProfile{}, err
                  }
                  if current.Version != request.GetVersion() {
                      return domain.TenantProfile{}, ports.ErrTenantProfileConflict
                  }
                  if err := current.Update(
                      request.GetName(), request.GetShortName(), request.GetIndustry(), request.GetCompanySize(), request.GetTimezone(),
                      request.GetContactName(), request.GetPhone(), request.GetEmail(), request.GetAddress(), request.GetDescription(), request.GetLogoAssetRef(), time.Now().UTC(),
                  ); err != nil {
                      return domain.TenantProfile{}, err
                  }
                  if err := repository.UpdateProfile(scope.Context(), &current, request.GetVersion()); err != nil {
                      return domain.TenantProfile{}, err
                  }
                  return current, nil
              })
              if err != nil {
                  return nil, err
              }
              return tenantProfileDTO(profile), nil
          }

          func tenantProfileDTO(profile domain.TenantProfile) *accessv1.TenantProfileDTO {
              shortName := strings.TrimSpace(profile.ShortName)
              if shortName == "" {
                  shortName = profile.Name
              }
              timezone := strings.TrimSpace(profile.Timezone)
              if timezone == "" {
                  timezone = "Asia/Shanghai"
              }
              return &accessv1.TenantProfileDTO{
                  TenantId: profile.TenantID,
                  Name: profile.Name,
                  ShortName: shortName,
                  Industry: profile.Industry,
                  CompanySize: profile.CompanySize,
                  Timezone: timezone,
                  ContactName: profile.ContactName,
                  Phone: profile.Phone,
                  Email: profile.Email,
                  Address: profile.Address,
                  Description: profile.Description,
                  LogoAssetRef: profile.LogoAssetRef,
                  Version: profile.Version,
              }
          }
          '''.replace('          ', ''))

          write('internal/bizruntime/tenant_profile_entitlements.go', r'''package bizruntime

          import (
              "context"
              "errors"

              accessv1 "github.com/hvritual/biz/contracts/gen/access/v1"
              accessapp "github.com/hvritual/biz/internal/access/application"
              "github.com/hvritual/biz/internal/access/domain"
              accessports "github.com/hvritual/biz/internal/access/ports"
              "github.com/hvritual/biz/internal/commercial/enforcement"
              "google.golang.org/grpc/codes"
              "google.golang.org/grpc/status"
          )

          type tenantProfileStatusError struct {
              cause error
              code  codes.Code
          }

          func (err *tenantProfileStatusError) Error() string { return err.cause.Error() }
          func (err *tenantProfileStatusError) Unwrap() error { return err.cause }
          func (err *tenantProfileStatusError) GRPCStatus() *status.Status { return status.New(err.code, err.cause.Error()) }

          func tenantProfileExecutionError(ctx context.Context, operation string, err error) error {
              if err == nil {
                  return nil
              }
              switch {
              case errors.Is(err, accessports.ErrTenantProfileConflict):
                  return &tenantProfileStatusError{cause: err, code: codes.Aborted}
              case errors.Is(err, accessports.ErrTenantProfileNotFound):
                  return &tenantProfileStatusError{cause: err, code: codes.NotFound}
              case errors.Is(err, accessapp.ErrInvalidTenantProfileRequest), errors.Is(err, domain.ErrInvalidTenantProfile):
                  return &tenantProfileStatusError{cause: err, code: codes.InvalidArgument}
              default:
                  return enforcement.ExecutionError(ctx, operation, err)
              }
          }

          type checkedTenantProfile struct {
              inner accessapp.TenantProfileManagementApplication
          }

          func (checked checkedTenantProfile) GetTenantProfile(ctx context.Context, request *accessv1.GetTenantProfileRequest) (*accessv1.TenantProfileDTO, error) {
              if err := enforcement.RequireExecuted(ctx, "tenant.profile.get"); err != nil {
                  return nil, err
              }
              value, err := checked.inner.GetTenantProfile(ctx, request)
              return value, tenantProfileExecutionError(ctx, "tenant.profile.get", err)
          }

          func (checked checkedTenantProfile) UpdateTenantProfile(ctx context.Context, request *accessv1.UpdateTenantProfileRequest) (*accessv1.TenantProfileDTO, error) {
              if err := enforcement.RequireExecuted(ctx, "tenant.profile.update"); err != nil {
                  return nil, err
              }
              value, err := checked.inner.UpdateTenantProfile(ctx, request)
              return value, tenantProfileExecutionError(ctx, "tenant.profile.update", err)
          }

          var _ accessapp.TenantProfileManagementApplication = checkedTenantProfile{}
          '''.replace('          ', ''))

          write('web/src/services/enterprise/tenantProfileRuntime.ts', r'''import {
            CommercialApiError,
            commercialRequestId,
            mutate,
            request,
          } from '@/services/commercial/platformCommercial'
          import {
            readSession,
            sessionContext,
            type TrustedSession,
          } from '@/services/runtime/api'

          export type EnterpriseTenantProfile = Readonly<{
            tenantId: string
            name: string
            shortName: string
            industry: string
            companySize: string
            timezone: string
            contactName: string
            phone: string
            email: string
            address: string
            description: string
            logoAssetRef: string
            version: string | number
          }>

          export type EnterpriseTenantProfileDraft = Omit<EnterpriseTenantProfile, 'tenantId' | 'version'>

          export function tenantProfileRequestId(suffix = '') {
            return commercialRequestId(`enterprise-tenant-profile-update${suffix ? `-${suffix}` : ''}`)
          }

          export function tenantProfileRuntimeError(error: unknown) {
            if (error instanceof CommercialApiError) {
              if (error.code === 'unauthenticated') return '登录会话已失效，请重新登录。'
              if (error.code === 'forbidden') return '当前账号没有维护企业资料的权限。'
              if (error.code === 'conflict') return '企业资料已被其他操作修改，请刷新后重试。'
              return error.message
            }
            return error instanceof Error ? error.message : '企业资料服务请求失败。'
          }

          function requireTenantSession(session: TrustedSession) {
            if (!session.authenticated) throw new Error('请先登录业务账号。')
            if (!session.active_tenant_id) throw new Error('请选择可访问的租户。')
          }

          function profileSnapshot(value: Partial<EnterpriseTenantProfile>): EnterpriseTenantProfile {
            return Object.freeze({
              tenantId: value.tenantId ?? '',
              name: value.name ?? '',
              shortName: value.shortName ?? '',
              industry: value.industry ?? '',
              companySize: value.companySize ?? '',
              timezone: value.timezone ?? 'Asia/Shanghai',
              contactName: value.contactName ?? '',
              phone: value.phone ?? '',
              email: value.email ?? '',
              address: value.address ?? '',
              description: value.description ?? '',
              logoAssetRef: value.logoAssetRef ?? '',
              version: value.version ?? 0,
            })
          }

          export async function readEnterpriseTenantProfileSession() {
            return readSession()
          }

          export async function getEnterpriseTenantProfile(session: TrustedSession) {
            requireTenantSession(session)
            const value = await request<EnterpriseTenantProfile>('/v1/tenant/profile', {
              headers: { 'X-Biz-Session-Context': sessionContext(session) },
            })
            return profileSnapshot(value)
          }

          export async function updateEnterpriseTenantProfile(
            session: TrustedSession,
            current: EnterpriseTenantProfile,
            draft: EnterpriseTenantProfileDraft,
            idempotencyKey: string,
          ) {
            requireTenantSession(session)
            const value = await mutate<EnterpriseTenantProfile>(
              '/v1/tenant/profile',
              'PATCH',
              {
                name: draft.name.trim(),
                shortName: draft.shortName.trim(),
                industry: draft.industry.trim(),
                companySize: draft.companySize.trim(),
                timezone: draft.timezone.trim(),
                contactName: draft.contactName.trim(),
                phone: draft.phone.trim(),
                email: draft.email.trim(),
                address: draft.address.trim(),
                description: draft.description.trim(),
                logoAssetRef: draft.logoAssetRef.trim(),
                version: current.version,
              },
              { idempotencyKey, sessionContext: sessionContext(session) },
            )
            return profileSnapshot(value)
          }
          '''.replace('          ', ''))

          write('web/src/views/enterprise/CompanyEntryView.vue', r'''<script setup lang="ts">
          import CompanyRealView from './CompanyRealView.vue'
          import CompanyView from './CompanyView.vue'

          const realMode = (import.meta.env.VITE_DATA_MODE ?? 'demo') === 'api'
          </script>

          <template>
            <CompanyRealView v-if="realMode" />
            <CompanyView v-else />
          </template>
          '''.replace('          ', ''))

          write('web/src/views/enterprise/CompanyRealView.vue', r'''<script setup lang="ts">
          import { computed, onMounted, ref } from 'vue'
          import PageHeading from '@/components/ui/PageHeading.vue'
          import AppIcon from '@/components/ui/AppIcon.vue'
          import StatusBadge from '@/components/ui/StatusBadge.vue'
          import { useUiStore } from '@/stores/ui'
          import {
            getEnterpriseTenantProfile,
            readEnterpriseTenantProfileSession,
            tenantProfileRequestId,
            tenantProfileRuntimeError,
            updateEnterpriseTenantProfile,
            type EnterpriseTenantProfile,
            type EnterpriseTenantProfileDraft,
          } from '@/services/enterprise/tenantProfileRuntime'
          import type { TrustedSession } from '@/services/runtime/api'

          const ui = useUiStore()
          const session = ref<TrustedSession | null>(null)
          const profile = ref<EnterpriseTenantProfile | null>(null)
          const draft = ref<EnterpriseTenantProfileDraft>(emptyDraft())
          const loading = ref(true)
          const saving = ref(false)
          const error = ref('')
          const confirmed = ref('')
          const writeKey = ref('')

          function emptyDraft(): EnterpriseTenantProfileDraft {
            return {
              name: '',
              shortName: '',
              industry: '',
              companySize: '',
              timezone: 'Asia/Shanghai',
              contactName: '',
              phone: '',
              email: '',
              address: '',
              description: '',
              logoAssetRef: '',
            }
          }

          function toDraft(value: EnterpriseTenantProfile): EnterpriseTenantProfileDraft {
            const { tenantId: _tenantId, version: _version, ...rest } = value
            return { ...rest }
          }

          const changed = computed(() => profile.value !== null && JSON.stringify(draft.value) !== JSON.stringify(toDraft(profile.value)))

          async function load() {
            loading.value = true
            error.value = ''
            confirmed.value = ''
            try {
              const trusted = await readEnterpriseTenantProfileSession()
              session.value = trusted
              const value = await getEnterpriseTenantProfile(trusted)
              profile.value = value
              draft.value = toDraft(value)
            } catch (cause) {
              error.value = tenantProfileRuntimeError(cause)
            } finally {
              loading.value = false
            }
          }

          function validate() {
            if (!draft.value.name.trim()) return '请填写企业名称。'
            if (!draft.value.shortName.trim()) return '请填写企业简称。'
            if (!draft.value.timezone.trim()) return '请选择默认时区。'
            if (draft.value.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.value.email)) return '请填写有效的企业邮箱。'
            if (draft.value.logoAssetRef.toLowerCase().startsWith('data:')) return '生产模式不接受 DataURL Logo，请使用资产服务引用。'
            return ''
          }

          async function save() {
            error.value = validate()
            confirmed.value = ''
            if (error.value || !session.value || !profile.value) return
            saving.value = true
            if (!writeKey.value) writeKey.value = tenantProfileRequestId(profile.value.tenantId || 'active')
            try {
              await updateEnterpriseTenantProfile(session.value, profile.value, draft.value, writeKey.value)
              const readback = await getEnterpriseTenantProfile(session.value)
              profile.value = readback
              draft.value = toDraft(readback)
              writeKey.value = ''
              confirmed.value = `企业资料已由服务端确认 · v${readback.version}`
              ui.toast('企业资料已由服务端确认。')
            } catch (cause) {
              error.value = tenantProfileRuntimeError(cause)
            } finally {
              saving.value = false
            }
          }

          function cancel() {
            if (!profile.value) return
            draft.value = toDraft(profile.value)
            error.value = ''
            writeKey.value = ''
          }

          function upload() {
            ui.toast('API 模式禁止 DataURL Logo；Logo 文件需先进入资产服务，再保存 logo_asset_ref。', 'info')
          }

          onMounted(load)
          </script>

          <template>
            <div class="page-stack" data-enterprise-company-source="server">
              <PageHeading title="企业信息" description="维护当前租户的权威企业资料；保存后必须从服务端回读确认" />
              <p v-if="confirmed" class="notice-box" role="status">{{ confirmed }}</p>
              <p v-if="error" class="form-error" role="alert">{{ error }}</p>
              <section v-if="loading" class="card panel-pad">正在读取服务端企业资料…</section>
              <div v-else-if="profile" class="split-layout">
                <form class="card panel-pad company-form" @submit.prevent="save">
                  <div class="row-between block-title">
                    <h2>基本信息</h2>
                    <StatusBadge text="服务端权威资料" />
                  </div>
                  <div class="form-grid">
                    <label class="field"><span class="required">企业名称</span><input v-model="draft.name" class="input" required maxlength="200" /></label>
                    <label class="field"><span class="required">企业简称</span><input v-model="draft.shortName" class="input" required maxlength="80" /></label>
                    <label class="field"><span>所属行业</span><input v-model="draft.industry" class="input" maxlength="120" /></label>
                    <label class="field"><span>企业规模</span><select v-model="draft.companySize" class="select"><option value="">未设置</option><option>1–10 人</option><option>10–50 人</option><option>50–200 人</option><option>200 人以上</option></select></label>
                    <label class="field"><span class="required">默认时区</span><select v-model="draft.timezone" class="select"><option value="Asia/Shanghai">中国标准时间 · UTC+08:00</option><option value="Asia/Taipei">台北时间 · UTC+08:00</option><option value="UTC">协调世界时 · UTC</option><option value="Europe/Berlin">欧洲柏林 · 按当地夏令时规则</option></select></label>
                    <div class="field">
                      <span>企业 Logo</span>
                      <div class="logo-control">
                        <span class="logo-placeholder"><AppIcon name="company" :size="24" /></span>
                        <button class="btn" type="button" @click="upload"><AppIcon name="upload" :size="15" />资产服务上传</button>
                      </div>
                      <small v-if="draft.logoAssetRef" class="mono">{{ draft.logoAssetRef }}</small>
