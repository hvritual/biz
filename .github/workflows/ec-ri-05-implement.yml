          </template>

          <style scoped>
          .company-form { padding: 28px; }
          .logo-control { display: flex; align-items: center; gap: 16px; }
          .logo-placeholder { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; color: var(--color-primary); background: var(--color-primary-soft); }
          .company-identity { text-align: center; padding: 24px 5px; }
          .company-identity > span { width: 64px; height: 64px; display: grid; place-items: center; background: var(--color-primary-soft); border-radius: 20px; color: var(--color-primary); margin: 0 auto 18px; }
          .company-identity h3 { font-size: 15px; }
          .company-identity p { font-size: 12px; color: var(--color-text-muted); margin-top: 8px; }
          .side-summary .detail-list { grid-template-columns: 85px 1fr; }
          @media (max-width: 767px) { .company-form { padding: 20px; } }
          </style>
          '''.replace('          ', ''))

          sources = json.loads(Path('contracts/sources.json').read_text())
          files = sources['sourceSets'][0]['files']
          if 'access/v1/tenant_profile.proto' not in files:
              idx = files.index('access/v1/tenant_member.proto')
              files.insert(idx, 'access/v1/tenant_profile.proto')
          Path('contracts/sources.json').write_text(json.dumps(sources, ensure_ascii=False, indent=2) + '\n')

          ports = Path('internal/access/ports/tenant.go').read_text()
          ports = ports.replace(
              'ErrTenantConflict = errors.New("access: tenant version conflict")',
              'ErrTenantConflict = errors.New("access: tenant version conflict")\n\tErrTenantProfileNotFound = errors.New("access: tenant profile not found")\n\tErrTenantProfileConflict = errors.New("access: tenant profile version conflict")',
          )
          ports = ports.replace(
              '\tUpdate(context.Context, *domain.Tenant, uint64) error\n',
              '\tUpdate(context.Context, *domain.Tenant, uint64) error\n\tGetProfile(context.Context, string) (domain.TenantProfile, error)\n\tUpdateProfile(context.Context, *domain.TenantProfile, uint64) error\n',
          )
          Path('internal/access/ports/tenant.go').write_text(ports)

          store = Path('internal/access/infrastructure/persistence/store.go').read_text()
          store = store.replace(
              '\tName      string    `gorm:"column:name;size:200;not null"`\n\tStatus',
              '\tName         string    `gorm:"column:name;size:200;not null"`\n\tShortName    string    `gorm:"column:short_name;size:80;not null;default:\'\'"`\n\tIndustry     string    `gorm:"column:industry;size:120;not null;default:\'\'"`\n\tCompanySize  string    `gorm:"column:company_size;size:64;not null;default:\'\'"`\n\tTimezone     string    `gorm:"column:timezone;size:64;not null;default:\'Asia/Shanghai\'"`\n\tContactName  string    `gorm:"column:contact_name;size:100;not null;default:\'\'"`\n\tPhone        string    `gorm:"column:phone;size:40;not null;default:\'\'"`\n\tEmail        string    `gorm:"column:email;size:320;not null;default:\'\'"`\n\tAddress      string    `gorm:"column:address;size:500;not null;default:\'\'"`\n\tDescription  string    `gorm:"column:description;size:1000;not null;default:\'\'"`\n\tLogoAssetRef string    `gorm:"column:logo_asset_ref;size:512;not null;default:\'\'"`\n\tStatus',
          )
          Path('internal/access/infrastructure/persistence/store.go').write_text(store)

          tenant = Path('internal/access/infrastructure/persistence/tenant.go').read_text()
          marker = '\nfunc NewTenantRepositoryFactory(database *gorm.DB)'
          profile_methods = r'''

          func (repository *TenantRepository) GetProfile(ctx context.Context, id string) (domain.TenantProfile, error) {
              if repository == nil || repository.database == nil {
                  return domain.TenantProfile{}, errors.New("access persistence: tenant profile repository unavailable")
              }
              var row tenantRecord
              if err := repository.database.WithContext(ctx).Where("id = ?", id).First(&row).Error; err != nil {
                  if errors.Is(err, gorm.ErrRecordNotFound) {
                      return domain.TenantProfile{}, ports.ErrTenantProfileNotFound
                  }
                  return domain.TenantProfile{}, err
              }
              shortName := row.ShortName
              if shortName == "" {
                  shortName = row.Name
              }
              timezone := row.Timezone
              if timezone == "" {
                  timezone = "Asia/Shanghai"
              }
              return domain.TenantProfile{
                  TenantID: row.ID, Name: row.Name, ShortName: shortName, Industry: row.Industry, CompanySize: row.CompanySize,
                  Timezone: timezone, ContactName: row.ContactName, Phone: row.Phone, Email: row.Email, Address: row.Address,
                  Description: row.Description, LogoAssetRef: row.LogoAssetRef, Version: row.Version, CreatedAt: row.CreatedAt, UpdatedAt: row.UpdatedAt,
              }, nil
          }

          func (repository *TenantRepository) UpdateProfile(ctx context.Context, profile *domain.TenantProfile, expectedVersion uint64) error {
              if repository == nil || repository.database == nil || profile == nil || expectedVersion == 0 {
                  return errors.New("access persistence: tenant profile update requires repository, value and version")
              }
              result := repository.database.WithContext(ctx).Model(&tenantRecord{}).
                  Where("id = ? AND version = ?", profile.TenantID, expectedVersion).
                  Updates(map[string]any{
                      "name": profile.Name,
                      "short_name": profile.ShortName,
                      "industry": profile.Industry,
                      "company_size": profile.CompanySize,
                      "timezone": profile.Timezone,
                      "contact_name": profile.ContactName,
                      "phone": profile.Phone,
                      "email": profile.Email,
                      "address": profile.Address,
                      "description": profile.Description,
                      "logo_asset_ref": profile.LogoAssetRef,
                      "updated_at": profile.UpdatedAt,
                      "version": gorm.Expr("version + 1"),
                  })
              if result.Error != nil {
                  return result.Error
              }
              if result.RowsAffected != 1 {
                  var count int64
                  if err := repository.database.WithContext(ctx).Model(&tenantRecord{}).Where("id = ?", profile.TenantID).Count(&count).Error; err != nil {
                      return err
                  }
                  if count == 0 {
                      return ports.ErrTenantProfileNotFound
                  }
                  return ports.ErrTenantProfileConflict
              }
              profile.Version = expectedVersion + 1
              return nil
          }
          '''.replace('          ', '')
          if 'func (repository *TenantRepository) GetProfile' not in tenant:
              tenant = tenant.replace(marker, profile_methods + marker)
          Path('internal/access/infrastructure/persistence/tenant.go').write_text(tenant)

          skeleton = Path('internal/bizruntime/access_skeleton.go').read_text()
          needle = '''func (factory applicationFactories) BuildAccessTenantDepartmentManagement(generatedassembly.AccessTenantDepartmentManagementDependencies) (accessapp.TenantDepartmentManagementApplication, error) {
\tinner, err := accessapp.NewTenantDepartmentManagementService(factory.departmentRepositories)
\tif err != nil {
\t\treturn nil, err
\t}
\treturn checkedDepartments{inner: inner}, nil
}
'''
          addition = needle + '''\nfunc (factory applicationFactories) BuildAccessTenantProfileManagement(generatedassembly.AccessTenantProfileManagementDependencies) (accessapp.TenantProfileManagementApplication, error) {
\tinner, err := accessapp.NewTenantProfileManagementService(factory.tenantRepositories)
\tif err != nil {
\t\treturn nil, err
\t}
\treturn checkedTenantProfile{inner: inner}, nil
}
'''
          if 'BuildAccessTenantProfileManagement' not in skeleton:
              if needle not in skeleton:
                  raise SystemExit('access_skeleton department factory marker not found')
              skeleton = skeleton.replace(needle, addition)
          Path('internal/bizruntime/access_skeleton.go').write_text(skeleton)

          router = Path('web/src/router/index.ts').read_text()
          router = router.replace("component: () => import('@/views/enterprise/CompanyView.vue'),", "component: () => import('@/views/enterprise/CompanyEntryView.vue'),")
          Path('web/src/router/index.ts').write_text(router)
          PY

      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          gofmt -w internal/access/domain/tenant_profile.go internal/access/application/tenant_profile_management.go internal/access/ports/tenant.go internal/access/infrastructure/persistence/store.go internal/access/infrastructure/persistence/tenant.go internal/bizruntime/access_skeleton.go internal/bizruntime/tenant_profile_entitlements.go

      - name: Generate canonical Yunka artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" make generate

      - name: Verify backend and web
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" make check
          go test ./internal/access/... ./internal/bizruntime/... ./internal/architecture/...
          npm --prefix web ci
          npm --prefix web run check
          test -z "$(git diff --name-only -- 'server/**')"

      - name: Commit EC-RI-05 implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          rm .github/workflows/ec-ri-05-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(access): implement EC-RI-05 tenant profile runtime"
          git push origin HEAD:feat/enterprise-tenant-profile-real-integration
