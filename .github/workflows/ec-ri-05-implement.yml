name: ec-ri-05-generate

on:
  push:
    branches:
      - feat/enterprise-tenant-profile-real-integration
    paths:
      - .github/workflows/ec-ri-05-implement.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout EC-RI-05 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-tenant-profile-real-integration
          path: biz
          fetch-depth: 0

      - name: Load locked Yunka source
        id: consumer_source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout locked Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.consumer_source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.toolchain.outputs.protoc_release }}/protoc-${{ steps.toolchain.outputs.protoc_release }}-linux-x86_64.zip" \
            -o "$archive"
          echo "${{ steps.toolchain.outputs.protoc_sha }}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Install locked protoc Go plugins
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          plugins="$RUNNER_TEMP/protoc-plugins"
          mkdir -p "$plugins"
          GOBIN="$plugins" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          GOBIN="$plugins" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$plugins" >> "$GITHUB_PATH"

      - name: Refine Tenant Profile repository boundary
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          python3 - <<'PY'
          from pathlib import Path

          ports = Path('internal/access/ports/tenant.go')
          text = ports.read_text(encoding='utf-8')
          text = text.replace('\n\tErrTenantProfileNotFound = errors.New("access: tenant profile not found")\n\tErrTenantProfileConflict = errors.New("access: tenant profile version conflict")', '')
          text = text.replace('\n\tGetProfile(context.Context, string) (domain.TenantProfile, error)\n\tUpdateProfile(context.Context, *domain.TenantProfile, uint64) error', '')
          ports.write_text(text, encoding='utf-8')

          Path('internal/access/ports/tenant_profile.go').write_text('''package ports

          import (
          \t"context"
          \t"errors"

          \t"github.com/hvritual/biz/internal/access/domain"
          )

          var (
          \tErrTenantProfileNotFound = errors.New("access: tenant profile not found")
          \tErrTenantProfileConflict = errors.New("access: tenant profile version conflict")
          )

          type TenantProfileRepository interface {
          \tGetProfile(context.Context, string) (domain.TenantProfile, error)
          \tUpdateProfile(context.Context, *domain.TenantProfile, uint64) error
          }

          type TenantProfileRepositories struct {
          \tProfile TenantProfileRepository
          }
          '''.replace('          ', ''), encoding='utf-8')

          app = Path('internal/access/application/tenant_profile_management.go')
          text = app.read_text(encoding='utf-8')
          text = text.replace('requestscope.RepositoryFactory[ports.TenantRepositories]', 'requestscope.RepositoryFactory[ports.TenantProfileRepositories]')
          text = text.replace('requestscope.View[ports.TenantRepositories]', 'requestscope.View[ports.TenantProfileRepositories]')
          text = text.replace('scope.Repositories().Tenant.GetProfile', 'scope.Repositories().Profile.GetProfile')
          text = text.replace('repository := scope.Repositories().Tenant', 'repository := scope.Repositories().Profile')
          app.write_text(text, encoding='utf-8')

          persistence = Path('internal/access/infrastructure/persistence/tenant.go')
          text = persistence.read_text(encoding='utf-8')
          if 'func NewTenantProfileRepositoryFactory' not in text:
              text += '''

          func NewTenantProfileRepositoryFactory(database *gorm.DB) (requestscope.RepositoryFactory[ports.TenantProfileRepositories], error) {
          \tif database == nil {
          \t\treturn nil, errors.New("access persistence: tenant profile database is required")
          \t}
          \treturn requestscope.GORMRepositories(func(_ context.Context, transaction *gorm.DB) (ports.TenantProfileRepositories, error) {
          \t\trepository, err := NewTenantRepository(transaction)
          \t\tif err != nil {
          \t\t\treturn ports.TenantProfileRepositories{}, err
          \t\t}
          \t\treturn ports.TenantProfileRepositories{Profile: repository}, nil
          \t}), nil
          }
          '''.replace('          ', '')
          persistence.write_text(text, encoding='utf-8')

          skeleton = Path('internal/bizruntime/access_skeleton.go')
          text = skeleton.read_text(encoding='utf-8')
          marker = '''func (factory applicationFactories) BuildAccessTenantProfileManagement(generatedassembly.AccessTenantProfileManagementDependencies) (accessapp.TenantProfileManagementApplication, error) {
          \tinner, err := accessapp.NewTenantProfileManagementService(factory.tenantRepositories)
          '''.replace('          ', '')
          replacement = '''func (factory applicationFactories) BuildAccessTenantProfileManagement(generatedassembly.AccessTenantProfileManagementDependencies) (accessapp.TenantProfileManagementApplication, error) {
          \tinner, err := accessapp.NewTenantProfileManagementService(factory.tenantProfileRepositories)
          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('tenant profile factory marker not found')
          skeleton.write_text(text.replace(marker, replacement), encoding='utf-8')

          runtime = Path('internal/bizruntime/runtime.go')
          text = runtime.read_text(encoding='utf-8')
          field_marker = '\ttenantRepositories          requestscope.RepositoryFactory[accessports.TenantRepositories]\n'
          if '\ttenantProfileRepositories   requestscope.RepositoryFactory[accessports.TenantProfileRepositories]\n' not in text:
              text = text.replace(field_marker, field_marker + '\ttenantProfileRepositories   requestscope.RepositoryFactory[accessports.TenantProfileRepositories]\n')
          factory_marker = '''\ttenantRepositories, err := accesspersistence.NewTenantRepositoryFactory(accessDatabase)
          \tif err != nil {
          \t\treturn generatedassembly.RuntimeBindings{}, err
          \t}
          '''.replace('          ', '')
          factory_replacement = factory_marker + '''\ttenantProfileRepositories, err := accesspersistence.NewTenantProfileRepositoryFactory(accessDatabase)
          \tif err != nil {
          \t\treturn generatedassembly.RuntimeBindings{}, err
          \t}
          '''.replace('          ', '')
          if 'tenantProfileRepositories, err :=' not in text:
              if factory_marker not in text:
                  raise SystemExit('runtime tenant repository factory marker not found')
              text = text.replace(factory_marker, factory_replacement)
          binding_marker = '\t\t\ttenantRepositories:          tenantRepositories,\n'
          if '\t\t\ttenantProfileRepositories:   tenantProfileRepositories,\n' not in text:
              text = text.replace(binding_marker, binding_marker + '\t\t\ttenantProfileRepositories:   tenantProfileRepositories,\n')
          runtime.write_text(text, encoding='utf-8')
          PY

      - name: Classify Tenant Profile commercial operations
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('contracts/commercial/operation-capabilities.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['mapping_version'] = '13'
          entries = {
              'tenant.profile.get': {'operation_id': 'tenant.profile.get', 'classification': 'tenant_business', 'module_code': 'access-management', 'capability_codes': ['tenant.lifecycle'], 'children': []},
              'tenant.profile.update': {'operation_id': 'tenant.profile.update', 'classification': 'tenant_business', 'module_code': 'access-management', 'capability_codes': ['tenant.lifecycle'], 'children': []},
          }
          operations = [item for item in data['operations'] if item['operation_id'] not in entries]
          operations.extend(entries.values())
          data['operations'] = sorted(operations, key=lambda item: item['operation_id'])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Generate and verify
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          gofmt -w internal/access/domain/tenant_profile.go internal/access/application/tenant_profile_management.go internal/access/ports/tenant.go internal/access/ports/tenant_profile.go internal/access/infrastructure/persistence/store.go internal/access/infrastructure/persistence/tenant.go internal/bizruntime/access_skeleton.go internal/bizruntime/runtime.go internal/bizruntime/tenant_profile_entitlements.go
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" make generate
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" make check
          go test ./internal/access/... ./internal/bizruntime/... ./internal/architecture/...
          npm --prefix web ci
          npm --prefix web run check
          test -z "$(git diff --name-only -- 'server/**')"

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          rm .github/workflows/ec-ri-05-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(access): generate EC-RI-05 tenant profile artifacts"
          git push origin HEAD:feat/enterprise-tenant-profile-real-integration
