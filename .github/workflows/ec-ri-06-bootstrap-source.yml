name: ec-ri-06-bootstrap-source

on:
  push:
    branches:
      - feat/ec-ri-06-tenant-plan-read
    paths:
      - .github/workflows/ec-ri-06-bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-06-tenant-plan-read
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Apply EC-RI-06 source slice
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proto = Path('contracts/proto/commercial/v1/subscription.proto')
          text = proto.read_text()
          if 'message GetMySubscriptionRequest' not in text:
              text = text.replace(
                  'message GetTenantSubscriptionRequest { string tenant_id=1; }\n',
                  'message GetTenantSubscriptionRequest { string tenant_id=1; }\nmessage GetMySubscriptionRequest {}\n',
              )
          if 'rpc GetMySubscription' not in text:
              needle = ' rpc GetTenantSubscription(GetTenantSubscriptionRequest) returns (TenantSubscriptionDTO) { option (google.api.http)={get:"/v1/platform/tenants/{tenant_id}/subscription"}; option (yunka.dsl.v1.operation)={id:"commercial.subscription.get" use_case:"get_tenant_subscription" permissions:"platform.subscription.read" permissions:"platform.tenant.read" permission_mode:PERMISSION_ALL tenant_required:false authentication:AUTHENTICATION_API_KEY authentication:AUTHENTICATION_WEB_SESSION execution:{transaction:TRANSACTION_READ_ONLY idempotency:IDEMPOTENCY_NONE}}; }\n'
              addition = needle + ' rpc GetMySubscription(GetMySubscriptionRequest) returns (TenantSubscriptionDTO) { option (google.api.http)={get:"/v1/tenant/subscription"}; option (yunka.dsl.v1.operation)={id:"commercial.subscription.get_my" use_case:"get_my_subscription" permissions:"tenant.entitlement.read" permission_mode:PERMISSION_ALL tenant_required:true authentication:AUTHENTICATION_API_KEY authentication:AUTHENTICATION_WEB_SESSION execution:{transaction:TRANSACTION_READ_ONLY idempotency:IDEMPOTENCY_NONE}}; }\n'
              if needle not in text:
                  raise SystemExit('subscription proto anchor not found')
              text = text.replace(needle, addition)
          proto.write_text(text)

          service = Path('internal/commercial/application/subscriptionmanagement/internal/usecase/service.go')
          text = service.read_text()
          actor = '''func actor(ctx context.Context) (string, error) {
\tp, ok := identity.FromContext(ctx)
\tif !ok || !p.Authenticated || p.Subject == "" || p.TenantID != "" {
\t\treturn "", subscription.ErrScope
\t}
\treturn p.Subject, nil
}
'''
          tenant_actor = '''func tenantActor(ctx context.Context) (identity.Principal, error) {
\tp, ok := identity.FromContext(ctx)
\tif !ok || !p.Authenticated || p.Subject == "" || p.TenantID == "" {
\t\treturn identity.Principal{}, subscription.ErrScope
\t}
\treturn p, nil
}
'''
          if 'func tenantActor(' not in text:
              if actor not in text:
                  raise SystemExit('subscription actor anchor not found')
              text = text.replace(actor, actor + tenant_actor)
          if 'func (s *service) GetMySubscription(' not in text:
              text = text.rstrip() + '''

func (s *service) GetMySubscription(ctx context.Context, _ *v1.GetMySubscriptionRequest) (*v1.TenantSubscriptionDTO, error) {
\tp, e := tenantActor(ctx)
\tif e != nil {
\t\treturn nil, exposed(e)
\t}
\tv, e := requestscope.JoinValue(ctx, s.repositories, func(sc *requestscope.View[ports.SubscriptionRepositories]) (subscription.Subscription, error) {
\t\treturn sc.Repositories().Subscriptions.GetBase(sc.Context(), p.TenantID, false)
\t})
\tif e != nil {
\t\treturn nil, exposed(e)
\t}
\treturn dto(v), nil
}
'''
          service.write_text(text)

          model = Path('internal/access/domain/model.go')
          text = model.read_text()
          if '"tenant.entitlement.read"' not in text:
              needle = 'var OwnerRequiredPermissions = []string{\n'
              if needle not in text:
                  raise SystemExit('owner permission anchor not found')
              text = text.replace(
                  needle,
                  needle + '\t"commercial.catalog.read",\n\t"tenant.entitlement.read",\n',
              )
          model.write_text(text)

          router = Path('web/src/router/index.ts')
          text = router.read_text()
          old = "component: () => import('@/features/enterprise/pages/PlansView.vue'),"
          new = "component: () => import('@/features/enterprise/pages/PlansEntryView.vue'),"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('enterprise plan router anchor not found')
          router.write_text(text)
          PY
      - name: Generate locked contracts and runtime artifacts
        working-directory: biz
        shell: bash
        env:
          YUNKA_ROOT: ${{ github.workspace }}/yunka.io
        run: |
          set -euo pipefail
          make generate
      - name: Qualify Go slice
        working-directory: biz
        shell: bash
        env:
          YUNKA_ROOT: ${{ github.workspace }}/yunka.io
        run: |
          set -euo pipefail
          go test ./internal/commercial/... ./internal/access/... ./internal/architecture/...
          make commercial-check
      - name: Qualify web build
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          VITE_DATA_MODE=api npm run build
      - name: Commit generated source slice
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts internal web go.mod go.sum go.work.sum
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m "feat(commercial): expose tenant subscription read"
          git push origin HEAD:feat/ec-ri-06-tenant-plan-read
