name: ec-ri-06-bootstrap-source

on:
  push:
    branches:
      - feat/ec-ri-06-tenant-plan-read
    paths:
      - .github/workflows/ec-ri-06-bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-06-tenant-plan-read
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Install locked protoc
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Apply source slice
        working-directory: biz
        run: python3 scripts/ec_ri_06_bootstrap.py
      - name: Generate locked contracts and runtime artifacts
        working-directory: biz
        env:
          YUNKA_ROOT: ../yunka.io
        run: make generate
      - name: Qualify Go slice
        working-directory: biz
        env:
          YUNKA_ROOT: ../yunka.io
        run: |
          set -euo pipefail
          go test ./internal/commercial/... ./internal/access/... ./internal/architecture/...
          make commercial-check
      - name: Qualify web build
        working-directory: biz/web
        run: |
          set -euo pipefail
          npm ci
          npm run check
          VITE_DATA_MODE=api npm run build
      - name: Commit generated source slice
        working-directory: biz
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts internal web go.mod go.sum go.work.sum
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(commercial): expose tenant subscription read"
          git push origin HEAD:feat/ec-ri-06-tenant-plan-read
