name: ec-ri-06-lifecycle-generate

on:
  push:
    branches:
      - feat/ec-ri-06-tenant-change-preview
    paths:
      - .github/workflows/ec-ri-06-lifecycle-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-06-tenant-change-preview
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Install locked protobuf toolchain
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify locked framework source
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" ./scripts/verify-yunka-source.sh
      - name: Format lifecycle sources and classify operations
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          gofmt -w \
            internal/commercial/application/planmanagement/internal/usecase/tenant_change.go \
            internal/commercial/application/subscriptionchanges/internal/usecase/context.go \
            internal/commercial/application/subscriptionchanges/internal/usecase/preview.go \
            internal/commercial/application/subscriptionchanges/internal/usecase/confirm.go \
            internal/commercial/application/subscriptionchanges/internal/usecase/selfservice.go \
            internal/commercial/application/subscriptionchanges/internal/usecase/service.go \
            internal/access/domain/model.go \
            internal/architecture/ce07_plan_boundary_test.go \
            internal/architecture/ce09_subscription_change_test.go \
            internal/architecture/ce13_platform_web_session_contract_test.go
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/commercial/operation-capabilities.v1.json')
          doc = json.loads(path.read_text())
          by_id = {item['operation_id']: item for item in doc['operations']}
          by_id.update({
            'commercial.plan.subscription_snapshot': {
              'operation_id': 'commercial.plan.subscription_snapshot',
              'classification': 'foundation_exempt',
              'capability_codes': [],
              'children': [],
              'exemption_reason': 'EC-RI-06 transport-private exact current-plan reader. It is reachable only as a C9 child from authenticated tenant subscription-change roots and has no HTTP or Web Session transport.'
            },
            'commercial.plan.change_target.resolve': {
              'operation_id': 'commercial.plan.change_target.resolve',
              'classification': 'foundation_exempt',
              'capability_codes': [],
              'children': [{
                'operation_id': 'commercial.module.plan_catalog',
                'mode': 'always',
                'source': 'internal/commercial/application/planmanagement/internal/usecase/tenant_change.go#ResolveTenantChangeTarget'
              }],
              'exemption_reason': 'EC-RI-06 transport-private target resolver. The trusted parent supplies the current subscription sales scope; only published eligible plans can pass.'
            },
            'commercial.plan.change_target.list': {
              'operation_id': 'commercial.plan.change_target.list',
              'classification': 'foundation_exempt',
              'capability_codes': [],
              'children': [{
                'operation_id': 'commercial.module.plan_catalog',
                'mode': 'always',
                'source': 'internal/commercial/application/planmanagement/internal/usecase/tenant_change.go#ListTenantChangeTargets'
              }],
              'exemption_reason': 'EC-RI-06 transport-private tenant target discovery. It returns only latest published eligible versions for the server-owned sales scope and exposes no draft management surface.'
            },
            'commercial.subscription.change.targets_my': {
              'operation_id': 'commercial.subscription.change.targets_my',
              'classification': 'recovery',
              'capability_codes': [],
              'children': [{
                'operation_id': 'commercial.plan.change_target.list',
                'mode': 'always',
                'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/selfservice.go#ListMySubscriptionChangeTargets'
              }],
              'exemption_reason': 'EC-RI-06 authenticated current-tenant change-target projection. IAM tenant.subscription.manage remains mandatory and target discovery cannot grant target-plan capabilities.'
            },
            'commercial.subscription.change.preview_my': {
              'operation_id': 'commercial.subscription.change.preview_my',
              'classification': 'recovery',
              'capability_codes': [],
              'children': [
                {'operation_id': 'commercial.plan.subscription_snapshot', 'mode': 'always', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/context.go#captureWithPlanAuthority'},
                {'operation_id': 'commercial.plan.change_target.resolve', 'mode': 'conditional', 'condition': 'action is SWITCH or RENEW; STOP_RENEWAL has no target lookup', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/context.go#captureWithPlanAuthority'},
                {'operation_id': 'commercial.module.plan_catalog', 'mode': 'always', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/context.go#captureWithPlanAuthority'}
              ],
              'exemption_reason': 'EC-RI-06 tenant decision preview. It persists only an expiring preview artifact, does not mutate subscription or entitlement authority, and remains protected by tenant.subscription.manage.'
            },
            'commercial.subscription.change.preview_my.get': {
              'operation_id': 'commercial.subscription.change.preview_my.get',
              'classification': 'recovery',
              'capability_codes': [],
              'children': [],
              'exemption_reason': 'EC-RI-06 actor-and-tenant-bound readback of an expiring self-service preview artifact; it performs no commercial mutation.'
            },
            'commercial.subscription.change.confirm_my': {
              'operation_id': 'commercial.subscription.change.confirm_my',
              'classification': 'recovery',
              'capability_codes': [],
              'children': [
                {'operation_id': 'commercial.plan.subscription_snapshot', 'mode': 'always', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/confirm.go#confirm'},
                {'operation_id': 'commercial.plan.change_target.resolve', 'mode': 'conditional', 'condition': 'preview action is SWITCH or RENEW; STOP_RENEWAL has no target lookup', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/confirm.go#confirm'},
                {'operation_id': 'commercial.module.plan_catalog', 'mode': 'always', 'source': 'internal/commercial/application/subscriptionchanges/internal/usecase/context.go#captureWithPlanAuthority'}
              ],
              'exemption_reason': 'EC-RI-06 tenant confirmation fully revalidates the preview and current authorities. Any target with price_ref fails closed with SUBSCRIPTION_CHANGE_EXTERNAL_APPROVAL_REQUIRED; no client field can assert payment or approval.'
            },
            'commercial.subscription.change.get_my': {
              'operation_id': 'commercial.subscription.change.get_my',
              'classification': 'recovery',
              'capability_codes': [],
              'children': [],
              'exemption_reason': 'EC-RI-06 trusted-tenant receipt readback for APPLIED, SCHEDULED or PROVISIONING lifecycle state; it performs no mutation.'
            },
          })
          doc['mapping_version'] = '17'
          doc['operations'] = sorted(by_id.values(), key=lambda item: item['operation_id'])
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Generate canonical contracts and assembly
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd biz
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
      - name: Run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          go test ./internal/commercial/... ./internal/access/... ./internal/architecture/... ./internal/bizruntime
          go test ./cmd/biz
          git diff --check
      - name: Commit deterministic generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts internal modules go.mod go.sum go.work.sum
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(ec-ri-06): generate tenant change lifecycle contracts"
          git push origin HEAD:feat/ec-ri-06-tenant-change-preview
