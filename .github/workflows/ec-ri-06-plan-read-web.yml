name: ec-ri-06-plan-read-web

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ec-ri-06-plan-read-web.yml
      - web/**
      - contracts/proto/commercial/v1/subscription.proto
      - contracts/proto/access/v1/tenant_member.proto
      - contracts/commercial/operation-capabilities.v1.json
      - contracts/generated/openapi.json
      - internal/architecture/ec_ri_06_tenant_plan_read_test.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Install Chromium and Chinese fonts
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run tenant plan and usage API-mode E2E
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          VITE_DATA_MODE=api npm run build
          ENTERPRISE_PLAN_REAL_E2E=1 npx playwright test e2e/enterprise-plan-real.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          results = json.loads(Path('test-results/results.json').read_text())
          stats = results['stats']
          assert stats.get('unexpected', 0) == 0, stats
          serialized = json.dumps(results, ensure_ascii=False)
          required_titles = [
              'real plan page renders authoritative subscription, entitlement and usage facts across CoffeeLink viewports',
              'tenant plan and usage reads never send arbitrary tenant ids and bind to trusted session',
              'finite member quota uses authoritative usage while unsupported quotas stay unknown instead of zero',
              'member quota below limit renders authoritative remaining capacity',
              'usage authority 5xx keeps quota limits visible but explicitly degrades usage to unknown',
              '401 exits to trusted login while downstream 403 responses never fall back to demo plan data',
              'entitlement authority failure stays visible instead of substituting preview quotas',
          ]
          for title in required_titles:
              assert title in serialized, f'missing EC-RI-06 browser evidence: {title}'
          shots = Path('screenshots')
          for width, height in [(1366, 768), (1440, 900), (1536, 1024), (390, 844)]:
              path = shots / f'enterprise-plan-real-{width}.png'
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              got = struct.unpack('>II', data[16:24])
              assert got == (width, height), (path, got)
          print(f'EC_RI_06_PLAN_USAGE_WEB=PASS expected={stats.get("expected", 0)}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec-ri-06-plan-usage-visual-review
          path: |
            web/screenshots
            web/test-results
            web/dist
          if-no-files-found: warn
          retention-days: 7
