name: ec-ri-06-slice2-docs-finalize

on:
  push:
    branches:
      - feat/ec-ri-06-tenant-usage-read
    paths:
      - .github/workflows/ec-ri-06-slice2-generate.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current Slice 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-06-tenant-usage-read
          fetch-depth: 0
      - name: Update EC-RI-06 authoritative usage truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ENTERPRISE-CENTER-REAL-INTEGRATION.md')
          text = path.read_text()

          replacements = {
              "当前主线基线：`main@7691ad68ca9252f6456b8c77eaf04bfac91e6cbf`（EC-RI-01～05 已合并）。EC-RI-06 按独立切片推进，当前首个切片只关闭租户套餐/权益/额度上限的权威读取，不提前宣称整个 EC-RI-06 完成。":
              "当前主线基线：`main@2a167885ba9a6a349d3a13eee90a4d8c818d55e5`（EC-RI-06 Slice 1 / PR #104 已合并）。EC-RI-06 按独立切片推进，Slice 2 正在关闭 `tenant.members` 权威用量读取；upgrade/change 写链路仍未进入。",
              "| EC-RI-06 Plan / entitlement / quota | 🚧 In progress | 首个独立切片已实现当前租户 subscription、entitlement 与 quota limit 权威读取；usage、upgrade/change preview、confirm + receipt 仍待后续切片。 |":
              "| EC-RI-06 Plan / entitlement / quota | 🚧 In progress | Slice 1 已合并当前租户 subscription、entitlement 与 quota limit 权威读取；Slice 2 已实现 `tenant.members` 权威用量 meter、tenant-scoped usage projection 与额度耗尽判断，待本轮 PR 门禁；其余 usage meters 与 upgrade/change 写链路仍待后续切片。 |",
              "EC-RI-06 首个切片进一步把套餐额度 API 模式从本地示例状态分离：当前订阅、模块/能力决策与 quota limit 来自 Commercial 权威服务；尚未接通的 usage 必须明确显示“权威用量未接入”，禁止以 `0`、假百分比或本地示例替代。":
              "EC-RI-06 已把套餐额度 API 模式从本地示例状态分离：当前订阅、模块/能力决策与 quota limit 来自 Commercial 权威服务；Slice 2 进一步通过 `GET /v1/tenant/usage` 接入 `access-management / tenant.members` 权威 meter。成员额度规则固定为 invited / active / suspended 占用、removed 释放；其余尚未接 meter 的 quota 继续显示“未知”，禁止以 `0`、假百分比或本地示例替代。",
              "- quota definition and entitlement limits\n":
              "- quota definition and entitlement limits\n- tenant-scoped authoritative quota usage projection（当前已接 `tenant.members`）\n",
              "- authoritative usage counters；\n- 套餐 upgrade/change preview；":
              "- 其余 quota 的 authoritative usage meters（当前仅 `tenant.members` 已接入）；\n- 套餐 upgrade/change preview；",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing roadmap source fragment: {old}')
              text = text.replace(old, new, 1)

          marker = "- 架构门禁固定检查 self-service contract 不接受 tenant id、服务按 `Principal.TenantID` 选 subscription、owner 商业只读权限存在。\n\n**Remaining EC-RI-06 slices**"
          slice2 = """- 架构门禁固定检查 self-service contract 不接受 tenant id、服务按 `Principal.TenantID` 选 subscription、owner 商业只读权限存在。\n\n**Slice 2 — authoritative `tenant.members` usage read**\n\n本轮只关闭第一个真实 usage meter，不引入通用 CE-19 计量平台：\n\n- Access 新增 transport-private `tenant.member.count_quota_usage` child operation；调用方不能提交 tenant id，范围只来自 trusted tenant principal。\n- `TenantMemberRepository.CountQuotaMembers` 直接统计 `biz_memberships` 权威事实：`invited / active / suspended` 占用额度，`removed` 才释放额度。\n- Commercial 新增 `GET /v1/tenant/usage`，通过 C9 child capability 组合 Access meter，不跨域直接读取 Access 表，也不新增第二套 usage 持久化。\n- usage item 使用 canonical entitlement key：`module_code=access-management`、`key=tenant.members`；仅权威 meter 返回 `known=true`。\n- finite quota 只有 `known=true` 时计算 used / remaining / exhausted；unlimited quota 永不误判耗尽；没有 meter 的 quota 保持“未知”，禁止默认成 `0`。\n- usage 5xx 只降级用量展示为“未知”，仍保留 subscription / entitlement limit 权威事实；401/403/tenant conflict 继续作为认证授权边界，不做 demo fallback。\n- MySQL gate 覆盖邀请占用、暂停占用、移除释放、双租户隔离、query tenant id 不可越权和缺少 `tenant.entitlement.read` 的 403。\n- Browser gate 覆盖 used / remaining / exhausted、unsupported quota unknown、usage 5xx 显式降级、usage 403 无 fallback，以及 1366×768 / 1440×900 / 1536×1024 / 390×844 视觉证据。\n- CE-03 capability mapping 升级到 mapping version 15，显式分类 tenant usage root 与内部 meter，未绕过商业治理门禁。\n\n**Remaining EC-RI-06 slices**"""
          if marker not in text:
              raise SystemExit('missing Slice 1 tail marker')
          text = text.replace(marker, slice2, 1)
          path.write_text(text)
          PY
      - name: Commit roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ENTERPRISE-CENTER-REAL-INTEGRATION.md
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "docs(ec-ri-06): record authoritative tenant member usage"
          git push origin HEAD:feat/ec-ri-06-tenant-usage-read
