name: ec-ri-06-ui-scope-fix

on:
  push:
    branches:
      - feat/ec-ri-06-tenant-change-preview
    paths:
      - .github/workflows/ec-ri-06-ui-scope-fix.yml

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-06-tenant-change-preview
          fetch-depth: 0
      - name: Apply component boundary metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          component = Path('web/src/features/enterprise/components/PlanChangeLifecycle.vue')
          code = component.read_text()
          code = code.replace('            <button\n', '            <UiButton\n')
          code = code.replace('            </button>\n', '            </UiButton>\n')
          component.write_text(code)

          manifest = Path('web/src/features/component-scopes.json')
          data = json.loads(manifest.read_text())
          data['enterprise/components/PlanChangeLifecycle.vue'] = {
            'scenario': '企业中心 · 套餐变更生命周期 · PlanChangeLifecycle',
            'scope': '仅用于企业中心租户套餐目标发现、权威预览、审批边界、确认与回执展示；跨业务复用必须下沉 ui/common，不得绕过 ui/base 或直接访问网络。'
          }
          manifest.write_text(json.dumps(dict(sorted(data.items())), ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Verify frontend architecture
        working-directory: web
        run: npm run check
      - name: Commit scope-safe UI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/features/enterprise/components/PlanChangeLifecycle.vue web/src/features/component-scopes.json
          git diff --cached --check
          git commit -m "fix(ec-ri-06): align plan change UI with component governance"
          git push origin HEAD:feat/ec-ri-06-tenant-change-preview
