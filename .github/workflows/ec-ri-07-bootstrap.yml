name: ec-ri-07-bootstrap

# final canonical generation after server, web, and MySQL qualification sources are locked
on:
  push:
    branches:
      - feat/ec-ri-07-server-audit-trail
    paths:
      - .github/workflows/ec-ri-07-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
    steps:
      - name: Checkout Biz branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ec-ri-07-server-audit-trail
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Install locked protobuf toolchain
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_LINUX_X86_64_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify locked framework source
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" ./scripts/verify-yunka-source.sh
      - name: Apply EC-RI-07 runtime wiring and CE-03 mapping
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          python3 - <<'PY'
          import json
          from pathlib import Path

          tenant = Path('internal/access/infrastructure/persistence/tenant.go')
          text = tenant.read_text()
          old = '''\t\ttenant, err := NewTenantRepository(transaction)\n\t\tif err != nil {\n\t\t\treturn ports.TenantRepositories{}, err\n\t\t}\n\t\treturn ports.TenantRepositories{Tenant: tenant}, nil\n'''
          new = '''\t\ttenant, err := NewTenantRepository(transaction)\n\t\tif err != nil {\n\t\t\treturn ports.TenantRepositories{}, err\n\t\t}\n\t\taudit, err := NewAuditRepository(transaction)\n\t\tif err != nil {\n\t\t\treturn ports.TenantRepositories{}, err\n\t\t}\n\t\treturn ports.TenantRepositories{Tenant: tenant, Audit: audit}, nil\n'''
          if old not in text:
              raise SystemExit('tenant repository factory anchor not found')
          tenant.write_text(text.replace(old, new, 1))

          runtime = Path('internal/bizruntime/runtime.go')
          text = runtime.read_text()
          old = '''\texecutor := operation.NewExecutorWithOptions(security, operation.ExecutorOptions{Transactions: transactions, Idempotency: tenantCreationReplay{idempotency}})\n'''
          new = '''\texecutor, err := newAuditedOperationExecutor(accessDatabase, security, transactions, tenantCreationReplay{idempotency})\n\tif err != nil {\n\t\treturn generatedassembly.RuntimeBindings{}, fmt.Errorf("biz runtime: audit executor: %w", err)\n\t}\n'''
          if old not in text:
              raise SystemExit('executor anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('\t"yunka.io/framework/operation"\n', '', 1)
          old = '''\t\tnext.ServeHTTP(writer, request.WithContext(identity.WithPrincipal(request.Context(), principal)))\n'''
          new = '''\t\tnext.ServeHTTP(writer, withAuditHTTPMetadata(request, principal, webAuth))\n'''
          if old not in text:
              raise SystemExit('http auth anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\treturn handler(identity.WithPrincipal(ctx, principal), request)\n'''
          new = '''\t\treturn handler(withAuditGRPCMetadata(ctx, principal, md), request)\n'''
          if old not in text:
              raise SystemExit('grpc auth anchor not found')
          runtime.write_text(text.replace(old, new, 1))

          mapping = Path('contracts/commercial/operation-capabilities.v1.json')
          doc = json.loads(mapping.read_text())
          by_id = {item['operation_id']: item for item in doc['operations']}
          for op in ('access.audit.list', 'access.audit.get', 'access.audit.export'):
              by_id[op] = {
                  'operation_id': op,
                  'classification': 'tenant_business',
                  'module_code': 'access-management',
                  'capability_codes': ['tenant.lifecycle'],
                  'children': [],
              }
          doc['mapping_version'] = '18'
          doc['operations'] = sorted(by_id.values(), key=lambda item: item['operation_id'])
          mapping.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')
          PY
          gofmt -w \
            internal/access/application/tenant_audit_management.go \
            internal/access/domain/audit.go \
            internal/access/domain/model.go \
            internal/access/infrastructure/persistence/audit.go \
            internal/access/infrastructure/persistence/store.go \
            internal/access/infrastructure/persistence/tenant.go \
            internal/access/ports/audit.go \
            internal/access/ports/tenant.go \
            internal/bizruntime/audit.go \
            internal/bizruntime/audit_application.go \
            internal/bizruntime/audit_entitlements.go \
            internal/bizruntime/runtime.go
      - name: Generate canonical contracts and assembly
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd biz
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
      - name: Run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          go test ./internal/access/... ./internal/architecture/... ./internal/bizruntime
          go test ./cmd/biz
          git diff --check
      - name: Commit EC-RI-07 wiring and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd biz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .yunka contracts internal modules go.mod go.sum go.work.sum
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(ec-ri-07): wire and generate audit contracts"
          git push origin HEAD:feat/ec-ri-07-server-audit-trail
