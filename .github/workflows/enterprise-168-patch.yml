name: enterprise-168-one-shot-patch

on:
  push:
    branches:
      - feat/enterprise-168-sensitive-identity
    paths:
      - .github/workflows/enterprise-168-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-168-sensitive-identity
          fetch-depth: 0
      - name: Checkout locked Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: ../yunka.io
          fetch-depth: 1
          persist-credentials: false
      - name: Apply #168 runtime, tenant-profile and migration closure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return value.replace(old, new, 1)

          # Store schema: username is optional/non-authoritative until #172; tenant contact fields are independent of Account email.
          path = 'internal/access/infrastructure/persistence/store.go'
          s = read(path)
          s = replace_once(s,
              'Username        *string   `gorm:"column:username;size:64;uniqueIndex"`',
              'Username        *string   `gorm:"column:username;size:64;index"`',
              'username policy')
          old = '''type membershipRecord struct {
\tTenantID           string    `gorm:"column:tenant_id;primaryKey;size:64;uniqueIndex:uniq_member_phone_lookup,priority:1"`
\tUserID             string    `gorm:"column:user_id;primaryKey;size:64"`
\tStatus             string    `gorm:"column:status;size:32;not null;index"`
\tName               string    `gorm:"column:name;size:100;not null;default:''"`
\tPhone              string    `gorm:"column:phone;size:40;not null;default:''"`
\tPhoneCiphertext    string    `gorm:"column:phone_ciphertext;type:text"`
\tPhoneLookupHash    *string   `gorm:"column:phone_lookup_hash;size:64;uniqueIndex:uniq_member_phone_lookup,priority:2"`
\tPhoneKeyVersion    string    `gorm:"column:phone_key_version;size:64;not null;default:''"`
\tEmployeeID         string    `gorm:"column:employee_id;size:64;not null;default:''"`
\tPosition           string    `gorm:"column:position;size:100;not null;default:''"`
\tDepartmentID       string    `gorm:"column:department_id;size:64;not null;default:'';index"`
\tVersion            uint64    `gorm:"column:version;not null;default:1"`
\tCreatedAt          time.Time `gorm:"column:created_at;not null"`
\tUpdatedAt          time.Time `gorm:"column:updated_at;not null"`
}'''
          new = '''type membershipRecord struct {
\tTenantID           string    `gorm:"column:tenant_id;primaryKey;size:64;uniqueIndex:uniq_member_email_lookup,priority:1;uniqueIndex:uniq_member_phone_lookup,priority:1"`
\tUserID             string    `gorm:"column:user_id;primaryKey;size:64"`
\tStatus             string    `gorm:"column:status;size:32;not null;index"`
\tName               string    `gorm:"column:name;size:100;not null;default:''"`
\tEmail              string    `gorm:"column:email;size:320;not null;default:''"`
\tEmailCiphertext    string    `gorm:"column:email_ciphertext;type:text"`
\tEmailLookupHash    *string   `gorm:"column:email_lookup_hash;size:64;uniqueIndex:uniq_member_email_lookup,priority:2"`
\tEmailKeyVersion    string    `gorm:"column:email_key_version;size:64;not null;default:''"`
\tPhone              string    `gorm:"column:phone;size:40;not null;default:''"`
\tPhoneCiphertext    string    `gorm:"column:phone_ciphertext;type:text"`
\tPhoneLookupHash    *string   `gorm:"column:phone_lookup_hash;size:64;uniqueIndex:uniq_member_phone_lookup,priority:2"`
\tPhoneKeyVersion    string    `gorm:"column:phone_key_version;size:64;not null;default:''"`
\tEmployeeID         string    `gorm:"column:employee_id;size:64;not null;default:''"`
\tPosition           string    `gorm:"column:position;size:100;not null;default:''"`
\tDepartmentID       string    `gorm:"column:department_id;size:64;not null;default:'';index"`
\tVersion            uint64    `gorm:"column:version;not null;default:1"`
\tCreatedAt          time.Time `gorm:"column:created_at;not null"`
\tUpdatedAt          time.Time `gorm:"column:updated_at;not null"`
}'''
          s = replace_once(s, old, new, 'membership protected fields')
          write(path, s)

          # Tenant membership repository: tenant-scoped contact email is separate from global login email.
          path = 'internal/access/infrastructure/persistence/member.go'
          s = read(path)
          anchor = '''func (repository *TenantMemberRepository) accountStore() *Store {
\treturn &Store{database: repository.database, contactProtection: repository.contactProtection}
}
'''
          addition = anchor + '''
func (repository *TenantMemberRepository) newMembershipRecord(member domain.Membership, contactEmail string) (membershipRecord, error) {
\trow := membershipRecord{TenantID: member.TenantID, UserID: member.UserID, Status: member.Status, Version: member.Version, CreatedAt: member.CreatedAt, UpdatedAt: member.UpdatedAt}
\tcontactEmail = strings.TrimSpace(contactEmail)
\tif contactEmail == "" {
\t\treturn row, nil
\t}
\tnormalized, err := NormalizeEmail(contactEmail)
\tif err != nil {
\t\treturn membershipRecord{}, err
\t}
\tif repository.contactProtection == nil {
\t\trow.Email = normalized
\t\treturn row, nil
\t}
\tciphertext, lookup, version, err := repository.contactProtection.ProtectEmail(normalized)
\tif err != nil {
\t\treturn membershipRecord{}, err
\t}
\trow.EmailCiphertext = ciphertext
\trow.EmailLookupHash = &lookup
\trow.EmailKeyVersion = version
\treturn row, nil
}
'''
          s = replace_once(s, anchor, addition, 'member record helper')
          old = 'row := membershipRecord{TenantID: member.TenantID, UserID: member.UserID, Status: member.Status, Version: member.Version, CreatedAt: member.CreatedAt, UpdatedAt: member.UpdatedAt}\n\tif err := db.Create(&row).Error; err != nil {'
          new = 'row, err := repository.newMembershipRecord(member, normalizedEmail)\n\tif err != nil {\n\t\treturn domain.Membership{}, err\n\t}\n\tif err := db.Create(&row).Error; err != nil {'
          if s.count(old) != 2:
              raise SystemExit(f'membership creation: expected two matches, found {s.count(old)}')
          s = s.replace(old, new)

          start = s.index('\ttype row struct {', s.index('func (repository *TenantMemberRepository) List'))
          end = s.index('\tif err := repository.enrichMemberAccess', start)
          replacement = '''\ttype row struct {
\t\tTenantID, UserID, AccountEmail, AccountEmailCiphertext, AccountEmailKeyVersion, Status, Name string
\t\tAccountEmailLookupHash *string
\t\tEmail, EmailCiphertext, EmailKeyVersion, Phone, PhoneCiphertext, PhoneKeyVersion, EmployeeID, Position, DepartmentID string
\t\tEmailLookupHash, PhoneLookupHash *string
\t\tVersion uint64
\t\tCreatedAt, UpdatedAt time.Time
\t}
\tvar rows []row
\tif err := repository.database.WithContext(ctx).Table("biz_memberships m").
\t\tSelect("m.tenant_id, m.user_id, u.email AS account_email, u.email_ciphertext AS account_email_ciphertext, u.email_lookup_hash AS account_email_lookup_hash, u.email_key_version AS account_email_key_version, m.status, m.name, m.email, m.email_ciphertext, m.email_lookup_hash, m.email_key_version, m.phone, m.phone_ciphertext, m.phone_lookup_hash, m.phone_key_version, m.employee_id, m.position, m.department_id, m.version, m.created_at, m.updated_at").
\t\tJoins("JOIN biz_users u ON u.id = m.user_id").Where("m.tenant_id = ?", tenantID).
\t\tOrder("m.created_at ASC, m.user_id ASC").Scan(&rows).Error; err != nil {
\t\treturn nil, err
\t}
\tmembers := make([]domain.Membership, 0, len(rows))
\tfor _, value := range rows {
\t\tmembershipRow := membershipRecord{TenantID: value.TenantID, UserID: value.UserID, Status: value.Status, Name: value.Name, Email: value.Email, EmailCiphertext: value.EmailCiphertext, EmailLookupHash: value.EmailLookupHash, EmailKeyVersion: value.EmailKeyVersion, Phone: value.Phone, PhoneCiphertext: value.PhoneCiphertext, PhoneLookupHash: value.PhoneLookupHash, PhoneKeyVersion: value.PhoneKeyVersion, EmployeeID: value.EmployeeID, Position: value.Position, DepartmentID: value.DepartmentID, Version: value.Version, CreatedAt: value.CreatedAt, UpdatedAt: value.UpdatedAt}
\t\taccountRow := userRecord{ID: value.UserID, Email: value.AccountEmail, EmailCiphertext: value.AccountEmailCiphertext, EmailLookupHash: value.AccountEmailLookupHash, EmailKeyVersion: value.AccountEmailKeyVersion}
\t\temail, err := repository.displayMemberEmail(membershipRow, accountRow)
\t\tif err != nil {
\t\t\treturn nil, err
\t\t}
\t\tphone, err := repository.displayPhone(membershipRow)
\t\tif err != nil {
\t\t\treturn nil, err
\t\t}
\t\tmembers = append(members, domain.Membership{TenantID: value.TenantID, UserID: value.UserID, Email: email, Status: value.Status, Name: value.Name, Phone: phone, EmployeeID: value.EmployeeID, Position: value.Position, DepartmentID: value.DepartmentID, Version: value.Version, DerivedDataScope: domain.DataScopeNone, CreatedAt: value.CreatedAt, UpdatedAt: value.UpdatedAt})
\t}
'''
          s = s[:start] + replacement + s[end:]

          old = '''\temail, err := repository.accountStore().displayUserEmail(user)
\tif err != nil {
\t\treturn domain.Membership{}, err
\t}
\tphone, err := repository.displayPhone(row)'''
          new = '''\temail, err := repository.displayMemberEmail(row, user)
\tif err != nil {
\t\treturn domain.Membership{}, err
\t}
\tphone, err := repository.displayPhone(row)'''
          s = replace_once(s, old, new, 'member detail email')
          anchor = 'func (repository *TenantMemberRepository) displayPhone(row membershipRecord) (string, error) {'
          helper = '''func (repository *TenantMemberRepository) displayMemberEmail(row membershipRecord, account userRecord) (string, error) {
\tif strings.TrimSpace(row.EmailCiphertext) != "" || strings.TrimSpace(row.EmailKeyVersion) != "" || row.EmailLookupHash != nil {
\t\tif repository.contactProtection == nil {
\t\t\treturn "", ErrSensitiveDataKeyUnavailable
\t\t}
\t\tplain, err := repository.contactProtection.DecryptEmail(row.EmailCiphertext, row.EmailKeyVersion)
\t\tif err != nil {
\t\t\treturn "", err
\t\t}
\t\treturn MaskEmail(plain), nil
\t}
\tif strings.TrimSpace(row.Email) != "" {
\t\tnormalized, err := NormalizeEmail(row.Email)
\t\tif err != nil {
\t\t\treturn "", err
\t\t}
\t\tif repository.contactProtection != nil {
\t\t\treturn MaskEmail(normalized), nil
\t\t}
\t\treturn normalized, nil
\t}
\treturn repository.accountStore().displayUserEmail(account)
}

''' + anchor
          s = replace_once(s, anchor, helper, 'display member email helper')
          write(path, s)

          # OIDC subject binding uses protected Account lookup and stops persisting a second plaintext email copy.
          path = 'internal/access/infrastructure/persistence/web_session.go'
          s = read(path)
          s = s.replace('Email: strings.TrimSpace(email), CreatedAt: now, UpdatedAt: now,', 'Email: "", CreatedAt: now, UpdatedAt: now,', 1)
          pattern = re.compile(r'func \(store \*Store\) ResolveOrBindOIDCIdentity\(ctx context\.Context, issuer, subject, email string, emailVerified bool\) \(WebIdentity, error\) \{.*?\n\}\n\nfunc \(store \*Store\) validateWebIdentityAuthority', re.S)
          replacement = '''func (store *Store) ResolveOrBindOIDCIdentity(ctx context.Context, issuer, subject, email string, emailVerified bool) (WebIdentity, error) {
\tissuer = strings.TrimSpace(issuer)
\tsubject = strings.TrimSpace(subject)
\temail = strings.TrimSpace(email)
\tif store == nil || store.database == nil || issuer == "" || subject == "" {
\t\treturn WebIdentity{}, ErrWebIdentityUnbound
\t}
\tvar link webIdentityRecord
\terr := store.database.WithContext(ctx).Where("issuer = ? AND subject = ?", issuer, subject).First(&link).Error
\tif err == nil {
\t\tif err := store.validateWebIdentityAuthority(ctx, link); err != nil {
\t\t\treturn WebIdentity{}, err
\t\t}
\t\treturn webIdentityFromRecord(link), nil
\t}
\tif !errors.Is(err, gorm.ErrRecordNotFound) {
\t\treturn WebIdentity{}, err
\t}
\tif !emailVerified || email == "" {
\t\treturn WebIdentity{}, ErrWebIdentityUnbound
\t}
\tuser, _, err := store.findUserByEmail(ctx, store.database, email, true)
\tif err != nil {
\t\tif errors.Is(err, gorm.ErrRecordNotFound) || errors.Is(err, ErrInvalidContact) {
\t\t\treturn WebIdentity{}, ErrWebIdentityUnbound
\t\t}
\t\treturn WebIdentity{}, err
\t}
\tnow := time.Now().UTC()
\tcandidate := webIdentityRecord{Issuer: issuer, Subject: subject, ActorKind: WebActorUser, ActorID: user.ID, Email: "", CreatedAt: now, UpdatedAt: now}
\tif err := store.database.WithContext(ctx).Clauses(clause.OnConflict{DoNothing: true}).Create(&candidate).Error; err != nil {
\t\treturn WebIdentity{}, err
\t}
\tif err := store.database.WithContext(ctx).Where("issuer = ? AND subject = ?", issuer, subject).First(&link).Error; err != nil {
\t\treturn WebIdentity{}, err
\t}
\tif err := store.validateWebIdentityAuthority(ctx, link); err != nil {
\t\treturn WebIdentity{}, err
\t}
\treturn webIdentityFromRecord(link), nil
}

func (store *Store) validateWebIdentityAuthority'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'OIDC binding replacement count={count}')
          s = replace_once(s,
              'return WebIdentity{Issuer: record.Issuer, Subject: record.Subject, ActorKind: record.ActorKind, ActorID: record.ActorID, Email: record.Email}',
              'return WebIdentity{Issuer: record.Issuer, Subject: record.Subject, ActorKind: record.ActorKind, ActorID: record.ActorID}',
              'web identity no duplicate email')
          write(path, s)

          # Explicit runtime injection while retaining legacy BootstrapWithOptions for existing qualification paths.
          path = 'internal/bizruntime/runtime.go'
          s = read(path)
          old = 'func BootstrapWithOptions(ctx context.Context, provider *platform.Provider, options Options) (*Started, error) {\n'
          new = '''func BootstrapWithOptions(ctx context.Context, provider *platform.Provider, options Options) (*Started, error) {
\treturn bootstrapWithOptions(ctx, provider, options, nil)
}

func BootstrapWithOptionsAndContactProtection(ctx context.Context, provider *platform.Provider, options Options, protection *accesspersistence.ContactProtection) (*Started, error) {
\tif protection == nil {
\t\treturn nil, accesspersistence.ErrSensitiveDataKeyUnavailable
\t}
\treturn bootstrapWithOptions(ctx, provider, options, protection)
}

func bootstrapWithOptions(ctx context.Context, provider *platform.Provider, options Options, protection *accesspersistence.ContactProtection) (*Started, error) {
'''
          s = replace_once(s, old, new, 'runtime bootstrap wrapper')
          s = replace_once(s,
              'return bindRuntime(bindCtx, prepared, options, authenticator, webAuth, worker)',
              'return bindRuntimeWithContactProtection(bindCtx, prepared, options, authenticator, webAuth, protection, worker)',
              'runtime protected bind')
          old = 'func bindRuntime(ctx context.Context, provider *platform.Provider, options Options, authenticator *runtimeAuthenticator, webAuth *runtimeWebAuth, workers ...*provisioningRunner) (generatedassembly.RuntimeBindings, error) {\n'
          new = '''func bindRuntime(ctx context.Context, provider *platform.Provider, options Options, authenticator *runtimeAuthenticator, webAuth *runtimeWebAuth, workers ...*provisioningRunner) (generatedassembly.RuntimeBindings, error) {
\treturn bindRuntimeWithContactProtection(ctx, provider, options, authenticator, webAuth, nil, workers...)
}

func bindRuntimeWithContactProtection(ctx context.Context, provider *platform.Provider, options Options, authenticator *runtimeAuthenticator, webAuth *runtimeWebAuth, protection *accesspersistence.ContactProtection, workers ...*provisioningRunner) (generatedassembly.RuntimeBindings, error) {
'''
          s = replace_once(s, old, new, 'bind runtime wrapper')
          old = '''\taccessStore, err := accesspersistence.New(accessDatabase)
\tif err != nil {
\t\treturn generatedassembly.RuntimeBindings{}, err
\t}'''
          new = '''\tvar accessStore *accesspersistence.Store
\tif protection == nil {
\t\taccessStore, err = accesspersistence.New(accessDatabase)
\t} else {
\t\taccessStore, err = accesspersistence.NewWithContactProtection(accessDatabase, protection)
\t}
\tif err != nil {
\t\treturn generatedassembly.RuntimeBindings{}, err
\t}'''
          s = replace_once(s, old, new, 'protected store')
          old = '''\tmemberRepositories, err := accesspersistence.NewTenantMemberRepositoryFactory(accessDatabase)
\tif err != nil {
\t\treturn generatedassembly.RuntimeBindings{}, err
\t}'''
          new = '''\tvar memberRepositories requestscope.RepositoryFactory[accessports.TenantMemberRepositories]
\tif protection == nil {
\t\tmemberRepositories, err = accesspersistence.NewTenantMemberRepositoryFactory(accessDatabase)
\t} else {
\t\tmemberRepositories, err = accesspersistence.NewTenantMemberRepositoryFactoryWithContactProtection(accessDatabase, protection)
\t}
\tif err != nil {
\t\treturn generatedassembly.RuntimeBindings{}, err
\t}'''
          s = replace_once(s, old, new, 'protected member factory')
          write(path, s)

          # API process parses one shared PII key configuration and injects it explicitly.
          path = 'cmd/biz/main.go'
          s = read(path)
          marker = '\tprovider, err := platform.New(platform.Options{\n'
          insert = '''\tcontactProtection, err := bizruntime.BuildContactProtection(
\t\tos.Getenv("YUNKA_BIZ_PII_ACTIVE_KEY_VERSION"),
\t\tos.Getenv("YUNKA_BIZ_PII_KEYS_JSON"),
\t\tos.Getenv("YUNKA_BIZ_PII_LOOKUP_KEY_B64"),
\t)
\tif err != nil {
\t\treturn err
\t}

''' + marker
          s = replace_once(s, marker, insert, 'biz PII config')
          old = '''\tstarted, err := bizruntime.BootstrapWithOptions(ctx, provider, bizruntime.Options{
\t\tDeviceOps:           config,
\t\tCommercialLifecycle: lifecycle,
\t\tProvisioningWorker: bizruntime.ProvisioningWorkerOptions{
\t\t\tToken: workerToken, Automatic: workerToken != "",
\t\t},
\t\tWebAuth: webAuth,
\t})
\tif err != nil {
\t\treturn err
\t}'''
          new = '''\truntimeOptions := bizruntime.Options{
\t\tDeviceOps:           config,
\t\tCommercialLifecycle: lifecycle,
\t\tProvisioningWorker: bizruntime.ProvisioningWorkerOptions{Token: workerToken, Automatic: workerToken != ""},
\t\tWebAuth:             webAuth,
\t}
\tvar started *bizruntime.Started
\tif contactProtection == nil {
\t\tstarted, err = bizruntime.BootstrapWithOptions(ctx, provider, runtimeOptions)
\t} else {
\t\tstarted, err = bizruntime.BootstrapWithOptionsAndContactProtection(ctx, provider, runtimeOptions, contactProtection)
\t}
\tif err != nil {
\t\treturn err
\t}'''
          s = replace_once(s, old, new, 'biz protected bootstrap')
          write(path, s)

          # IdP process must use the same contact keys as API runtime.
          path = 'cmd/biz-idp/main.go'
          s = read(path)
          marker = '\tdatabase, err := gorm.Open(gormmysql.Open(dsn), &gorm.Config{})\n'
          insert = '''\tcontactProtection, err := bizruntime.BuildContactProtection(
\t\tos.Getenv("YUNKA_BIZ_PII_ACTIVE_KEY_VERSION"),
\t\tos.Getenv("YUNKA_BIZ_PII_KEYS_JSON"),
\t\tos.Getenv("YUNKA_BIZ_PII_LOOKUP_KEY_B64"),
\t)
\tif err != nil {
\t\treturn err
\t}
''' + marker
          s = replace_once(s, marker, insert, 'idp PII config')
          old = '''\tstore, err := accesspersistence.New(database)
\tif err != nil {
\t\treturn err
\t}'''
          new = '''\tvar store *accesspersistence.Store
\tif contactProtection == nil {
\t\tstore, err = accesspersistence.New(database)
\t} else {
\t\tstore, err = accesspersistence.NewWithContactProtection(database, contactProtection)
\t}
\tif err != nil {
\t\treturn err
\t}'''
          s = replace_once(s, old, new, 'idp protected store')
          write(path, s)

          # Controlled legacy backfill. Caller chooses bounded batches and owns rollout/backup decisions.
          write('internal/access/infrastructure/persistence/contact_backfill.go', r'''package persistence

import (
	"context"
	"errors"
	"strings"

	"gorm.io/gorm"
	"gorm.io/gorm/clause"
)

type ContactBackfillResult struct {
	Users       uint64
	Memberships uint64
	Phones      uint64
}

func (store *Store) BackfillLegacyContacts(ctx context.Context, limit int) (ContactBackfillResult, error) {
	if store == nil || store.database == nil || store.contactProtection == nil {
		return ContactBackfillResult{}, ErrSensitiveDataKeyUnavailable
	}
	if limit <= 0 || limit > 1000 {
		return ContactBackfillResult{}, errors.New("access: legacy contact backfill limit must be between 1 and 1000")
	}
	var result ContactBackfillResult
	err := store.database.WithContext(ctx).Transaction(func(tx *gorm.DB) error {
		var users []userRecord
		if err := tx.Clauses(clause.Locking{Strength: "UPDATE"}).Where("email_ciphertext = '' AND email <> '' AND email NOT LIKE ?", protectedEmailPrefix+"%").Order("id ASC").Limit(limit).Find(&users).Error; err != nil {
			return err
		}
		for index := range users {
			email, err := NormalizeEmail(users[index].Email)
			if err != nil {
				return err
			}
			if err := store.protectLegacyUserEmail(ctx, tx, &users[index], email); err != nil {
				return err
			}
			result.Users++
		}

		var memberships []membershipRecord
		if err := tx.Clauses(clause.Locking{Strength: "UPDATE"}).Where("email_ciphertext = '' OR (phone_ciphertext = '' AND phone <> '')").Order("tenant_id ASC, user_id ASC").Limit(limit).Find(&memberships).Error; err != nil {
			return err
		}
		for _, member := range memberships {
			updates := map[string]any{}
			if strings.TrimSpace(member.EmailCiphertext) == "" {
				contactEmail := strings.TrimSpace(member.Email)
				if contactEmail == "" {
					var account userRecord
					if err := tx.Where("id = ?", member.UserID).First(&account).Error; err != nil {
						return err
					}
					var err error
					contactEmail, err = store.userEmail(account)
					if err != nil {
						return err
					}
				}
				ciphertext, lookup, version, err := store.contactProtection.ProtectEmail(contactEmail)
				if err != nil {
					return err
				}
				updates["email"] = ""
				updates["email_ciphertext"] = ciphertext
				updates["email_lookup_hash"] = lookup
				updates["email_key_version"] = version
				result.Memberships++
			}
			if strings.TrimSpace(member.PhoneCiphertext) == "" && strings.TrimSpace(member.Phone) != "" {
				ciphertext, lookup, version, err := store.contactProtection.ProtectPhone(member.Phone)
				if err != nil {
					return err
				}
				updates["phone"] = ""
				updates["phone_ciphertext"] = ciphertext
				updates["phone_lookup_hash"] = lookup
				updates["phone_key_version"] = version
				result.Phones++
			}
			if len(updates) == 0 {
				continue
			}
			if err := tx.Model(&membershipRecord{}).Where("tenant_id = ? AND user_id = ?", member.TenantID, member.UserID).Updates(updates).Error; err != nil {
				return err
			}
		}
		return nil
	})
	return result, err
}
''')

          # Versioned schema only; data backfill is deliberately separate and bounded.
          write('internal/access/infrastructure/persistence/migrations/0007_enterprise_sensitive_contacts.sql', r'''ALTER TABLE biz_users
  ADD COLUMN username VARCHAR(64) NULL,
  ADD COLUMN email_ciphertext TEXT NULL,
  ADD COLUMN email_lookup_hash VARCHAR(64) NULL,
  ADD COLUMN email_key_version VARCHAR(64) NOT NULL DEFAULT '';

CREATE INDEX idx_biz_users_username ON biz_users(username);
CREATE UNIQUE INDEX uniq_biz_users_email_lookup_hash ON biz_users(email_lookup_hash);

ALTER TABLE biz_memberships
  ADD COLUMN email VARCHAR(320) NOT NULL DEFAULT '',
  ADD COLUMN email_ciphertext TEXT NULL,
  ADD COLUMN email_lookup_hash VARCHAR(64) NULL,
  ADD COLUMN email_key_version VARCHAR(64) NOT NULL DEFAULT '',
  ADD COLUMN phone_ciphertext TEXT NULL,
  ADD COLUMN phone_lookup_hash VARCHAR(64) NULL,
  ADD COLUMN phone_key_version VARCHAR(64) NOT NULL DEFAULT '';

CREATE UNIQUE INDEX uniq_biz_memberships_email_lookup ON biz_memberships(tenant_id, email_lookup_hash);
CREATE UNIQUE INDEX uniq_biz_memberships_phone_lookup ON biz_memberships(tenant_id, phone_lookup_hash);

-- OIDC subject linkage is authoritative by issuer/subject -> actor. Email is not
