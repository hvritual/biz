name: enterprise-168-one-shot-patch

on:
  push:
    branches:
      - feat/enterprise-168-sensitive-identity
    paths:
      - .github/workflows/enterprise-168-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-168-sensitive-identity
          path: biz
          fetch-depth: 0
      - name: Checkout locked Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Apply and qualify patch
        shell: bash
        working-directory: biz
        run: |
          set -euo pipefail
          python3 scripts/enterprise_168_patch.py
          gofmt -w \
            internal/access/infrastructure/persistence/contact_protection.go \
            internal/access/infrastructure/persistence/user_contact.go \
            internal/access/infrastructure/persistence/contact_backfill.go \
            internal/access/infrastructure/persistence/contact_protection_test.go \
            internal/access/infrastructure/persistence/store.go \
            internal/access/infrastructure/persistence/member.go \
            internal/access/infrastructure/persistence/first_party_idp.go \
            internal/access/infrastructure/persistence/web_session.go \
            internal/bizruntime/sensitive_data.go \
            internal/bizruntime/sensitive_data_test.go \
            internal/bizruntime/runtime.go \
            cmd/biz/main.go \
            cmd/biz-idp/main.go
          go test ./internal/access/infrastructure/persistence ./internal/access/application ./internal/bizruntime
          go test ./cmd/biz ./cmd/biz-idp ./cmd/biz-idp-credential
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz ./cmd/biz-idp
      - name: Commit business changes and self-delete temporary patch files
        shell: bash
        working-directory: biz
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-168-patch.yml scripts/enterprise_168_patch.py
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          git commit -m "feat(access): close protected account and tenant contact boundary"
          git push origin HEAD:feat/enterprise-168-sensitive-identity
