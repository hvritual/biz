name: enterprise-169-dev-qualification
on:
  push:
    branches:
      - feat/enterprise-169-consent-gate
    paths:
      - .github/workflows/enterprise-169-dev.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-169-consent-gate
          path: biz
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format and focused qualification
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w             internal/access/infrastructure/persistence/privacy_consent.go             internal/access/infrastructure/persistence/first_party_idp.go             internal/access/infrastructure/persistence/first_party_idp_security.go             internal/bizruntime/config.go             internal/bizruntime/first_party_idp.go             internal/bizruntime/first_party_idp_hardening_test.go             internal/bizruntime/privacy_consent_config_test.go             cmd/biz-idp/main.go
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
      - name: Commit formatting and remove temporary workflow
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-169-dev.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore: qualify #169 backend consent gate"
            git push origin HEAD:feat/enterprise-169-consent-gate
          fi
