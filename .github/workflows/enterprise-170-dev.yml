name: enterprise-170-dev
# current candidate qualification
# rerun after database-authoritative expiry fixture
on:
  push:
    branches:
      - feat/enterprise-170-verification-notification
    paths:
      - .github/workflows/enterprise-170-dev.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise170_dev?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise170_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-170-verification-notification
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format check
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l             internal/access/domain/verification.go             internal/access/ports/verification.go             internal/access/application/verification.go             internal/access/infrastructure/notification/memory.go             internal/access/infrastructure/persistence/verification_protection.go             internal/access/infrastructure/persistence/verification.go             internal/access/infrastructure/persistence/verification_protection_test.go             internal/bizruntime/verification_security.go             internal/bizruntime/verification_security_test.go             internal/bizruntime/verification_http.go             integration/enterprise_170_verification_notification_mysql_test.go)"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }
      - name: Unit vet and build
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/access/domain ./internal/access/ports ./internal/access/application ./internal/access/infrastructure/notification ./internal/access/infrastructure/persistence ./internal/bizruntime
          go vet ./internal/access/domain ./internal/access/ports ./internal/access/application ./internal/access/infrastructure/notification ./internal/access/infrastructure/persistence ./internal/bizruntime
          go build ./cmd/biz ./cmd/biz-idp
      - name: Real MySQL qualification
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise170'
      - name: Clean worktree
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"
