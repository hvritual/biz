name: enterprise-170-finalize
# rerun after MySQL precision canonicalization
# rerun after persisted-record binding canonicalization
on:
  push:
    branches:
      - feat/enterprise-170-verification-notification
    paths:
      - .github/workflows/enterprise-170-finalize.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise170_final?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise170_final
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-170-verification-notification
          path: biz
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format candidate
        working-directory: biz
        run: |
          gofmt -w             internal/access/domain/verification.go             internal/access/ports/verification.go             internal/access/application/verification.go             internal/access/infrastructure/notification/memory.go             internal/access/infrastructure/persistence/verification_protection.go             internal/access/infrastructure/persistence/verification.go             internal/access/infrastructure/persistence/verification_protection_test.go             internal/bizruntime/verification_security.go             internal/bizruntime/verification_security_test.go             internal/bizruntime/verification_http.go             integration/enterprise_170_verification_notification_mysql_test.go
      - name: Unit vet build
        working-directory: biz
        run: |
          set -euo pipefail
          go test ./internal/access/domain ./internal/access/ports ./internal/access/application ./internal/access/infrastructure/notification ./internal/access/infrastructure/persistence ./internal/bizruntime
          go vet ./internal/access/domain ./internal/access/ports ./internal/access/application ./internal/access/infrastructure/notification ./internal/access/infrastructure/persistence ./internal/bizruntime
          go build ./cmd/biz ./cmd/biz-idp
      - name: Real MySQL qualification
        working-directory: biz
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise170'
      - name: Static boundary
        working-directory: biz
        run: |
          set -euo pipefail
          ! grep -R -n 'internal/commercial' internal/access/domain/verification.go internal/access/ports/verification.go internal/access/application/verification.go internal/access/infrastructure/persistence/verification.go
          ! grep -R -n 'firstPartyAuthorizationCode' internal/access/domain/verification.go internal/access/application/verification.go internal/access/infrastructure/persistence/verification.go
          grep -q 'ResendInterval < time.Minute' internal/access/domain/verification.go
          grep -q 'StatusTooManyRequests' internal/bizruntime/verification_http.go
      - name: Commit formatted final candidate and remove temporary workflows
        working-directory: biz
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-170-finalize.yml .github/workflows/enterprise-170-dev.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          git commit -m "feat(access): complete #170 verification foundation"
          git push origin HEAD:feat/enterprise-170-verification-notification
