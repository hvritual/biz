name: enterprise-171-format
on:
  push:
    branches:
      - feat/enterprise-171-session-isolation
    paths:
      - .github/workflows/enterprise-171-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-171-session-isolation
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format
        run: |
          gofmt -w             internal/access/infrastructure/persistence/web_session.go             internal/access/infrastructure/persistence/first_party_idp_security.go             internal/access/infrastructure/persistence/member.go             internal/bizruntime/config.go internal/bizruntime/web_auth.go             internal/bizruntime/web_session_precondition.go internal/bizruntime/web_session_precondition_test.go             cmd/biz/main.go integration/ce12_web_session_mysql_test.go             integration/enterprise_171_session_isolation_mysql_test.go
      - name: Commit
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-171-format.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore: format #171 session isolation changes"
            git push origin HEAD:feat/enterprise-171-session-isolation
          fi
