name: Enterprise 171 session isolation qualification

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise171?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise171
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Static session authority boundary
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l             biz/internal/access/infrastructure/persistence/web_session.go             biz/internal/access/infrastructure/persistence/first_party_idp_security.go             biz/internal/access/infrastructure/persistence/member.go             biz/internal/bizruntime/config.go             biz/internal/bizruntime/web_auth.go             biz/internal/bizruntime/web_session_precondition.go             biz/internal/bizruntime/web_session_precondition_test.go             biz/cmd/biz/main.go             biz/integration/ce12_web_session_mysql_test.go             biz/integration/enterprise_171_session_isolation_mysql_test.go)"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }
          grep -q 'context_version' biz/internal/access/infrastructure/persistence/web_session.go
          grep -q 'context_version' biz/internal/bizruntime/web_session_precondition.go
          grep -q 'SessionRefreshWindow' biz/internal/bizruntime/config.go
          grep -q 'membership_suspended' biz/integration/enterprise_171_session_isolation_mysql_test.go
          grep -q 'account_security' biz/integration/enterprise_171_session_isolation_mysql_test.go
          grep -q 'BroadcastChannel' biz/web/src/services/runtime/sessionCoordinator.ts
          grep -q 'cancelTrustedSessionRequests' biz/web/src/stores/enterprise.ts
          ! grep -q 'tenantId' biz/web/src/services/runtime/sessionCoordinator.ts
          ! grep -R -nE '(localStorage|sessionStorage).*(tenant|active_tenant)'             biz/web/src/services/runtime biz/web/src/stores/enterprise.ts

      - name: Go unit vet and build
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz
          go build ./cmd/biz ./cmd/biz-idp

      - name: Real MySQL session isolation
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration ./integration -run '^(TestCE12WebSession|TestCE12OIDCBinding|TestCE12PlatformWebAuthority|TestEnterprise171)'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Web session isolation qualification
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run type-check
          npm run lint
          npm run check:architecture
          npm run check:ui-contracts
          npm run check:route-convergence
          npm run check:i18n
          npm run test:unit
          npx playwright test --config playwright.ce12.config.ts --list | tee /tmp/enterprise171-playwright.txt
          grep -q 'TestEnterprise171CrossTabTenantIsolationBackNavigationAndStaleContext' /tmp/enterprise171-playwright.txt

      - name: Verify candidate clean
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"
