name: enterprise-172-dev-mysql
on:
  push:
    branches:
      - feat/enterprise-172-native-login
    paths:
      - .github/workflows/enterprise-172-dev-mysql.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise172_dev?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise172_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-172-native-login
          path: biz
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format unit vet and MySQL
        working-directory: biz
        run: |
          set -euo pipefail
          gofmt -w             internal/access/infrastructure/persistence/login_identifier.go             internal/access/infrastructure/persistence/login_identifier_test.go             internal/bizruntime/first_party_native_login.go             internal/bizruntime/first_party_native_login_test.go             integration/enterprise_172_native_login_mysql_test.go             integration/ce12_browser_seed_test.go
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go test -tags=qualification ./cmd/biz-idp
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise172'
      - name: Commit formatting and self-delete
        working-directory: biz
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-172-dev-mysql.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          git commit -m "chore: qualify #172 MySQL matrix"
          git push origin HEAD:feat/enterprise-172-native-login
