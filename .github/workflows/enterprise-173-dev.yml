name: enterprise-173-dev
# rerun after formatting
# rerun after character-length fix
on:
  push:
    branches:
      - feat/enterprise-173-password-recovery
    paths:
      - .github/workflows/enterprise-173-dev.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-173-password-recovery
          path: biz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format check
        working-directory: biz
        run: |
          set -euo pipefail
          bad="$(gofmt -l             internal/access/infrastructure/persistence/credential_security.go             internal/access/infrastructure/persistence/credential_security_test.go             internal/access/infrastructure/persistence/first_party_idp.go             internal/bizruntime/config.go             internal/bizruntime/first_party_idp.go             internal/bizruntime/first_party_idp_server.go             internal/bizruntime/first_party_password_recovery.go             internal/bizruntime/web_auth.go             internal/bizruntime/web_password_security.go             cmd/biz-idp/main.go)"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }
      - name: Unit vet build
        working-directory: biz
        run: |
          set -euo pipefail
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go build ./cmd/biz ./cmd/biz-idp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json
      - name: Web check
        working-directory: biz/web
        run: |
          npm ci
          npm run check
