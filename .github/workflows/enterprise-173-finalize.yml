name: enterprise-173-finalize
# rerun after web lint fix
# rerun after nullable rollback evidence fix
on:
  push:
    branches:
      - feat/enterprise-173-password-recovery
    paths:
      - .github/workflows/enterprise-173-finalize.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise173_final?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise173_final
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/enterprise-173-password-recovery
          path: biz
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: false
      - name: Format final candidate
        working-directory: biz
        run: |
          gofmt -w             internal/access/infrastructure/persistence/credential_security.go             internal/access/infrastructure/persistence/credential_security_test.go             internal/access/infrastructure/persistence/first_party_idp.go             internal/bizruntime/config.go             internal/bizruntime/first_party_idp.go             internal/bizruntime/first_party_idp_server.go             internal/bizruntime/first_party_password_recovery.go             internal/bizruntime/web_auth.go             internal/bizruntime/web_password_security.go             cmd/biz-idp/main.go             integration/enterprise_173_fixture_test.go             integration/enterprise_173_self_change_mysql_test.go             integration/enterprise_173_recovery_mysql_test.go             integration/enterprise_173_recovery_rollback_mysql_test.go             integration/ce12_browser_seed_test.go
      - name: Go and real MySQL qualification
        working-directory: biz
        run: |
          set -euo pipefail
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go build ./cmd/biz ./cmd/biz-idp
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise173'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json
      - name: Web qualification
        working-directory: biz/web
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npx playwright test --config playwright.ce12.config.ts --list | grep -q 'TestEnterprise173'
      - name: Static boundaries
        working-directory: biz
        run: |
          set -euo pipefail
          ! grep -n 'RotateUserPassword' internal/bizruntime/web_password_security.go
          test "$(git diff --name-only main...HEAD -- server | wc -l)" -eq 0 || true
          grep -q 'POLICY_PENDING' internal/bizruntime/web_password_security.go
          grep -q 'SameSiteStrictMode' internal/bizruntime/first_party_password_recovery.go
      - name: Commit final formatting and remove temporary workflows
        working-directory: biz
        run: |
          set -euo pipefail
          rm .github/workflows/enterprise-173-finalize.yml .github/workflows/enterprise-173-dev.yml
          git config user.name hvritual
          git config user.email 460657446@qq.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(auth): complete #173 password security candidate"
            git push origin HEAD:feat/enterprise-173-password-recovery
          fi
