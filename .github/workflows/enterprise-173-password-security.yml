name: Enterprise 173 password security qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise173?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise173
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"
          test "$YUNKA_COMMIT" = "9ee6640f5e19777b4c04d9e4937a93e2035eacda"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Static password security boundary
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l             biz/internal/access/infrastructure/persistence/credential_security.go             biz/internal/access/infrastructure/persistence/credential_security_test.go             biz/internal/access/infrastructure/persistence/first_party_idp.go             biz/internal/bizruntime/config.go             biz/internal/bizruntime/first_party_idp.go             biz/internal/bizruntime/first_party_idp_server.go             biz/internal/bizruntime/first_party_password_recovery.go             biz/internal/bizruntime/web_auth.go             biz/internal/bizruntime/web_password_security.go             biz/cmd/biz-idp/main.go             biz/integration/enterprise_173_fixture_test.go             biz/integration/enterprise_173_self_change_mysql_test.go             biz/integration/enterprise_173_recovery_mysql_test.go             biz/integration/enterprise_173_recovery_rollback_mysql_test.go             biz/integration/ce12_browser_seed_test.go)"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }

          ! grep -n 'RotateUserPassword' biz/internal/bizruntime/web_password_security.go
          grep -q 'tenant.member.password_recovery.request' biz/internal/bizruntime/web_password_security.go
          grep -q 'org.basic.user.reset' biz/internal/bizruntime/web_password_security.go
          grep -q 'POLICY_PENDING' biz/internal/bizruntime/web_password_security.go
          grep -q 'Q-007' biz/internal/bizruntime/web_password_security.go
          grep -q 'SameSiteStrictMode' biz/internal/bizruntime/first_party_password_recovery.go
          grep -q 'RecoverPasswordWithCode' biz/internal/access/infrastructure/persistence/credential_security.go
          grep -q 'revokeWebSessionsForUser' biz/internal/access/infrastructure/persistence/credential_security.go

          leaks="$(grep -R -nEi '(fmt|log)\.(Print|Printf|Println).*\b(password|otp|secret|credential)\b'             biz/internal/access/infrastructure/persistence/credential_security.go             biz/internal/bizruntime/first_party_password_recovery.go             biz/internal/bizruntime/web_password_security.go             biz/cmd/biz-idp || true)"
          test -z "$leaks" || { printf '%s\n' "$leaks"; exit 1; }

      - name: Unit vet and production build
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go vet ./internal/access/infrastructure/persistence ./internal/bizruntime ./cmd/biz-idp
          go build ./cmd/biz ./cmd/biz-idp

      - name: Real MySQL password security qualification
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise173'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Web password security qualification
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npx playwright test --config playwright.ce12.config.ts --list > "$RUNNER_TEMP/enterprise-173-playwright-list.txt"
          grep -q 'TestEnterprise173' "$RUNNER_TEMP/enterprise-173-playwright-list.txt"

      - name: Verify candidate clean
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"
