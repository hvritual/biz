name: Enterprise 174 current authorization gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/enterprise-174-current-authorization.yml
      - .yunka/source.env
      - Makefile
      - contracts/**
      - internal/access/**
      - internal/bizruntime/**
      - integration/enterprise_174_current_authorization_mysql_test.go
      - web/package.json
      - web/package-lock.json
      - web/src/features/enterprise/**
      - web/src/services/enterprise/**
      - web/src/services/runtime/**
      - web/tests/ce12/enterprise-174-authorization.spec.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/enterprise-174-current-authorization.yml
      - .yunka/source.env
      - Makefile
      - contracts/**
      - internal/access/**
      - internal/bizruntime/**
      - integration/enterprise_174_current_authorization_mysql_test.go
      - web/package.json
      - web/package-lock.json
      - web/src/features/enterprise/**
      - web/src/services/enterprise/**
      - web/src/services/runtime/**
      - web/tests/ce12/enterprise-174-authorization.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-174-current-authorization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc and Go plugins
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3             "https://github.com/protocolbuffers/protobuf/releases/download/v${{ steps.lock.outputs.protoc_release }}/protoc-${{ steps.lock.outputs.protoc_release }}-linux-x86_64.zip"             -o "$archive"
          echo "${{ steps.lock.outputs.protoc_sha256 }}  $archive" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prove canonical generated contracts are committed
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --exit-code
            echo "::error::make generate changed the candidate; commit canonical generated artifacts"
            exit 1
          fi

      - name: Run canonical consumer gate
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          make check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Run #174 Go contract and compile qualification
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          changed=(
            integration/enterprise_174_current_authorization_mysql_test.go
            internal/access/application/tenant_audit_management.go
            internal/access/application/tenant_audit_management_test.go
            internal/access/authorization/catalog.go
            internal/access/authorization/catalog_test.go
            internal/access/domain/audit.go
            internal/access/infrastructure/persistence/audit.go
            internal/access/infrastructure/persistence/current_authorization.go
            internal/access/infrastructure/persistence/platform.go
            internal/bizruntime/audit.go
            internal/bizruntime/runtime.go
            internal/bizruntime/web_auth.go
            internal/bizruntime/web_authorization.go
          )
          bad="$(gofmt -l "${changed[@]}")"
          test -z "$bad" || { printf 'gofmt required:\n%s\n' "$bad"; exit 1; }
          go test -count=1 ./internal/access/authorization ./internal/access/application ./internal/access/infrastructure/persistence ./internal/bizruntime
          go vet ./internal/access/authorization ./internal/access/application ./internal/access/infrastructure/persistence ./internal/bizruntime
          go build -o "$RUNNER_TEMP/biz" ./cmd/biz

      - name: Verify candidate remains clean
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"

  mysql-current-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_TEST_RESET_FIXTURES: "1"
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise174?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise174
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false

      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Run real MySQL #174 authorization qualification
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags=integration ./integration -run '^TestEnterprise174'

      - name: Verify candidate remains clean
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"

  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: biz/web/package-lock.json

      - name: Run Web static and #174 contract qualification
        working-directory: biz/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npx playwright test --config playwright.ce12.config.ts --list > "$RUNNER_TEMP/enterprise-174-playwright-list.txt"
          grep -q 'TestEnterprise174CurrentAuthorizationAndActionCatalogAreSameSource' "$RUNNER_TEMP/enterprise-174-playwright-list.txt"

      - name: Verify candidate remains clean
        shell: bash
        run: test -z "$(git -C biz status --porcelain)"
