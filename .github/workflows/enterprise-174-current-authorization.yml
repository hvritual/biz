name: Enterprise 174 canonical source formatting

on:
  push:
    branches:
      - feat/enterprise-174-current-authorization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gofmt-changed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: true
      - name: Read consumer lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 1
          persist-credentials: false
      - name: Load locked Go
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false
      - name: Canonical gofmt only #174 changed source
        working-directory: biz
        shell: bash
        run: |
          set -euo pipefail
          files=(
            integration/enterprise_174_current_authorization_mysql_test.go
            internal/access/application/tenant_audit_management.go
            internal/access/authorization/catalog.go
            internal/access/authorization/catalog_test.go
            internal/access/domain/audit.go
            internal/access/infrastructure/persistence/audit.go
            internal/access/infrastructure/persistence/current_authorization.go
            internal/access/infrastructure/persistence/platform.go
            internal/bizruntime/audit.go
            internal/bizruntime/runtime.go
            internal/bizruntime/web_auth.go
            internal/bizruntime/web_authorization.go
          )
          gofmt -w "${files[@]}"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "changed #174 Go source already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(access): gofmt #174 authorization changes"
          git push origin HEAD:feat/enterprise-174-current-authorization
