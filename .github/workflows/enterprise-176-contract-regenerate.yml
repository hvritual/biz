name: Enterprise 176 contract regenerate

on:
  push:
    branches:
      - feat/enterprise-176-member-query-atomic-create
    paths:
      - .github/workflows/enterprise-176-contract-regenerate.yml
      - contracts/proto/access/v1/tenant_member.proto
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/enterprise-176-contract-regenerate.yml
      - contracts/proto/access/v1/tenant_member.proto

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: biz
          fetch-depth: 0

      - name: Load current consumer framework lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Load locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3             "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip"             -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked RPC generators
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Regenerate from the canonical contract
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          git -C biz diff -- contracts/gen/access/v1/tenant_member.pb.go

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git -C biz status --porcelain)"; then
            echo "generated outputs already canonical"
            exit 0
          fi
          git -C biz config user.name github-actions[bot]
          git -C biz config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C biz add -A
          git -C biz commit -m "chore(access): regenerate #176 contract outputs"
          git -C biz push origin HEAD:feat/enterprise-176-member-query-atomic-create
