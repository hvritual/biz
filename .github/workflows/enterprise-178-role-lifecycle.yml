name: Enterprise 178 role lifecycle qualification

on:
  push:
    branches:
      - feat/enterprise-178-role-lifecycle
    paths:
      - .github/workflows/enterprise-178-role-lifecycle.yml
      - contracts/proto/access/v1/tenant_role.proto
      - contracts/commercial/operation-capabilities.v1.json
      - contracts/commercial/generated/**
      - contracts/generated/**
      - docs/enterprise-center/decisions.md
      - internal/access/**
      - internal/bizruntime/**
      - integration/b12_role_runtime_mysql_test.go
      - integration/enterprise_178_role_lifecycle_mysql_test.go
      - web/src/features/enterprise/**
      - web/src/services/enterprise/**
      - web/src/services/runtime/api.ts
      - web/src/stores/enterprise.ts
      - web/src/types/enterprise.ts
      - web/e2e/enterprise-roles-real.spec.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/enterprise-178-role-lifecycle.yml
      - contracts/proto/access/v1/tenant_role.proto
      - contracts/commercial/operation-capabilities.v1.json
      - contracts/commercial/generated/**
      - contracts/generated/**
      - docs/enterprise-center/decisions.md
      - internal/access/**
      - internal/bizruntime/**
      - integration/b12_role_runtime_mysql_test.go
      - integration/enterprise_178_role_lifecycle_mysql_test.go
      - web/src/features/enterprise/**
      - web/src/services/enterprise/**
      - web/src/services/runtime/api.ts
      - web/src/stores/enterprise.ts
      - web/src/types/enterprise.ts
      - web/e2e/enterprise-roles-real.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise178
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise178?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      YUNKA_TEST_RESET_FIXTURES: "1"
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer framework lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Read locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked generators
        env:
          RELEASE: ${{ steps.lock.outputs.protoc_release }}
          CHECKSUM: ${{ steps.lock.outputs.protoc_sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20             "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip"             -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Verify canonical generation and formatting
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"
          git -C biz diff --exit-code
          mapfile -t changed < <(git -C biz diff --name-only origin/main...HEAD -- '*.go')
          if ((${#changed[@]})); then
            test -z "$(printf '%s\n' "${changed[@]}" | sed 's#^#biz/#' | xargs gofmt -l)"
          fi

      - name: Run Access unit and runtime regression
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test ./internal/access/... ./internal/bizruntime

      - name: Run Enterprise 178 MySQL qualification
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^TestEnterprise178'
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB124TenantRolePermissionsAreTenantScopedAndImmediate$'
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB124OwnerRoleProtectsRequiredPermissionsAndLastAssignment$'
          test -z "$(git -C biz status --porcelain)"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run role lifecycle E2E
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          VITE_DATA_MODE=api npm run build
          ENTERPRISE_ROLE_REAL_E2E=1 npx playwright test e2e/enterprise-roles-real.spec.ts
