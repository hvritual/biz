name: Enterprise Role Qualification

on:
  workflow_call:
    inputs:
      skip_fast_check:
        description: Canonical Fast Gate already passed in PR Qualification
        required: false
        type: boolean
        default: false
      enforce_enterprise180_admission:
        description: Require #180 Human policy decisions before any role/data-policy qualification
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate for admission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate Enterprise180 Human policy admission
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENTERPRISE180_ADMISSION_REQUIRED: ${{ inputs.enforce_enterprise180_admission }}
        run: python3 scripts/enterprise_180_admission.py check --required "$ENTERPRISE180_ADMISSION_REQUIRED"

      - name: Retain Enterprise180 admission receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise180-admission-role-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise180-admission.json
          if-no-files-found: error
          retention-days: 30

  backend:
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_enterprise_role
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_enterprise_role?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      YUNKA_TEST_RESET_FIXTURES: "1"
    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Read consumer framework lock
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Yunka baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Read locked toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc_release=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "protoc_sha=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked generators
        env:
          RELEASE: ${{ steps.lock.outputs.protoc_release }}
          CHECKSUM: ${{ steps.lock.outputs.protoc_sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20             "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip"             -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Generate canonical contracts with recoverable source evidence
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)"

      - name: Retain canonical generated diff without modifying the candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/canonical-generation"
          mkdir -p "$output"
          # Include new generated paths in the diff; never commit or push from CI.
          git -C biz add --intent-to-add -- contracts/gen contracts/generated internal modules
          git -C biz diff --binary > "$output/generated.patch"
          printf 'candidate_sha=%s\ncandidate_tree=%s\n' "$(git -C biz rev-parse HEAD)" "$(git -C biz rev-parse HEAD^{tree})" > "$output/provenance.txt"
          sha256sum yunka.io/tools/toolchain.env > "$output/toolchain.sha256"
          (cd "$output" && sha256sum generated.patch provenance.txt toolchain.sha256 > SHA256SUMS)

      - name: Upload canonical generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-role-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-generation/
          if-no-files-found: error
          retention-days: 30

      - name: Verify canonical generation, formatting and unit regression
        shell: bash
        run: |
          set -euo pipefail
          git -C biz diff --exit-code
          mapfile -t changed < <(git -C biz diff --name-only origin/main...HEAD -- '*.go')
          if ((${#changed[@]})); then
            unformatted="$(printf '%s\n' "${changed[@]}" | sed 's#^#biz/#' | xargs gofmt -l)"
            if [[ -n "$unformatted" ]]; then
              printf 'GOFMT_REQUIRED\n%s\n' "$unformatted" >&2
              exit 1
            fi
          fi
          go -C biz test ./internal/access/... ./internal/bizruntime

      - name: Run Enterprise Role MySQL qualification
        shell: bash
        run: |
          set -euo pipefail
          go -C biz test -count=1 -tags=integration ./integration -run '^TestEnterprise178'
          go -C biz test -v -count=1 -tags=integration ./integration -run '^TestEnterprise179'
          enterprise180_log="$RUNNER_TEMP/enterprise180-data-policy.log"
          go -C biz test -v -count=1 -tags=integration ./integration -run '^TestEnterprise180DataPolicyAuthorityAndRoleReference$' | tee "$enterprise180_log"
          grep -Fq -- '--- PASS: TestEnterprise180DataPolicyAuthorityAndRoleReference ' "$enterprise180_log"
          enterprise180_member_scope_log="$RUNNER_TEMP/enterprise180-member-business-scope.log"
          go -C biz test -v -count=1 -tags=integration ./integration -run '^TestEnterprise180MemberBusinessScopeAuthority$' | tee "$enterprise180_member_scope_log"
          grep -Fq -- '--- PASS: TestEnterprise180MemberBusinessScopeAuthority ' "$enterprise180_member_scope_log"
          enterprise180_department_log="$RUNNER_TEMP/enterprise180-department-regression.log"
          go -C biz test -v -count=1 -tags=integration ./integration -run '^TestECIR04TenantDepartmentRESTIsAuthoritativeAndTenantScoped$' | tee "$enterprise180_department_log"
          grep -Fq -- '--- PASS: TestECIR04TenantDepartmentRESTIsAuthoritativeAndTenantScoped ' "$enterprise180_department_log"
          enterprise180_query_log="$RUNNER_TEMP/enterprise180-effective-query-scope.log"
          go -C biz test -v -count=1 -tags=integration ./integration -run '^TestEnterprise180EffectiveScopeQueryEnforcement$' | tee "$enterprise180_query_log"
          grep -Fq -- '--- PASS: TestEnterprise180EffectiveScopeQueryEnforcement ' "$enterprise180_query_log"
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB124TenantRolePermissionsAreTenantScopedAndImmediate$'
          go -C biz test -count=1 -tags=integration ./integration -run '^TestB124OwnerRoleProtectsRequiredPermissionsAndLastAssignment$'
          test -z "$(git -C biz status --porcelain)"

  web:
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Run canonical Web Fast Gate
        if: ${{ !inputs.skip_fast_check }}
        run: npm run check
        working-directory: web

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run canonical role lifecycle and grant E2E
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          VITE_DATA_MODE=api npm run build
          ENTERPRISE_ROLE_REAL_E2E=1 ENTERPRISE_DATA_PERMISSION_REAL_E2E=1 ENTERPRISE_PERSONAL_PROFILE_REAL_E2E=1 npx playwright test e2e/enterprise-roles-real.spec.ts e2e/enterprise-data-policy-ui.spec.ts e2e/enterprise-personal-profile-real.spec.ts


      - name: Record Enterprise181 personal profile UI evidence
        if: always()
        working-directory: web
        shell: bash
        run: |
          mkdir -p test-results
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          shots = sorted((root / 'screenshots/enterprise181-personal-profile').glob('*.png'))
          manifest = {
              'candidate_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'candidate_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'suite': 'e2e/enterprise-personal-profile-real.spec.ts',
              'data_mode': 'mocked-api-browser-contract',
              'live_backend_evidence': False,
              'screenshots': [{'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in shots],
          }
          (root / 'test-results/enterprise181-ui-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON

      - name: Retain Enterprise181 personal profile UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise181-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/screenshots/enterprise181-personal-profile
            web/test-results/enterprise181-ui-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Record permission UI evidence identity
        if: always()
        working-directory: web
        shell: bash
        run: |
          mkdir -p test-results
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          shots = sorted((root / 'screenshots/enterprise180-permission-ui').glob('*.png'))
          manifest = {
              'candidate_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'candidate_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'suite': 'e2e/enterprise-data-policy-ui.spec.ts',
              'data_mode': 'mocked-api-browser-contract',
              'live_backend_evidence': False,
              'screenshots': [{'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in shots],
          }
          (root / 'test-results/enterprise180-ui-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON

      - name: Retain permission UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise180-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/screenshots/enterprise180-permission-ui
            web/test-results
            web/playwright-report
          if-no-files-found: error
          retention-days: 30
