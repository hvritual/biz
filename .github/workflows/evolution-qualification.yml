name: Unified evolution qualification
on:
  workflow_call:
    inputs:
      enforce_performance:
        description: Enforce targeted evolution performance acceptance
        required: false
        type: boolean
        default: false
      performance_target_seconds:
        description: Target evolution qualification duration
        required: false
        type: number
        default: 240
      performance_hard_seconds:
        description: Diagnostic evolution hard performance budget
        required: false
        type: number
        default: 300
  workflow_dispatch:

permissions:
  contents: read

env:
  YUNKA_TEST_RESET_FIXTURES: "1"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CE08_RESTART_RECEIPT: /tmp/ce08-restart.json
      CE09_RESTART_RECEIPT: /tmp/ce09-restart.json
      CE10_RESTART_RECEIPT: /tmp/ce10-restart.json
      CE12_E2E_ENV_FILE: /tmp/ce12-env.json
      CE13_PLATFORM_E2E_ENV_FILE: /tmp/ce13-env.json
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_evolution?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      EVOLUTION_GROUPS: business,CE16,CE16-restart,delegation
    steps:
      - name: Start evolution performance clock
        run: date +%s > "$RUNNER_TEMP/evolution.started"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: biz
          fetch-depth: 0

      - name: Read consumer lock
        id: source
        run: |
          source biz/.yunka/source.env
          echo "sha=$YUNKA_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ steps.source.outputs.sha }}
          path: yunka.io

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: biz/go.sum

      - name: Start isolated evolution MySQL
        shell: bash
        run: |
          set -euo pipefail
          container="evolution-mysql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker run \
            --name "$container" \
            --tmpfs /var/lib/mysql:rw,nosuid,size=1g \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=biz_evolution \
            -p 127.0.0.1:3306:3306 \
            -d mysql:8.4 > "$RUNNER_TEMP/evolution-mysql.id"
          echo "EVOLUTION_MYSQL_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Locked protobuf tools
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o /tmp/protoc.zip
          echo "$PROTOC_LINUX_X86_64_SHA256  /tmp/protoc.zip" | sha256sum -c -
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo /tmp/protoc/bin >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}

      - name: Framework compatibility regression
        working-directory: yunka.io
        run: go test -count=1 ./gateway/httpbinding ./pkg/contract

      - name: Consumer generation, unit, vet and build
        working-directory: biz
        run: |
          set -euo pipefail
          make yunka-source-check workspace-check
          make generate
          git diff --exit-code
          make check
          go test -count=1 ./cmd/... ./internal/... ./modules/... ./integration/...
          go vet ./cmd/... ./internal/... ./modules/...
          go build ./cmd/...

      - name: Wait for evolution MySQL
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$EVOLUTION_MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -proot --silent; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

      - name: Retained evolution MySQL suites
        working-directory: biz
        env:
          EVOLUTION_MYSQL_PASSWORD: root
          EVOLUTION_EVIDENCE_DIR: /tmp/evolution-evidence
        run: python3 scripts/qualify-evolution-mysql.py

      - name: Plan and receipt regression
        working-directory: biz
        run: |
          python3 docs/commercial-entitlements/tools/check_plan.py
          python3 -m unittest discover -s docs/commercial-entitlements/tools -p 'test_*.py' -v

      - name: Write evolution performance receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENFORCE_PERFORMANCE: ${{ inputs.enforce_performance }}
        run: |
          set -euo pipefail
          args=(
            --surface evolution
            --lane qualify
            --started-file "$RUNNER_TEMP/evolution.started"
            --target-seconds "${{ inputs.performance_target_seconds }}"
            --hard-seconds "${{ inputs.performance_hard_seconds }}"
            --candidate-sha "$CANDIDATE_SHA"
            --job-status "$JOB_STATUS"
            --output "$RUNNER_TEMP/evolution-performance.json"
          )
          if [ "$ENFORCE_PERFORMANCE" = "true" ]; then args+=(--enforce); fi
          python3 biz/scripts/ci_performance_receipt.py "${args[@]}"

      - name: Stop evolution MySQL
        if: always()
        shell: bash
        run: docker rm -f "${EVOLUTION_MYSQL_CONTAINER:-}" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evolution-mysql-evidence
          path: |
            /tmp/evolution-evidence/summary.json
            /tmp/evolution-evidence/*.log
            ${{ runner.temp }}/evolution-performance.json
          retention-days: 30
