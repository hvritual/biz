name: Record approved evolution exception samples
on:
  push:
    branches: [integration/biz-evolution-20260912]
    paths: [docs/evolution/pending-exception-samples.json, .github/workflows/evolution-record-samples.yml]
permissions:
  contents: read
  issues: write
jobs:
  record:
    if: github.repository == 'hvritual/biz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create only the reviewed, deduplicated sample records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          base = 'https://api.github.com/repos/hvritual/biz/issues'
          def api(url, payload=None):
              request = urllib.request.Request(url, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          known = {}
          page = 1
          while True:
              items = api(base + f'?state=all&per_page=100&page={page}')
              for item in items:
                  if 'pull_request' not in item:
                      known[item['title']] = item['html_url']
              if len(items) < 100:
                  break
              page += 1
          for sample in json.loads(Path('docs/evolution/pending-exception-samples.json').read_text()):
              if set(sample) != {'title', 'body'}:
                  raise SystemExit('Unexpected sample fields')
              url = known.get(sample['title'])
              if url is None:
                  url = api(base, sample)['html_url']
                  known[sample['title']] = url
              print(sample['title'] + ': ' + url)
          PY
  converge-prs:
    if: github.repository == 'hvritual/biz'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update the unified PR and close only fully retained source PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          from pathlib import Path
          base = 'https://api.github.com/repos/hvritual/biz/pulls/'
          def api(number, payload=None):
              request = urllib.request.Request(base + str(number), method='GET' if payload is None else 'PATCH', data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          current = api(83)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if current['head']['sha'] != head or current['head']['ref'] != 'integration/biz-evolution-20260912':
              raise SystemExit('Unified PR moved; refusing stale metadata update')
          api(83, {'body': Path('docs/evolution/PR-DESCRIPTION.md').read_text()})
          for number in [40, 45, 59, 68]:
              source = api(number)
              sha = source['head']['sha']
              if source['state'] != 'open' or source['head']['repo']['full_name'] != 'hvritual/biz' or not re.fullmatch('[0-9a-f]{40}', sha):
                  continue
              if subprocess.run(['git', 'merge-base', '--is-ancestor', sha, head]).returncode != 0:
                  print(f'Preserved #{number}: contains independent changes')
                  continue
              body = (source.get('body') or '') + '\n\nSuperseded by unified integration PR #83. The complete source head ' + sha + ' is retained in its ancestry; this closure does not claim a main merge or production release.'
              api(number, {'state': 'closed', 'body': body})
              print(f'Closed superseded source PR #{number}; source retained at {sha}')
          PY
