name: Repair platform V1.1 migration helper
on:
  push:
    branches: [feat/platform-commercial-ui-contract-v11]
    paths: ['.github/workflows/fix-platform-v11-helper.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/platform-commercial-ui-contract-v11
      - name: Repair Python heredoc expression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/platform-commercial-v11-migration.yml')
          source = path.read_text()
          old = "          '''.replace(/^          /gm, ''))"
          new = "          ''')"
          assert source.count(old) == 1, source.count(old)
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/fix-platform-v11-helper.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/platform-commercial-v11-migration.yml .github/workflows/fix-platform-v11-helper.yml
          git commit -m 'chore(ci): repair platform V1.1 migration helper'
          git push origin HEAD:feat/platform-commercial-ui-contract-v11
