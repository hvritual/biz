name: Design i18n dependency qualification
# Task-scoped carrier used only on feat/design-i18n. It writes package metadata back
# to the same feature branch after the exact source passes npm run check, then is removed.
on:
  push:
    branches: [feat/design-i18n]
    paths:
      - 'web/**'
      - '.github/workflows/i18n-dependency-generation.yml'
permissions:
  contents: read
concurrency:
  group: design-i18n-dependency
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'hvritual/biz' && github.ref == 'refs/heads/feat/design-i18n'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Add exact Vue I18n dependency and validate source
        working-directory: web
        run: |
          set -euo pipefail
          npm install --save-exact vue-i18n@11.4.10
          npm run check
          git diff --check
      - name: Commit only package metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','status','--porcelain','-z']).decode().split('\0')
          changed = [line[3:] for line in changed if line]
          allowed = {'web/package.json','web/package-lock.json'}
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit('Unexpected i18n qualification changes: ' + ', '.join(unexpected))
          PY
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin refs/heads/feat/design-i18n | cut -f1)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(web): lock vue-i18n 11.4.10 for design pilot'
          git push origin HEAD:refs/heads/feat/design-i18n
