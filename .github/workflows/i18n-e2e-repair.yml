name: Design i18n E2E contract repair
on:
  push:
    branches: [feat/design-i18n]
    paths:
      - '.github/workflows/i18n-e2e-repair.yml'
permissions:
  contents: write
jobs:
  repair-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Repair stable i18n/E2E contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'web/e2e/i18n.spec.ts': [
              ("const locale = page.getByLabel('Language')", "const locale = page.getByRole('combobox', { name: /语言|Language/ })"),
              ("await locale.selectOption('en-US')", "await locale.click()\n  await page.getByRole('option', { name: 'English', exact: true }).click()"),
              ("await locale.selectOption('zh-CN')", "await locale.click()\n  await page.getByRole('option', { name: '中文', exact: true }).click()"),
              ("await page.getByLabel('Language').selectOption('en-US')", "await page.getByRole('combobox', { name: /语言|Language/ }).click()\n  await page.getByRole('option', { name: 'English', exact: true }).click()"),
              ("await page.getByLabel('Language').selectOption('zh-CN')", "await page.getByRole('combobox', { name: /语言|Language/ }).click()\n  await page.getByRole('option', { name: '中文', exact: true }).click()"),
            ],
            'web/e2e/console.spec.ts': [("getByText('启用', { exact: true })", "getByText('正常', { exact: true })")],
            'web/e2e/members-layout.spec.ts': [
              ("getByRole('button', { name: '编辑成员资料', exact: true })", "getByRole('button', { name: '编辑 王五', exact: true })"),
              ("toContainText('启用')", "toContainText('正常')"),
            ],
            'web/e2e/navigation-ia.spec.ts': [
              ('data-menu-group="客户管理"', 'data-menu-group="customer-management"'),
              ('data-menu-group="客户协同"', 'data-menu-group="customer-collaboration"'),
              ('data-menu-group="客户成功"', 'data-menu-group="customer-success"'),
              ('data-menu-group="投放与资产"', 'data-menu-group="deployment-assets"'),
              ('data-menu-group="计费与结算"', 'data-menu-group="billing-settlement"'),
              ('data-menu-group="履约与服务"', 'data-menu-group="fulfillment-service"'),
              ('data-menu-group="设备配置"', 'data-menu-group="device-configuration"'),
              ("getByTitle('饮品配置尚未接入')", "getByRole('button', { name: /饮品配置/ })"),
            ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1: raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Install and static qualify web
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npx playwright install --with-deps chromium
      - name: Run targeted E2E and capture diagnostics
        id: e2e
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set +e
          npx playwright test e2e/console.spec.ts e2e/i18n.spec.ts e2e/members-layout.spec.ts e2e/navigation-ia.spec.ts --reporter=line 2>&1 | tee ../I18N-E2E-DIAGNOSTICS.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Persist failure diagnostics
        if: steps.e2e.outputs.exit_code != '0'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/design-i18n | cut -f1)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add I18N-E2E-DIAGNOSTICS.txt
          git commit -m 'chore(i18n): refresh E2E repair diagnostics'
          git push origin HEAD:refs/heads/feat/design-i18n
          exit 1
      - name: Run full E2E and commit repaired contracts
        if: steps.e2e.outputs.exit_code == '0'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd web
          npm run test:e2e -- --reporter=line
          git diff --check
          cd ..
          test "$(git ls-remote origin refs/heads/feat/design-i18n | cut -f1)" = "$SOURCE_SHA"
          git add web/e2e/i18n.spec.ts web/e2e/console.spec.ts web/e2e/members-layout.spec.ts web/e2e/navigation-ia.spec.ts
          git rm .github/workflows/i18n-e2e-repair.yml I18N-E2E-DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(i18n): align E2E with localized controls and stable navigation IDs'
          git push origin HEAD:refs/heads/feat/design-i18n
