name: Main Qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: main-qualification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact main tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify delivery governance contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/candidate_lifecycle.py validate-contract
          python3 scripts/check_ci_topology.py
          python3 scripts/delivery_execution.py validate-contract
          python3 scripts/test_delivery_execution.py
          python3 scripts/check_ci_qualification_governance.py
          python3 scripts/test_ci_changed_files_router.py
          python3 scripts/test_candidate_lifecycle.py
          node --test .github/scripts/main-qualification.test.mjs

      - name: Verify exact delivery receipt and latest attempts
        run: python3 scripts/delivery_execution.py verify-main

      - name: Verify merged PR proof chain
        id: proof
        run: node .github/scripts/main-qualification.mjs

      - name: Verify exact remote main tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/candidate_lifecycle.py verify-main --main-ref HEAD --remote-main-ref origin/main

      - name: Retain main delivery decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-execution.json
          if-no-files-found: error
          retention-days: 30
