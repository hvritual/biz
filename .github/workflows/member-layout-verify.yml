name: Member management reference verification
on:
  push:
    branches: [build/member-layout-source-20260909]
    paths: [.github/workflows/member-layout-verify.yml]
permissions:
  contents: write
concurrency:
  group: member-management-reference-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0196761678b31fa459a8a7be32938c21018f55eb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore hash verified frontend patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = ['2348084763229f3fbdcca2d9de1f2ee6dd4a371b', 'e36046f27f24d94d225aee24eeaa47cb61d8f5f8', 'b89cac39f26dac8c61a61fa705c89894bfa46ef5']
          chunks = []
          for sha in shas:
              request = urllib.request.Request('https://api.github.com/repos/hvritual/biz/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          patch = lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == '4770b7cb1a58d8780afc50d0e30aca73dbfbe5b20b880a030c6c734549ef4683'
          pathlib.Path('/tmp/member-layout.patch').write_bytes(patch)
          print('Verified frontend patch:', len(patch), 'bytes')
          PY
          git apply --check /tmp/member-layout.patch
          git apply --index /tmp/member-layout.patch
          python3 - <<'PY'
          import pathlib, subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert paths and all(p.startswith('web/') for p in paths)
          assert not any(pathlib.Path(p).suffix in ('.ttf','.otf','.woff','.woff2') or 'node_modules' in p for p in paths)
          print('\n'.join(paths))
          PY
      - name: Install existing locked dependencies
        working-directory: web
        run: npm ci
      - name: Type lint architecture unit tests and production build
        working-directory: web
        run: npm run check
      - name: Install Chromium and system CJK rendering fonts
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser interaction and reference screenshots
        working-directory: web
        run: npm run test:e2e
      - name: Publish clean verified frontend change to feature branch
        env:
          DELIVERY_PARENT: 0196761678b31fa459a8a7be32938c21018f55eb
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/feat/member-management-reference | cut -f1)
          test "$current" = "$DELIVERY_PARENT" || { echo 'Feature branch advanced; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat(web): match reference member layout with slide-out details and preserved illustration'
          git push origin HEAD:refs/heads/feat/member-management-reference
          git rev-parse HEAD > /tmp/member-delivery-commit.txt
          echo "Verified frontend commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-layout-review
          path: |
            web/screenshots/
            web/test-results/
            web/playwright-report/
            /tmp/member-delivery-commit.txt
          retention-days: 14
