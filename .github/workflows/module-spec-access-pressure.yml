name: module-spec-access-pressure

on:
  push:
    branches:
      - agent/module-spec-access-pressure
    paths:
      - .github/workflows/module-spec-access-pressure.yml
      - modules/access/**
      - contracts/generated/assembly-plan.json
      - internal/assembly/zz_yunka_modules_gen.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YUNKA_SHA: 7e86f0a622a29d2c57263d7df1eeea2e1794dc43
      YUNKA_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/biz_module_spec?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biz_module_spec
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout exact Biz candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka module-spec head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          : "${GO_VERSION:?}"
          : "${PROTOC_RELEASE:?}"
          : "${PROTOC_LINUX_X86_64_SHA256:?}"
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Assert access declarative source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f biz/modules/access/module.yunka.json
          for legacy in \
            biz/modules/access/config.go \
            biz/modules/access/dependencies.go \
            biz/modules/access/module.go \
            biz/modules/access/zz_yunka_module_gen.go \
            biz/modules/access/autoload/register.go; do
            test ! -e "$legacy"
          done
          grep -Fq '"primary"' biz/modules/access/module.yunka.json

      - name: Generate canonical closure with new module spec
        shell: bash
        run: |
          set -euo pipefail
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"

          git -C biz diff --name-only | sort > "$RUNNER_TEMP/module-spec-generated-files.txt"
          if test -s "$RUNNER_TEMP/module-spec-generated-files.txt"; then
            while IFS= read -r file; do
              case "$file" in
                contracts/generated/assembly-plan.json|internal/assembly/zz_yunka_modules_gen.go) ;;
                *) echo "unexpected generated drift: $file" >&2; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/module-spec-generated-files.txt"
          fi

      - name: Assert generated module composition
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"source": "module-spec"' biz/contracts/generated/assembly-plan.json
          grep -Fq '"ref": "access/module.yunka.json"' biz/contracts/generated/assembly-plan.json
          grep -Fq 'Name: "access"' biz/internal/assembly/zz_yunka_modules_gen.go
          grep -Fq 'Databases: []modulecatalog.DatabaseRequirement{{Name: "primary"}}' biz/internal/assembly/zz_yunka_modules_gen.go
          ! grep -Fq 'github.com/hvritual/biz/modules/access' biz/internal/assembly/zz_yunka_modules_gen.go
          grep -Fq 'github.com/hvritual/biz/modules/deviceops' biz/internal/assembly/zz_yunka_modules_gen.go

      - name: Check generated closure with new Yunka
        shell: bash
        run: |
          set -euo pipefail
          make -C biz check \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"

      - name: Run full Biz pressure regression
        shell: bash
        run: |
          set -euo pipefail
          make -C biz pressure \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"

      - name: Prove second generation byte stability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            biz/contracts/generated/assembly-plan.json \
            biz/internal/assembly/zz_yunka_modules_gen.go \
            > "$RUNNER_TEMP/module-spec-first.sha256"
          make -C biz generate \
            YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" \
            PROTOC="$(command -v protoc)"
          sha256sum \
            biz/contracts/generated/assembly-plan.json \
            biz/internal/assembly/zz_yunka_modules_gen.go \
            > "$RUNNER_TEMP/module-spec-second.sha256"
          diff -u "$RUNNER_TEMP/module-spec-first.sha256" "$RUNNER_TEMP/module-spec-second.sha256"

      - name: Capture qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/module-spec-evidence/generated"
          cp biz/contracts/generated/assembly-plan.json "$RUNNER_TEMP/module-spec-evidence/generated/assembly-plan.json" 2>/dev/null || true
          cp biz/internal/assembly/zz_yunka_modules_gen.go "$RUNNER_TEMP/module-spec-evidence/generated/zz_yunka_modules_gen.go" 2>/dev/null || true
          cp "$RUNNER_TEMP/module-spec-generated-files.txt" "$RUNNER_TEMP/module-spec-evidence/generated-files.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/module-spec-first.sha256" "$RUNNER_TEMP/module-spec-evidence/first.sha256" 2>/dev/null || true
          cp "$RUNNER_TEMP/module-spec-second.sha256" "$RUNNER_TEMP/module-spec-evidence/second.sha256" 2>/dev/null || true
          git -C biz diff --no-ext-diff > "$RUNNER_TEMP/module-spec-evidence/generated.diff" || true
          git -C biz status --porcelain > "$RUNNER_TEMP/module-spec-evidence/status.txt" || true

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: module-spec-access-pressure
          path: ${{ runner.temp }}/module-spec-evidence
          if-no-files-found: error
          retention-days: 2
