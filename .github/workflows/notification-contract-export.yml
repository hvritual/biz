name: Notification Contract Object Export
on:
  push:
    branches:
      - build/enterprise184-contract-export
permissions:
  contents: write
concurrency:
  group: enterprise184-contract-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'hvritual/biz'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: b6cae6ca826a683d34cbededda8269fa4f3645ad
      YUNKA_SHA: 9ee6640f5e19777b4c04d9e4937a93e2035eacda
    steps:
      - name: Read object-export helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: helper
          persist-credentials: false
      - name: Checkout exact business source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: biz
          persist-credentials: false
      - name: Checkout exact qualified generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          persist-credentials: false
      - name: Read locked versions
        id: locked
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C biz rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          source biz/.yunka/source.env
          test "$YUNKA_COMMIT" = "$YUNKA_SHA"
          source yunka.io/tools/toolchain.env
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "protoc=$PROTOC_RELEASE" >> "$GITHUB_OUTPUT"
          echo "checksum=$PROTOC_LINUX_X86_64_SHA256" >> "$GITHUB_OUTPUT"
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.locked.outputs.go }}
          cache: false
      - name: Install locked protobuf tools
        shell: bash
        env:
          RELEASE: ${{ steps.locked.outputs.protoc }}
          CHECKSUM: ${{ steps.locked.outputs.checksum }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 20 "https://github.com/protocolbuffers/protobuf/releases/download/v${RELEASE}/protoc-${RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
      - name: Generate twice and check exact output
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/canonical-export
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cd biz
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" | tee "$OUTPUT_DIR/generate-first.log"
          python3 "$GITHUB_WORKSPACE/helper/scripts/export_generated_objects.py" snapshot
          make generate YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" | tee "$OUTPUT_DIR/generate-second.log"
          make check YUNKA_ROOT="$GITHUB_WORKSPACE/yunka.io" PROTOC="$(command -v protoc)" | tee "$OUTPUT_DIR/check.log"
      - name: Export generated blobs and tree without commits or ref changes
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/canonical-export
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd biz
          python3 "$GITHUB_WORKSPACE/helper/scripts/export_generated_objects.py" export
          git add --intent-to-add -- contracts/gen contracts/generated internal modules
          git diff --binary > "$OUTPUT_DIR/generated.patch"
          sha256sum "$GITHUB_WORKSPACE/yunka.io/tools/toolchain.env" > "$OUTPUT_DIR/toolchain.sha256"
          cd "$OUTPUT_DIR"
          sha256sum generated-objects.json generated.patch first-snapshot.json toolchain.sha256 generate-first.log generate-second.log check.log > SHA256SUMS
      - name: Retain generated object provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-contract-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-export/
          if-no-files-found: error
          retention-days: 30
