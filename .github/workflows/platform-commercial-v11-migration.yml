name: Prepare platform commercial V1.1 convergence
on:
  push:
    branches: [feat/platform-commercial-ui-contract-v11]
    paths: ['.github/workflows/platform-commercial-v11-migration.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/platform-commercial-ui-contract-v11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Converge three platform commercial pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 occurrence, got {count}'
              return text.replace(old, new, 1)

          # --- Module catalog -> ListPage ---
          path = Path('web/src/views/platform/CommercialModulesView.vue')
          text = path.read_text()
          text = replace_once(
              text,
              "const reason = ref('')\n",
              "const reason = ref('')\nconst keyword = ref('')\nconst technicalFilter = ref('')\nconst salesFilter = ref('')\n\nconst filteredModules = computed(() => {\n  const query = keyword.value.trim().toLowerCase()\n  return modules.value.filter((item) => {\n    const matchesKeyword = !query || [item.moduleCode, item.name, item.category]\n      .some((value) => String(value ?? '').toLowerCase().includes(query))\n    const matchesTechnical = !technicalFilter.value || item.technicalStatus === technicalFilter.value\n    const matchesSales = !salesFilter.value || item.salesStatus === salesFilter.value\n    return matchesKeyword && matchesTechnical && matchesSales\n  })\n})\n",
              'module filters',
          )
          text = replace_once(
              text,
              '<div class="page-stack" data-testid="ce13-module-catalog">',
              '<div class="page-stack" data-testid="ce13-module-catalog" data-ui-template="ListPage">',
              'module template',
          )
          text = replace_once(
              text,
              '''    <PageHeading\n      title="平台商业管理"\n      description="管理模块目录、技术/销售状态与依赖关系；所有配置均以服务端商业事实为准"\n    />\n\n    <section class="commercial-tabs" aria-label="平台商业管理导航">\n      <RouterLink class="commercial-tab active" to="/platform/commercial/modules">模块目录</RouterLink>\n      <RouterLink class="commercial-tab" to="/platform/commercial/plans">套餐版本</RouterLink>\n      <RouterLink class="commercial-tab" to="/platform/commercial/tenant-entitlements">租户权益</RouterLink>\n    </section>''',
              '''    <div data-ui-region="page-heading">\n      <PageHeading\n        title="模块目录"\n        description="治理平台可售模块、技术状态与能力边界；所有状态均来自服务端商业事实"\n      />\n    </div>''',
              'module heading and duplicate navigation',
          )
          text = replace_once(text, '<section class="metric-grid" aria-label="模块目录摘要">', '<section class="metric-grid" aria-label="模块目录摘要" data-ui-region="metrics">', 'module metrics region')
          text = replace_once(
              text,
              '''      </section>\n\n      <section v-if="loadState === 'empty'" class="card state-card">''',
              '''      </section>\n\n      <section class="card query-panel" data-ui-region="query" aria-label="模块目录查询">\n        <div class="query-grid">\n          <label class="field"><span>关键词</span><input v-model.trim="keyword" class="input" placeholder="模块名称 / 代码 / 分类" /></label>\n          <label class="field"><span>技术状态</span>\n            <select v-model="technicalFilter" class="select">\n              <option value="">全部技术状态</option>\n              <option value="MODULE_TECHNICAL_STATUS_READY">技术就绪</option>\n              <option value="MODULE_TECHNICAL_STATUS_NOT_READY">未就绪</option>\n              <option value="MODULE_TECHNICAL_STATUS_DISABLED">技术停用</option>\n            </select>\n          </label>\n          <label class="field"><span>销售状态</span>\n            <select v-model="salesFilter" class="select">\n              <option value="">全部销售状态</option>\n              <option value="MODULE_SALES_STATUS_SELLABLE">可销售</option>\n              <option value="MODULE_SALES_STATUS_RETIRED">已停售</option>\n            </select>\n          </label>\n          <button class="btn query-reset" type="button" @click="keyword = ''; technicalFilter = ''; salesFilter = ''">重置</button>\n        </div>\n        <p class="query-summary">当前显示 {{ filteredModules.length }} / {{ modules.length }} 个模块；筛选只影响当前服务端目录的展示结果。</p>\n      </section>\n\n      <section v-if="loadState === 'empty'" class="card state-card">''',
              'module query panel',
          )
          text = replace_once(text, '<section v-else class="card catalog-card">', '<section v-else class="card catalog-card" data-ui-region="data">', 'module data region')
          text = replace_once(
              text,
              '<th>模块</th><th>分类</th><th>技术状态</th><th>销售状态</th><th>能力</th><th>依赖</th><th>版本</th><th>操作</th>',
              '<th>模块</th><th>分类</th><th>技术状态</th><th>销售状态</th><th>能力治理</th><th>操作</th>',
              'module table headers',
          )
          text = replace_once(
              text,
              '''            <tbody>\n              <tr v-for="item in modules" :key="item.moduleCode">\n                <td><strong>{{ item.name || item.moduleCode }}</strong><small class="module-code">{{ item.moduleCode }}</small></td>\n                <td>{{ item.category || '—' }}</td>\n                <td><StatusBadge :text="technicalLabel(item.technicalStatus)" :tone="item.technicalStatus === 'MODULE_TECHNICAL_STATUS_READY' ? 'success' : 'warning'" /></td>\n                <td><StatusBadge :text="salesLabel(item.salesStatus)" :tone="item.salesStatus === 'MODULE_SALES_STATUS_SELLABLE' ? 'success' : 'neutral'" /></td>\n                <td><span class="count-cell">{{ item.capabilityCodes?.length ?? 0 }}</span></td>\n                <td>{{ item.dependencies?.length ? item.dependencies.join('、') : '无' }}</td>\n                <td class="numeric">{{ item.version }}</td>\n                <td><button class="btn table-action" type="button" @click="openDetail(item)">查看详情</button></td>\n              </tr>''',
              '''            <tbody>\n              <tr v-if="!filteredModules.length">\n                <td colspan="6" class="empty-row">没有符合当前筛选条件的模块。</td>\n              </tr>\n              <tr v-for="item in filteredModules" :key="item.moduleCode">\n                <td><strong>{{ item.name || item.moduleCode }}</strong><small class="module-code">{{ item.moduleCode }} · v{{ item.version }}</small></td>\n                <td>{{ item.category || '—' }}</td>\n                <td><StatusBadge :text="technicalLabel(item.technicalStatus)" :tone="item.technicalStatus === 'MODULE_TECHNICAL_STATUS_READY' ? 'success' : 'warning'" /></td>\n                <td><StatusBadge :text="salesLabel(item.salesStatus)" :tone="item.salesStatus === 'MODULE_SALES_STATUS_SELLABLE' ? 'success' : 'neutral'" /></td>\n                <td><strong class="governance-count">{{ item.capabilityCodes?.length ?? 0 }} 项能力</strong><small class="cell-note">{{ item.dependencies?.length ?? 0 }} 项依赖</small></td>\n                <td><button class="btn table-action" type="button" @click="openDetail(item)">查看详情</button></td>\n              </tr>''',
              'module six-column table',
          )
          text = replace_once(
              text,
              '''.commercial-tabs {\n  display: flex;\n  gap: 4px;\n  border-bottom: 1px solid var(--color-border);\n}\n.commercial-tab {\n  padding: 10px 14px;\n  font-size: 13px;\n  color: var(--color-text-secondary);\n  text-decoration: none;\n  border-bottom: 2px solid transparent;\n}\n.commercial-tab.active {\n  color: var(--color-primary);\n  border-bottom-color: var(--color-primary);\n  font-weight: 600;\n}\n''',
              '''.query-panel { padding: 18px 20px; }\n.query-grid { display: grid; grid-template-columns: minmax(220px, 1.4fr) minmax(170px, .8fr) minmax(170px, .8fr) auto; gap: 12px; align-items: end; }\n.query-grid .field { margin: 0; }\n.query-reset { min-height: 36px; }\n.query-summary { margin: 10px 0 0; color: var(--color-text-muted); font-size: 11px; }\n''',
              'module styles remove local tabs',
          )
          text = replace_once(text, '.count-cell { display: inline-flex; min-width: 28px; justify-content: center; }', '.governance-count { display: block; font-size: 12px; }\n.cell-note { display: block; margin-top: 4px; color: var(--color-text-muted); font-size: 11px; }\n.empty-row { padding: 28px 16px !important; text-align: center; color: var(--color-text-muted); }', 'module governance styles')
          text = replace_once(
              text,
              '''  .commercial-tabs { overflow-x: auto; }\n  .commercial-tab { white-space: nowrap; }\n  .state-card, .catalog-header { align-items: flex-start; flex-wrap: wrap; }''',
              '''  .query-grid { grid-template-columns: 1fr; }\n  .state-card, .catalog-header { align-items: flex-start; flex-wrap: wrap; }''',
              'module mobile styles',
          )
          path.write_text(text)

          # --- Plan versions -> WorkbenchPage ---
          path = Path('web/src/views/platform/CommercialPlansView.vue')
          text = path.read_text()
          text = replace_once(text, '<div class="page-stack" data-testid="ce13-plan-management">', '<div class="page-stack" data-testid="ce13-plan-management" data-ui-template="WorkbenchPage">', 'plan template')
          text = replace_once(
              text,
              '''    <PageHeading\n      title="平台商业管理"\n      description="按真实 plan_code 管理套餐草稿、不可变版本、发布停售与适用资格；不从租户订阅或本地缓存反推套餐目录"\n    />\n\n    <section class="commercial-tabs" aria-label="平台商业管理导航">\n      <RouterLink class="commercial-tab" to="/platform/commercial/modules">模块目录</RouterLink>\n      <RouterLink class="commercial-tab active" to="/platform/commercial/plans">套餐版本</RouterLink>\n      <RouterLink class="commercial-tab" to="/platform/commercial/tenant-entitlements">租户权益</RouterLink>\n    </section>''',
              '''    <div data-ui-region="page-heading">\n      <PageHeading\n        title="套餐版本"\n        description="围绕真实 plan_code 管理套餐草稿、不可变版本、发布停售与适用资格"\n      />\n    </div>''',
              'plan heading and duplicate navigation',
          )
          text = replace_once(text, '<AuthorityPicker kind="plans" @select="(id) => { planCodeInput = id; loadVersions(true) }" />', '<div data-ui-region="authority"><AuthorityPicker kind="plans" @select="(id) => { planCodeInput = id; loadVersions(true) }" /></div>', 'plan authority region')
          text = replace_once(text, '<section class="card workspace-card">', '<section class="card workspace-card" data-ui-region="query">', 'plan query region')
          text = replace_once(text, '<section class="metric-grid">', '<section class="metric-grid" data-ui-region="metrics">', 'plan metrics region')
          text = replace_once(text, '<div v-else class="plan-layout">', '<div v-else class="plan-layout" data-ui-region="workspace">', 'plan workspace region')
          text = replace_once(text, '<section class="card versions-card">', '<section class="card versions-card" data-ui-region="history">', 'plan history region')
          text = replace_once(
              text,
              '''        <PlanVersionDetail\n          v-if="selectedVersion"\n          :version="selectedVersion"\n          :modules="modules"\n          :pending="actionPending"\n          @edit="openEdit"\n          @publish="publishSelected"\n          @retire="retireSelected"\n          @clone="cloneSelected"\n          @eligibility="openEligibility"\n        />''',
              '''        <div class="detail-region" data-ui-region="detail">\n          <PlanVersionDetail\n            v-if="selectedVersion"\n            :version="selectedVersion"\n            :modules="modules"\n            :pending="actionPending"\n            @edit="openEdit"\n            @publish="publishSelected"\n            @retire="retireSelected"\n            @clone="cloneSelected"\n            @eligibility="openEligibility"\n          />\n        </div>''',
              'plan detail region',
          )
          text = replace_once(
              text,
              '''.commercial-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); }\n.commercial-tab { padding: 10px 14px; font-size: 13px; color: var(--color-text-secondary); text-decoration: none; border-bottom: 2px solid transparent; }\n.commercial-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }\n.commercial-tab.disabled { color: var(--color-text-muted); cursor: not-allowed; }\n''',
              '.detail-region { min-width: 0; }\n',
              'plan styles remove local tabs',
          )
          text = replace_once(
              text,
              '''  .commercial-tabs { overflow-x: auto; }\n  .commercial-tab { white-space: nowrap; }\n  .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }''',
              '  .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }',
              'plan mobile styles',
          )
          path.write_text(text)

          # --- Tenant entitlements -> WorkbenchPage ---
          path = Path('web/src/views/platform/CommercialTenantEntitlementsView.vue')
          text = path.read_text()
          text = replace_once(text, '<div class="page-stack" data-testid="ce13-tenant-entitlements">', '<div class="page-stack" data-testid="ce13-tenant-entitlements" data-ui-template="WorkbenchPage">', 'entitlement template')
          text = replace_once(
              text,
              '''    <PageHeading\n      title="平台商业管理"\n      description="查看租户当前订阅、服务端权益决策与完整来源链，并以 source_version CAS 管理专项授权；不在浏览器自行合并权益"\n    />\n\n    <section class="commercial-tabs" aria-label="平台商业管理导航">\n      <RouterLink class="commercial-tab" to="/platform/commercial/modules">模块目录</RouterLink>\n      <RouterLink class="commercial-tab" to="/platform/commercial/plans">套餐版本</RouterLink>\n      <RouterLink class="commercial-tab active" to="/platform/commercial/tenant-entitlements">租户权益</RouterLink>\n    </section>''',
              '''    <div data-ui-region="page-heading">\n      <PageHeading\n        title="租户权益"\n        description="以租户上下文查看订阅、服务端权益决策、专项来源与变更工作区；浏览器不自行合并权益"\n      />\n    </div>''',
              'entitlement heading and duplicate navigation',
          )
          text = replace_once(text, '<AuthorityPicker kind="tenants" @select="(id) => { tenantIdInput = id; loadWorkspace() }" />', '<div data-ui-region="authority"><AuthorityPicker kind="tenants" @select="(id) => { tenantIdInput = id; loadWorkspace() }" /></div>', 'entitlement authority region')
          text = replace_once(text, '<section class="card workspace-card">', '<section class="card workspace-card" data-ui-region="context">', 'entitlement context region')
          text = replace_once(text, '<section class="metric-grid">', '<section class="metric-grid" data-ui-region="metrics">', 'entitlement metrics region')
          text = replace_once(text, '<section class="card subscription-card">', '<section class="card subscription-card" data-ui-region="subscription">', 'entitlement subscription region')
          text = replace_once(text, '<SubscriptionChangeWorkspace :tenant-id="activeTenantId" :subscription="subscription" @refresh="loadWorkspace" />', '<div data-ui-region="change-workspace"><SubscriptionChangeWorkspace :tenant-id="activeTenantId" :subscription="subscription" @refresh="loadWorkspace" /></div>', 'entitlement change workspace region')
          text = replace_once(text, '<section class="resolver-meta card">', '<section class="resolver-meta card" data-ui-region="resolver-meta">', 'entitlement resolver metadata region')
          text = replace_once(text, '<EntitlementDecisionTable :decisions="entitlement.decisions ?? []" />', '<div data-ui-region="decisions"><EntitlementDecisionTable :decisions="entitlement.decisions ?? []" /></div>', 'entitlement decisions region')
          text = replace_once(text, '<EntitlementOverrideTable :sources="overrides" :source-version="sourceVersion" :pending="pending" @create="overrideDialogOpen = true" @revoke="openRevoke" />', '<div data-ui-region="overrides"><EntitlementOverrideTable :sources="overrides" :source-version="sourceVersion" :pending="pending" @create="overrideDialogOpen = true" @revoke="openRevoke" /></div>', 'entitlement override region')
          text = replace_once(
              text,
              '''.commercial-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); }\n.commercial-tab { padding: 10px 14px; font-size: 13px; color: var(--color-text-secondary); text-decoration: none; border-bottom: 2px solid transparent; }\n.commercial-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }\n''',
              '',
              'entitlement styles remove local tabs',
          )
          text = replace_once(
              text,
              '@media (max-width: 680px) { .lookup-row, .filter-row { grid-template-columns: 1fr; } .metric-grid, .subscription-grid { grid-template-columns: 1fr; } .commercial-tabs { overflow-x: auto; } .commercial-tab { white-space: nowrap; } }',
              '@media (max-width: 680px) { .lookup-row, .filter-row { grid-template-columns: 1fr; } .metric-grid, .subscription-grid { grid-template-columns: 1fr; } }',
              'entitlement mobile styles',
          )
          path.write_text(text)

          # --- Router contracts ---
          path = Path('web/src/router/index.ts')
          text = path.read_text()
          text = replace_once(text, "meta: { title: '模块目录', module: 'platform-commercial', surface: 'platform' },", "meta: { title: '模块目录', module: 'platform-commercial', surface: 'platform', pageTemplate: 'ListPage' },", 'module route template')
          text = replace_once(text, "meta: { title: '套餐版本', module: 'platform-commercial', surface: 'platform' },", "meta: { title: '套餐版本', module: 'platform-commercial', surface: 'platform', pageTemplate: 'WorkbenchPage' },", 'plan route template')
          text = replace_once(text, "meta: { title: '租户权益', module: 'platform-commercial', surface: 'platform' },", "meta: { title: '租户权益', module: 'platform-commercial', surface: 'platform', pageTemplate: 'WorkbenchPage' },", 'entitlement route template')
          path.write_text(text)

          # --- UI Contract: route -> template -> regions -> four viewports ---
          path = Path('web/ui-contracts.json')
          contract = json.loads(path.read_text())
          additions = [
              {
                  'path': '/platform/commercial/modules',
                  'component': '@/views/platform/CommercialModulesView.vue',
                  'surface': 'platform',
                  'template': 'ListPage',
                  'required_regions': ['page-heading', 'metrics', 'query', 'data'],
              },
              {
                  'path': '/platform/commercial/plans',
                  'component': '@/views/platform/CommercialPlansView.vue',
                  'surface': 'platform',
                  'template': 'WorkbenchPage',
                  'required_regions': ['page-heading', 'authority', 'query', 'metrics', 'workspace', 'history', 'detail'],
              },
              {
                  'path': '/platform/commercial/tenant-entitlements',
                  'component': '@/views/platform/CommercialTenantEntitlementsView.vue',
                  'surface': 'platform',
                  'template': 'WorkbenchPage',
                  'required_regions': ['page-heading', 'authority', 'context', 'metrics', 'subscription', 'change-workspace', 'decisions', 'overrides'],
              },
          ]
          existing = {item['path'] for item in contract['routes']}
          assert not any(item['path'] in existing for item in additions), existing
          contract['routes'].extend(additions)
          path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n')

          # --- Visual E2E for platform management core pages ---
          path = Path('web/e2e/platform-management-visual.spec.ts')
          path.write_text(r'''import { expect, test, type Page } from '@playwright/test'
          import { mkdirSync } from 'node:fs'

          const evidenceDir = 'test-results/screenshots'
          const viewports = [
            [1366, 768],
            [1440, 900],
            [1536, 1024],
            [390, 844],
          ] as const

          const moduleFixture = [
            {
              moduleCode: 'device-operations',
              name: '设备运营',
              category: 'operations',
              salesScope: ['default'],
              technicalStatus: 'MODULE_TECHNICAL_STATUS_READY',
              salesStatus: 'MODULE_SALES_STATUS_SELLABLE',
              capabilityCodes: ['device.lifecycle', 'device.telemetry'],
              quotaSchemaKeys: ['device.count'],
              fieldPolicySchemaKeys: [],
              dependencies: [],
              version: 12,
            },
            {
              moduleCode: 'customer-operations',
              name: '客户经营',
              category: 'crm',
              salesScope: ['default'],
              technicalStatus: 'MODULE_TECHNICAL_STATUS_READY',
              salesStatus: 'MODULE_SALES_STATUS_SELLABLE',
              capabilityCodes: ['customer.view'],
              quotaSchemaKeys: ['customer.count'],
              fieldPolicySchemaKeys: [],
              dependencies: ['device-operations'],
              version: 7,
            },
            {
              moduleCode: 'marketing',
              name: '营销能力',
              category: 'growth',
              salesScope: ['enterprise'],
              technicalStatus: 'MODULE_TECHNICAL_STATUS_NOT_READY',
              salesStatus: 'MODULE_SALES_STATUS_RETIRED',
              capabilityCodes: ['marketing.campaign'],
              quotaSchemaKeys: [],
              fieldPolicySchemaKeys: [],
              dependencies: ['customer-operations'],
              version: 3,
            },
          ]

          const planVersionFixture = {
            planCode: 'office-pro',
            version: 3,
            revision: 8,
            planRevision: 5,
            state: 'PUBLISHED',
            name: '办公室专业版',
            terms: {
              modules: [{ moduleCode: 'device-operations', capabilityCodes: ['device.lifecycle'], quotas: [], fields: [] }],
              salesScope: ['default'],
              validityMode: 'unlimited',
              validityDays: 0,
              priceRef: 'price-office-pro',
            },
            contentSha256: 'visual-fixture',
            createdAt: '2026-09-01T08:00:00Z',
            publishedAt: '2026-09-02T08:00:00Z',
            retiredAt: '',
            actorId: 'platform-admin',
            reason: 'visual contract fixture',
          }

          async function installPlatformFixture(page: Page) {
            await page.route('**/api/**', async (route) => {
              const request = route.request()
              const url = new URL(request.url())
              const path = url.pathname
              const method = request.method()
              if (path === '/api/auth/session') {
                return route.fulfill({ json: { authenticated: true, actor_kind: 'platform', platform_subject: 'platform-admin', csrf_token: 'csrf' } })
              }
              if (path === '/api/v1/tenants' && method === 'GET') {
                return route.fulfill({ json: { tenants: [
                  { id: 'tenant-a', name: '北区运营公司', status: 'TENANT_STATUS_ACTIVE', version: '12' },
                  { id: 'tenant-b', name: '共享办公项目组', status: 'TENANT_STATUS_SUSPENDED', version: '7' },
                  { id: 'tenant-c', name: '历史测试租户', status: 'TENANT_STATUS_CLOSED', version: '4' },
                ] } })
              }
              if (path === '/api/v1/platform/modules' && method === 'GET') {
                return route.fulfill({ json: { modules: moduleFixture } })
              }
              if (path === '/api/v1/platform/plans' && method === 'GET') {
                return route.fulfill({ json: { plans: [{ planCode: 'office-pro', name: '办公室专业版' }], nextAfterPlanCode: '' } })
              }
              if (path === '/api/v1/platform/plans/office-pro/versions' && method === 'GET') {
                return route.fulfill({ json: { versions: [planVersionFixture], nextAfterVersion: '' } })
              }
              if (path === '/api/v1/platform/tenants/tenant-a/subscription' && method === 'GET') {
                return route.fulfill({ json: {
                  subscriptionId: 'sub-a', tenantId: 'tenant-a', kind: 'PLAN', state: 'ACTIVE', planCode: 'office-pro', planVersion: 3,
                  ruleId: '', ruleVersion: 0, salesScope: 'default', entitlementSourceVersion: 19, createdAt: '2026-09-01T08:00:00Z',
