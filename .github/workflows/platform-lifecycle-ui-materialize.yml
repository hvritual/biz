name: platform-lifecycle-ui-materialize
on:
  push:
    branches:
      - feat/platform-lifecycle-management-ui
    paths:
      - .github/workflows/platform-lifecycle-ui-materialize.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/platform-lifecycle-management-ui
          fetch-depth: 0
      - name: Materialize lifecycle UI in one source commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/platform-lifecycle-ui.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/platform-lifecycle-ui.b64 | tar -xzf - -C .
          rm .github/workflows/platform-lifecycle-ui-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web .github/workflows/platform-lifecycle-ui-materialize.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | grep '^web/' | wc -l)" -eq 8
          git commit -m "feat(web): add platform lifecycle management surfaces"
          git push origin HEAD:feat/platform-lifecycle-management-ui
