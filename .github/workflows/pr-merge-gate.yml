name: PR Merge Gate

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
      enterprise180: ${{ steps.route.outputs.enterprise180 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --depth=1
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 scripts/ci_changed_files_router.py --github-output "$GITHUB_OUTPUT"

  freeze-candidate:
    needs: route
    if: github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.lifecycle.outputs.candidate_sha }}
      main_sha: ${{ steps.lifecycle.outputs.main_sha }}
      state: ${{ steps.lifecycle.outputs.state }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze exact candidate against current main
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/candidate_lifecycle.py validate-contract
          python3 scripts/candidate_lifecycle.py assert-fresh --main-ref origin/main --candidate-ref HEAD
          {
            echo "## Candidate lifecycle"
            echo
            echo "- state: **CANDIDATE_FROZEN**"
            echo "- candidate: \`$(git rev-parse HEAD)\`"
            echo "- current main: \`$(git rev-parse origin/main)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  wait-qualification:
    needs: [route, freeze-candidate]
    if: github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      qualification_run_id: ${{ steps.control.outputs.qualification_run_id }}
      qualification_attempt: ${{ steps.control.outputs.qualification_attempt }}
      frozen_main_sha: ${{ steps.control.outputs.frozen_main_sha }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching PR Qualification success
        id: control
        run: python3 scripts/delivery_execution.py wait-qualification
      - name: Retain qualification decision even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-execution.json
          if-no-files-found: error
          retention-days: 30

  full-01-mysql-runtime-qualification:
    needs: [route, wait-qualification]
    if: github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true' && needs.wait-qualification.result == 'success'
    uses: ./.github/workflows/mysql-runtime-qualification.yml

  full-02-b12-7-runtime-qualification:
