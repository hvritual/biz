      - full-25-ec-ri-07-web-qualification
      - full-26-enterprise-168-sensitive-contacts
      - full-27-enterprise-169-privacy-consent
      - full-28-enterprise-170-verification-notification
      - full-29-enterprise-171-session-isolation
      - full-30-enterprise-173-password-security
      - full-31-enterprise-174-current-authorization
      - full-32-enterprise-175-authorized-navigation
      - full-33-enterprise-177-member-lifecycle
      - full-34-enterprise-role-qualification
      - full-35-evolution-qualification
    if: always() && github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      FULL_RESULTS: ${{ toJSON(needs) }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck current main before MERGE_READY
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/candidate_lifecycle.py assert-fresh --main-ref origin/main --candidate-ref HEAD
      - name: Enforce Delivery Execution Control Plane
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_proof_governance.py audit-run
          python3 scripts/delivery_execution.py merge-ready
      - name: Retain actual proof coverage and performance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-execution.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact delivery receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-execution.json
          if-no-files-found: error
          retention-days: 30
      - name: Record CI amplification metrics
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: node .github/scripts/ci-qualification-metrics.mjs
