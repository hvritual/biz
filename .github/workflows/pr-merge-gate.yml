name: PR Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --depth=1
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 scripts/ci_changed_files_router.py --github-output "$GITHUB_OUTPUT"

  wait-qualification:
    needs: route
    if: github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require matching PR Qualification success
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const candidate = process.env.CANDIDATE_SHA;
          const pr = process.env.PR_NUMBER;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + token,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = async (path) => {
            const response = await fetch('https://api.github.com' + path, { headers });
            if (!response.ok) throw new Error('GitHub API ' + response.status + ': ' + path);
            return response.json();
          };
          for (let attempt = 1; attempt <= 180; attempt += 1) {
            const pull = await api('/repos/' + repo + '/pulls/' + pr);
            if (pull.head?.sha !== candidate) throw new Error('candidate HEAD changed while waiting for PR Qualification');
            const payload = await api('/repos/' + repo + '/actions/runs?event=pull_request&head_sha=' + encodeURIComponent(candidate) + '&per_page=100');
            const runs = (payload.workflow_runs ?? [])
              .filter((run) => run.name === 'PR Qualification')
              .sort((a, b) => Number(b.id) - Number(a.id));
            const current = runs[0];
            if (current?.status === 'completed') {
              if (current.conclusion !== 'success') throw new Error('PR Qualification did not succeed: ' + current.conclusion);
              console.log('PR_QUALIFICATION=PASS run=' + current.id + ' candidate=' + candidate);
              process.exit(0);
            }
            console.log('waiting for PR Qualification candidate=' + candidate + ' attempt=' + attempt);
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          throw new Error('timed out waiting for PR Qualification');
          NODE

  full-01-b12-3-tenant-member-mysql:
    needs: [route, wait-qualification]
    if: github.event.pull_request.draft == false && needs.route.outputs.docs_only != 'true' && needs.wait-qualification.result == 'success'
    uses: ./.github/workflows/b12-3-tenant-member-mysql.yml

