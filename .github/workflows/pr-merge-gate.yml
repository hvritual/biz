      - full-07-ce02-bootstrap
      - full-08-ce03-qualification
      - full-09-ce04-qualification
      - full-10-ce05-qualification
      - full-11-ce06-qualification
      - full-12-ce07-qualification
      - full-13-ce08-qualification
      - full-14-ce09-qualification
      - full-15-ce10-qualification
      - full-16-ce12-browser-e2e
