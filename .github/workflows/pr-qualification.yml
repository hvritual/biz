name: PR Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      access: ${{ steps.route.outputs.access }}
      commercial: ${{ steps.route.outputs.commercial }}
      deviceops: ${{ steps.route.outputs.deviceops }}
      web: ${{ steps.route.outputs.web }}
      core: ${{ steps.route.outputs.core }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      domain_count: ${{ steps.route.outputs.domain_count }}
      native_login: ${{ steps.route.outputs.native_login }}
      delivery_isolation: ${{ steps.route.outputs.delivery_isolation }}
      ce_receipts: ${{ steps.route.outputs.ce_receipts }}
      web_e2e_harness: ${{ steps.route.outputs.web_e2e_harness }}
      web_product: ${{ steps.route.outputs.web_product }}
      role_grants: ${{ steps.route.outputs.role_grants }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Route changed files
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --depth=1
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 scripts/ci_changed_files_router.py --github-output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed-files.txt"
          {
            echo "## PR Qualification route"
            echo
            echo "- candidate: \`$HEAD_SHA\`"
            echo "- domains: \`$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(x["domain"] for x in d["domain_matrix"]) or "docs-only")' < <(python3 scripts/ci_changed_files_router.py < "$RUNNER_TEMP/changed-files.txt"))\`"
          } >> "$GITHUB_STEP_SUMMARY"

  governance:
    needs: route
    if: needs.route.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: CI governance, lifecycle and router tests
        run: |
          python3 scripts/candidate_lifecycle.py validate-contract
          python3 scripts/check_ci_qualification_governance.py
          python3 scripts/test_ci_changed_files_router.py
          python3 scripts/test_candidate_lifecycle.py
          node --test .github/scripts/main-qualification.test.mjs

  fast-web:
    needs: route
    if: needs.route.outputs.docs_only != 'true'
    uses: ./.github/workflows/candidate-qualification.yml

  access-role:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.access == 'true'
    uses: ./.github/workflows/b12-4-tenant-role-mysql.yml

  access-pressure:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.access == 'true'
    uses: ./.github/workflows/b12-multitenant-access-pressure.yml

  access-lifecycle:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.access == 'true'
    uses: ./.github/workflows/enterprise-178-role-lifecycle.yml

  access-native-login:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.native_login == 'true'
    uses: ./.github/workflows/enterprise-172-native-login.yml

  access-role-grants:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.role_grants == 'true'
    uses: ./.github/workflows/enterprise-179-role-grant-tree.yml
    with:
      skip_fast_check: true

  commercial-map:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.commercial == 'true'
    uses: ./.github/workflows/ce03-qualification.yml

  commercial-runtime:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.commercial == 'true'
    uses: ./.github/workflows/ce10-qualification.yml

  web-product:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.web_product == 'true'
    uses: ./.github/workflows/coffeelink-web.yml
    with:
      skip_fast_check: true

  web-e2e-harness:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.web_e2e_harness == 'true'
    uses: ./.github/workflows/web-e2e-harness.yml

  core-static:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.core == 'true'
    uses: ./.github/workflows/c9-pressure.yml

  core-framework:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.core == 'true'
    uses: ./.github/workflows/b12-8-framework-pressure-disposition.yml

  core-delivery-isolation:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.delivery_isolation == 'true'
    uses: ./.github/workflows/delivery-workspace-isolation.yml

  commercial-receipts:
    needs: route
    if: needs.route.outputs.ce_receipts == 'true'
    uses: ./.github/workflows/ce-round-receipts.yml

  deviceops-regression:
    needs: [route, governance, fast-web]
    if: needs.route.outputs.deviceops == 'true'
    uses: ./.github/workflows/evolution-qualification.yml
