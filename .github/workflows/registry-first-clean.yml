name: Registry-first clean pilot
on:
  push:
    branches: [feat/registry-first-pilot]
permissions:
  contents: write
concurrency:
  group: registry-first-clean-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply bounded Registry-first consumer change
        run: python3 .github/scripts/registry-first-clean.py
      - name: Qualify deterministic gates
        working-directory: web
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=line
      - name: Verify clean diff and publish qualified source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/scripts/registry-first-clean.py .github/workflows/registry-first-clean.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(design): complete Registry-first clean pilot"
          git push origin HEAD:feat/registry-first-pilot
