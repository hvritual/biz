name: Repair CE13 navigation selector
on:
  push:
    branches: [feat/platform-management-ui-contract]
    paths: ['.github/workflows/repair-ce13-nav-selector.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/platform-management-ui-contract
      - name: Replace only stale navigation labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/tests/ce13-platform/ce13-platform-commercial.spec.ts')
          source = path.read_text()
          old_trigger = 'getByRole("button", { name: "平台商业", exact: true })'
          new_trigger = 'getByRole("button", { name: "平台管理", exact: true })'
          old_dialog = 'getByRole("dialog", { name: "平台商业导航" })'
          new_dialog = 'getByRole("dialog", { name: "平台管理导航" })'
          assert source.count(old_trigger) == 1, source.count(old_trigger)
          assert source.count(old_dialog) == 1, source.count(old_dialog)
          source = source.replace(old_trigger, new_trigger).replace(old_dialog, new_dialog)
          path.write_text(source)
          PY
          git diff --check
          git diff -- web/tests/ce13-platform/ce13-platform-commercial.spec.ts
      - name: Commit exact repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-ce13-nav-selector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/tests/ce13-platform/ce13-platform-commercial.spec.ts .github/workflows/repair-ce13-nav-selector.yml
          git commit -m 'test(ce13): align platform console qualification with renamed navigation'
          git push origin HEAD:feat/platform-management-ui-contract
