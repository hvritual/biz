name: Scope platform visual E2E selectors
on:
  push:
    branches: [feat/platform-commercial-ui-contract-v11]
    paths: ['.github/workflows/repair-platform-visual-selectors.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/platform-commercial-ui-contract-v11
      - name: Scope only ambiguous visual assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/e2e/platform-management-visual.spec.ts')
          source = path.read_text()
          replacements = [
            (
              "await expect(page.getByText('设备运营', { exact: true })).toBeVisible()",
              "await expect(page.getByTestId('ce13-module-catalog').getByText('设备运营', { exact: true })).toBeVisible()",
            ),
            (
              "await expect(page.getByText('office-pro v3', { exact: true })).toBeVisible()",
              "await expect(page.locator('[data-ui-region=\"subscription\"]').getByText('office-pro v3', { exact: true })).toBeVisible()",
            ),
          ]
          for old, new in replacements:
              assert source.count(old) == 1, (old, source.count(old))
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          git diff --check
          git diff -- web/e2e/platform-management-visual.spec.ts
      - name: Commit exact selector repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/e2e/platform-management-visual.spec.ts
          git commit -m 'test(web): scope platform visual selectors to page regions'
          git push origin HEAD:feat/platform-commercial-ui-contract-v11
