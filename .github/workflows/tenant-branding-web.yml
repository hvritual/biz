name: Tenant branding web closure
on:
  push:
    branches: [feat/tenant-branding-web]
permissions:
  contents: write
concurrency:
  group: tenant-branding-web-closure
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply bounded tenant branding integration
        run: python3 .github/scripts/tenant-branding-web.py
      - name: Run deterministic gates
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Install browser and text support
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run authoritative enterprise API slices
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          VITE_DATA_MODE=api npm run build
          ENTERPRISE_MEMBER_REAL_E2E=1 ENTERPRISE_ROLE_REAL_E2E=1 ENTERPRISE_BRANDING_REAL_E2E=1 npx playwright test \
            e2e/enterprise-members-real.spec.ts \
            e2e/enterprise-roles-real.spec.ts \
            e2e/enterprise-branding-real.spec.ts --reporter=line
          npm run build
      - name: Run full browser regression
        working-directory: web
        run: npm run test:e2e -- --reporter=line
      - name: Publish qualified frontend closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/scripts/tenant-branding-web.py .github/workflows/tenant-branding-web.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(enterprise): complete tenant branding frontend closure"
          git push origin HEAD:feat/tenant-branding-web
