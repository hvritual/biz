name: terminalization-t4-changeset-reverse4

on:
  push:
    branches:
      - qualification/terminalization-t4-changeset-b13-reverse4
    paths:
      - .github/workflows/terminalization-t4-changeset-reverse4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset-b13-reverse4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 43a7a0df64afecba8beb114f4828827bdeb5142b
      BIZ_PRESSURE_SHA: 506e9c117822855db318f8b4b6689d318a62ded1
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka T4 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          git -C biz merge-base --is-ancestor "$BIZ_PRESSURE_SHA" HEAD
          changed="$(git -C biz diff -- name-only "$BIZ_PRESSURE_SHA"...HEAD)"
          test "$changed" = ".github/workflows/terminalization-t4-changeset-reverse4.yml"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build exact candidate CLI and protobuf plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"
          go -C yunka.io/app build -o "$RUNNER_TEMP/yunka" ./cmd
          "$RUNNER_TEMP/yunka" change set --help > "$RUNNER_ TEMP/change-set-help.txt"
          grep -q "begin" "$RUNNER_TEMP/change-set-help.txt"
          grep -q "check" "$RUNNER_TEMP/change-set-help.txt"

      - name: Capture clean consumer baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t4-evidence"
          git -C biz status --porcelain > "$RUNNER_TEMP/t4-evidence/before.status"
          test ! -s "$RUNNER_TEMP/t4-everything/before.status"

      - name: Qualify clean B13 canonical generate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/yunka" generate \
            --root "$GITHUB_WORKSPACE/biz" \
            --protoc "$(command -v protoc)" \
            --format agent-json > "$RUNNER_TEMP/t4-evidence/clean-generate.json"

      - name: Restore after clean generate probe
        shell: bash
        run: |
          set -euo pipefail
          git -C biz reset --hard "$GITHUB_SHA"
          git -C biz clean -fdx
          rm -rf biz/.git/yunka
          git -C biz status --porcelain > "$RUNNER_TEMP/t4-evidence/after-clean-reset.status"
          diff -u "$RUNNER_TEMP/t4-evidence/before.status" "$RUNNER_TEMP/t4-evidence/after-clean-reset.status"

      - name: Qualify matching create ChangeSet
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/t4-evidence"
          root="$GITHUB_WORKSPACE/biz"
          plan="$RUNNER_TEMP/t4-create-plan.json"

          "$RUNNER_TEMP/yunka" add operation access/tenant_lifecycle tenant.t4_qualification_probe \
            --root "$root" \
            --source contracts/proto/access/v1/tenant.proto \
            --use-case terminalization_t4_qualification_probe \
            --access protected \
            --permission tenant.delegation.manage \
            --permission-mode all \
            --tenant required \
            --authentication api-key \
            --transaction read-only \
            --idempotency none \
            --composition none \
            --plan \
            --format agent-json > "$plan"

          "$RUNNER_TEMP/yunka" change set begin \
            --root "$root" \
            --base HEAD \
            --create-plan "$plan" \
            --format agent-json > "$evidence/matching-set-begin.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 't4-evidence'
          begin = json.loads((evidence / 'matching-set-begin.json').read_text())
          assert begin['path'] == '.git/yunka/change-set.json', begin
          assert begin['changeSet']['schemaVersion'] == 2, begin
          PY

          git -C biz status --porcelain > "$evidence/after-set-begin.status"
          diff -u "$evidence/before.status" "$evidence/after-set-begin.status"

          "$RUNNER_TEMP/yunka" add operation access/tenant_lifecycle tenant.t4_qualification_probe \
            --root "$root" \
            --source contracts/proto/access/v1/tenant.proto \
            --use-case terminalization_t4_qualification_probe \
            --access protected \
            --permission tenant.delegation.manage \
            --permission-mode all \
            --tenant required \
            --authentication api-key \
            --transaction read-only \
            --idempotency none \
            --composition none \
            --format agent-json > "$evidence/matching-add.json"

          "$RUNNER_TEMP/yunka" generate \
            --root "$root" \
            --protoc "$(command -v protoc)" \
            --format agent-json > "$evidence/matching-generate.json"

          "$RUNNER_TEMP/yunka" change set check \
            --root "$root" \
            --format agent-json > "$evidence/matching-check.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 't4-evidence'
          report = json.loads((evidence / 'matching-check.json').read_text())
          assert report['conformant'] is True, report
          assert report['reconciliation']['violations'] == [], report
          assert report['semantic']['violations'] == [], report
          assert any(d['subject'] == 'operation:tenant.t4_qualification_probe' and d['field'] == 'existence' and d['allowed'] for d in report['semantic']['deltas']), report
          PY

      - name: Restore after matching fixture
        shell: bash
        run: |
          set -euo pipefail
          git -C biz reset --hard "$GITHUB_SHA"
          git -C biz clean -fdx
          rm -rf biz/.git/yunka
          git -C biz status --porcelain > "$RUNNER_TEMP/t4-evidence/after-matching-reset.status"
          diff -u "$RUNNER_TEMP/t4-evidence/before.status" "$RUNNER_TEMP/t4_evidence/after-matching-reset.status"

      - name: Reject create semantics that drift from planned intent
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/t4-evidence"
          root="$GITHUB_WORKSPACE/biz"
          plan="$RUNNER_TEMP/t4-drift-plan.json"

          "$RUNNER_TEMP/yunka" add operation access/tenant_lifecycle tenant.t4_qualification_probe \
            --root "$root" \
            --source contracts/proto/access/v1/tenant.proto \
            --use-case terminalization_t4_qualification_probe \
            --access protected \
            --permission tenant.delegation.manage \
            --permission-mode all \
            --tenant required \
            --authentication api-key \
            --transaction read-only \
            --idempotency none \
            --composition none \
            --plan \
            --format agent-json > "$plan"

          "$RUNNER_TEMP/yunka" change set begin \
            --root "$root" \
            --base HEAD \
            --create-plan "$plan" \
            --format agent-json > "$evidence/drift-set-begin.json"

          "$RUNNER_TEMP/yunka" add operation access/tenant_lifecycle tenant.t4_qualification_probe \
            --root "$root" \
            --source contracts/proto/access/v1/tenant.proto \
            --use-case terminalization_t4_qualification_probe \
            --access public \
            --tenant optional \
            --transaction none \
            --idempotency none \
            --composition none \
            --format agent-json > "$evidence/drift-add.json"

          "$RUNNER_TEMP/yunka" generate \
            --root "$root" \
            --protoc "$(command -v protoc)" \
            --format agent-json > "$RUNNER_TEMP/t4-evidence/drift-generate.json"

          if "$RUNNER_TEMP/yunka" change set check \
            --root "$root" \
            --format agent-json > "$evidence/drift-check.json"; then
            echo "planned-vs-actual create semantic drift unexpectedly conformed" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 't4-evidence'
          report = json.loads((evidence / 'drift-check.json').read_text())
          assert report['conformant'] is False, report
          categories = {v['category'] for v in report['semantic']['violations']}
          expected = {'permission', 'tenant', 'authentication', 'transaction'}
          assert expected.issubset(categories), (categories, expected, report)
          assert report['reconciliation']['violations'] == [], report
          (evidence / 'drift-summary.txt').write_text('categories=' + ','.join(sorted(categories)) + '\n')
          PY

      - name: Reconcile qualification worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C biz reset --hard "$GITHUB_SHA"
          git -C biz clean -fdx
          rm -rf biz/.git/yunka
          git -C biz status --porcelain > "$RUNNER_TEMP/t4-evidence/final.status"
          diff -u "$RUNNER_TEMP/t4-evidence/before.status" "$RUNNER_TEMP/t4-evidence/final.status"

      - name: Upload deterministic T4 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminalization-t4-b13-changeset-reverse4
          path: ${{ runner.temp }}/t4-evidence
          if-no-files-found: warn
          retention-days: 3
