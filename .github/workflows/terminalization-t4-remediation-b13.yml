name: terminalization-t4-remediation-b13

on:
  push:
    branches:
      - qualification/terminalization-t4-remediation-b13
    paths:
      - .github/workflows/terminalization-t4-remediation-b13.yml
      - .github/qualification/t4-remediation-pressure.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediation-b13:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YUNKA_SHA: d527d2bbfb1c9bcd89598c680b81679def68f488
      BIZ_PRESSURE_SHA: 506e9c117822855db318f8b4b6689d318a62ded1
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka T4.3 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          git -C biz merge-base --is-ancestor "$BIZ_PRESSURE_SHA" HEAD
          changed="$(git -C biz diff --name-only "$BIZ_PRESSURE_SHA"...HEAD)"
          expected=$'.github/qualification/t4-remediation-pressure.sh\n.github/workflows/terminalization-t4-remediation-b13.yml'
          test "$changed" = "$expected"

      - name: Load locked Yunka Go toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Build exact candidate CLI
        shell: bash
        run: |
          set -euo pipefail
          go -C yunka.io/app build -o "$RUNNER_TEMP/yunka" ./cmd
          "$RUNNER_TEMP/yunka" change set remediation --help > "$RUNNER_TEMP/remediation-help.txt"
          grep -q "bind" "$RUNNER_TEMP/remediation-help.txt"
          grep -q "check" "$RUNNER_TEMP/remediation-help.txt"

      - name: Execute real consumer remediation pressure
        shell: bash
        env:
          YUNKA_BIN: ${{ runner.temp }}/yunka
          ROOT: ${{ github.workspace }}/biz
          EVIDENCE: ${{ runner.temp }}/t4-remediation-evidence
        run: |
          set -euo pipefail
          bash biz/.github/qualification/t4-remediation-pressure.sh

      - name: Restore consumer worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C biz reset --hard "$GITHUB_SHA"
          git -C biz clean -fdx
          rm -rf biz/.git/yunka

      - name: Upload deterministic T4.3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminalization-t4-remediation-b13
          path: ${{ runner.temp }}/t4-remediation-evidence
          if-no-files-found: warn
          retention-days: 3
