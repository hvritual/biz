name: terminalization-t5-proof-b13

on:
  push:
    branches:
      - qualification/terminalization-t5-proof-b13
    paths:
      - .github/workflows/terminalization-t5-proof-b13.yml
      - .github/qualification/t5-proof-of-change-pressure.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-of-change-b13:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUNKA_SHA: 4c41e4ec518aebd5809b3675af95a67531c7980e
      BIZ_PRESSURE_SHA: 506e9c117822855db318f8b4b6689d318a62ded1
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: biz
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Yunka T5.1 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hvritual/yunka.io
          ref: ${{ env.YUNKA_SHA }}
          path: yunka.io
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C yunka.io rev-parse HEAD)" = "$YUNKA_SHA"
          git -C biz merge-base --is-ancestor "$BIZ_PRESSURE_SHA" HEAD
          changed="$(git -C biz diff --name-only "$BIZ_PRESSURE_SHA"...HEAD)"
          expected=$'.github/qualification/t5-proof-of-change-pressure.sh\n.github/workflows/terminalization-t5-proof-b13.yml'
          test "$changed" = "$expected"

      - name: Load locked Yunka toolchain
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          source yunka.io/tools/toolchain.env
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "protoc_release=${PROTOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "protoc_sha256=${PROTOC_LINUX_X86_64_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Install locked protoc
        shell: bash
        env:
          PROTOC_RELEASE: ${{ steps.lock.outputs.protoc_release }}
          PROTOC_SHA256: ${{ steps.lock.outputs.protoc_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          root="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" \
            -o "$archive"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build locked protobuf Go plugins
        shell: bash
        run: |
          set -euo pipefail
          make -C yunka.io rpc-tools
          echo "$GITHUB_WORKSPACE/yunka.io/.yunka/bin" >> "$GITHUB_PATH"

      - name: Build exact T5.1 candidate CLI
        shell: bash
        run: |
          set -euo pipefail
          go -C yunka.io/app build -o "$RUNNER_TEMP/yunka" ./cmd
          "$RUNNER_TEMP/yunka" change verify --help > "$RUNNER_TEMP/change-verify-help.txt"
          grep -q "attestation" "$RUNNER_TEMP/change-verify-help.txt"

      - name: Execute real consumer Proof-of-Change pressure
        shell: bash
        env:
          YUNKA_BIN: ${{ runner.temp }}/yunka
          YUNKA_ROOT: ${{ github.workspace }}/yunka.io
          ROOT: ${{ github.workspace }}/biz
          EVIDENCE: ${{ runner.temp }}/t5-proof-evidence
        run: |
          set -euo pipefail
          bash biz/.github/qualification/t5-proof-of-change-pressure.sh

      - name: Restore consumer worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C biz reset --hard "$GITHUB_SHA"
          git -C biz clean -fdx
          rm -rf biz/.git/yunka

      - name: Upload deterministic T5.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminalization-t5-proof-b13
          path: ${{ runner.temp }}/t5-proof-evidence
          if-no-files-found: warn
          retention-days: 3
