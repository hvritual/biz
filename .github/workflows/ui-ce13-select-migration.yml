name: ui-ce13-select-migration

on:
  push:
    branches:
      - refactor/ui-three-layer-system
    paths:
      - .github/workflows/ui-ce13-select-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/ui-three-layer-system
          fetch-depth: 0
      - name: Replace native-select test assumptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/tests/ce13-platform/ce13-platform-commercial.spec.ts')
          text = path.read_text()
          replacements = {
              '  await editor.getByLabel("模块").selectOption("device-operations");': '  await editor.getByLabel("模块").click();\n  await page.locator(\'[data-slot="select-item"][data-ui-option-value="device-operations"]\').click();',
              '  await override.getByLabel("模块", { exact: true }).selectOption("device-operations");': '  await override.getByLabel("模块", { exact: true }).click();\n  await page.locator(\'[data-slot="select-item"][data-ui-option-value="device-operations"]\').click();',
              '  await override.getByLabel("目标类型", { exact: true }).selectOption("ENTITLEMENT_TARGET_CAPABILITY");': '  await override.getByLabel("目标类型", { exact: true }).click();\n  await page.locator(\'[data-slot="select-item"][data-ui-option-value="ENTITLEMENT_TARGET_CAPABILITY"]\').click();',
              '  await override.getByLabel("目标 key", { exact: true }).selectOption("device.lifecycle");': '  await override.getByLabel("目标 key", { exact: true }).click();\n  await page.locator(\'[data-slot="select-item"][data-ui-option-value="device.lifecycle"]\').click();',
              '  await override.getByLabel("效果", { exact: true }).selectOption("ENTITLEMENT_EFFECT_DENY");': '  await override.getByLabel("效果", { exact: true }).click();\n  await page.locator(\'[data-slot="select-item"][data-ui-option-value="ENTITLEMENT_EFFECT_DENY"]\').click();',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {before}')
              text = text.replace(before, after)
          if '.selectOption(' in text:
              raise SystemExit('unexpected legacy selectOption remains in CE13 platform test')
          path.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/tests/ce13-platform/ce13-platform-commercial.spec.ts
          git commit -m 'test(web): migrate CE-13 custom select interactions'
          git push origin HEAD:refactor/ui-three-layer-system
