name: ui-finalize-migration-v2
on:
  push:
    branches: [refactor/ui-three-layer-system]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[ui-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-three-layer-system
      - name: Apply deterministic migration transforms
        shell: bash
        run: |
          awk '/python3 - <<'\''PY'\''/{capture=1;next} capture && /^          PY$/{exit} capture {sub(/^          /, ""); print}' .github/workflows/ui-finalize-migration.yml > /tmp/ui-finalize.py
          python3 /tmp/ui-finalize.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify migrated frontend without reformatting unrelated source
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Commit finalized migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): finalize design-system compatibility [ui-finalized]"
          git push origin HEAD:refactor/ui-three-layer-system
