name: ui-finalize-migration
on:
  push:
    branches: [refactor/ui-three-layer-system]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[ui-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-three-layer-system
      - name: Normalize design-system E2E and navigation geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('web')

          option = root / 'src/ui/base/UiOption.vue'
          source = option.read_text()
          if 'data-ui-option-value' not in source:
              source = source.replace('data-slot="select-item"', 'data-slot="select-item"\n    :data-ui-option-value="normalized"')
              option.write_text(source)

          helper = root / 'e2e/ui.helpers.ts'
          helper.write_text("""import { expect, type Locator } from '@playwright/test'\n\nexport async function selectUiOption(control: Locator, value: string | number) {\n  await control.click()\n  const options = control.page().locator('[data-slot=\"select-item\"]')\n  const expected = String(value)\n  const index = await options.evaluateAll(\n    (elements, wanted) => elements.findIndex((element) => element.getAttribute('data-ui-option-value') === wanted),\n    expected,\n  )\n  expect(index, `UI option value not found: ${expected}`).toBeGreaterThanOrEqual(0)\n  await options.nth(index).click()\n}\n""")

          customer_helper = root / 'e2e/customer.helpers.ts'
          source = customer_helper.read_text()
          if "from './ui.helpers'" not in source:
              source = source.replace("import { createCustomerSeed } from '../src/services/customer/seed'\n", "import { createCustomerSeed } from '../src/services/customer/seed'\nimport { selectUiOption } from './ui.helpers'\n")
          start = source.index('export async function fill(')
          end = source.index('export async function commit(', start)
          fill = """export async function fill(dialog: Locator, values: Record<string, string | boolean>) {\n  for (const [key, value] of Object.entries(values)) {\n    const field = dialog.locator(`[data-field=\"${key}\"]`)\n    if (typeof value === 'boolean') {\n      await field.getByRole('checkbox').setChecked(value)\n      continue\n    }\n    const combobox = field.getByRole('combobox')\n    if (await combobox.count()) {\n      await selectUiOption(combobox, value)\n      continue\n    }\n    await field.locator('input,textarea').first().fill(value)\n  }\n}\n"""
          source = source[:start] + fill + source[end:]
          customer_helper.write_text(source)

          pattern = re.compile(r"await\s+([^\n;]+?)\.selectOption\(([^)\n]+)\)")
          changed = []
          for path in sorted((root / 'e2e').glob('*.ts')):
              if path.name in {'ui.helpers.ts', 'customer.helpers.ts'}:
                  continue
              source = path.read_text()
              next_source, count = pattern.subn(lambda m: f"await selectUiOption({m.group(1)}, {m.group(2)})", source)
              if not count:
                  continue
              if "from './ui.helpers'" not in next_source:
                  next_source = "import { selectUiOption } from './ui.helpers'\n" + next_source
              path.write_text(next_source)
              changed.append((path.name, count))

          primary = root / 'src/features/app-shell/components/PrimaryNavigation.vue'
          source = primary.read_text()
          source = source.replace(".primary-nav {\n  flex-shrink: 0;", ".primary-nav {\n  width: 100%;\n  flex-shrink: 0;")
          source = source.replace(".primary-nav.collapsed {\n  width: 64px;", ".primary-nav.collapsed {")
          source = source.replace('height: 47px;', 'height: 48px;')
          primary.write_text(source)

          shell = root / 'src/features/app-shell/components/AppShell.vue'
          source = shell.read_text()
          source = source.replace('width: calc(var(--current-rail) - 16px);', 'width: var(--current-rail);')
          source = source.replace('width: calc(var(--current-rail) - 16px + var(--module-width));', 'width: calc(var(--current-rail) + var(--module-width));')
          marker = ".side-frame.joined {\n"
          if '.side-frame :deep(.primary-nav) {' not in source:
              source = source.replace(marker, ".side-frame :deep(.primary-nav) {\n  width: var(--current-rail);\n  flex: 0 0 var(--current-rail);\n}\n" + marker)
          source = source.replace('background: white;', 'background: var(--color-surface);')
          source = source.replace('.side-frame :deep(.primary-nav) { width: 80px; border-radius: 0 !important; }', '.side-frame :deep(.primary-nav) { width: var(--rail-collapsed-width); flex-basis: var(--rail-collapsed-width); border-radius: 0 !important; }')
          source = source.replace('.app-shell { --current-rail: 80px; }', '.app-shell { --current-rail: var(--rail-collapsed-width); }')
          shell.write_text(source)

          panel = root / 'src/features/app-shell/components/ModulePanel.vue'
          source = panel.read_text()
          source = source.replace('padding: 24px;', 'padding: 20px;')
          source = source.replace('border-radius: 0 var(--radius-lg) var(--radius-lg) 0;', 'border-radius: 0 var(--radius-xl) var(--radius-xl) 0;')
          source = source.replace('gap: 22px;', 'gap: 12px;')
          source = source.replace('.module-panel { padding: 20px 24px; }', '.module-panel { padding: 20px; }')
          source = source.replace('width: calc(100vw - 80px);', 'width: calc(100vw - var(--rail-collapsed-width));')
          panel.write_text(source)

          console = root / 'e2e/console.spec.ts'
          source = console.read_text()
          source = source.replace("expect((await page.locator('.primary-nav').boundingBox())!.width).toBe(64)", "expect((await page.locator('.primary-nav').boundingBox())!.width).toBe(68)")
          source = source.replace("expect((await page.locator('.module-panel').boundingBox())!.width).toBe(310)", "expect((await page.locator('.module-panel').boundingBox())!.width).toBe(322)")
          console.write_text(source)

          architecture = root / 'scripts/check-architecture.mjs'
          source = architecture.read_text()
          guard = """\nconst appShellSource = readFileSync(resolve(root, 'features/app-shell/components/AppShell.vue'), 'utf8')\nconst primaryNavigationSource = readFileSync(resolve(root, 'features/app-shell/components/PrimaryNavigation.vue'), 'utf8')\nconst modulePanelSource = readFileSync(resolve(root, 'features/app-shell/components/ModulePanel.vue'), 'utf8')\nif (primaryNavigationSource.includes('width: 64px') || appShellSource.includes('--current-rail: 80px') || modulePanelSource.includes('100vw - 80px')) failures.push('app shell must consume rail design tokens instead of legacy 64/80px widths')\nif (!appShellSource.includes('width: var(--current-rail)') || !appShellSource.includes('width: calc(var(--current-rail) + var(--module-width))')) failures.push('app shell rail/flyout geometry must be token-driven')\nif (!modulePanelSource.includes('padding: 20px') || !modulePanelSource.includes('gap: 12px') || !modulePanelSource.includes('var(--radius-xl)')) failures.push('module panel must preserve CoffeeLink V1.1 20px padding, 12px columns and 18px outer radius')\n"""
          if 'appShellSource' not in source:
              source = source.replace("const manifestFile = resolve(root, 'features/component-scopes.json')", guard + "\nconst manifestFile = resolve(root, 'features/component-scopes.json')")
          architecture.write_text(source)

          remaining = []
          for path in sorted((root / 'e2e').glob('*.ts')):
              text = path.read_text()
              if '.selectOption(' in text:
                  remaining.append(f'{path}: selectOption')
          if remaining:
              raise SystemExit('\n'.join(remaining))
          print('converted E2E files:', changed)
          PY
      - name: Format and verify static UI checks
        working-directory: web
        run: |
          npx prettier --write "src/**/*.{vue,ts,css,json}" "e2e/*.ts" "scripts/*.mjs"
          npm ci
          npm run check
      - name: Commit finalized migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web
          git diff --cached --quiet && exit 0
          git commit -m "fix(web): finalize design-system compatibility [ui-finalized]"
          git push origin HEAD:refactor/ui-three-layer-system
