name: UI Route API Contract Remediation

on:
  push:
    branches:
      - refactor/ui-route-convergence
    paths:
      - .github/workflows/ui-route-api-contract-remediation.yml

permissions:
  contents: write

jobs:
  remediate-role-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Align role API E2E accessible label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/e2e/enterprise-roles-real.spec.ts')
          text = path.read_text()
          old = "await dialog.getByLabel('查看成员', { exact: true }).check()"
          new = "await dialog.getByLabel('企业成员 查看成员', { exact: true }).check()"
          assert old in text, 'legacy role permission locator not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build API mode
        working-directory: web
        env:
          VITE_DATA_MODE: api
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify role create API contract
        working-directory: web
        env:
          VITE_DATA_MODE: api
          ENTERPRISE_ROLE_REAL_E2E: '1'
        run: npx playwright test e2e/enterprise-roles-real.spec.ts --grep "role create and permission update"
      - name: Commit verified contract alignment and self-clean
        run: |
          rm .github/workflows/ui-route-api-contract-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(web): align role permission locator with accessible label"
          git push origin HEAD:refactor/ui-route-convergence
