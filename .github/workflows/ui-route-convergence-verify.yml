name: UI Route Convergence Verify

on:
  push:
    branches:
      - refactor/ui-route-convergence

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run full static and unit gate
        working-directory: web
        run: npm run check
