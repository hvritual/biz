name: UI Route Domain Migration

on:
  push:
    branches:
      - refactor/ui-route-convergence
    paths:
      - '.github/workflows/ui-route-domain-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply domain-scoped enterprise migration
        working-directory: web
        run: node scripts/apply-domain-scoped-enterprise.mjs
      - name: Commit migration and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(enterprise): load canonical pages by domain"
          git push origin HEAD:refactor/ui-route-convergence
