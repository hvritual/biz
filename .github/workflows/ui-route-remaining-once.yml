name: UI Route Remaining Convergence Once

on:
  push:
    branches:
      - refactor/ui-route-convergence
    paths:
      - web/scripts/apply-remaining-route-convergence.py
      - .github/workflows/ui-route-remaining-once.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ENTERPRISE_ROLE_REAL_E2E: '1'
      ENTERPRISE_ORGANIZATION_REAL_E2E: '1'
      ENTERPRISE_PLAN_REAL_E2E: '1'
      ENTERPRISE_PLAN_CHANGE_E2E: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply remaining convergence migration
        run: python3 web/scripts/apply-remaining-route-convergence.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run full static and unit gate
        working-directory: web
        run: npm run check
      - name: Build canonical API-mode UI
        working-directory: web
        env:
          VITE_DATA_MODE: api
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify remaining canonical API domains
        working-directory: web
        env:
          VITE_DATA_MODE: api
        run: >-
          npx playwright test
          e2e/enterprise-organization-real.spec.ts
          e2e/enterprise-roles-real.spec.ts
          e2e/enterprise-plan-real.spec.ts
          e2e/enterprise-plan-change-real.spec.ts
      - name: Commit verified migration and self-clean
        run: |
          rm web/scripts/apply-remaining-route-convergence.py
          rm .github/workflows/ui-route-remaining-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): converge remaining enterprise API domains"
          git push origin HEAD:refactor/ui-route-convergence
