name: UI Route Targeted Remediation

on:
  push:
    branches:
      - refactor/ui-route-convergence
    paths:
      - .github/workflows/ui-route-targeted-remediation.yml

permissions:
  contents: write

jobs:
  targeted-remediation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply product and contract remediation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          member = Path('web/src/features/enterprise/components/members/MemberActionDialog.vue')
          text = member.read_text()
          marker = '        ><label class="option-line"\n          ><UiInput v-model="confirmed" type="checkbox" />我已确认成员身份，并了解此处不会发送真实邮件</label\n        >'
          replacement = '        ><label class="field"\n          ><span class="required">操作原因</span\n          ><UiTextarea\n            v-model="reason"\n            class="textarea"\n            maxlength="300"\n            placeholder="请记录发起密码重置请求的原因，用于审计追踪"\n          /></label\n        ><label class="option-line"\n          ><UiInput v-model="confirmed" type="checkbox" />我已确认成员身份，并了解此处不会发送真实邮件</label\n        >'
          assert marker in text, 'password reset confirmation marker not found'
          member.write_text(text.replace(marker, replacement, 1))

          role = Path('web/src/features/enterprise/components/roles/RoleEditor.vue')
          text = role.read_text()
          marker = ':aria-label="item.label"'
          replacement = ':aria-label="`${group.name} ${item.label}`"'
          assert marker in text, 'role permission aria-label marker not found'
          role.write_text(text.replace(marker, replacement, 1))

          spec = Path('web/e2e/console.spec.ts')
          text = spec.read_text()
          marker = "  await d.getByRole('checkbox').check()\n  await d.getByRole('button', { name: '记录重置请求', exact: true }).click()"
          replacement = "  await d.getByRole('checkbox').check()\n  await d.getByLabel('操作原因', { exact: true }).fill('成员身份已核验，发起密码重置预览请求')\n  await d.getByRole('button', { name: '记录重置请求', exact: true }).click()"
          assert marker in text, 'password reset E2E marker not found'
          spec.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run static and unit gate
        working-directory: web
        run: npm run check
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify console regressions
        working-directory: web
        run: npx playwright test e2e/console.spec.ts --grep "password reset|role creation"
      - name: Verify customer route action hydration
        working-directory: web
        run: |
          npx playwright test e2e/customer-gallery.spec.ts --grep "03 edit customer persists"
          npx playwright test e2e/customer-acceptance-review.spec.ts --grep "positive acceptance evidence and confirmation surface: CS-104"
          npx playwright test e2e/customer-interactions.spec.ts --grep "create customer with first work"
      - name: Verify site rental route action hydration
        working-directory: web
        run: npx playwright test e2e/site-rental.spec.ts --grep "missing scope or mid-period date cannot be published"
      - name: Commit qualified remediation and self-clean
        run: |
          rm .github/workflows/ui-route-targeted-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): restore query actions and high-risk form semantics"
          git push origin HEAD:refactor/ui-route-convergence
