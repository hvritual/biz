syntax = "proto3";

package access.v1;

import "google/api/annotations.proto";
import "yunka/dsl/v1/options.proto";

option go_package = "github.com/hvritual/biz/contracts/gen/access/v1;accessv1";
option (yunka.dsl.v1.domain) = {
  name: "access"
  version: "v1"
};

enum TenantDepartmentStatus {
  TENANT_DEPARTMENT_STATUS_UNSPECIFIED = 0;
  TENANT_DEPARTMENT_STATUS_ACTIVE = 1;
  TENANT_DEPARTMENT_STATUS_DISABLED = 2;
}

message TenantDepartmentDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string department_id = 1;
  string name = 2;
  string parent_id = 3;
  string leader_user_id = 4;
  string email = 5;
  string phone = 6;
  TenantDepartmentStatus status = 7;
  int32 sort = 8;
  uint64 version = 9;
}

message CreateTenantDepartmentRequest {
  string name = 1;
  string parent_id = 2;
  string leader_user_id = 3;
  string email = 4;
  string phone = 5;
  int32 sort = 6;
}

message GetTenantDepartmentRequest {
  string department_id = 1;
}

message ListTenantDepartmentsRequest {}

message ListTenantDepartmentsResponse {
  repeated TenantDepartmentDTO departments = 1;
}

message UpdateTenantDepartmentRequest {
  string department_id = 1;
  string name = 2;
  string parent_id = 3;
  string leader_user_id = 4;
  string email = 5;
  string phone = 6;
  int32 sort = 7;
  uint64 version = 8;
}

message EnableTenantDepartmentRequest {
  string department_id = 1;
  uint64 version = 2;
}

message DisableTenantDepartmentRequest {
  string department_id = 1;
  uint64 version = 2;
}

message AssertTenantMemberDepartmentAssignmentAllowedRequest {
  string department_id = 1;
}

message AssertTenantMemberDepartmentAssignmentAllowedResponse {}

service TenantDepartmentManagementApplication {
  option (yunka.dsl.v1.application) = {
    name: "tenant_department_management"
    operations: {
      id: "tenant.department.assert_member_assignment_allowed"
      use_case: "assert_tenant_member_department_assignment_allowed"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
      request_type: "access.v1.AssertTenantMemberDepartmentAssignmentAllowedRequest"
      response_type: "access.v1.AssertTenantMemberDepartmentAssignmentAllowedResponse"
      application_method: "AssertTenantMemberDepartmentAssignmentAllowed"
    }
  };

  rpc CreateTenantDepartment(CreateTenantDepartmentRequest) returns (TenantDepartmentDTO) {
    option (google.api.http) = { post: "/v1/tenant/departments" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.create"
      use_case: "create_tenant_department"
      permissions: "tenant.organization.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc GetTenantDepartment(GetTenantDepartmentRequest) returns (TenantDepartmentDTO) {
    option (google.api.http) = { get: "/v1/tenant/departments/{department_id}" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.get"
      use_case: "get_tenant_department"
      permissions: "tenant.organization.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc ListTenantDepartments(ListTenantDepartmentsRequest) returns (ListTenantDepartmentsResponse) {
    option (google.api.http) = { get: "/v1/tenant/departments" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.list"
      use_case: "list_tenant_departments"
      permissions: "tenant.organization.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc UpdateTenantDepartment(UpdateTenantDepartmentRequest) returns (TenantDepartmentDTO) {
    option (google.api.http) = { patch: "/v1/tenant/departments/{department_id}" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.update"
      use_case: "update_tenant_department"
      permissions: "tenant.organization.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc EnableTenantDepartment(EnableTenantDepartmentRequest) returns (TenantDepartmentDTO) {
    option (google.api.http) = { post: "/v1/tenant/departments/{department_id}/enable" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.enable"
      use_case: "enable_tenant_department"
      permissions: "tenant.organization.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc DisableTenantDepartment(DisableTenantDepartmentRequest) returns (TenantDepartmentDTO) {
    option (google.api.http) = { post: "/v1/tenant/departments/{department_id}/disable" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.department.disable"
      use_case: "disable_tenant_department"
      permissions: "tenant.organization.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }
}
