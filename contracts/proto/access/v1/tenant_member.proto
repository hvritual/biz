syntax = "proto3";

package access.v1;

import "google/api/annotations.proto";
import "yunka/dsl/v1/options.proto";

option go_package = "github.com/hvritual/biz/contracts/gen/access/v1;accessv1";
option (yunka.dsl.v1.domain) = {
  name: "access"
  version: "v1"
};

enum TenantMemberStatus {
  TENANT_MEMBER_STATUS_UNSPECIFIED = 0;
  TENANT_MEMBER_STATUS_INVITED = 1;
  TENANT_MEMBER_STATUS_ACTIVE = 2;
  TENANT_MEMBER_STATUS_SUSPENDED = 3;
  TENANT_MEMBER_STATUS_REMOVED = 4;
}

enum TenantMemberActivationMode {
  TENANT_MEMBER_ACTIVATION_MODE_UNSPECIFIED = 0;
  TENANT_MEMBER_ACTIVATION_MODE_ACTIVATION_LINK = 1;
  TENANT_MEMBER_ACTIVATION_MODE_SMS_INITIAL_PASSWORD = 2;
}

message TenantMemberRoleDTO {
  string role_id = 1;
  string role_name = 2;
  string role_status = 3;
}

message TenantMemberDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string user_id = 1;
  string email = 2;
  TenantMemberStatus status = 3;
  uint64 version = 4;
  string name = 5;
  string phone = 6;
  string employee_id = 7;
  string position = 8;
  string department_id = 9;
  repeated TenantMemberRoleDTO roles = 10;
  // UI/read-model summary only. Authorization continues to evaluate each
  // permission grant independently. Values: none, self, sites, all.
  string derived_data_scope = 11;
  string username = 12;
}

message TenantPersonalProfileDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string user_id = 1;
  string username = 2;
  string name = 3;
  string tenant_id = 4;
  string tenant_name = 5;
  repeated TenantMemberRoleDTO roles = 6;
  string registered_at = 7;
  string joined_at = 8;
  string email = 9;
  string phone = 10;
  string avatar_asset_ref = 11;
  uint64 version = 12;
  string employee_id = 13;
  string position = 14;
  string department_id = 15;
}

message PersonalAvatarOptionDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string asset_ref = 1;
  string name = 2;
  string tone = 3;
}

message GetMyPersonalProfileRequest {}

message ListMyPersonalAvatarOptionsRequest {}

message ListMyPersonalAvatarOptionsResponse {
  repeated PersonalAvatarOptionDTO options = 1;
}

message UpdateMyPersonalAvatarRequest {
  uint64 version = 1;
  string avatar_asset_ref = 2;
}

message InviteTenantMemberRequest {
  string email = 1;
}

message CreateTenantMemberRequest {
  string username = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
  string employee_id = 5;
  string position = 6;
  string department_id = 7;
  repeated string role_ids = 8;
  TenantMemberActivationMode activation_mode = 9;
}

message TenantMemberCreationReceipt {
  TenantMemberDTO member = 1;
  TenantMemberActivationMode activation_mode = 2;
  string notification_event_id = 3;
  string delivery_state = 4;
  string masked_destination = 5;
}

message GetTenantMemberRequest {
  string user_id = 1;
}

message ListTenantMembersRequest {
  // Free-text search. Plain name/account/employee-id matching is fuzzy; protected
  // email/phone matching is exact through the #168 deterministic lookup index; no decrypt-scan fallback is allowed.
  string query = 1;
  string role_id = 2;
  string department_id = 3;
  TenantMemberStatus status = 4;
  uint32 page = 5;
  uint32 page_size = 6;
}

message ListTenantMembersResponse {
  repeated TenantMemberDTO members = 1;
  uint64 total = 2;
}

// Internal quota meter used by Commercial composition. No tenant id is accepted:
// the trusted tenant principal is the only source of scope.
message CountTenantQuotaMembersRequest {}

message CountTenantQuotaMembersResponse {
  uint64 used = 1;
  string evidence = 2;
}

message UpdateTenantMemberProfileRequest {
  string user_id = 1;
  string name = 2;
  string phone = 3;
  string employee_id = 4;
  string position = 5;
  string department_id = 6;
  uint64 version = 7;
}

message UpdateTenantMemberRequest {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
  string employee_id = 5;
  string position = 6;
  string department_id = 7;
  repeated string role_ids = 8;
  uint64 version = 9;
}

message ActivateTenantMemberRequest {
  string user_id = 1;
  uint64 version = 2;
  string reason = 3;
}

message SuspendTenantMemberRequest {
  string user_id = 1;
  uint64 version = 2;
  string reason = 3;
}

message RemoveTenantMemberRequest {
  string user_id = 1;
  uint64 version = 2;
  string reason = 3;
}

message ListRemovedTenantMembersRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message RestoreTenantMemberRequest {
  string user_id = 1;
  uint64 version = 2;
  string reason = 3;
}

message BootstrapTenantOwnerMemberRequest {
  string tenant_id = 1;
  string user_id = 2;
  string email = 3;
}

message TenantMemberScopeCandidateDTO {
  string id = 1;
  string name = 2;
  uint64 version = 3;
  bool assignable = 4;
  string unavailable_reason = 5;
}

message ListTenantMemberScopeCandidatesRequest {
  string query = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}

message ListTenantMemberScopeCandidatesResponse {
  repeated TenantMemberScopeCandidateDTO candidates = 1;
  uint64 total = 2;
}

message GetTenantMemberBusinessScopeRequest { string user_id = 1; }

message SetTenantMemberBusinessScopeRequest {
  string user_id = 1;
  // CAS uses the authoritative tenant membership resource version. Any
  // concurrent member/profile/lifecycle/scope write invalidates a stale edit.
  uint64 version = 2;
  repeated string site_ids = 3;
}

message TenantMemberBusinessScopeDTO {
  string user_id = 1;
  uint64 version = 2;
  repeated string site_ids = 3;
  string tenant_id = 4;
}

service TenantMemberLifecycleApplication {
  option (yunka.dsl.v1.application) = {
    name: "tenant_member_lifecycle"
    requires: "access/tenant_role_permission"
    requires: "access/tenant_department_management"
    operations: {
      id: "tenant.member.bootstrap_owner"
      use_case: "bootstrap_tenant_owner_member"
      permissions: "platform.tenant.create"
      permission_mode: PERMISSION_ALL
      tenant_required: false
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
      request_type: "access.v1.BootstrapTenantOwnerMemberRequest"
      response_type: "access.v1.TenantMemberDTO"
      application_method: "BootstrapTenantOwnerMember"
    }
    operations: {
      id: "tenant.member.count_quota_usage"
      use_case: "count_tenant_quota_usage"
      permissions: "tenant.entitlement.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
      request_type: "access.v1.CountTenantQuotaMembersRequest"
      response_type: "access.v1.CountTenantQuotaMembersResponse"
      application_method: "CountTenantQuotaMembers"
    }
  };

  rpc InviteTenantMember(InviteTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { post: "/v1/tenant/members" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.invite"
      use_case: "invite_tenant_member"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc CreateTenantMember(CreateTenantMemberRequest) returns (TenantMemberCreationReceipt) {
    option (google.api.http) = { post: "/v1/tenant/members/create" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.create"
      use_case: "create_tenant_member"
      permissions: "tenant.member.manage"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.department.assert_member_assignment_allowed"
      requires_operations: "tenant.role.assign_member"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc GetMyPersonalProfile(GetMyPersonalProfileRequest) returns (TenantPersonalProfileDTO) {
    option (google.api.http) = { get: "/v1/tenant/me/profile" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.personal_profile.get"
      permissions: "tenant.personal_profile.self"
      permission_mode: PERMISSION_ALL
      use_case: "get_my_personal_profile"
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc ListMyPersonalAvatarOptions(ListMyPersonalAvatarOptionsRequest) returns (ListMyPersonalAvatarOptionsResponse) {
    option (google.api.http) = { get: "/v1/tenant/me/avatar-options" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.personal_profile.avatar_options"
      permissions: "tenant.personal_profile.self"
      permission_mode: PERMISSION_ALL
      use_case: "list_my_personal_avatar_options"
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc UpdateMyPersonalAvatar(UpdateMyPersonalAvatarRequest) returns (TenantPersonalProfileDTO) {
    option (google.api.http) = { patch: "/v1/tenant/me/avatar" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.personal_profile.avatar_update"
      permissions: "tenant.personal_profile.self"
      permission_mode: PERMISSION_ALL
      use_case: "update_my_personal_avatar"
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc GetTenantMember(GetTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { get: "/v1/tenant/members/{user_id}" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.get"
      use_case: "get_tenant_member"
      permissions: "tenant.member.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse) {
    option (google.api.http) = { get: "/v1/tenant/members" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.list"
      use_case: "list_tenant_members"
      permissions: "tenant.member.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc ListRemovedTenantMembers(ListRemovedTenantMembersRequest) returns (ListTenantMembersResponse) {
    option (google.api.http) = { get: "/v1/tenant/members/removed" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.list_removed"
      use_case: "list_removed_tenant_members"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc UpdateTenantMemberProfile(UpdateTenantMemberProfileRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { patch: "/v1/tenant/members/{user_id}/profile" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.profile.update"
      use_case: "update_tenant_member_profile"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.department.assert_member_assignment_allowed"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc UpdateTenantMember(UpdateTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { patch: "/v1/tenant/members/{user_id}" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.update"
      use_case: "update_tenant_member"
      permissions: "tenant.member.manage"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.department.assert_member_assignment_allowed"
      requires_operations: "tenant.role.assign_member"
      requires_operations: "tenant.role.revoke_member"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc ActivateTenantMember(ActivateTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { post: "/v1/tenant/members/{user_id}/activate" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.activate"
      use_case: "activate_tenant_member"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc RestoreTenantMember(RestoreTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { post: "/v1/tenant/members/{user_id}/restore" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.restore"
      use_case: "restore_tenant_member"
      permissions: "tenant.member.manage"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.role.assign_member"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc SuspendTenantMember(SuspendTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { post: "/v1/tenant/members/{user_id}/suspend" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.suspend"
      use_case: "suspend_tenant_member"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.role.assert_member_deactivation_allowed"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc RemoveTenantMember(RemoveTenantMemberRequest) returns (TenantMemberDTO) {
    option (google.api.http) = { post: "/v1/tenant/members/{user_id}/remove" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.remove"
      use_case: "remove_tenant_member"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "tenant.role.assert_member_deactivation_allowed"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }
}


service TenantMemberBusinessScopeApplication {
  option (yunka.dsl.v1.application) = {
    name: "tenant_member_business_scope"
    requires: "deviceops/site_management"
  };

  rpc ListTenantMemberScopeCandidates(ListTenantMemberScopeCandidatesRequest) returns (ListTenantMemberScopeCandidatesResponse) {
    option (google.api.http) = { get: "/v1/tenant/member-scope-candidates" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.scope_candidates"
      use_case: "list_tenant_member_scope_candidates"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "site.member_scope_directory"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc GetTenantMemberBusinessScope(GetTenantMemberBusinessScopeRequest) returns (TenantMemberBusinessScopeDTO) {
    option (google.api.http) = { get: "/v1/tenant/members/{user_id}/business-scope" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.business_scope.get"
      use_case: "get_tenant_member_business_scope"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc SetTenantMemberBusinessScope(SetTenantMemberBusinessScopeRequest) returns (TenantMemberBusinessScopeDTO) {
    option (google.api.http) = { put: "/v1/tenant/members/{user_id}/business-scope" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.member.business_scope.set"
      use_case: "set_tenant_member_business_scope"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "site.member_scope_directory"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }
}
