syntax = "proto3";

package access.v1;

import "google/api/annotations.proto";
import "yunka/dsl/v1/options.proto";

option go_package = "github.com/hvritual/biz/contracts/gen/access/v1;accessv1";
option (yunka.dsl.v1.domain) = {
  name: "access"
  version: "v1"
};

enum TenantRoleStatus {
  TENANT_ROLE_STATUS_UNSPECIFIED = 0;
  TENANT_ROLE_STATUS_ACTIVE = 1;
  TENANT_ROLE_STATUS_DISABLED = 2;
}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_NONE = 1;
  DATA_SCOPE_SELF = 2;
  DATA_SCOPE_SITES = 3;
  DATA_SCOPE_ALL = 4;
}

message PermissionGrantInput {
  string permission = 1;
  DataScope scope = 2;
}

message PermissionGrantDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string permission = 1;
  DataScope scope = 2;
}

message TenantRoleDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string id = 1;
  string name = 2;
  TenantRoleStatus status = 3;
  repeated PermissionGrantDTO permissions = 4;
  uint64 version = 5;
  string description = 6;
  string role_code = 7;
  bool system_role = 8;
  uint64 member_count = 9;
  TenantDataPolicyReferenceDTO data_policy = 10;
}

message CreateTenantRoleRequest {
  string name = 1;
  string description = 2;
}

message GetTenantRoleRequest {
  string role_id = 1;
}

message ListTenantRolesRequest {
  string query = 1;
  TenantRoleStatus status = 2;
}

message ListTenantRolesResponse {
  repeated TenantRoleDTO roles = 1;
}

message UpdateTenantRoleRequest {
  string role_id = 1;
  string name = 2;
  uint64 version = 3;
  string description = 4;
}

message DeleteTenantRoleRequest {
  string role_id = 1;
  uint64 version = 2;
}

message DisableTenantRoleRequest {
  string role_id = 1;
  uint64 version = 2;
}

message EnableTenantRoleRequest {
  string role_id = 1;
  uint64 version = 2;
}

message SetTenantRolePermissionsRequest {
  string role_id = 1;
  repeated PermissionGrantInput permissions = 2;
  uint64 version = 3;
}

message AssignTenantRoleMemberRequest {
  string role_id = 1;
  string user_id = 2;
}

message RevokeTenantRoleMemberRequest {
  string role_id = 1;
  string user_id = 2;
}

message BootstrapTenantOwnerRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message AssertTenantMemberDeactivationAllowedRequest {
  string user_id = 1;
}

message AssertTenantMemberDeactivationAllowedResponse {}

// Data Policy is a resource-versioned Access constraint, never an action grant.
message TenantDataPolicyDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string id = 1;
  string name = 2;
  string status = 3;
  repeated string site_ids = 4;
  uint64 version = 5;
  string not_before = 6;
  string expires_at = 7;
  bool effective = 8;
  string invalid_reason = 9;
}
message TenantDataPolicyReferenceDTO {
  string policy_id = 1;
  string policy_name = 2;
  uint64 policy_version = 3;
  uint64 accepted_version = 4;
  bool effective = 5;
  string invalid_reason = 6;
}
message ListTenantDataPoliciesRequest {}
message ListTenantDataPoliciesResponse { repeated TenantDataPolicyDTO policies = 1; }
message GetTenantDataPolicyRequest { string policy_id = 1; }
message CreateTenantDataPolicyRequest {
  string name = 1;
  repeated string site_ids = 2;
  string not_before = 3;
  string expires_at = 4;
  // Optional client-generated UUID enables authoritative recovery after a timeout.
  string policy_id = 5;
}
message UpdateTenantDataPolicyRequest {
  string policy_id = 1;
  uint64 version = 2;
  string name = 3;
  repeated string site_ids = 4;
  string not_before = 5;
  string expires_at = 6;
}
message RevokeTenantDataPolicyRequest { string policy_id = 1; uint64 version = 2; }
message SetTenantRoleDataPolicyRequest {
  string role_id = 1;
  uint64 version = 2;
  string policy_id = 3;
  uint64 policy_version = 4;
}
message TenantScopeCandidateDTO {
  string id = 1;
  string name = 2;
  bool assignable = 3;
  string unavailable_reason = 4;
  uint64 version = 5;
}
message ListTenantScopeCandidatesRequest {
  string query = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}
message ListTenantScopeCandidatesResponse {
  repeated TenantScopeCandidateDTO candidates = 1;
  uint64 total = 2;
}
message GetTenantMemberBusinessScopeRequest { string user_id = 1; }
message SetTenantMemberBusinessScopeRequest {
  string user_id = 1;
  uint64 version = 2;
  repeated string site_ids = 3;
}
message TenantMemberBusinessScopeDTO {
  string user_id = 1;
  uint64 version = 2;
  repeated TenantScopeCandidateDTO sites = 3;
  string tenant_id = 4;
}

service TenantRolePermissionApplication {
  option (yunka.dsl.v1.application) = {
    name: "tenant_role_permission"
    requires: "deviceops/site_management"
    operations: {
      id: "tenant.role.bootstrap_owner"
      use_case: "bootstrap_tenant_owner_role"
      permissions: "platform.tenant.create"
      permission_mode: PERMISSION_ALL
      tenant_required: false
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
      request_type: "access.v1.BootstrapTenantOwnerRoleRequest"
      response_type: "access.v1.TenantRoleDTO"
      application_method: "BootstrapTenantOwnerRole"
    }
    operations: {
      id: "tenant.role.assert_member_deactivation_allowed"
      use_case: "assert_tenant_member_deactivation_allowed"
      permissions: "tenant.member.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_NONE }
      request_type: "access.v1.AssertTenantMemberDeactivationAllowedRequest"
      response_type: "access.v1.AssertTenantMemberDeactivationAllowedResponse"
      application_method: "AssertTenantMemberDeactivationAllowed"
    }
  };

  rpc CreateTenantRole(CreateTenantRoleRequest) returns (TenantRoleDTO) {
    option (google.api.http) = { post: "/v1/tenant/roles" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.role.create"
      use_case: "create_tenant_role"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc GetTenantRole(GetTenantRoleRequest) returns (TenantRoleDTO) {
    option (google.api.http) = { get: "/v1/tenant/roles/{role_id}" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.role.get"
      use_case: "get_tenant_role"
      permissions: "tenant.role.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

