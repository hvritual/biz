  rpc GetTenantDataPolicy(GetTenantDataPolicyRequest) returns (TenantDataPolicyDTO) {
    option (google.api.http) = { get: "/v1/tenant/data-policies/{policy_id}" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.data_policy.get"
      use_case: "get_tenant_data_policy"
      permissions: "tenant.role.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc CreateTenantDataPolicy(CreateTenantDataPolicyRequest) returns (TenantDataPolicyDTO) {
    option (google.api.http) = { post: "/v1/tenant/data-policies" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.data_policy.create"
      use_case: "create_tenant_data_policy"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      authentication: AUTHENTICATION_WEB_SESSION
      requires_operations: "site.role_scope_directory"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc UpdateTenantDataPolicy(UpdateTenantDataPolicyRequest) returns (TenantDataPolicyDTO) {
    option (google.api.http) = { patch: "/v1/tenant/data-policies/{policy_id}" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "tenant.data_policy.update"
      use_case: "update_tenant_data_policy"
      permissions: "tenant.role.manage"
      permission_mode: PERMISSION_ALL
