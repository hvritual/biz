syntax = "proto3";

package deviceops.v1;

import "google/api/annotations.proto";
import "yunka/dsl/v1/options.proto";

option go_package = "github.com/hvritual/biz/contracts/gen/deviceops/v1;deviceopsv1";
option (yunka.dsl.v1.domain) = {
  name: "deviceops"
  version: "v1"
};

message DeviceDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string id = 1;
  string site_id = 2;
  string name = 3;
  string serial = 4;
  string created_by = 5;
  uint64 version = 6;
}

message SiteDTO {
  option (yunka.dsl.v1.dto) = { kind: DTO_OUTPUT };
  string id = 1;
  string name = 2;
  uint64 version = 3;
}

message ListDevicesRequest {}
message ListDevicesResponse {
  repeated DeviceDTO devices = 1;
}
message GetDeviceRequest { string id = 1; }
message CreateDeviceRequest {
  string site_id = 1;
  string name = 2;
  string serial = 3;
}
message UpdateDeviceRequest {
  string id = 1;
  string site_id = 2;
  string name = 3;
  uint64 version = 4;
}
message DeleteDeviceRequest {
  string id = 1;
  uint64 version = 2;
}
message DeleteDeviceResponse {}

message ValidateTransferTargetRequest {
  string site_id = 1;
}

message TransferDeviceRequest {
  string id = 1;
  string target_site_id = 2;
  uint64 version = 3;
}

service DeviceApplication {
  option (yunka.dsl.v1.application) = { name: "device_management" };

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.http) = { get: "/v1/devices" };
    option (yunka.dsl.v1.operation) = {
      id: "device.list"
      use_case: "list_devices"
      permissions: "device.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc GetDevice(GetDeviceRequest) returns (DeviceDTO) {
    option (google.api.http) = { get: "/v1/devices/{id}" };
    option (yunka.dsl.v1.operation) = {
      id: "device.get"
      use_case: "get_device"
      permissions: "device.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }

  rpc CreateDevice(CreateDeviceRequest) returns (DeviceDTO) {
    option (google.api.http) = { post: "/v1/devices" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "device.create"
      use_case: "create_device"
      permissions: "device.create"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc UpdateDevice(UpdateDeviceRequest) returns (DeviceDTO) {
    option (google.api.http) = { patch: "/v1/devices/{id}" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "device.update"
      use_case: "update_device"
      permissions: "device.update"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }

  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse) {
    option (google.api.http) = { delete: "/v1/devices/{id}" };
    option (yunka.dsl.v1.operation) = {
      id: "device.delete"
      use_case: "delete_device"
      permissions: "device.delete"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }
}

// SiteApplication intentionally exposes no HTTP binding for the transfer-target
// child use case. It is still a protobuf RPC because OperationDeclaration is a
// method option today; C9.8 records that contract pressure as FP-C9-001 evidence.
service SiteApplication {
  option (yunka.dsl.v1.application) = { name: "site_management" };

  rpc ValidateTransferTarget(ValidateTransferTargetRequest) returns (SiteDTO) {
    option (yunka.dsl.v1.operation) = {
      id: "site.validate_transfer_target"
      use_case: "validate_transfer_target"
      permissions: "site.read"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      execution: { transaction: TRANSACTION_READ_ONLY idempotency: IDEMPOTENCY_NONE }
    };
  }
}

service DeviceTransferApplication {
  option (yunka.dsl.v1.application) = {
    name: "device_transfer"
    requires: "deviceops/site_management"
    requires: "deviceops/device_management"
  };

  rpc TransferDevice(TransferDeviceRequest) returns (DeviceDTO) {
    option (google.api.http) = { patch: "/v1/devices/{id}/transfer" body: "*" };
    option (yunka.dsl.v1.operation) = {
      id: "device.transfer"
      use_case: "transfer_device"
      permissions: "site.read"
      permissions: "device.update"
      permission_mode: PERMISSION_ALL
      tenant_required: true
      authentication: AUTHENTICATION_API_KEY
      requires_operations: "site.validate_transfer_target"
      requires_operations: "device.update"
      composition: COMPOSITION_LOCAL
      execution: { transaction: TRANSACTION_LOCAL idempotency: IDEMPOTENCY_REQUIRED }
    };
  }
}
