# Recovery description of the existing local instance, not a second database.
# Normal startup: scripts/local-mysql.sh start
services:
  mysql:
    image: mysql:8.4
    container_name: biz-evolution-mysql-20260912
    environment:
      MYSQL_ROOT_PASSWORD: ${EVOLUTION_MYSQL_PASSWORD:?Use existing settings from .env.local}
      MYSQL_DATABASE: biz_evolution
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - existing-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  existing-mysql:
    external: true
    name: ${BIZ_MYSQL_VOLUME:?Existing MySQL volume required; do not create a new one}
