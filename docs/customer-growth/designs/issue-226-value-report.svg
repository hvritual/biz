="62" height="26" rx="13" fill="#FFFBEB"/><text x="295" y="264" font-size="12" fill="#D97706" font-weight="600" text-anchor="middle">草稿</text><text x="616" y="264" font-size="10" fill="#64748B" font-weight="400" text-anchor="end">09/22 20:14</text><rect x="248" y="302" width="388" height="86" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="264" y="330" font-size="13" fill="#1F2937" font-weight="650" text-anchor="start">2026 年 8 月经营报告</text><rect x="264" y="344" width="62" height="26" rx="13" fill="#ECFDF5"/><text x="295" y="362" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">已发布</text><text x="616" y="362" font-size="10" fill="#64748B" font-weight="400" text-anchor="end">09/01 09:10</text><rect x="248" y="400" width="388" height="86" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="264" y="428" font-size="13" fill="#1F2937" font-weight="650" text-anchor="start">2026 年 7 月经营报告</text><rect x="264" y="442" width="62" height="26" rx="13" fill="#ECFDF5"/><text x="295" y="460" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">已发布</text><text x="616" y="460" font-size="10" fill="#64748B" font-weight="400" text-anchor="end">08/01 10:06</text><rect x="248" y="498" width="388" height="86" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="264" y="526" font-size="13" fill="#1F2937" font-weight="650" text-anchor="start">2026 Q2 经营复盘</text><rect x="264" y="540" width="62" height="26" rx="13" fill="#F1F5F9"/><text x="295" y="558" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">已替代</text><text x="616" y="558" font-size="10" fill="#64748B" font-weight="400" text-anchor="end">07/05 16:40</text><rect x="672" y="145" width="662" height="575" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="700" y="180" font-size="20" fill="#1F2937" font-weight="700" text-anchor="start">2026 年 9 月经营报告</text><rect x="1196" y="158" width="62" height="26" rx="13" fill="#FFFBEB"/><text x="1227" y="176" font-size="12" fill="#D97706" font-weight="600" text-anchor="middle">草稿</text><text x="700" y="204" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">CoffeeHub 徐汇 · 数据截至 2026-09-22 20:00</text><line x1="700" y1="220" x2="1306" y2="220" stroke="#E5E7EB" stroke-width="1"/><text x="700" y="252" font-size="15" fill="#1F2937" font-weight="650" text-anchor="start">本期经营摘要</text><rect x="700" y="270" width="184" height="82" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/><text x="714" y="292" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">出杯</text><text x="714" y="322" font-size="20" fill="#1F2937" font-weight="700" text-anchor="start">12,480</text><text x="870" y="322" font-size="10" fill="#059669" font-weight="600" text-anchor="end">+12.7%</text><rect x="896" y="270" width="184" height="82" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/><text x="910" y="292" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">可用性</text><text x="910" y="322" font-size="20" fill="#1F2937" font-weight="700" text-anchor="start">98.4%</text><text x="1066" y="322" font-size="10" fill="#059669" font-weight="600" text-anchor="end">+0.8%</text><rect x="1092" y="270" width="184" height="82" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/><text x="1106" y="292" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">活跃点位</text><text x="1106" y="322" font-size="20" fill="#1F2937" font-weight="700" text-anchor="start">18 / 20</text><text x="1262" y="322" font-size="10" fill="#D97706" font-weight="600" text-anchor="end">2 个待恢复</text><text x="700" y="390" font-size="15" fill="#1F2937" font-weight="650" text-anchor="start">重点变化</text><text x="700" y="420" font-size="12" fill="#1F2937" font-weight="400" text-anchor="start">• 徐汇店出杯环比 +18%，设备可用性 99.2%。</text><text x="700" y="446" font-size="12" fill="#1F2937" font-weight="400" text-anchor="start">• 虹桥办公区出杯 -11%，主要受到 3 次离线影响。</text><text x="700" y="472" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">• 本期没有可信成本来源，未展示毛利。</text><rect x="700" y="506" width="606" height="92" rx="10" fill="#EFF6FF"/><text x="716" y="532" font-size="12" fill="#2563EB" font-weight="650" text-anchor="start">下期建议</text><text x="716" y="558" font-size="12" fill="#1F2937" font-weight="500" text-anchor="start">优先处理虹桥办公区稳定性，再评估营销能力。</text><text x="716" y="580" font-size="10" fill="#64748B" font-weight="400" text-anchor="start">所有建议均链接到真实业务流程，不在报告中直接执行。</text><rect x="1086" y="626" width="84" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="1128" y="648" font-size="13" fill="#1F2937" font-weight="600" text-anchor="middle">预览</text><rect x="1180" y="626" width="106" height="34" rx="8" fill="#2563EB"/><text x="1233" y="648" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">发布报告</text><text x="700" y="688" font-size="10" fill="#64748B" font-weight="400" text-anchor="start">Snapshot revision: draft-r3 · Coverage 91%</text></svg>