humanized_ux:
  time_to_information:
    applicability: applies
    reason: 识别当前企业、目标成员和读取可信状态。
    requirements:
    - 读取中/错误/有效空结果分别展示。
    - 长名称可在详情核对，不仅依赖截断表格。
    evidence_types:
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
  time_to_action:
    applicability: applies
    reason: 识别成员后能直接进入查看和既有动作。
    requirements:
    - 查看、关闭与指引可键盘触达。
    - 读取失败提供当前查询的只读重试。
    evidence_types:
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
  context_switching:
    applicability: applies
    reason: 关闭详情后继续当前工作，切企业必须清空。
    requirements:
    - 关闭保持筛选、排序、分页、滚动、已选集合，焦点返回最近查看按钮。
    - 迟到成功、失败和finally不得覆盖后发请求；切企业/同租户返回也拒绝旧代际。
    evidence_types:
    - static_check
    - browser_test
    - api_test
    verification: not_verified
    evidence: []
  decision_load:
    applicability: applies
    reason: 区别查看与选择、请求受理与结果核实、部分完成与全成。
    requirements:
    - 批量名单显式固定，说明逐项执行及可能部分完成。
    - 不从当前页面推断其他业务责任已交接或额度已释放。
    evidence_types:
    - source_review
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
  interaction_cost:
    applicability: applies
    reason: 避免重复查询和重填，同时不取消必要确认。
    requirements:
    - 同次筛选/分页反应只安排一次查询；用户条件保留。
    - 读取安全重试不产生写请求；写入忙时防重复提交。
    evidence_types:
    - static_check
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
  error_recoverability:
    applicability: applies
    reason: 不确定写结果不能直接整批重提。
    requirements:
    - 批量失败保留原因与原名单，停止后续目标，提供返回列表核对；不承诺原子回滚。
    - Store 明确区分 pre_write_failure / rejected / write_uncertain / write_confirmed；只有 write_uncertain 进入锁定只读核对，明确 4xx 拒绝不伪装成未知写入。
    - 单个状态变更失败先读新状态；原profile409的幂等键保留策略不删除。
    evidence_types:
    - browser_test
    - api_test
    verification: not_verified
    evidence: []
  how_to_guidance:
    applicability: applies
    reason: 首次操作者需要知道找、看、选的区别。
    requirements:
    - 按需展开说明，不强制导览；说明搜索、当前页批量范围与核对顺序。
    evidence_types:
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
  operation_effect_transparency:
    applicability: applies
    reason: 敏感变更必须说明对象、范围、影响和实际回读。
    requirements:
    - 关键后果使用可见正文而非仅hover；角色和状态命令保持已有授权。
    - 逐项读取状态/版本吻合才计为已核实；不把指令返回等同于交接/额度释放。
    evidence_types:
    - source_review
    - browser_test
    - api_test
    verification: not_verified
    evidence: []
  problem_resolution_guidance:
    applicability: applies
    reason: 管理员面对无法确认操作完成的业务事项。
    requirements:
    - 显示下一步只读核对入口和授权不足时的管理员接管方向。
    - 配额不足或更深业务处置缺契约时明确缺口，不生成假的购买/恢复能力。
    evidence_types:
    - source_review
    - browser_test
    - user_test
    verification: not_verified
    evidence: []
acceptance:
  scenarios:
  - 桌面切换查看两名成员后Escape返回最近行，选择不变。
  - 筛选、排序、分页后键盘详情往返，行顺序/页码/滚动/勾选保持。
  - 切换企业清查询、排序、选择、对话框和迟到结果。
  - API fixture查询500/403保留输入，只读重试无写。
  - 双次提交只有一次写；首目标回读失败时第二目标未执行。
  - 单成员/批量 409 明确拒绝可安全关闭且不进入 inspection；网络或写后回读失败保持 write_uncertain、禁止重复写并要求只读核对。
