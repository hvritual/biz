context:
  role:
    summary: 具有当前企业对应成员查看/状态操作权限的管理员；身份与按钮授权仍来自可信会话。
    source_refs:
    - requirement
    - api
    - contract
  task:
    summary: 查找→筛选→查看→关闭→继续原列表；必要时对明确的当前页名单执行已有启停操作并确认结果。
    source_refs:
    - requirement
    - page
  entity:
    summary: 主对象是当前企业成员；正在查看的一个成员与勾选集合独立；不携带其他企业草稿或选择。
    source_refs:
    - page
    - store
  workflow:
    summary: 默认列表与抽屉保持现状；按需打开指引；读失败保留查询并提供只读重试；写入不确定先停止再回列表核对。
    source_refs:
    - page
    - api
    - store
  state:
    summary: 区分准备/查询中、有效结果、查询失败、确认中、逐项回读、结果未确认、切企业已失效。未知状态不等同于失败或空列表。
    source_refs:
    - store
    - api
  action:
    summary: 只保留既有查询、详情、profile更新、启用/停用/移除/恢复；不新增批量后端、资金流、额度购买或设备命令。
    source_refs:
    - page
    - contract
  risk:
    summary: 迟到响应污染当前列表，旧finally清除新加载态，双击重复写，批量部分完成被当成全成/全败，操作后误宣称业务交接或额度释放。
    source_refs:
    - store
    - api
    - authority
  decision:
    summary: 让管理员知道操作谁/当前页范围/影响/是否已逐项核实；额度不足等结构化原因不足时不猜测。
    source_refs:
    - requirement
    - authority
    - api
