schema_version: 1
artifact_kind: analysis
status: ready_for_review
task_ref:
  issue: "#340"
  baseline_commit: aa15de7d8e0091dc210f63fe422ad54c649a80fa
  candidate_commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  name: 平台管理员租户首次订阅与模块开通
classification:
  type: business_task
  reason: 平台管理员会为无基础订阅租户创建真实 Subscription，可能触发 Provisioning，并最终改变租户 Entitlement。
  business_state_mutation: true
  authorization_sensitive: true
  asynchronous_effect: true
context:
  role:
    summary: 具备平台租户读取、套餐读取、商业目录读取和订阅管理权限的平台管理员。
    source_refs: [issue_340, proto_contract]
  task:
    summary: 为当前无基础订阅的租户选择精确已发布套餐版本，核对范围和影响，确认开通并验证最终权益。
    source_refs: [issue_340]
  entity:
    summary: 无基础订阅租户、精确 PlanVersion、首次开通 Change/Receipt、可选 ProvisioningTask 和最终 EntitlementView。
    source_refs: [issue_340, proto_contract, subscription_model]
  workflow:
    summary: 读取租户权益 → 发现可用 Published PlanVersion → 服务端资格检查 → 预览 → 确认 → 必要准备 → Subscription/Entitlement 权威回读。
    source_refs: [issue_340, preview_authority, change_authority]
  state:
    summary: 无订阅 → INITIAL 预览 → APPLIED 或 PROVISIONING；只有最终权益回读成功后页面才宣告已开通。
    source_refs: [issue_340, change_authority, prepared_change_authority, provisioning_authority]
  action:
    summary: 复用平台 Subscription Change Authority；INITIAL 显式携带 sales_scope，确认只绑定 preview_hash，不在浏览器生成权益事实。
    source_refs: [proto_contract, platform_service]
  risk:
    summary: 错选版本、范围不匹配、并发双开通、预览过期、Provisioning 失败或未知、回读失败以及把租户权益误当成成员 IAM。
    source_refs: [issue_340, subscription_model, provisioning_authority]
  decision:
    summary: 管理员必须理解将开通的精确版本、模块/能力/额度/期限、是否需要准备以及最终结果是否已被权威回读确认。
    source_refs: [issue_340]
sources:
- id: issue_340
  kind: user_requirement
  path: https://github.com/hvritual/biz/issues/340
  commit: null
  locator: 用户旅程、实施范围、异常与恢复、验收
  claim: 定义平台管理员为无订阅租户首次开通的完整任务与恢复要求。
- id: proto_contract
  kind: repository_contract
  path: contracts/proto/commercial/v1/subscription_change.proto
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: PreviewSubscriptionChangeRequest / ConfirmSubscriptionChangeRequest
  claim: INITIAL 复用现有平台变更协议，首次预览显式携带 sales_scope，确认绑定 preview_hash。
- id: subscription_model
  kind: implementation
  path: internal/commercial/domain/subscription/model.go
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: OriginInitialActivation / StateProvisioning / Subscription.Validate
  claim: 首次开通具有独立来源事实，准备期间不冒充已激活权益。
- id: change_authority
  kind: implementation
  path: internal/commercial/application/subscriptionchanges/internal/usecase/confirm.go
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: ConfirmSubscriptionChange
  claim: 首次确认锁定租户与原预览，原子创建订阅和回执；准备期间不会提前生成目标权益。
- id: preview_authority
  kind: implementation
  path: internal/commercial/application/subscriptionchanges/internal/usecase/preview.go
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: PreviewSubscriptionChange / preview
  claim: 首次预览使用真实租户、销售范围、精确版本资格和商业目录形成服务端预览事实。
- id: prepared_change_authority
  kind: implementation
  path: internal/commercial/application/subscriptionchanges/internal/usecase/prepared.go
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: CompletePreparedSubscriptionChange / CancelPreparedSubscriptionChange
  claim: 准备完成后才原子应用订阅及权益，INITIAL 不能通过通用取消恢复不存在的旧订阅。
- id: provisioning_authority
  kind: implementation
  path: internal/commercial/domain/provisioning/model.go
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: Task / Retry / Complete
  claim: 准备任务有独立状态、重试和最终完成事实；INITIAL 禁止用通用取消恢复不存在的旧套餐。
- id: platform_service
  kind: implementation
  path: web/src/services/commercial/platformCommercial.ts
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: listPlans / previewSubscriptionChange / confirmSubscriptionChange
  claim: 前端使用可信会话、CSRF、幂等键和真实平台商业接口。
- id: current_page
  kind: implementation
  path: web/src/features/platform/pages/CommercialTenantEntitlementsView.vue
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: CommercialTenantEntitlementsView / InitialSubscriptionWorkspace / useInitialSubscription
  claim: 当前产品候选已有可信租户上下文首次开通、原变更结果恢复、有效权益确认及已订阅变更入口；四视口与人工体验仍分别验收。
- id: recovery_orchestration
  kind: implementation
  path: web/src/features/platform/composables/useInitialSubscription.ts
  commit: fdddd8bd4c67171c8f6b1f5bcd257545e371aabd
  locator: retryOriginalConfirmation / recoverConcurrentActivation / restoreSubmission
  claim: 原请求重试保持同一幂等键；明确拒绝后先对账原回执和当前订阅，仅双重 404 解锁重新预览；迟到结果不能跨租户上下文。
page_pattern:
  name: WorkbenchPage
  reason: 首次开通需要在同一租户上下文内协作展示订阅状态、目标版本、影响、处理状态和最终权益回读。
  contract_ref: web/ui-contracts.json:/platform/commercial/tenant-entitlements
  gaps:
  - 四视口键盘、长中英文与大整数、未知结果和原准备任务恢复用例已补充，待新候选实际执行；200% 浏览器缩放与独立人工体验批准仍未完成。
outcome:
  definition: 管理员只有在同一租户的已应用原开通回执、精确套餐版本、当前有效订阅与权益结果核对完成后才看到完成；权益应反映已有限制与专项覆盖后的实际结果，允许合法固定天数试用态及已应用后停售的历史版本。处理中、失败、未知和结果读取失败保持独立状态，不提前分配成员角色或虚构能力。
  result_contract_refs: [issue_340, change_authority, prepared_change_authority, provisioning_authority]
  recovery_contract_refs: [issue_340, change_authority, provisioning_authority, recovery_orchestration]
humanized_ux:
  time_to_information:
    applicability: applies
    reason: 无订阅原因、目标套餐版本和当前处理状态必须立即可见。
    requirements:
    - 无订阅时直接显示首次开通任务，不展示无意义的套餐切换表单。
    - 目标卡明确 plan_code、exact version、模块、能力、额度、有效期和 sales scope。
    evidence_types: [browser_test]
    verification: not_verified
    evidence: []
  time_to_action:
    applicability: applies
    reason: 管理员应从无订阅状态直接进入目标发现、预览和确认。
    requirements:
    - sales scope 明确后才能发现服务端判定可用的版本。
    - 无可用版本时显示阻断原因和重新检查入口。
    evidence_types: [browser_test, api_test]
    verification: not_verified
    evidence: []
  context_switching:
    applicability: applies
    reason: 全流程绑定同一 tenant、scope、target version 和 change id。
    requirements:
    - 切换租户清空目标、预览、回执和迟到结果。
    - 冲突后回读当前租户订阅，不把旧租户结果继续显示。
    evidence_types: [browser_test]
    verification: not_verified
    evidence: []
  decision_load:
    applicability: applies
    reason: 首次开通会改变租户能力上限，需要在确认前展示真实差异和准备要求。
    requirements:
    - 不用套餐名称或 latest 推断目标，始终显示 exact version。
    - 含价格引用的套餐阻断本次非支付首次开通；费用仅显示现有商业审批事实，不由页面计算价格。
    evidence_types: [source_review, browser_test]
    verification: not_verified
    evidence: []
  interaction_cost:
    applicability: applies
    reason: 应复用当前租户权益工作台与真实商业接口，不新增第二套商业控制台。
    requirements:
    - 有订阅继续使用现有 SubscriptionChangeWorkspace。
    - 无订阅仅显示 InitialSubscriptionWorkspace，避免两个任务同时出现。
    evidence_types: [static_check, browser_test]
    verification: not_verified
    evidence: []
  error_recoverability:
    applicability: applies
    reason: 并发确认、Provisioning、网络未知和最终回读都可能留下真实业务事实。
    requirements:
    - 首次确认或使用原请求重试收到 HTTP 400/409 后，必须先核验原开通回执及当前租户订阅；两者均明确不存在才允许重新预览，任一读取未知则保留原请求。
    - 已确认的 Provisioning 任务通过租户级回执恢复，另一名合规平台管理员无需读取原操作人的私有预览。
    - 发生丢响应、结果未知或最终权益核对失败时保留原任务线索，禁止自动重复首次开通。
    evidence_types: [api_test, browser_test]
    verification: not_verified
    evidence: []
  how_to_guidance:
    applicability: applies
    reason: 平台管理员需要理解“首次开通”“处理中”和“已获得权益”的区别。
    requirements:
    - 就地说明套餐权益不会自动授予成员 IAM 权限。
    - Provisioning 状态说明模块尚未正式可用。
    evidence_types: [browser_test]
    verification: not_verified
    evidence: []
  operation_effect_transparency:
    applicability: applies
    reason: INITIAL 会创建 Base Subscription 并可能异步产生最终权益。
    requirements:
    - 预览明确目标 exact version、预计有效期、依赖、额度、外部商业审批条件及准备项。
    - 确认后的 APPLIED/PROVISIONING/FAILED/UNKNOWN 与原任务结果分别展示；有效权益比对以含 Override/安全约束的服务端投影及当前版本事实为依据，不直接宣称所有原始套餐能力均已授权。
    evidence_types: [source_review, api_test, browser_test]
    verification: not_verified
    evidence: []
  problem_resolution_guidance:
    applicability: applies
    reason: scope 不匹配、目标变化、并发开通和异步失败需要不同下一步。
    requirements:
    - scope 不匹配或目标失效时返回目标重新发现。
    - 并发冲突先读取当前订阅，不重复确认。
    - 未知结果先查回执/任务/权益状态，不生成第二个 INITIAL。
    - 已有订阅时，历史或错误的首次开通链接不得遮住正常套餐变更操作；只有与租户当前待处理任务、真实回执和订阅一致的 INITIAL 可以恢复。
    evidence_types: [browser_test, api_test]
    verification: not_verified
    evidence: []
acceptance:
  scenarios:
  - 无订阅租户看到明确首次开通入口，有订阅租户继续看到套餐变更任务。
  - 只展示真实 PUBLISHED 且服务端 eligibility 允许的 exact PlanVersion 候选。
  - 预览显示模块、能力、额度、有效期、sales scope、依赖和 Provisioning 要求。
  - 直接开通后仅在原变更回执、当前订阅及有效权益投影/当前权威决策核对完成后显示成功；有效安全拒绝或额度限制不能误判为开通失败，也不得误报授权成功。
  - 需要 Provisioning 时订阅显示处理中，目标套餐权益不会提前出现；同租户的其他获授权管理员可以按原任务恢复，不重复创建订阅。
  - 两个管理员并发首次确认只产生一份 Base Subscription，冲突方回读现有事实。
  - 成员 IAM 未授权时首次开通不自动授予成员操作权限。
  - 401、403、400 校验失败、409、ProvisioningFailed、Unknown、ReadbackFailed 有独立反馈和下一步；超过 512 UTF-8 字节的原因在提交前拒绝。
  - 真实订阅已存在时，历史已应用或伪造的 initialChange 链接不会隐藏套餐变更工作区；合法当前 Pending INITIAL 可以继续恢复。
  - 合法 fixed_days TRIAL 与开通后套餐版本 RETIRED 可按确切历史回执和当前权益核验，不能将其误认为尚未开通。
  automated_checks:
  - make check
  - go test ./...
  - cd web && npm run check
  - cd web && npm run test:e2e
  human_checks:
  - 1366x768、1440x900、1536x1024、390x844 检查目标信息、处理中、失败恢复与回读待确认状态。
  - 200% 浏览器缩放及长套餐名、长能力名、长 change id 的可读性检查。
  - 独立产品/UX 评审确认“租户套餐权益不等于成员权限”“已确认任务恢复不再展示创建按钮”和当前实际功能/额度提示；仍未执行人工批准。
  metrics: []
open_questions:
- question: 收费首次开通的 Quote/Payment authority 仍由 #124/#125/#132 提供，本 Issue 不自行定义价格或扣款结果。
  blocking: false
  owner_role: 商业化产品
handoff:
  allowed_paths:
  - web/src/features/platform/**
  - web/src/services/commercial/**
  - web/src/i18n/**
  - web/src/features/component-scopes.json
  - web/e2e/**
  - web/docs/platform-first-subscription-journey-ux.yaml
  forbidden_paths:
  - web/src/features/app-shell/**
  - web/src/styles/tokens.css
  - server/**
  reuse_refs:
  - web/src/features/platform/pages/CommercialTenantEntitlementsView.vue
  - web/src/features/platform/components/SubscriptionChangeWorkspace.vue
  - web/src/services/commercial/platformCommercial.ts
  - web/src/ui/common/StatusBadge.vue
  gates:
  - name: web_fast_gate
    status: not_verified
  - name: browser_e2e
    status: not_verified
  - name: entitlement_readback
    status: not_verified
review:
  reviewer: null
  actor_kind: null
  scope: null
  reference: null
  analysis_ref: null
  reviewed_at: null
  candidate_sha: null
  decision: not_reviewed
